const VDIR='videos/Ch06_数据的分析/';
const KEY='bnu8_ch06_state';

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const LESSONS=[
 {id:'intro',t:'Intro',cn:'Start here · What this chapter covers',n:'🏠'},
 {id:'k1',t:'Mean / Median / Mode',cn:'Mean, median, and mode',n:'6.1'},

];
let cur='intro';
function st(id){return S[id]||(S[id]={diag:null,prac:{ok:0,tot:0},vid:{},done:false});}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[ri(0,a.length-1)];}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const variance=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/a.length;};
const std=a=>Math.sqrt(variance(a));

/* ===== Video list ===== */
const VIDEOS={
k1:[

],
k2:[

 {f:'17_Range, variance and standard deviation as measures of dispersion.mp4',t:'Dispersion measures',c:'core'},

],
k3:[

 {f:'27_Worked example: Creating a box plot (even number of data points).mp4',t:'Box plot: even count',c:'core'},

/* ============ Lesson K1: mean / median / mode ============ */
function microK1(el){
 let data=Array.from({length:ri(5,7)},()=>ri(10,99));
 const render=()=>{
  const sorted=[...data].sort((a,b)=>a-b);
  const m=mean(data);
  const median=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
  const freq={};data.forEach(x=>freq[x]=(freq[x]||0)+1);
  const mode=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
  el.innerHTML=`
   <div class="step">Mean / median / mode</div>
   <div class="box">
    <p>Data: <span class="num">${data.join(', ')}</span></p>
    <div class="trytip">👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
     ${data.map((d,i)=>`#${i+1}: <input type="number" data-i="${i}" value="${d}" min="10" max="99" style="width:60px">`).join('&nbsp; ')}
     <button id="reroll">🎲 New numbers</button>
    </div>
    <div class="box" style="background:#dbeafe">
     <h3>The three, side by side</h3>
     <div style="font-size:14px;line-height:2">
      <p>📊 <b>mean</b>: <span class="num">${m.toFixed(2)}</span> (add them all up, divide by how many)</p>
      <p>📏 <b>median</b>: <span class="num">${median}</span> (the middle one once sorted)</p>
      <p>🔁 <b>mode</b>: <span class="num">${mode}</span> (whichever turns up most)</p>
     </div>
     <p style="font-size:13px;color:var(--muted);margin-top:8px">Sorted: ${sorted.join(' &lt; ')}</p>
    </div>
    <div class="note"><strong>Which one should you use?</strong> The mean is sensitive to outliers (for 1, 2, 3, 4, 100 the mean is 22 — badly skewed); the median is steadier (here it is 3). The mode only asks which value turns up most, and says nothing about the shape.</div>
   </div>`;
  el.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=e=>{data[parseInt(e.target.dataset.i)]=parseInt(e.target.value)||0;render();});
  el.querySelector('#reroll').onclick=()=>{data=Array.from({length:ri(5,7)},()=>ri(10,99));render();};
 };
 render();
}

/* ============ Lesson K2: variance & standard deviation ============ */
function microK2(el){
 let data=Array.from({length:ri(5,6)},()=>ri(40,80));
 const render=()=>{
  const m=mean(data);
  const v=variance(data);
  const s=std(data);
  el.innerHTML=`
   <div class="step">Variance & standard deviation</div>
   <div class="box">
    <h3>Why variance?</h3>
    <p>Two classes both average 80. Are they at the same level? <b>Not necessarily</b> — one could be 75, 80, 85; the other 50, 80, 100. The mean alone cannot tell those two apart.</p>
    <p>So we want <b>one number</b> for "how far the data sits from its mean". That number is the <span class="num">variance, s²</span>, and a closely related one is the <span class="num">standard deviation, s</span>.</p>
   </div>
   <div class="box">
    <h3>The formula</h3>
    <div class="eq">s² = (1/n) × Σᵢ₌₁ⁿ (xᵢ − x̄)²</div>
    <div class="eq">s = √(s²)</div>
    <p style="font-size:13px;color:var(--muted)">Note: in grade 8 you divide by n. Later you will meet dividing by n − 1, the stricter sample variance.</p>
   </div>
   <div class="box">
    <h3>Try it · change the numbers and watch the variance</h3>
    <p>Data: <span class="num">${data.join(', ')}</span></p>
    <div class="trytip">👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
     ${data.map((d,i)=>`#${i+1}: <input type="number" data-i="${i}" value="${d}" min="0" max="100" style="width:60px">`).join(' ')}
     <button id="reroll2">🎲 New numbers</button>
     <button id="flatten" class="secondary">Set them all to the mean</button>
    </div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin:10px 0">
     <tr style="background:#f5f3ff"><th style="padding:4px">xᵢ</th>${data.map(x=>`<th style="padding:4px">${x}</th>`).join('')}</tr>
     <tr style="background:#fefce8"><th style="padding:4px">xᵢ − x̄</th>${data.map(x=>`<td style="padding:4px;text-align:center;color:${x>=m?'#16a34a':'#dc2626'}">${(x-m).toFixed(1)}</td>`).join('')}</tr>
     <tr style="background:#dbeafe"><th style="padding:4px">(xᵢ − x̄)²</th>${data.map(x=>`<td style="padding:4px;text-align:center">${((x-m)**2).toFixed(2)}</td>`).join('')}</tr>
    </table>
    <div class="eq">x̄ = ${m.toFixed(2)} &nbsp;|&nbsp; s² = ${v.toFixed(2)} &nbsp;|&nbsp; s = ${s.toFixed(2)}</div>
    <div style="font-size:13px;color:var(--muted)">Set every value to the mean and the variance drops to 0 — there is no spread left to measure.</div>
   </div>
   <div class="box" style="background:#dbeafe">
    <h3>How to use variance</h3>
    <p style="font-size:14px">Comparing two sets (say two classes' marks) with the same mean, the smaller variance is the steadier group. The routine:</p>
    <ol style="margin-left:20px;font-size:14px;line-height:1.8">
     <li>Find the mean x̄</li>
     <li>Find each (xᵢ − x̄)</li>
     <li>Square them</li>
     <li>Add them up</li>
     <li>Divide by n to get s²</li>
     <li>Take the square root to get s (optional)</li>
    </ol>
   </div>`;
  el.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=e=>{data[parseInt(e.target.dataset.i)]=parseInt(e.target.value)||0;render();});
  el.querySelector('#reroll2').onclick=()=>{data=Array.from({length:ri(5,6)},()=>ri(40,80));render();};
  el.querySelector('#flatten').onclick=()=>{data=data.map(()=>Math.round(m));render();};
 };
 render();
}

/* ============ Lesson K3: box plots ============ */
function microK3(el){
 let data=Array.from({length:ri(7,9)},()=>ri(50,100));
 const render=()=>{
  const sorted=[...data].sort((a,b)=>a-b);
  const n=sorted.length;
  const min=sorted[0],max=sorted[n-1];
  const median=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
  const lo=n%2?sorted.slice(0,(n-1)/2):sorted.slice(0,n/2);
  const hi=n%2?sorted.slice((n+1)/2):sorted.slice(n/2+1);
  const q1=lo.length%2?lo[(lo.length-1)/2]:(lo[lo.length/2-1]+lo[lo.length/2])/2;
  const q3=hi.length%2?hi[(hi.length-1)/2]:(hi[hi.length/2-1]+hi[hi.length/2])/2;
  el.innerHTML=`
   <div class="step">Box plots</div>
   <div class="box">
    <h3>What is a box plot?</h3>
    <p style="font-size:14px">A box plot shows five numbers as a box plus two whiskers:</p>
    <ul style="margin-left:20px;font-size:14px;line-height:1.8">
     <li>min, lower quartile (Q1), median, upper quartile (Q3), max</li>
     <li>The box runs from Q1 to Q3 — the middle 50% of the data</li>
     <li>The line inside the box is the median</li>
     <li>The whiskers reach out to the min and the max</li>
    </ul>
   </div>
   <div class="box">
    <h3>Live demo · current data: ${data.join(', ')}</h3>
    <svg viewBox="0 0 600 200" style="background:#fafafa;border-radius:6px;margin:10px 0">
     <line x1="50" y1="100" x2="550" y2="100" stroke="#9ca3af" stroke-width="1"/>
     ${[min,q1,median,q3,max].map((v,i)=>{
      const x=50+(v-30)/(100-30)*500;
      return `<line x1="${x}" y1="80" x2="${x}" y2="120" stroke="#374151" stroke-width="1.5"/><text x="${x}" y="75" font-size="12" text-anchor="middle" fill="#374151">${v}</text>`;
     }).join('')}
     <rect x="${50+(q1-30)/(100-30)*500}" y="80" width="${(50+(q3-30)/(100-30)*500)-(50+(q1-30)/(100-30)*500)}" height="40" fill="#a855f7" opacity=".3" stroke="#7c3aed" stroke-width="2"/>
     <line x1="${50+(median-30)/(100-30)*500}" y1="80" x2="${50+(median-30)/(100-30)*500}" y2="120" stroke="#dc2626" stroke-width="3"/>
     <text x="300" y="170" font-size="12" text-anchor="middle" fill="#6b7280">min = ${min} &nbsp;|&nbsp; Q1 = ${q1} &nbsp;|&nbsp; median = ${median} &nbsp;|&nbsp; Q3 = ${q3} &nbsp;|&nbsp; max = ${max}</text>
     <text x="300" y="190" font-size="11" text-anchor="middle" fill="#6b7280">IQR = Q3 − Q1 = ${(q3-q1).toFixed(1)} &nbsp;|&nbsp; Range = max − min = ${max-min}</text>
    </svg>
    <div class="trytip">👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
     ${data.map((d,i)=>`#${i+1}: <input type="number" data-i="${i}" value="${d}" min="30" max="100" style="width:60px">`).join(' ')}
     <button id="reroll3">🎲 New numbers</button>
    </div>
   </div>
   <div class="box" style="background:#dbeafe">
    <h3>How to read it</h3>
    <p style="font-size:14px"><b>A longer box</b> = the middle 50% is more spread out<br>
    <b>Longer whiskers</b> = a wider overall range<br>
    <b>Median line off to one side</b> = the distribution is skewed<br>
    <b>Points beyond the whiskers</b> = outliers</p>
   </div>
   <div class="note"><strong>How this connects to variance:</strong> variance and standard deviation give the spread as a number; a box plot gives it as a picture. They confirm each other — a larger IQR usually goes with a larger s².</div>`;
  el.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=e=>{data[parseInt(e.target.dataset.i)]=parseInt(e.target.value)||30;render();});
  el.querySelector('#reroll3').onclick=()=>{data=Array.from({length:ri(7,9)},()=>ri(50,100));render();};
 };
 render();
}

function diag(el,lessonId,generator){

 const qEl=el.querySelector('#diagQ');
 let ok=0;
 const qs=Array.from({length:3},()=>generator('diag'));
 let i=0;
 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){
    qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3：</strong>you can skip the lesson.</div><div style="margin-top:14px"><button id="skipMicro">Skip the lesson, go to practice →</button></div>`;
    qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};
   } else {
    qEl.innerHTML=`<div class="note" style="background:#fef3c7;border-color:var(--warn)"><strong>${ok}/3：</strong>watch the lesson.</div><div style="margin-top:14px"><button id="goMicro">Go to lesson →</button></div>`;
    qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};
   }
   save();renderNav();return;
  }
  const q=qs[i];
  qEl.innerHTML=`<div class="q"><div class="q-text">${i+1}. ${q.q}</div><div style="display:flex;gap:8px"><input id="da"><button id="sub">Submit</button></div><div class="hint" id="ht"></div><div class="feedback" id="fb"></div></div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();qEl.querySelector('#sub').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const correct=q.check(input.value.trim());
   if(correct===true){ok++;fb.className='feedback show ok';fb.textContent='✓';input.disabled=true;setTimeout(()=>{i++;show();},700);}
   else if(correct==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗ Try again.';}
  }
 };
 show();
}

/* ============ Practice generators ============ */
const generators={
k1:()=>{
 const data=Array.from({length:5},()=>ri(1,20));
 const m=mean(data);
 const sorted=[...data].sort((a,b)=>a-b);
 const median=sorted[2];
 return {q:`Find the mean of: ${data.join(', ')}`,
   check:a=>Math.abs(parseFloat(a)-m)<0.01,ans:m.toFixed(2),hint:`Sum them, then divide by ${data.length}.`};
},
k2:()=>{
 const data=Array.from({length:4},()=>ri(1,15));
 const v=variance(data);
 return {q:`Find the variance s² of: ${data.join(', ')} (divide by n)`,
   check:a=>Math.abs(parseFloat(a)-v)<0.01,ans:v.toFixed(2),hint:`Mean=${mean(data).toFixed(2)}, then sum (xᵢ−x̄)² and divide by 4.`};
},
k3:()=>{
 const sorted=[ri(40,60),ri(60,70),ri(70,80),ri(80,85),ri(85,95),ri(95,99),ri(99,100)].sort((a,b)=>a-b);
 return {q:`Sorted data: ${sorted.join(', ')}. The median (Q2) is:`,
   check:a=>Math.abs(parseFloat(a)-sorted[3])<0.01,ans:String(sorted[3]),
   hint:`7 numbers → median is the 4th.`};
},
};

/* ============ Videos module ============ */
function videos(el,lessonId){
 const list=VIDEOS[lessonId]||[];
 if(!list.length){el.innerHTML='<div class="note">No videos for this section.</div>';return;}
 let html=`<div class="step">Videos · ${LESSONS.find(l=>l.id===lessonId).t}</div>`;
 list.forEach((v,i)=>{
  const watched=st(lessonId).vid[i];
  html+=`<div class="vid"><div class="vid-h"><span class="title">${v.t}</span><span class="meta"><span class="tag ${v.c}">${v.c==='core'?'Core':'Extra'}</span><span class="st ${watched?'ok':''}">${watched?'✓':'Unwatched'}</span><button data-i="${i}">${watched?'▶ Replay':'▶ Play'}</button></span></div><div id="vc${i}" style="display:${watched?'block':'none'}"><video controls preload="none" style="width:100%;background:#000" src="${encodeURI(VDIR+v.f)}"></video></div></div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{const i=parseInt(b.dataset.i);const slot=el.querySelector('#vc'+i);const v=slot.querySelector('video');if(slot.style.display==='none'){slot.style.display='block';v.play();}else{v.pause();v.currentTime=0;slot.style.display='none';}st(lessonId).vid[i]=true;save();renderNav();b.textContent='▶ Replay';};
 });
}

/* ============ Practice ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`<div class="step">Practice (${streak}/${need}）</div><div style="font-size:13px;color:var(--muted);margin:8px 0">Correct: ${s.prac.ok}/${s.prac.tot}<button class="secondary" id="rs" style="margin-left:8px">Reset</button></div><div class="progress"><div style="width:${(streak/need)*100}%"></div></div><div class="q"><div class="q-text">${q.q}</div><div style="display:flex;gap:8px"><input id="pi"><button id="ps">Submit</button></div><div class="hint" id="ph"></div><div class="feedback" id="pf"></div></div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();el.querySelector('#ps').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.textContent='✓';
    inp.disabled=true;
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>Section cleared ✓</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.textContent=q.hint||'Have another go.';
     fb.className='feedback show err';fb.textContent='✗ Try again。';
    } else if(tries===2){
     fb.className='feedback show err';
     fb.textContent='✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.'));
    } else {
     streak=0;s.prac.tot++;
     fb.className='feedback show err';
     fb.innerHTML=`The answer is <b>${q.ans}</b>`+(q.sol?('。'+q.sol):'。');
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
  }
 };
 q=gen();tries=0;update();
}

/* ============ Chapter test ============ */
function chTest(el){
 el.innerHTML=`<div class="step">Chapter test</div><div class="box"><p style="font-size:13px;color:var(--muted)">6 questions.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k1());
 for(let i=0;i<3;i++)qs.push(generators.k2());
 qs.push(generators.k3());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){tq.innerHTML=`<div class="note" style="background:${ok>=4?'#dcfce7':'#fef3c7'}"><strong>${ok}/${qs.length}</strong> ${ok>=4?'Chapter passed!':'Review it again'}</div>`;S.test={ok,tot:qs.length};save();renderNav();return;}
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${q.q}</div><div style="display:flex;gap:8px"><input id="ti"><button id="ts">Submit</button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */

/* ===== Chapter lobby: start here ===== */
const GLOSS={k1:"平均数 / 中位数 / 众数",k2:"方差 / 标准差",k3:"箱线图"};
const USE_MICRO=true;
const INTRO={why:"You play basketball and finish the season averaging 12 points — that 12 is a mean. But a coach also wants to know whether you are steady: 12 every single game, versus 30 one night and 2 the next, is the same mean but a very different variance. Picking a team, reading a win rate, deciding whose grades are actually reliable, comparing which shop pours fastest — same tools.",desc:{k1:"Which single number should stand for a whole data set",k2:"One number for how spread out, and how steady, the data is",k3:"One picture showing the spread and the outliers"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h">What this chapter covers</div>'
    +'<div class="intro-sub">Skim the list to see where this chapter is going, then press the button at the bottom.</div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.cn+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b>Where this shows up in real life</b><br>'+INTRO.why+'</div>';
  h+='<div class="box"><b>How this chapter works</b><div class="how">'
    +'① <b>Watch the lesson</b>: a few minutes to get what the section is about<br>'
    +'② <b>Practice</b>: 5 correct in a row clears it; if you get stuck, hints walk you through<br>'
    +'③ <b>Next section</b>: on the left, '+pts[0].n+'、'+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">Start '+pts[0].n+' '+pts[0].cn+' →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}"><span><b>${l.n}</b> ${l.t}</span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{const id=n.dataset.go;cur=id==='test'?'test':`micro-${id}`;render();});
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown</div>';return;}
  const titles={k1:'Mean / median / mode',k2:'Variance & standard deviation',k3:'Box plots'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · ${titles[id]} · ${lesson.cn}</div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){practice(c,id);}
 } else {
  introRender(main);
 }
}
render();
</script>
<script>
(function(){try{if(new URLSearchParams(location.search).get('go')==='test'){cur='test';render();}}catch(e){}})();
</script>
