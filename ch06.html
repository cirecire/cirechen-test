*{box-sizing:border-box;margin:0;padding:0}

header{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:22px 26px;border-radius:14px;margin-bottom:14px;grid-column:1/-1}

nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:fit-content;position:sticky;top:14px}

button.secondary{background:#e5e7eb;color:var(--text)}

.q .q-cn{font-size:12px;color:var(--muted);margin-bottom:8px}

<script>
const VDIR='videos/Ch06_数据的分析/';
const KEY='bnu8_ch06_state';

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const LESSONS=[
 {id:'intro',t:'Intro',cn:'Start here · What this chapter covers',n:'🏠'},
 {id:'k1',t:'Mean / Median / Mode',cn:'Mean, median, and mode',n:'6.1'},
 {id:'k4',t:'Reading from charts',cn:'Reading from charts',n:'6.2'},
 {id:'k2',t:'Variance & standard deviation',cn:'Variance & standard deviation',n:'6.3'},
 {id:'k3',t:'Box Plots',cn:'Box plots',n:'6.4'},
 {id:'test',t:'Chapter check',cn:'Chapter check',n:''}
];
let cur='intro';

function pick(a){return a[ri(0,a.length-1)];}
function L(a,b){ return '<span class="en">'+a+'</span><span class="zh">'+(b==null?a:b)+'</span>'; }
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const variance=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/a.length;};
const std=a=>Math.sqrt(variance(a));

/* ============ Lesson K1: mean / median / mode ============ */
function microK1(el){
 let data=Array.from({length:ri(5,7)},()=>ri(10,99));
 const render=()=>{
  const sorted=[...data].sort((a,b)=>a-b);
  const m=mean(data);
  const median=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
  const freq={};data.forEach(x=>freq[x]=(freq[x]||0)+1);
  const mode=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
  el.innerHTML=`
   <div class="step">${L('Mean / median / mode','平均数 / 中位数 / 众数')}</div>
   <div class="box">
    <p>${L('Data: ','数据：')}<span class="num">${data.join(', ')}</span></p>
    <div class="trytip">${L('👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)','👇 <b>这些数字可以直接改</b> —— 看下面的结果跟着变（按 🎲 换一组新的）')}</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
     ${data.map((d,i)=>`#${i+1}: <input type="number" data-i="${i}" value="${d}" min="10" max="99" style="width:60px">`).join('&nbsp; ')}
     <button id="reroll">🎲 New numbers</button>
    </div>
    <div class="box" style="background:#dbeafe">
     <h3>${L('The three, side by side','三个放一起比一比')}</h3>
     <div style="font-size:14px;line-height:2">
      <p>${L('📊 <b>mean</b>: <span class="num">'+m.toFixed(2)+'</span> (add them all up, divide by how many)','📊 <b>平均数</b>：<span class="num">'+m.toFixed(2)+'</span>（全部加起来，再除以个数）')}</p>

      <p>${L('🔁 <b>mode</b>: <span class="num">'+mode+'</span> (whichever turns up most)','🔁 <b>众数</b>：<span class="num">'+mode+'</span>（出现次数最多的那个）')}</p>

/* ============ Lesson K2: variance & standard deviation ============ */
function microK2(el){
 let data=Array.from({length:ri(5,6)},()=>ri(40,80));
 const render=()=>{
  const m=mean(data);
  const v=variance(data);
  const s=std(data);
  el.innerHTML=`
   <div class="step">Range, variance & standard deviation</div>
   <div class="box">
    <h3>${L('Range — the quickest look at spread','极差 —— 最快看一眼波动的办法')}</h3>
    <p>${L('The <span class="num">range</span> is simply largest − smallest. For <span class="num">'+data.join(', ')+'</span>:','<span class="num">极差</span>就是最大值减最小值。对于 <span class="num">'+data.join(', ')+'</span>：')}</p>
    <div class="eq">range = ${Math.max(...data)} − ${Math.min(...data)} = <span class="num">${Math.max(...data)-Math.min(...data)}</span></div>
    <p style="font-size:13px">${L('One subtraction, but it only reads the two ends — every value in between is ignored. Two very different sets can share the same range.','一次减法就得到，但它只看两头 —— 中间的数全被忽略了。两组很不一样的数据，极差可能相同。')}</p>
   </div>
   <div class="box">
    <h3>${L('Why variance?','为什么要方差？')}</h3>
    <p>${L('Two classes both average 80. Are they at the same level? <b>Not necessarily</b> — one could be 75, 80, 85; the other 50, 80, 100. The mean alone cannot tell those two apart.','两个班平均分都是 80，水平就一样吗？<b>不一定</b> —— 一班可能是 75, 80, 85；另一班是 50, 80, 100。只看平均分，分不出这两班。')}</p>
    <p>${L('So we want <b>one number</b> for "how far the data sits from its mean". That number is the <span class="num">variance, s²</span>, and a closely related one is the <span class="num">standard deviation, s</span>.','所以我们需要<b>一个数</b>来表示"数据离平均数有多远"。这个数就是<span class="num">方差 s²</span>，和它配套的还有<span class="num">标准差 s</span>。')}</p>
   </div>
   <div class="box">
    <h3>${L('The formula','公式')}</h3>
    <div class="eq">s² = (1/n) × Σᵢ₌₁ⁿ (xᵢ − x̄)²</div>
    <div class="eq">s = √(s²)</div>
    <p style="font-size:13px;color:var(--muted)">${L('Note: in grade 8 you divide by n. Later you will meet dividing by n − 1, the stricter sample variance.','注：八年级阶段除以 n。以后会学到除以 n − 1，那是更严格的样本方差。')}</p>
   </div>
   <div class="box" style="background:#fffbeb">
    <h3>${L('Why square, and why divide by n?','为什么要平方？为什么要除以 n？')}</h3>
    <p style="font-size:14px">${L('Try just adding the deviations: <span class="num">'+data.map(x=>(x-m).toFixed(1)).join(' + ')+'</span> = <span class="num">'+data.reduce((a,x)=>a+(x-m),0).toFixed(1)+'</span>. Always 0 — the plus and minus cancel, so the plain sum can never measure spread.','试试把偏差直接相加：<span class="num">'+data.map(x=>(x-m).toFixed(1)).join(' + ')+'</span> = <span class="num">'+data.reduce((a,x)=>a+(x-m),0).toFixed(1)+'</span>。永远是 0 —— 正负刚好抵消，所以直接求和根本无法衡量波动。')}</p>
    <p style="font-size:14px">${L('Squaring makes every term positive, so nothing cancels. Dividing by n then turns a total into an average, so sets of different sizes stay comparable.','平方之后每一项都变成正的，就不会抵消了。再除以 n，把"总和"变成"平均"，这样个数不同的两组数据也能互相比较。')}</p>
   </div>
   <div class="box">
    <h3>${L('Try it · change the numbers and watch the variance','动手试 · 改数字，看方差怎么变')}</h3>
    <p>${L('Data: ','数据：')}<span class="num">${data.join(', ')}</span></p>
    <div class="trytip">${L('👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)','👇 <b>这些数字可以直接改</b> —— 看下面的结果跟着变（按 🎲 换一组新的）')}</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">
     ${data.map((d,i)=>`#${i+1}: <input type="number" data-i="${i}" value="${d}" min="0" max="100" style="width:60px">`).join(' ')}
     <button id="reroll2">🎲 ${L('New numbers','换一组')}</button>
     <button id="flatten" class="secondary">${L('Set them all to the mean','全部设成平均数')}</button>
    </div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin:10px 0">
     <tr style="background:#f5f3ff"><th style="padding:4px">xᵢ</th>${data.map(x=>`<th style="padding:4px">${x}</th>`).join('')}</tr>
     <tr style="background:#fefce8"><th style="padding:4px">xᵢ − x̄</th>${data.map(x=>`<td style="padding:4px;text-align:center;color:${x>=m?'#15803d':'#b91c1c'}">${(x-m).toFixed(1)}</td>`).join('')}</tr>
     <tr style="background:#dbeafe"><th style="padding:4px">(xᵢ − x̄)²</th>${data.map(x=>`<td style="padding:4px;text-align:center">${((x-m)**2).toFixed(2)}</td>`).join('')}</tr>
    </table>
    <div class="eq">x̄ = ${m.toFixed(2)} &nbsp;|&nbsp; s² = ${v.toFixed(2)} &nbsp;|&nbsp; s = ${s.toFixed(2)}</div>
    <div style="font-size:13px;color:var(--muted)">${L('Set every value to the mean and the variance drops to 0 — there is no spread left to measure.','把每个数都设成平均数，方差就降到 0 —— 没有波动可测了。')}</div>
   </div>
   <div class="box" style="background:#dbeafe">
    <h3>${L('How to use variance','方差怎么用')}</h3>
    <p style="font-size:14px">${L("Comparing two sets (say two classes' marks) with the same mean, the smaller variance is the steadier group. The routine:",'比较两组数据（比如两个班的分数）时，如果平均数相同，方差小的那一组更稳定。计算步骤：')}</p>
    <ol style="margin-left:20px;font-size:14px;line-height:1.8">
     <li>${L('Find the mean x̄','先求平均数 x̄')}</li>
     <li>${L('Find each (xᵢ − x̄)','求每个 (xᵢ − x̄)')}</li>
     <li>${L('Square them','把它们平方')}</li>
     <li>${L('Add them up','求和')}</li>
     <li>${L('Divide by n to get s²','除以 n 得到 s²')}</li>
     <li>${L('Take the square root to get s (optional)','开平方得到 s（可选）')}</li>
    </ol>
   </div>`;
  el.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=e=>{data[parseInt(e.target.dataset.i)]=parseInt(e.target.value)||0;render();});
  el.querySelector('#reroll2').onclick=()=>{data=Array.from({length:ri(5,6)},()=>ri(40,80));render();};
  el.querySelector('#flatten').onclick=()=>{data=data.map(()=>Math.round(m));render();};
 };
 render();
}

/* ============ Lesson K3: box plots ============ */
function microK3(el){

  const sorted=[...data].sort((a,b)=>a-b);
  const n=sorted.length;
  const min=sorted[0],max=sorted[n-1];
  const median=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
  const lo=n%2?sorted.slice(0,(n-1)/2):sorted.slice(0,n/2);
  const hi=n%2?sorted.slice((n+1)/2):sorted.slice(n/2+1);
  const q1=lo.length%2?lo[(lo.length-1)/2]:(lo[lo.length/2-1]+lo[lo.length/2])/2;
  const q3=hi.length%2?hi[(hi.length-1)/2]:(hi[hi.length/2-1]+hi[hi.length/2])/2;
  el.innerHTML=`
   <div class="step">${L('Box plots','箱线图')}</div>
   <div class="box">
    <h3>${L('What is a box plot?','箱线图是什么？')}</h3>
    <p style="font-size:14px">${L('A box plot shows five numbers as a box plus two whiskers:','箱线图用一个"箱子"加两条"胡须"，把五个数画出来：')}</p>
    <ul style="margin-left:20px;font-size:14px;line-height:1.8">

    </ul>
   </div>
   <div class="box">
    <h3>${L('Live demo · current data: '+data.join(', '),'实时演示 · 当前数据：'+data.join(', '))}</h3>
    <svg viewBox="0 0 600 200" style="background:#fafafa;border-radius:6px;margin:10px 0">
     <line x1="50" y1="100" x2="550" y2="100" stroke="#9ca3af" stroke-width="1"/>
     ${[min,q1,median,q3,max].map((v,i)=>{
      const x=50+(v-30)/(100-30)*500;
      return `<line x1="${x}" y1="80" x2="${x}" y2="120" stroke="#374151" stroke-width="1.5"/><text x="${x}" y="75" font-size="12" text-anchor="middle" fill="#374151">${v}</text>`;
     }).join('')}

     <line x1="${50+(median-30)/(100-30)*500}" y1="80" x2="${50+(median-30)/(100-30)*500}" y2="120" stroke="#b91c1c" stroke-width="3"/>
     <text x="300" y="170" font-size="12" text-anchor="middle" fill="#5b6472">min = ${min} &nbsp;|&nbsp; Q1 = ${q1} &nbsp;|&nbsp; median = ${median} &nbsp;|&nbsp; Q3 = ${q3} &nbsp;|&nbsp; max = ${max}</text>
     <text x="300" y="190" font-size="11" text-anchor="middle" fill="#5b6472">IQR = Q3 − Q1 = ${(q3-q1).toFixed(1)} &nbsp;|&nbsp; Range = max − min = ${max-min}</text>
    </svg>
    <div class="trytip">👇 <b>You can edit these numbers</b> — watch the results below change (hit 🎲 for a new set)</div><div class="controls" style="display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap">

     <button id="reroll3">🎲 ${L('New numbers','换一组')}</button>

   </div>
   <div class="box" style="background:#dbeafe">
    <h3>${L('How to read it','怎么看')}</h3>
    <p style="font-size:14px">${L('<b>A longer box</b> = the middle 50% is more spread out<br><b>Longer whiskers</b> = a wider overall range<br><b>Median line off to one side</b> = the distribution is skewed<br><b>Points beyond the whiskers</b> = outliers','<b>箱子越长</b> = 中间 50% 的数据越分散<br><b>胡须越长</b> = 整体范围越大<br><b>中位数偏向一侧</b> = 分布不对称<br><b>胡须之外的点</b> = 异常值')}</p>

  fcount={};expanded.forEach(x=>fcount[x]=(fcount[x]||0)+1);
  const maxc=Math.max(...Object.values(fcount));
  const modeEntries=Object.entries(fcount).filter(e=>e[1]===maxc);
  mode = modeEntries.length===1 ? parseInt(modeEntries[0][0],10) : null; // need a unique mode
 } while(mode===null);
 total=expanded.length;
 m=mean(expanded);
 sorted=[...expanded].sort((a,b)=>a-b);
 median=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
 const bars=labels.map((l,i)=>`${l}: ${freq[i]}`).join(', ');
 const type=ri(1,3);
 if(type===1) return {q:`A survey of ${total} people gives these ratings: ${bars} (rating : count). What is the mean rating? (round to 2 d.p.)`,
  zhq:`对 ${total} 人的调查评分分布为：${bars}（评分:人数）。平均评分是多少？（保留两位小数）`,
  check:a=>Math.abs(parseFloat(a)-m)<0.01,ans:m.toFixed(2),
  hint:`Add up all rating values (each rating × its count), then divide by ${total}.`,
  zhh:`把各评分值相加（每个评分×人数），再除以 ${total}。`};
 else if(type===2) return {q:`A survey of ${total} people gives these ratings: ${bars} (rating : count). What is the median rating?`,
  zhq:`对 ${total} 人的调查评分分布为：${bars}（评分:人数）。中位评分是多少？`,
  check:a=>Math.abs(parseFloat(a)-median)<0.01,ans:String(median),
  hint:`List all ${total} ratings in order and take the middle one.`,
  zhh:`把 ${total} 个评分从小到大排列，取中间那个。`};
 return {q:`A survey of ${total} people gives these ratings: ${bars} (rating : count). What is the mode rating?`,
  zhq:`对 ${total} 人的调查评分分布为：${bars}（评分:人数）。众数评分是多少？`,
  check:a=>parseInt(a)===mode,ans:String(mode),
  hint:`The mode is the rating with the largest count.`,
  zhh:`众数是出现次数最多的那个评分。`};
},
};

/* ============ Videos module ============ */
function videos(el,lessonId){
 const list=VIDEOS[lessonId]||[];
 if(!list.length){el.innerHTML='<div class="note">No videos for this section.</div>';return;}
 let html=`<div class="step"><span class="en">Videos</span><span class="zh">视频</span> · ${LESSONS.find(l=>l.id===lessonId).t}</div>`;
 list.forEach((v,i)=>{
  const watched=st(lessonId).vid[i];
  html+=`<div class="vid"><div class="vid-h"><span class="title">${L(v.t,(typeof VTZ!=='undefined'&&VTZ[v.t])||v.t)}</span><span class="meta"><span class="tag ${v.c}"><span class="en">${v.c==='core'?'Core':'Extra'}</span><span class="zh">${v.c==='core'?'核心':'拓展'}</span></span><span class="st ${watched?'ok':''}">${watched?'✓':'Unwatched'}</span><button data-i="${i}">${watched?'<span class="en">▶ Replay</span><span class="zh">▶ 重播</span>':'<span class="en">▶ Play</span><span class="zh">▶ 播放</span>'}</button></span></div><div id="vc${i}" style="display:${watched?'block':'none'}"><video controls preload="none" style="width:100%;background:#000" src="${encodeURI(VDIR+v.f)}"></video></div></div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{const i=parseInt(b.dataset.i);const slot=el.querySelector('#vc'+i);const v=slot.querySelector('video');if(slot.style.display==='none'){slot.style.display='block';v.play();}else{v.pause();v.currentTime=0;slot.style.display='none';}st(lessonId).vid[i]=true;save();renderNav();b.textContent='▶ Replay';};
 });
}

/* ============ Practice ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`<div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div><div style="font-size:13px;color:var(--muted);margin:8px 0">Correct: ${s.prac.ok}/${s.prac.tot}<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></div><div class="progress"><div style="width:${(streak/need)*100}%"></div></div><div class="q"><div class="q-text">${q.q}</div><div style="display:flex;gap:8px"><input id="pi"><button id="ps">Submit</button></div><div class="hint" id="ph"></div><div class="feedback" id="pf"></div></div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};

  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();el.querySelector('#ps').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.textContent='✓';
    /* ✓ needs no translation */
    inp.disabled=true;
    syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
  }
 };
 q=gen();tries=0;update();
}

/* ============ Chapter check ============ */
function chTest(el){
 el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div><div class="box"><p style="font-size:13px;color:var(--muted)">6 questions.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k1());
 for(let i=0;i<2;i++)qs.push(generators.k2());
 qs.push(generators.k3());
 qs.push(generators.k4());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){tq.innerHTML=`<div class="note" style="background:${ok>=4?'#dcfce7':'#fef3c7'}"><strong>${ok}/${qs.length}</strong> ${ok>=4?'Chapter passed!':'Review it again'}</div>`;S.test={ok,tot:qs.length};save();renderNav();return;}
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.innerHTML=L(q.hint||'', q.zhh||'');}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */

/* ===== Chapter lobby: start here ===== */
const GLOSS={k1:"平均数 / 中位数 / 众数",k2:"方差 / 标准差",k3:"箱线图",k4:"从统计图分析数据"};
const USE_MICRO=true;
const INTRO={why:"You play basketball and finish the season averaging 12 points — that 12 is a mean. But a coach also wants to know whether you are steady: 12 every single game, versus 30 one night and 2 the next, is the same mean but a very different variance. Picking a team, reading a win rate, deciding whose grades are actually reliable, comparing which shop pours fastest — same tools.",desc:{k1:"Which single number should stand for a whole data set",k2:"One number for how spread out, and how steady, the data is",k3:"One picture showing the spread and the outliers",k4:"Read the mean, median, mode straight off a bar or pie chart"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h"><span class="en">What this chapter covers</span><span class="zh">本章学什么</span></div>'
    +'<div class="intro-sub"><span class="en">Skim the list to see where this chapter is going, then press the button at the bottom.</span><span class="zh">先扫一眼下面的清单，看本章去哪，然后按底部按钮开始。</span></div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.t+(GLOSS[l.id]?' <span class="cn-tag">'+GLOSS[l.id]+'</span>':'')+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b><span class="en">Where this shows up in real life</span><span class="zh">在真实生活里哪里会用到</span></b><br>'+INTRO.why+'</div>';
  h+='<div class="box"><b><span class="en">How this chapter works</span><span class="zh">本章怎么学</span></b><div class="how">'
    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"平均数·中位数·众数","k2":"方差与标准差","k3":"箱线图","k4":"统计图分析","test":"章末自己测"};
const LKEY='bnu8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}
function applyLang(){const l=getLang();document.body.className=(' '+document.body.className+' ').replace(/\s+lang-(en|mix|zh)\b/g,' ').trim();if(l==='mix'||l==='zh')document.body.classList.add('lang-'+l);document.querySelectorAll('.langseg button').forEach(b=>{b.classList.toggle('on',b.dataset.lang===l);});}
applyLang();


function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}"><span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{const id=n.dataset.go;cur=id==='test'?'test':`micro-${id}`;render();});
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown</div>';return;}
  const titles={k1:'Mean / median / mode',k2:'Variance & standard deviation',k3:'Box plots',k4:'Reading from charts'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){practice(c,id);}
 } else {
  introRender(main);
 }
}
render();
</script>
