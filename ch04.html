/* ============ 微课 K1：什么是函数 ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step">什么是函数？</div>
  <div class="box">
   <h3>Step 1 — A function is a one-to-one rule</h3>
   <div class="cn">函数：每个 x 只对应一个 y</div>
   <p>Rule: every <b>input</b> x gives <b>exactly one</b> <b>output</b> y. If the same x could give two different y's, it's <b>not</b> a function.</p>
   <p style="margin-top:6px">Example: <span class="num">y = 2x + 1</span> — for every x, there's exactly one y. ✓</p>
   <p>Example: <span class="num">x² + y² = 1</span> — at x=0, y can be +1 or −1. ✗ Not a function.</p>
  </div>
  <div class="box">
   <h3>Step 2 — The vertical line test</h3>
   <div class="cn">竖线检验</div>
   <p>On a graph: if any <b>vertical line</b> crosses the curve at more than one point, it's not a function. (Why? Because that x-value would give multiple y-values.)</p>
  </div>
  <div class="box">
   <h3>Step 3 — Function notation</h3>
   <div class="cn">函数记号 f(x)</div>
   <p>Write <span class="num">f(x) = 2x + 1</span> instead of y. f(3) means "plug x=3 in": f(3) = 2·3+1 = 7.</p>
   <p>The variable is just a placeholder — <span class="num">f(t) = 2t + 1</span> is the same function.</p>
  </div>
  <div class="note">y=kx+b（k≠0）叫一次函数。但函数范围更广 —— y=x² 也是函数。</div>`;
}

/* ============ 微课 K2：交互式一次函数 ============ */
function microK2(el){
 let k=1,b=0;
 const render=()=>{
  const X=x=>400+x*30, Y=y=>320-y*30;
  const xmin=-7,xmax=7;
  const px1=xmin,py1=k*xmin+b,px2=xmax,py2=k*xmax+b;
  el.innerHTML=`
   <div class="step">一次函数 — 拖一拖</div>
   <div class="box">
    <p>拖动下方两个滑块，观察图像怎么动。<span class="num">k</span> 是斜率（线有多陡），<span class="num">b</span> 是 y 轴截距（线在哪儿起步）。</p>
    <div class="controls">
     <span>k = <span id="kv" class="num">${k.toFixed(1)}</span></span>
     <input type="range" id="kSlider" min="-3" max="3" step="0.1" value="${k}" style="flex:1;min-width:160px">
     <span style="margin-left:14px">b = <span id="bv" class="num">${b.toFixed(0)}</span></span>
     <input type="range" id="bSlider" min="-4" max="4" step="0.5" value="${b}" style="flex:1;min-width:160px">
    </div>
    <svg viewBox="0 0 800 480" style="background:#fafafa;border-radius:8px" id="svgK2">
     <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker></defs>
     <line x1="40" y1="${Y(0)}" x2="760" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr2)"/>
     <line x1="${X(0)}" y1="440" x2="${X(0)}" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arr2)"/>
     <text x="755" y="${Y(0)-6}" font-size="14" fill="#374151">x</text>
     <text x="${X(0)+8}" y="40" font-size="14" fill="#374151">y</text>
     ${[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     <circle cx="${X(0)}" cy="${Y(b)}" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>
     <text x="${X(0)+10}" y="${Y(b)-8}" font-size="13" font-weight="bold" fill="#dc2626">(0, ${b})  y-axis intercept 截距 b</text>
     <line x1="${X(px1)}" y1="${Y(py1)}" x2="${X(px2)}" y2="${Y(py2)}" stroke="#7c3aed" stroke-width="3" id="lineK"/>
    </svg>
    <div class="eq">y = ${k.toFixed(1)}x + ${b.toFixed(1)}</div>
    <div class="box" style="background:#dbeafe">
     <h3>What you see</h3>
     <div style="font-size:14px">
      <p>• When <b>k > 0</b>: line goes up-right. When <b>k < 0</b>: goes down-right.</p>
      <p>• When <b>|k|</b> is larger: steeper. When <b>|k|</b> is smaller: flatter.</p>
      <p>• <b>b</b> shifts the line up (b > 0) or down (b < 0) without changing slope.</p>
      <p>• <b>k = 0</b>: horizontal line at y = b. Not a linear function in this textbook (but it IS a constant function).</p>
     </div>
    </div>
   </div>`;
  el.querySelector('#kSlider').oninput=e=>{k=parseFloat(e.target.value);render();};
  el.querySelector('#bSlider').oninput=e=>{b=parseFloat(e.target.value);render();};
 };
 render();
}

/* ============ 微课 K3：斜率公式 =========== */
function microK3(el){

  const riseColor=m>=0?'#16a34a':'#dc2626';
  el.innerHTML=`
   <div class="step">★ 斜率公式</div>
   <div class="box">
    <p>斜率 slope 描述一条线"有多陡"，用字母 <span class="num">k</span>（或 m）表示。定义：</p>
    <div class="eq">k = (y₂ − y₁) / (x₂ − x₁) = <span class="frac"><span class="num">rise 纵坐标变化 Δy</span><span class="den">run 横坐标变化 Δx</span></span></div>
    <p style="margin-top:6px">拖动下面两个点 P₁ 和 P₂，看 k 怎么变。</p>
    <svg viewBox="0 0 800 480" style="background:#fafafa;border-radius:8px;cursor:crosshair" id="svgK3">
     <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker></defs>
     <line x1="40" y1="${Y(0)}" x2="760" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <line x1="${X(0)}" y1="440" x2="${X(0)}" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <text x="755" y="${Y(0)-6}" font-size="14" fill="#374151">x</text>
     <text x="${X(0)+8}" y="40" font-size="14" fill="#374151">y</text>
     ${[-5,-4,-3,-2,-1,1,2,3,4,5].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${[-5,-4,-3,-2,-1,1,2,3,4,5].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${dx!==0?`<line x1="${X(p1x)}" y1="${Y(p1y)}" x2="${X(p2x)}" y2="${Y(p2y)}" stroke="#7c3aed" stroke-width="3"/>`:''}
     ${dx!==0?`<path d="M${X(p1x)},${Y(p1y)} l${(X(p2x)-X(p1x))},0 l0,${(Y(p2y)-Y(p1y))}" fill="none" stroke="${riseColor}" stroke-width="2.5" stroke-dasharray="3 2"/>`:''}
     <circle cx="${X(p1x)}" cy="${Y(p1y)}" r="10" fill="#dc2626" stroke="#fff" stroke-width="2.5" id="dot1" style="cursor:grab"/>
     <circle cx="${X(p2x)}" cy="${Y(p2y)}" r="10" fill="#7c3aed" stroke="#fff" stroke-width="2.5" id="dot2" style="cursor:grab"/>
     <text x="${X(p1x)-12}" y="${Y(p1y)-15}" font-size="14" font-weight="bold" fill="#dc2626">P₁(${p1x},${p1y})</text>
     <text x="${X(p2x)+12}" y="${Y(p2y)-15}" font-size="14" font-weight="bold" fill="#7c3aed">P₂(${p2x},${p2y})</text>
     ${dx!==0?`<text x="60" y="50" font-size="14" fill="${riseColor}" font-weight="bold">Δy = ${dy}  (rise)</text>`:''}
     ${dx!==0?`<text x="60" y="70" font-size="14" fill="#2563eb" font-weight="bold">Δx = ${dx}  (run)</text>`:''}
    </svg>
    <div class="eq">
     k = (y₂ − y₁) / (x₂ − x₁) = (${p2y} − ${p1y}) / (${p2x} − ${p1x}) = ${dy} / ${dx} = <span class="num" style="color:${riseColor}">${mStr}</span>
    </div>
    <div class="box" style="background:#dbeafe">
     <h3>Understanding the slope</h3>
     <div style="font-size:14px">
      <p>• <b>Positive k</b> (green): line goes up-right. Negative k (red): down-right.</p>
      <p>• <b>|k|</b> = how steep: |k|=1 is 45°; |k|=2 is twice as steep.</p>
      <p>• <b>Δx = 0</b> (vertical line): k is undefined — not a function!</p>
      <p>• <b>Same line, different points, same k</b>: try dragging P₁ and P₂ to opposite ends of the same line, k doesn't change. (Similar triangles prove this — there's a video on it.)</p>
     </div>
    </div>
   </div>`;
  const svg=el.querySelector('#svgK3');
  function getPos(e){
   const r=svg.getBoundingClientRect();
   return {
    x:Math.round(((e.clientX-r.left)/r.width*800-400)/40),
    y:Math.round((300-(e.clientY-r.top)/r.height*480)/40)
   };
  }
  function start(p){return e=>{drag=p;e.preventDefault();};}
  function move(e){
   if(!drag)return;
   const p=getPos(e);
   if(drag===1){p1x=Math.max(-5,Math.min(5,p.x));p1y=Math.max(-5,Math.min(5,p.y));}
   else{p2x=Math.max(-5,Math.min(5,p.x));p2y=Math.max(-5,Math.min(5,p.y));}
   render();
  }
  svg.onmousedown=start(drag||0);
  svg.onmousemove=move;
  svg.onmouseup=svg.onmouseleave=()=>drag=null;
  svg.querySelector('#dot1').onmousedown=start(1);
  svg.querySelector('#dot2').onmousedown=start(2);
  el.querySelector('#dot1').onmousedown=start(1);
  el.querySelector('#dot2').onmousedown=start(2);
  svg.ontouchstart=e=>{const t=e.touches[0];const p=getPos(t);drag=Math.hypot(p.x-p1x,p.y-p1y)<Math.hypot(p.x-p2x,p.y-p2y)?1:2;e.preventDefault();};
  svg.ontouchmove=e=>{move(e.touches[0]);e.preventDefault();};
  svg.ontouchend=()=>drag=null;
 };
 render();
}

/* ============ 微课 K4：建模应用示例 ============ */
function microK4(el){
 el.innerHTML=`
  <div class="step">一次函数建模</div>
  <div class="box">
   <h3>The four steps · 建模四步</h3>
   <ol style="margin-left:20px;font-size:15px;line-height:1.8">
    <li>读题：找出 <b>常量</b>（每次都一样的）和 <b>变量</b>（变的）。</li>
    <li>建关系：写出 y = 一次函数 / 正比例函数 的形式。</li>
    <li>求参数：用题目给的一个具体点代进去求 k、b。</li>
    <li>回答：把所问代回函数求值。</li>
   </ol>
  </div>
  <div class="box">
   <h3>Worked example · 典型例题</h3>
   <p>某地出租车：起步价 8 元（3 公里内），之后每公里 2 元。写出车费 y（元）与里程 x（公里，x ≥ 3）的函数关系。</p>
   <p style="margin-top:8px"><b>Step 1</b>: 常量 = 起步价 8 元，每公里 2 元（每增加 1 公里加 2 元）<br>
   <b>Step 2</b>: 形如 y = kx + b<br>
   <b>Step 3</b>: 起步价 = 8 元，代入"x=3 时 y=8"得 8 = 2·3 + b → b = 2<br>
   <b>Step 4</b>: <span class="num">y = 2x + 2</span> （x ≥ 3）</p>
  </div>
  小心：起步价 8 元是单独的一项（b），别和"每公里 2 元"混在一起。
  <div class="box">
   <h3>Look for these patterns in word problems</h3>
   <ul style="margin-left:20px;font-size:14px;line-height:1.8">
    <li>"每 X 元"或"每 X 公里"→ k 出现</li>
    <li>"起步"、"基础"、"已有"→ b 出现</li>
    <li>"按比例"、"每件 5 元"→ 正比例 y = kx（b = 0）</li>
    <li>反过来求"用了多少"→ 解 x = (y − b) / k</li>
   </ul>
  </div>`;
}

/* ============ 先测一下 ============ */

/* ============ 练习生成器（按 4 知识点） ============ */
const generators={
k1:()=>{
 const type=ri(1,3);
 if(type===1){
  const eq=ri(1,3);
  const a=ri(1,5)*[1,-1][ri(0,1)],b=ri(1,5);
  const ftype=['y='+a+'x+'+b,'y=x²','x='+ri(1,3)][eq%3];
  const isFunc=eq%3!==0; // x=const not function
  return {q:`Is ${ftype} a function? Answer "yes" or "no".`,qcn:`${ftype} 是函数吗？（是 / 否）`,
   check:a=>{const ans=a.toLowerCase().trim();return (isFunc&&(ans==='yes'||ans==='y'||ans==='是'))||(!isFunc&&(ans==='no'||ans==='n'||ans==='否'));},
   ans:isFunc?'yes':'no',hint:'A vertical line x=const has one x with many y — not a function.'};
 } else if(type===2){
  const a=ri(2,5),b=ri(-3,3);
  const x=ri(1,4);
  return {q:`If f(x) = ${a}x + ${b}, what is f(${x})?`,qcn:`若 f(x) = ${a}x + ${b}，求 f(${x}) = ?`,
   check:a=>parseInt(a)===a*x+b,ans:String(a*x+b),hint:`f(${x}) = ${a}*${x} + ${b}`};
 } else {
  // vertical line test
  return {q:`Does the circle x²+y²=1 pass the vertical line test? Answer "yes" or "no".`,qcn:`圆 x²+y²=1 通过竖线检验吗？`,
   check:a=>{const ans=a.toLowerCase().trim();return ans==='no'||ans==='n'||ans==='否';},
   ans:'no',hint:'At x=0, y can be +1 or −1 — two outputs, not a function.'};
 }
},
k2:()=>{
 const type=ri(1,2);
 if(type===1){
  const k=ri(-3,3),b=ri(-3,3);
  const x=ri(-2,2);
  return {q:`If y = ${k}x + ${b}, what is y when x = ${x}?`,qcn:`y = ${k}x + ${b}，x = ${x} 时 y = ?`,
   check:a=>parseInt(a)===k*x+b,ans:String(k*x+b),hint:`y = ${k}*${x} + ${b}`};
 } else {
  // which is linear
  const isLinear=ri(0,1);
  const eqsLinear=['y=2x+1','y=-x+3','y=5x'];
  const eqsNotLinear=['y=x²','y=1/x','y=√x'];
  const eq=isLinear?pick(eqsLinear):pick(eqsNotLinear);
  return {q:`Is "${eq}" a linear function? Answer "yes" or "no".`,qcn:`"${eq}" 是一次函数吗？`,
   check:a=>{const ans=a.toLowerCase().trim();return (isLinear&&(ans==='yes'||ans==='y'||ans==='是'))||(!isLinear&&(ans==='no'||ans==='n'||ans==='否'));},
   ans:isLinear?'yes':'no',hint:'Linear = y = kx + b (k≠0). Anything with x², 1/x, √x is not.'};
 }
},
k3:()=>{
 const type=ri(1,2);
 if(type===1){
  // compute slope from two points
  const x1=ri(-2,2),y1=ri(-2,2),x2=x1+ri(1,3),y2=y1+ri(-3,3);
  const m=(y2-y1)/(x2-x1);
  return {q:`Find the slope of the line through (${x1},${y1}) and (${x2},${y2}).`,qcn:`求过 (${x1},${y1}) 和 (${x2},${y2}) 的直线斜率 k = ?`,
   check:a=>Math.abs(parseFloat(a)-m)<0.01,ans:String(m),
   hint:`k = (y₂−y₁)/(x₂−x₁) = (${y2}-${y1})/(${x2}-${x1})`};
 } else {
  // find y-intercept
  const k=ri(-3,3),b=ri(-3,3);
  return {q:`The line y = ${k}x + ${b} crosses the y-axis at what point?`,qcn:`y = ${k}x + ${b} 与 y 轴交点的 y 坐标是？`,
   check:a=>parseInt(a)===b,ans:String(b),hint:'y-axis is x=0. Plug in x=0 → y=b.'};
 }
},
k4:()=>{
 // simple modeling
 const k=ri(2,5),b=ri(1,5);
  const x=ri(5,10);
  return {q:`A taxi charges 起步价 ${b} 元 plus ${k} 元/公里. If you travel ${x} km, what is the fare?`,qcn:`出租车起步价 ${b} 元，每公里 ${k} 元。坐 ${x} 公里，车费 = ?`,
   check:a=>parseInt(a)===k*x+b,ans:String(k*x+b),hint:`y = ${k}x + ${b}, plug x=${x}`};
},
};

/* ============ 练习模块 ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`
   <div class="step">练一练（${streak}/${need}）</div>
   <div class="info" style="font-size:13px;color:var(--muted);margin:8px 0">对 ${s.prac.ok}/${s.prac.tot}（连对 ${streak}）<button class="secondary" id="rs" style="margin-left:8px">Reset 重置</button></div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${q.q}</div>
    <div class="q-cn">${q.qcn||''}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps">Submit · 提交</button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.textContent='✓ 正确！';
    inp.disabled=true;
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>本节过关！✓</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.textContent=q.hint||'再想想看。';
     fb.className='feedback show err';fb.textContent='✗ 再试一次。';
    } else if(tries===2){
     fb.className='feedback show err';
     fb.textContent='✗ 还不对。'+(q.sol?('思路：'+q.sol):(q.hint?('提示：'+q.hint):'再算一遍。'));
    } else {
     streak=0;s.prac.tot++;
     fb.className='feedback show err';
     fb.innerHTML=`答案是 <b>${q.ans}</b>`+(q.sol?('。'+q.sol):'。');
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 q=gen();tries=0;update();
}

/* ============ 章末测 ============ */
function chTest(el){
 el.innerHTML=`<div class="step">章末自己测</div><div class="box"><p style="font-size:13px;color:var(--muted)">共 10 题，覆盖本章 4 个知识点。</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<3;i++)qs.push(generators.k1());
 for(let i=0;i<2;i++)qs.push(generators.k2());
 for(let i=0;i<3;i++)qs.push(generators.k3());
 for(let i=0;i<2;i++)qs.push(generators.k4());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){
   tq.innerHTML=`<div class="note" style="background:${ok>=7?'#dcfce7':'#fef3c7'};border-color:${ok>=7?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${ok>=7?'章末通过！可以进 Ch05':'再回去复习错的知识点'}</div>`;
   S.test={ok,tot:qs.length};save();renderNav();return;
  }
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${q.q}</div><div class="q-cn">${q.qcn||''}</div><div style="display:flex;gap:8px"><input id="ti" autocomplete="off"><button id="ts">提交</button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ 渲染 ============ */
function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}">
   <span><b>${l.n}</b> ${l.cn}</span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
  const id=n.dataset.go;
  cur = id==='test' ? 'test' : `micro-${id}`;
  render();
 });
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  const titles={k1:'函数',k2:'一次函数与正比例函数',k3:'斜率与截距',k4:'一次函数的应用'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · ${titles[id]} · ${lesson.cn}</div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice · 开始练习</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  main.innerHTML='<div class="note">Select a lesson on the left.</div>';
 }
}
render();
</script>
