*{box-sizing:border-box;margin:0;padding:0}

.nav-i:hover{background:#f5f3ff}
.nav-i.on{background:var(--accent);color:#fff}
.nav-i .st{font-size:11px;opacity:.85}
.nav-i .st.ok{color:var(--ok)}
.nav-i .st.err{color:var(--err)}
.nav-i.on .st.ok,.nav-i.on .st.err{color:#fff}
main{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;min-height:80vh}
h2{font-size:18px;margin-bottom:6px}
.lesson-id{color:var(--muted);font-size:13px;margin-bottom:14px}
.box{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.box h3{font-size:15px;margin-bottom:8px;color:var(--accent)}
.box .cn{font-size:12px;color:var(--muted);font-style:italic}
.step{padding:10px 14px;background:var(--accent);color:#fff;border-radius:8px;margin-bottom:14px;font-size:15px}
.note{background:#fffbeb;border-left:3px solid var(--warn);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:14px}
.note strong{color:var(--warn)}
.vid{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vid-h{padding:10px 14px;background:#f5f3ff;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}

button.secondary{background:#e5e7eb;color:var(--text)}
button:hover{opacity:.92}
input[type=text],input[type=number]{padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;width:120px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--ok);background:#f0fdf4}
input.err{border-color:var(--err);background:#fef2f2}
input:disabled{background:#f3f4f6;cursor:not-allowed}
.q{margin:12px 0;padding:14px;background:#f9fafb;border-radius:8px;border-left:3px solid var(--accent)}
.q .q-text{font-size:15px;margin-bottom:8px}
.q .q-cn{font-size:12px;color:var(--muted);margin-bottom:8px}
.q .feedback{margin-top:8px;font-size:13px;padding:6px 10px;border-radius:6px;display:none}
.q .feedback.show{display:block}
.q .feedback.ok{background:#dcfce7;color:#166534}
.q .feedback.err{background:#fee2e2;color:#991b1b}
.q .feedback.warn{background:#fef3c7;color:#92400e}

.hint.show{display:block}
.diff{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.diff button{padding:4px 10px;font-size:12px}

.controls{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;align-items:center}
.controls .info{margin-left:auto;font-size:13px;color:var(--muted)}
.progress{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:8px 0}
.progress div{height:100%;background:var(--accent);transition:width .3s}
svg{max-width:100%;display:block;margin:0 auto}
.num{color:var(--accent);font-weight:600}
svg circle{transition:r .2s,fill .2s}
svg line,svg path{transition:stroke .3s,opacity .3s}

.frac .num{display:block;border-bottom:1px solid currentColor;padding:0 4px}
.frac .den{display:block;padding:0 4px}

.intro-h{font-size:21px;font-weight:700;margin:0 0 4px}
.intro-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.kp-c{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#f9fafb}
.kp-c .n{font-size:12px;color:var(--accent);font-weight:700}
.kp-c .t{font-size:15px;font-weight:600;margin:2px 0 5px;line-height:1.4}
.kp-c .d{font-size:12px;color:var(--muted);line-height:1.55}
.why{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14px;line-height:1.85}
.why b{color:var(--accent)}
.how{font-size:14px;line-height:2.1;margin:8px 0 2px}
.how b{color:var(--accent)}
.big-start{margin-top:20px;text-align:center}
.big-start button{font-size:16px;padding:13px 30px;border-radius:10px}
.trytip{font-size:12px;color:var(--muted);margin:10px 0 2px}

/* ============ Lesson K1: what is a function? ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step">What is a function?</div>
  <div class="box">
   <h3>Step 1 — A function is a one-to-one rule</h3>
   <div class="cn">A function: each x gives exactly one y</div>
   <p>Rule: every <b>input</b> x gives <b>exactly one</b> <b>output</b> y. If the same x could give two different y's, it's <b>not</b> a function.</p>
   <p style="margin-top:6px">Example: <span class="num">y = 2x + 1</span> — for every x, there's exactly one y. ✓</p>
   <p>Example: <span class="num">x² + y² = 1</span> — at x=0, y can be +1 or −1. ✗ Not a function.</p>
  </div>
  <div class="box">
   <h3>Step 2 — The vertical line test</h3>
   <div class="cn">The vertical line test</div>
   <p>On a graph: if any <b>vertical line</b> crosses the curve at more than one point, it's not a function. (Why? Because that x-value would give multiple y-values.)</p>
  </div>
  <div class="box">
   <h3>Step 3 — Function notation</h3>
   <div class="cn">Function notation f(x)</div>
   <p>Write <span class="num">f(x) = 2x + 1</span> instead of y. f(3) means "plug x=3 in": f(3) = 2·3+1 = 7.</p>
   <p>The variable is just a placeholder — <span class="num">f(t) = 2t + 1</span> is the same function.</p>
  </div>
  <div class="note">y = kx + b with k ≠ 0 is called a linear function. But functions are broader than that — y = x² is one too.</div>`;
}

     <line x1="40" y1="${Y(0)}" x2="760" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr2)"/>
     <line x1="${X(0)}" y1="440" x2="${X(0)}" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arr2)"/>

     ${[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#5b6472">${i}</text>`).join('')}
     ${[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#5b6472">${i}</text>`).join('')}

     <text x="${X(0)+10}" y="${Y(b)-8}" font-size="13" font-weight="bold" fill="#b91c1c">(0, ${b})  y-axis intercept b</text>

/* ============ Lesson K3: the slope formula ============ */
function microK3(el){
 let p1x=-2,p1y=3,p2x=3,p2y=5,drag=null;
 const render=()=>{
  const X=x=>400+x*40, Y=y=>300-y*40;
  const dx=p2x-p1x,dy=p2y-p1y;
  const m=dx===0?Infinity:dy/dx;
  const mStr=Math.abs(m)===Infinity?'undefined (vertical line)':m.toFixed(2);
  const riseColor=m>=0?'#15803d':'#b91c1c';
  el.innerHTML=`
   <div class="step">★ The slope formula</div>
   <div class="box">
    <p>Slope describes how steep a line is, written <span class="num">k</span> (or m). It is defined as:</p>
    <div class="eq">k = (y₂ − y₁) / (x₂ − x₁) = <span class="frac"><span class="num">rise, the change in y, Δy</span><span class="den">run, the change in x, Δx</span></span></div>
    <p style="margin-top:6px">Drag P₁ and P₂ and watch how k changes.</p>
    <svg viewBox="0 0 800 480" style="background:#fafafa;border-radius:8px;cursor:crosshair" id="svgK3">
     <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker></defs>
     <line x1="40" y1="${Y(0)}" x2="760" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <line x1="${X(0)}" y1="440" x2="${X(0)}" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <text x="755" y="${Y(0)-6}" font-size="14" fill="#374151">x</text>
     <text x="${X(0)+8}" y="40" font-size="14" fill="#374151">y</text>
     ${[-5,-4,-3,-2,-1,1,2,3,4,5].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#5b6472">${i}</text>`).join('')}
     ${[-5,-4,-3,-2,-1,1,2,3,4,5].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#5b6472">${i}</text>`).join('')}
     ${dx!==0?`<line x1="${X(p1x)}" y1="${Y(p1y)}" x2="${X(p2x)}" y2="${Y(p2y)}" stroke="#7c3aed" stroke-width="3"/>`:''}
     ${dx!==0?`<path d="M${X(p1x)},${Y(p1y)} l${(X(p2x)-X(p1x))},0 l0,${(Y(p2y)-Y(p1y))}" fill="none" stroke="${riseColor}" stroke-width="2.5" stroke-dasharray="3 2"/>`:''}
     <circle cx="${X(p1x)}" cy="${Y(p1y)}" r="10" fill="#b91c1c" stroke="#fff" stroke-width="2.5" id="dot1" style="cursor:grab"/>
     <circle cx="${X(p2x)}" cy="${Y(p2y)}" r="10" fill="#7c3aed" stroke="#fff" stroke-width="2.5" id="dot2" style="cursor:grab"/>
     <text x="${X(p1x)-12}" y="${Y(p1y)-15}" font-size="14" font-weight="bold" fill="#b91c1c">P₁(${p1x},${p1y})</text>
     <text x="${X(p2x)+12}" y="${Y(p2y)-15}" font-size="14" font-weight="bold" fill="#7c3aed">P₂(${p2x},${p2y})</text>
     ${dx!==0?`<text x="60" y="50" font-size="14" fill="${riseColor}" font-weight="bold">Δy = ${dy}  (rise)</text>`:''}
     ${dx!==0?`<text x="60" y="70" font-size="14" fill="#2563eb" font-weight="bold">Δx = ${dx}  (run)</text>`:''}
    </svg>
    <div class="eq">
     k = (y₂ − y₁) / (x₂ − x₁) = (${p2y} − ${p1y}) / (${p2x} − ${p1x}) = ${dy} / ${dx} = <span class="num" style="color:${riseColor}">${mStr}</span>
    </div>
    <div class="box" style="background:#dbeafe">
     <h3>Understanding the slope</h3>
     <div style="font-size:14px">
      <p>• <b>Positive k</b> (green): line goes up-right. Negative k (red): down-right.</p>
      <p>• <b>|k|</b> = how steep: |k|=1 is 45°; |k|=2 is twice as steep.</p>
      <p>• <b>Δx = 0</b> (vertical line): k is undefined — not a function!</p>
      <p>• <b>Same line, different points, same k</b>: try dragging P₁ and P₂ to opposite ends of the same line, k doesn't change. (Similar triangles prove this — there's a video on it.)</p>
     </div>
    </div>
   </div>`;
  const svg=el.querySelector('#svgK3');
  function getPos(e){
   const r=svg.getBoundingClientRect();
   return {
    x:Math.round(((e.clientX-r.left)/r.width*800-400)/40),
    y:Math.round((300-(e.clientY-r.top)/r.height*480)/40)
   };
  }
  function start(p){return e=>{drag=p;e.preventDefault();};}
  function move(e){
   if(!drag)return;
   const p=getPos(e);
   if(drag===1){p1x=Math.max(-5,Math.min(5,p.x));p1y=Math.max(-5,Math.min(5,p.y));}
   else{p2x=Math.max(-5,Math.min(5,p.x));p2y=Math.max(-5,Math.min(5,p.y));}
   render();
  }
  svg.onmousedown=start(drag||0);
  svg.onmousemove=move;
  svg.onmouseup=svg.onmouseleave=()=>drag=null;
  svg.querySelector('#dot1').onmousedown=start(1);
  svg.querySelector('#dot2').onmousedown=start(2);
  el.querySelector('#dot1').onmousedown=start(1);
  el.querySelector('#dot2').onmousedown=start(2);
  svg.ontouchstart=e=>{const t=e.touches[0];const p=getPos(t);drag=Math.hypot(p.x-p1x,p.y-p1y)<Math.hypot(p.x-p2x,p.y-p2y)?1:2;e.preventDefault();};
  svg.ontouchmove=e=>{move(e.touches[0]);e.preventDefault();};
  svg.ontouchend=()=>drag=null;
 };
 render();
}

/* ============ Lesson K5: finding y = kx + b ============ */
function microK5(el){
 let mode=1;
 function build(){
  // mode 1: proportional, one point fixes k   |  mode 2: b known, one point fixes k
  // mode 3: two points -> k from slope, then b
  let k,b,x1,y1,x2,y2;
  if(mode===1){ k=2; x1=3; y1=k*x1; b=0; }
  else if(mode===2){ b=4; k=3; x1=2; y1=k*x1+b; }
  else { k=2; b=-1; x1=1; y1=k*x1+b; x2=4; y2=k*x2+b; }
  const rows=mode===3
   ? `<div class="eq">k = (y₂ − y₁)/(x₂ − x₁) = (${y2} − ${y1})/(${x2} − ${x1}) = ${y2-y1}/${x2-x1} = <span class="num">${k}</span></div>
      <div class="eq">then ${y1} = ${k}·${x1} + b &nbsp;→&nbsp; b = <span class="num">${b}</span></div>
      <div class="eq">y = <span class="num">${k}x ${b<0?'− ':'- '}${Math.abs(b)}</span></div>`
   : (mode===1
     ? `<div class="eq">y = kx &nbsp;(goes through the origin, so b = 0)</div>
        <div class="eq">${y1} = k·${x1} &nbsp;→&nbsp; k = <span class="num">${k}</span></div>
        <div class="eq">y = <span class="num">${k}x</span></div>`
     : `<div class="eq">y = kx + ${b} &nbsp;(b is given)</div>
        <div class="eq">${y1} = k·${x1} + ${b} &nbsp;→&nbsp; k = <span class="num">${k}</span></div>
        <div class="eq">y = <span class="num">${k}x + ${b}</span></div>`);
  el.innerHTML=`
   <div class="step">Finding y = kx + b</div>
   <div class="box">
    <h3>The idea</h3>
    <p style="font-size:14px">Write the form down first, <b>then</b> put the numbers in. The letters you do not know are the unknowns; each point you are given turns into one equation.</p>
   </div>
   <div class="box">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
     <button class="stepbtn${mode===1?'':' ghost'}" id="m1">A · proportional, one point</button>
     <button class="stepbtn${mode===2?'':' ghost'}" id="m2">B · b known, one point</button>
     <button class="stepbtn${mode===3?'':' ghost'}" id="m3">C · two points</button>
    </div>
    <div class="box" style="background:#f8fafc">
     <p style="font-size:15px">${mode===1?`A proportional function passes through (${x1}, ${y1}). Find its rule.`
       :mode===2?`A linear function has b = ${b} and passes through (${x1}, ${y1}). Find its rule.`
       :`A linear function passes through (${x1}, ${y1}) and (${x2}, ${y2}). Find its rule.`}</p>
     ${rows}
    </div>
    <div class="box" style="background:#fffbeb">
     <h3>Why this works</h3>
     <p style="font-size:14px">${mode===3
      ? 'Two unknowns (k and b) need two equations — that is why two points are enough. One point alone leaves a whole family of lines through it.'
      : 'One unknown (k) needs one equation — one point is enough, because the other letter is already fixed.'}</p>
    </div>
   </div>`;
  el.querySelector('#m1').onclick=()=>{mode=1;build();};
  el.querySelector('#m2').onclick=()=>{mode=2;build();};
  el.querySelector('#m3').onclick=()=>{mode=3;build();};
 }
 build();
}

function diag(el,lessonId,generator){
 el.innerHTML=`<div class="step"><span class="en">Quick check</span><span class="zh">小测一下</span></div><div class="box"><p style="font-size:14px;color:var(--muted)">3 questions, just to see where you stand. Pass 3/3 to skip the lesson; otherwise the lesson comes next.</p><div id="diagQ"></div></div>`;

 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){
    qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3:</strong> you already have this — skip the lesson and go to practice.</div><div style="margin-top:14px"><button id="skipMicro"><span class="en">Skip the lesson, go to practice →</span><span class="zh">跳过微课，去做练习 →</span></button></div>`;
    qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};
   } else {

    qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};
   }
   save();renderNav();
   return;
  }
  const q=qs[i];
  qEl.innerHTML=`
   <div class="q">
    <div class="q-text">${i+1}. ${L(q.q,q.zhq)}</div>
    
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="da" autocomplete="off" placeholder="?"> <button id="sub"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ht"></div>
    <div class="feedback" id="fb"></div>
   </div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();
  qEl.querySelector('#sub').onclick=check;
  input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){

   else{fb.className='feedback show err';fb.innerHTML=L('✗ Not right, try again.','✗ 不对，再试一次。');}
  }
 };
 show();
}

 const type=ri(1,2);
 if(type===1){
  const k=ri(-3,3),b=ri(-3,3);
  const x=ri(-2,2);
  return {q:`If y = ${k}x + ${b}, what is y when x = ${x}?`,
   zhq:`若 y = ${k}x + ${b}，当 x = ${x} 时，y 是多少？`,
   check:a=>parseInt(a)===k*x+b,ans:String(k*x+b),hint:`y = ${k}*${x} + ${b}`,zhh:`y = ${k}*${x} + ${b}`};
 } else {
  // which is linear
  const isLinear=ri(0,1);
  const eqsLinear=['y=2x+1','y=-x+3','y=5x'];
  const eqsNotLinear=['y=x²','y=1/x','y=√x'];
  const eq=isLinear?pick(eqsLinear):pick(eqsNotLinear);
  return {q:`Is "${eq}" a linear function? Answer "yes" or "no".`,
   zhq:`"${eq}" 是一次函数吗？回答 "yes" 或 "no"。`,
   check:a=>{const ans=a.toLowerCase().trim();return (isLinear&&(ans==='yes'||ans==='y'||ans==='yes'))||(!isLinear&&(ans==='no'||ans==='n'||ans==='no'));},
   ans:isLinear?'yes':'no',hint:'Linear = y = kx + b (k≠0). Anything with x², 1/x, √x is not.',zhh:'一次函数的形式是 y = kx + b（k≠0）。含 x²、1/x、√x 的都不是。'};
 }
},
k3:()=>{
 const type=ri(1,2);
 if(type===1){
  // compute slope from two points
  const x1=ri(-2,2),y1=ri(-2,2),x2=x1+ri(1,3),y2=y1+ri(-3,3);
  const m=(y2-y1)/(x2-x1);
  return {q:`Find the slope of the line through (${x1},${y1}) and (${x2},${y2}).`,
   zhq:`求经过 (${x1},${y1}) 和 (${x2},${y2}) 两点的直线的斜率。`,
   check:a=>Math.abs(parseFloat(a)-m)<0.01,ans:String(m),
   hint:`k = (y₂−y₁)/(x₂−x₁) = (${y2}-${y1})/(${x2}-${x1})`,
   zhh:`k = (y₂−y₁)/(x₂−x₁) = (${y2}-${y1})/(${x2}-${x1})`};
 } else {
  // find y-intercept
  const k=ri(-3,3),b=ri(-3,3);
  return {q:`The line y = ${k}x + ${b} crosses the y-axis at what point?`,
   zhq:`直线 y = ${k}x + ${b} 与 y 轴交于哪一点？`,
   check:a=>parseInt(a)===b,ans:String(b),hint:'y-axis is x=0. Plug in x=0 → y=b.',zhh:'y 轴上 x=0。代入 x=0 → y=b。'};
 }
},
k5:()=>{
 // finding y = kx + b from given conditions
 const type=ri(1,4);
 if(type===1){
  // proportional: one point fixes k
  const k=ri(2,6),x=ri(2,6);
  return {q:`A proportional function passes through (${x}, ${k*x}). What is k?`,
   zhq:`一个正比例函数经过点 (${x}, ${k*x})。k 是多少？`,
   check:v=>parseInt(v)===k,ans:String(k),
   hint:`Proportional means y = kx with b = 0, so ${k*x} = k·${x}.`,
   zhh:`正比例函数形如 y = kx（b = 0），所以 ${k*x} = k·${x}。`};
 } else if(type===2){
  // b given, one point fixes k
  const b=ri(1,9),k=ri(2,6),x=ri(2,6);
  return {q:`A linear function y = kx + ${b} passes through (${x}, ${k*x+b}). What is k?`,
   zhq:`一次函数 y = kx + ${b} 经过点 (${x}, ${k*x+b})。k 是多少？`,
   check:v=>parseInt(v)===k,ans:String(k),
   hint:`Put the point in: ${k*x+b} = k·${x} + ${b}, so k·${x} = ${k*x}.`,
   zhh:`把点代入：${k*x+b} = k·${x} + ${b}，所以 k·${x} = ${k*x}。`};
 } else if(type===3){
  // two points -> find k (integer slope)
  const k=ri(2,5),b=ri(-4,4);
  const x1=ri(-2,2),x2=x1+ri(1,3);
  const y1=k*x1+b,y2=k*x2+b;
  return {q:`A line passes through (${x1}, ${y1}) and (${x2}, ${y2}). What is k?`,
   zhq:`一条直线经过 (${x1}, ${y1}) 和 (${x2}, ${y2})。k 是多少？`,
   check:v=>parseInt(v)===k,ans:String(k),
   hint:`k = (y₂ − y₁)/(x₂ − x₁) = (${y2} − ${y1})/(${x2} − ${x1}).`,
   zhh:`k = (y₂ − y₁)/(x₂ − x₁) = (${y2} − ${y1})/(${x2} − ${x1})。`};
 } else {
  // two points -> find b
  const k=ri(2,5),b=ri(-4,6);
  const x1=ri(-2,2),x2=x1+ri(1,3);
  const y1=k*x1+b,y2=k*x2+b;
  return {q:`A line passes through (${x1}, ${y1}) and (${x2}, ${y2}). What is b?`,
   zhq:`一条直线经过 (${x1}, ${y1}) 和 (${x2}, ${y2})。b 是多少？`,
   check:v=>parseInt(v)===b,ans:String(b),
   hint:`k = (${y2} − ${y1})/(${x2} − ${x1}) = ${k}, then ${y1} = ${k}·${x1} + b.`,
   zhh:`k = (${y2} − ${y1})/(${x2} − ${x1}) = ${k}，再由 ${y1} = ${k}·${x1} + b 求 b。`};
 }
},
k4:()=>{
 // simple modeling
 const k=ri(2,5),b=ri(1,5);
  const x=ri(5,10);
  return {q:`A taxi charges a ${b} yuan flagfall plus ${k} yuan per km. If you travel ${x} km, what is the fare?`,
   zhq:`出租车起步价 ${b} 元，之后每公里 ${k} 元。行驶 ${x} 公里，车费是多少？`,
   check:a=>parseInt(a)===k*x+b,ans:String(k*x+b),hint:`y = ${k}x + ${b}, plug x=${x}`,zhh:`y = ${k}x + ${b}，代入 x=${x}`};
},
};

/* ============ Practice module ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`
   <div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div>
   <div class="info" style="font-size:13px;color:var(--muted);margin:8px 0">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${L(q.q,q.zhq)}</div>
    
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};

  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');
    inp.disabled=true;
    syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 q=gen();tries=0;update();
}

/* ============ Chapter check ============ */
function chTest(el){
 el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div><div class="box"><p style="font-size:13px;color:var(--muted)">12 questions covering the 5 topics in this chapter.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<3;i++)qs.push(generators.k1());
 for(let i=0;i<2;i++)qs.push(generators.k2());
 for(let i=0;i<3;i++)qs.push(generators.k3());
 for(let i=0;i<2;i++)qs.push(generators.k5());
 for(let i=0;i<2;i++)qs.push(generators.k4());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){
   tq.innerHTML=`<div class="note" style="background:${ok>=8?'#dcfce7':'#fef3c7'};border-color:${ok>=8?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${ok>=8?'Chapter passed! Go to Ch05':'Go back and review what you missed'}</div>`;
   S.test={ok,tot:qs.length};save();renderNav();return;
  }
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti" autocomplete="off"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.innerHTML=L(q.hint||'', q.zhh||'');}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

 nav.innerHTML=LESSONS.map(l=>{

 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  const titles={k1:'What is a function?',k2:'Linear and proportional functions',k3:'Slope and intercept',k5:'Finding the rule',k4:'Applications'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k5')microK5(c);
   else if(id==='k4')microK4(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  introRender(main);
 }
}
render();
