/* ============ 微课 K1：在数轴上作出 √2（跨章衔接） ============ */
function microK1(el){
  let step=0;
  const steps=[
    {t:'数轴上画出 0 和 1',d:'先在数轴上确定单位长度 1。'},
    {t:'在 1 处作垂线，取长度 1',d:'过 x=1 作垂线，向上量 1 个单位。'},
    {t:'连接 0 到该点 → 斜边 = √2',d:'由勾股定理：1² + 1² = 2，所以斜边 = √2。'},
    {t:'以 0 为圆心画弧，交数轴于 √2',d:'把这段长度转到数轴上，就得到 √2 的精确位置。'}
  ];
  el.innerHTML=`
    <div class="step">玩一玩</div>
    <h3>√2 在数轴上到底在哪？</h3>
    <div class="lead">
      √2 ≈ 1.414 是近似值。要画在数轴上得用尺子量。下面用第一章的勾股定理一步步把它画出来 —— 点按钮一步步看。
    </div>
    <div class="row"><button class="stepbtn" id="prev">← 上一步</button>
      <button class="stepbtn" id="next">下一步 →</button>
      <button class="stepbtn ghost" id="auto">自动播放</button>
      <span class="val" id="snum">1 / 4</span></div>
    <div class="fig"><div class="cap" id="stitle">${steps[0].t}</div>
      <svg id="svgA" viewBox="0 0 560 260" width="540" height="250"></svg>
      <div class="sub2" id="sdesc">${steps[0].d}</div></div>
    <div class="box">√2 就在这儿 —— 数轴上实实在在的一个点，跟 1、2、3 一样。</div>`;

  const SC=110, OX=70, OY=190;
  const X=v=>OX+v*SC, Y=v=>OY-v*SC;
  function draw(){
    let g='';
    // 数轴
    g+=`<line x1="${X(-0.4)}" y1="${OY}" x2="${X(4.6)}" y2="${OY}" stroke="#1c2430" stroke-width="2"/>`;
    for(let i=0;i<=4;i++){
      g+=`<line x1="${X(i)}" y1="${OY-5}" x2="${X(i)}" y2="${OY+5}" stroke="#1c2430" stroke-width="1.5"/>`;
      g+=`<text x="${X(i)}" y="${OY+20}" font-size="13" fill="#1c2430" text-anchor="middle">${i}</text>`;
    }
    // 单位段 0→1
    if(step>=0){
      g+=`<line x1="${X(0)}" y1="${OY+9}" x2="${X(1)}" y2="${OY+9}" stroke="#7c3aed" stroke-width="3"/>`;
      g+=`<text x="${X(0.5)}" y="${OY+34}" font-size="12" fill="#7c3aed" text-anchor="middle">1</text>`;
    }
    if(step>=1){
      g+=`<line x1="${X(1)}" y1="${OY}" x2="${X(1)}" y2="${Y(1)}" stroke="#0ea5e9" stroke-width="3"/>`;
      g+=`<text x="${X(1)+12}" y="${(OY+Y(1))/2}" font-size="12" fill="#0ea5e9">1</text>`;
    }
    if(step>=2){
      g+=`<line x1="${X(0)}" y1="${OY}" x2="${X(1)}" y2="${Y(1)}" stroke="#dc2626" stroke-width="3"/>`;
      const mx=(X(0)+X(1))/2, my=(OY+Y(1))/2;
      g+=`<text x="${mx-18}" y="${my-6}" font-size="14" fill="#dc2626" font-weight="bold">√2</text>`;
      g+=`<text x="${X(1)+16}" y="${Y(1)-4}" font-size="12" fill="#1c2430">(1,1)</text>`;
    }
    if(step>=3){
      const r=Math.sqrt(2)*SC;
      g+=`<path d="M ${X(0)+r} ${OY} A ${r} ${r} 0 0 1 ${X(1)} ${Y(1)}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>`;
      g+=`<circle cx="${X(Math.sqrt(2))}" cy="${OY}" r="6" fill="#16a34a" stroke="#fff" stroke-width="2"/>`;
      g+=`<text x="${X(Math.sqrt(2))}" y="${OY-14}" font-size="13" fill="#16a34a" font-weight="bold" text-anchor="middle">√2 ≈ 1.414</text>`;
    }
    el.querySelector('#svgA').innerHTML=g;
    el.querySelector('#stitle').textContent=steps[step].t;
    el.querySelector('#sdesc').textContent=steps[step].d;
    el.querySelector('#snum').textContent=(step+1)+' / 4';
  }
  el.querySelector('#next').onclick=()=>{step=Math.min(3,step+1);draw();};
  el.querySelector('#prev').onclick=()=>{step=Math.max(0,step-1);draw();};
  el.querySelector('#auto').onclick=()=>{
    step=0;draw();
    let i=0;const t=setInterval(()=>{i++;if(i>=3){clearInterval(t);}step=Math.min(3,i);draw();},1100);
  };
  draw();
}

/* ============ 微课 K2：√9=3 vs x²=9 → ±3 ============ */
function microK2(el){
  let n=9;
  el.innerHTML=`
    <div class="step">玩一玩</div>
    <h3>√n  vs  x² = n </h3>
    <div class="lead">两个问题很像，但答案不一样。拖滑块自己看差别。</div>
    <div class="slider-row"><label>n = <input type="range" id="rn" min="1" max="25" value="9"><span class="val" id="vn">9</span></label></div>
    <div class="micro">
      <div class="fig"><div class="cap">√n 是什么 </div>
        <svg id="sL" viewBox="0 0 240 150" width="230" height="144"></svg>
        <div class="sub2" id="dL"></div></div>
      <div class="fig"><div class="cap">x² = n 的解 </div>
        <svg id="sR" viewBox="0 0 240 150" width="230" height="144"></svg>
        <div class="sub2" id="dR"></div></div>
    </div>
    <div class="box">√9 只问 3 — 一个答案。x²=9 问 x=±3 — 两个答案。
      </div>`;
  const draw=()=>{
    const r=Math.sqrt(n);
    const isSq=Math.abs(r-Math.round(r))<1e-9;
    let L=`<text x="120" y="52" font-size="26" fill="#7c3aed" font-weight="bold" text-anchor="middle">√${n} = ${isSq?Math.round(r):r.toFixed(3)}</text>
           <text x="120" y="86" font-size="13" fill="#15803d" text-anchor="middle">只有一个值 · 非负</text>
           <line x1="40" y1="110" x2="200" y2="110" stroke="#e3e8ef" stroke-width="2"/>
           <circle cx="${40+(r/6)*160}" cy="110" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/>
           <text x="40" y="132" font-size="11" fill="#6b7785" text-anchor="middle">0</text>`;
    el.querySelector('#sL').innerHTML=L;
    el.querySelector('#dL').innerHTML=`√${n} 是「算术平方根」，只取非负数`;
    let R=isSq
      ? `<text x="120" y="42" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">x² = ${n}</text>
         <text x="120" y="74" font-size="20" fill="#dc2626" font-weight="bold" text-anchor="middle">x = +${Math.round(r)}  或  −${Math.round(r)}</text>
         <text x="120" y="100" font-size="13" fill="#b91c1c" text-anchor="middle">${n===0?'只有一个（0）':'两个解 · 一正一负'}</text>
         <line x1="30" y1="124" x2="210" y2="124" stroke="#e3e8ef" stroke-width="2"/>
         <circle cx="${120-(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <circle cx="${120+(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <text x="${120-(r/6)*90}" y="144" font-size="11" fill="#dc2626" text-anchor="middle">−${Math.round(r)}</text>
         <text x="${120+(r/6)*90}" y="144" font-size="11" fill="#dc2626" text-anchor="middle">+${Math.round(r)}</text>`
      : `<text x="120" y="42" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">x² = ${n}</text>
         <text x="120" y="74" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle">x = ±√${n} ≈ ±${r.toFixed(3)}</text>
         <text x="120" y="100" font-size="13" fill="#b91c1c" text-anchor="middle">两个解 · 都是无理数</text>
         <line x1="30" y1="124" x2="210" y2="124" stroke="#e3e8ef" stroke-width="2"/>
         <circle cx="${120-(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <circle cx="${120+(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>`;
    el.querySelector('#sR').innerHTML=R;
    el.querySelector('#dR').innerHTML=`x² = ${n} 是方程，要找出所有平方后等于 ${n} 的数`;
  };
  el.querySelector('#rn').oninput=()=>{n=+el.querySelector('#rn').value;el.querySelector('#vn').textContent=n;draw();};
  draw();
}

/* ============ 微课 K3：立方根可为负 ============ */
function microK3(el){
  let v=8;
  el.innerHTML=`
    <div class="step">玩一玩</div>
    <h3>Cube roots can be negative </h3>
    <div class="lead">拖滑块穿过 0 —— 看会发生什么。</div>
    <div class="slider-row"><label>被开方数 <input type="range" id="rv" min="-27" max="27" value="8"><span class="val" id="vv">8</span></label></div>
    <div class="eqbox" id="res"></div>
    <div class="micro">

      `&nbsp;&nbsp;&nbsp;&nbsp;∛${v} = ${Math.abs(cr-Math.round(cr))<1e-9? Math.round(cr): cr.toFixed(3)}`;

            <text x="120" y="80" font-size="12" fill="#6b7785" text-anchor="middle">${ok?'被开方数必须 ≥ 0':'负数没有（实数）平方根'}</text>`;

    el.querySelector('#eq4').innerHTML=
      `${lo}² = ${lo*lo} &lt; ${n} &lt; ${hi*hi} = ${hi}² &nbsp;→&nbsp; ${lo} &lt; √${n} &lt; ${hi}`+
      `&nbsp;&nbsp;|&nbsp;&nbsp; <span class="num">√${n} ≈ ${trueV.toFixed(Math.min(d+1,4))}</span>`;

  }

  el.querySelector('#refine').onclick=()=>{d=Math.min(4,d+1);draw();};
  el.querySelector('#reset2').onclick=()=>{init();draw();};
  init();draw();

function microK7(el){

    }
    g+=`<text x="${30+S*k/2}" y="${20+S*k+18}" font-size="12" fill="#7c3aed" text-anchor="middle">面积 = ${k}² × ${m} = ${prod}</text>`;
    g+=`<text x="230" y="60" font-size="16" fill="#1c2430">边长 = √${prod}</text>`;
    g+=`<text x="230" y="86" font-size="16" fill="#7c3aed" font-weight="bold">= ${k} × √${m}</text>`;
    g+=`<text x="230" y="112" font-size="12" fill="#6b7785">（${k} 个 √${m} 并排）</text>`;
    g+=`<line x1="230" y1="128" x2="400" y2="128" stroke="#e3e8ef" stroke-width="2"/>`;
    for(let i=0;i<k;i++){
      g+=`<rect x="${230+i*34}" y="140" width="32" height="32" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
          <text x="${230+i*34+16}" y="${160}" font-size="11" fill="#5b21b6" text-anchor="middle">${m}</text>`;
    }
    g+=`<text x="${230+k*34/2}" y="${186}" font-size="11" fill="#6b7785" text-anchor="middle">每块边长 √${m}，共 ${k} 块</text>`;
    el.querySelector('#s7').innerHTML=g;
    el.querySelector('#d7').textContent=`√${prod} = ${k}√${m}`;
  };
  el.querySelector('#rk').oninput=()=>{el.querySelector('#vk').textContent=el.querySelector('#rk').value;draw();};
  el.querySelector('#rm').oninput=()=>{el.querySelector('#vm').textContent=el.querySelector('#rm').value;draw();};
  draw();
}

/* ============ 练习引擎 ============ */
function genQ(type,diff){
  if(type==='sqrt'){
    const p=pick(SQR.filter(x=>diff===1?x<=100:true));
    return {q:`Find <b>√${p}</b>.<br><span class="cn-tag">求 ${p} 的算术平方根</span>`,
      ans:Math.sqrt(p), sol:`因为 ${Math.sqrt(p)}² = ${p}，且算术平方根取非负数，所以 √${p} = ${Math.sqrt(p)}`};
  }
  if(type==='cuberoot'){
    const sign=Math.random()<0.35?-1:1;
    const p=pick(CUB.filter(x=>diff===1?x<=125:true));
    const v=sign*p;
    return {q:`Find <b>∛${v}</b>.<br><span class="cn-tag">求 ${v} 的立方根</span>`,
      ans:Math.cbrt(v), sol:`因为 (${Math.cbrt(v)})³ = ${v}，所以 ∛${v} = ${Math.cbrt(v)}${v<0?'（负数也有立方根）':''}`};
  }
  if(type==='eq'){
    const p=pick(SQR.filter(x=>diff===1?x<=81:true));
    return {q:`Solve <b>x² = ${p}</b>. Select ALL solutions — how many are there?<br><span class="cn-tag">解方程 x² = ${p}，有几个解？</span>`,
      ans:p===0?'1':'2', sol:`x² = ${p} → x = ±√${p} = ±${Math.sqrt(p)}，共 ${p===0?'1':'2'} 个解（一正一负）`};
  }
  if(type==='ratirr'){
    const irr=['√2','√3','√5','√7','π','√10','√8'];
    const rat=['1/2','0.75','-3','0.333...','22/7','0.6','5'];
    const isIrr=Math.random()<0.5;
    const v=isIrr?pick(irr):pick(rat);
    return {q:`Is <b>${v}</b> rational or irrational?<br><span class="cn-tag">${v} 是有理数还是无理数？</span>`,
      ans:isIrr?'Irrational':'Rational',
      sol:isIrr?`${v} 不能写成两个整数的比，是无限不循环小数 → 无理数`:`${v} 可以写成分数（两个整数之比）→ 有理数`};
  }
  if(type==='estimate'){
    const n=ri(2,90);
    const lo=Math.floor(Math.sqrt(n));
    return {q:`Between which two consecutive integers is <b>√${n}</b>?<br><span class="cn-tag">√${n} 在哪两个连续整数之间？</span>`,
      ans:`${lo} and ${lo+1}`,
      sol:`${lo}² = ${lo*lo}，${lo+1}² = ${(lo+1)*(lo+1)}。因为 ${lo*lo} < ${n} < ${(lo+1)*(lo+1)}，所以 ${lo} < √${n} < ${lo+1}`};
  }
  if(type==='simplify'){
    const k=ri(2,7), m=ri(2,11);
    return {q:`Simplify <b>√${k*k*m}</b>.<br><span class="cn-tag">化简 √${k*k*m}</span>`,
      ans:`${k}√${m}`,
      sol:`√${k*k*m} = √${k*k} × √${m} = ${k}√${m}`};
  }
}

function renderQ(el,q,onAns){
  el.innerHTML=`<div class="q"><div class="qt">${q.q}</div><div id="opts"></div>
    <div class="row"><button class="ghost" id="hb">Hint 提示</button></div>
    <div class="hint" id="hint">${q.hint||'先判断求的是「算术平方根」还是「方程的解」——前者只有一个非负答案，后者一正一负。'}</div>
    <div class="fb" id="fb"></div></div>`;
  const od=el.querySelector('#opts');
  let opts;
  if(['Yes','No','Rational','Irrational','1','2'].includes(String(q.ans))){
    const map={'ratirr':['Rational','Irrational'],'eq':['1','2'],'conv':['Yes','No']};
    opts=map[guessType(q)]||['Rational','Irrational'];
  } else if(String(q.ans).includes(' and ')){
    opts=[q.ans, `${parseInt(q.ans)-1} and ${parseInt(q.ans)}`, `${parseInt(q.ans)+1} and ${parseInt(q.ans)+2}`];
  } else if(String(q.ans).includes('√')){
    const kk=parseInt(q.ans);
    opts=[q.ans, `${kk+1}√${q.ans.split('√')[1]}`, `${kk-1}√${q.ans.split('√')[1]}`, `√${q.ans.split('√')[1]}`];
  } else {
    const n=+q.ans;
    opts=[...new Set([n, n+1, Math.max(-10,n-1), n+ri(2,4), -n])].slice(0,4);
  }
  opts=[...new Set(opts)].sort(()=>Math.random()-0.5);
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=String(o);
    b.onclick=()=>{
      od.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok=String(o)===String(q.ans);
      b.classList.add(ok?'sel-ok':'sel-bad');
      if(!ok) od.querySelectorAll('.opt').forEach(x=>{if(x.innerHTML===String(q.ans))x.classList.add('sel-ok');});
      const fb=el.querySelector('#fb'); fb.className='fb '+(ok?'ok':'bad');
      fb.innerHTML=(ok?'✓ Correct. ':'✗ Not quite. ')+q.sol;
      onAns(ok);
    };
    od.appendChild(b);
  });
  el.querySelector('#hb').onclick=()=>el.querySelector('#hint').classList.add('on');
}
function guessType(q){
  if(q.q.includes('rational or irrational'))return 'ratirr';
  if(q.q.includes('how many are there'))return 'eq';
  return 'conv';
}

/* ============ 诊断 / 练习 / 章测 ============ */
function diag(el,id,types){
  const s=st(id);
  if(s.diag){el.innerHTML=`<div class="box"><b>先测一下：</b>${s.diag.pass?'✓ 全对，可直接练。':'已完成，有错题 → 先看微课。'}</div>`;return;}
  el.innerHTML=`<div class="step">先测一下</div>
    <div class="lead">3 道题。全对可跳过讲解直接练习。</div>
    <div id="dq"></div><div class="row"><button id="done2" disabled>提交诊断</button></div>`;
  const box=el.querySelector('#dq'); let ok=0,done=0;
  const qs=types.map(t=>genQ(t,1));
  qs.forEach(q=>{const d=document.createElement('div');box.appendChild(d);
    renderQ(d,q,r=>{if(r)ok++;done++;if(done===qs.length)el.querySelector('#done2').disabled=false;},true);});
  el.querySelector('#done2').onclick=()=>{
    s.diag={ok,tot:qs.length,pass:ok===qs.length};save();
    el.innerHTML=`<div class="box"><b>诊断结果：${ok}/${qs.length}</b><br>${ok===qs.length?'✓ 全对，直接进练习。':'建议先看微课和视频。'}</div>`;};
}
function prac(el,id,types,need){
  const s=st(id);
  el.innerHTML=`<div class="step">练一练</div>
    <div class="lead">题目实时生成，每次不同。过关线：连续答对 ${need} 题。</div>
    <div class="stat"><span>连对：<b id="sk">0</b>/${need}</span><span>累计：<b id="cm">${s.prac.ok}/${s.prac.tot}</b></span><span id="ms"></span></div>
    <div class="prog"><i id="pb" style="width:0%"></i></div>
    <div id="pq"></div><div class="row"><button id="nq">下一题</button><button class="ghost" id="rs">重置</button></div>`;
  let streak=0,diff=1;
  const upd=()=>{el.querySelector('#sk').textContent=streak;
    el.querySelector('#cm').textContent=s.prac.ok+'/'+s.prac.tot;
    el.querySelector('#pb').style.width=Math.min(100,streak/need*100)+'%';
    const m=el.querySelector('#ms');
    m.innerHTML=streak>=need?'<span class="mastery m-pro">Proficient 熟练</span>'
      :(s.prac.tot>0&&s.prac.ok/s.prac.tot>=0.7?'<span class="mastery m-fam">Familiar 熟悉</span>'
      :'<span class="mastery m-none">Not started</span>');};
  const next=()=>{const box=el.querySelector('#pq');box.innerHTML='';
    const d=document.createElement('div');box.appendChild(d);
    const q=genQ(pick(types),diff);
    renderQ(d,q,r=>{s.prac.tot++;if(r){s.prac.ok++;streak++;if(streak>=3)diff=Math.min(3,diff+1);}else{streak=0;diff=Math.max(1,diff-1);}
      if(streak>=need){s.done=true;save();renderNav();}save();upd();});upd();};
  el.querySelector('#nq').onclick=next;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};s.done=false;streak=0;save();upd();renderNav();};
  next();
}
