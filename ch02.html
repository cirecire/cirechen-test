/* ============ Lesson K1: placing √2 on the number line ============ */
function microK1(el){
  let step=0;
  const steps=[
    {t:'Mark 0 and 1 on the number line'},
    {t:'At 1, draw a perpendicular of length 1'},
    {t:'Join 0 to that point — the hypotenuse is √2'},
    {t:'Swing an arc centred at 0 to meet the line at √2'}
  ];
  el.innerHTML=`
    <div class="step">Have a go</div>
    <h3>Where exactly is √2 on the number line?</h3>
    <div class="lead">
      √2 ≈ 1.414 is only an approximation; you cannot just measure it with a ruler. So build it with the theorem from chapter 1 — press through the steps.
    </div>
    <div class="row"><button class="stepbtn" id="prev">← Back</button>
      <button class="stepbtn" id="next">Next →</button>
      <button class="stepbtn ghost" id="auto">Autoplay</button>
      <span class="val" id="snum">1 / 4</span></div>
    <div class="fig"><div class="cap" id="stitle">${steps[0].t}</div>
      <svg id="svgA" viewBox="0 0 560 260" width="540" height="250"></svg>
      <div class="sub2" id="sdesc">${steps[0].d}</div></div>
    <div class="box">There it is — √2 is a genuine point on the line, just like 1, 2 and 3.</div>`;

  const SC=110, OX=70, OY=190;
  const X=v=>OX+v*SC, Y=v=>OY-v*SC;
  function draw(){
    let g='';
    // number line
    g+=`<line x1="${X(-0.4)}" y1="${OY}" x2="${X(4.6)}" y2="${OY}" stroke="#1c2430" stroke-width="2"/>`;
    for(let i=0;i<=4;i++){
      g+=`<line x1="${X(i)}" y1="${OY-5}" x2="${X(i)}" y2="${OY+5}" stroke="#1c2430" stroke-width="1.5"/>`;
      g+=`<text x="${X(i)}" y="${OY+20}" font-size="13" fill="#1c2430" text-anchor="middle">${i}</text>`;
    }
    // unit segment 0 to 1
    if(step>=0){
      g+=`<line x1="${X(0)}" y1="${OY+9}" x2="${X(1)}" y2="${OY+9}" stroke="#7c3aed" stroke-width="3"/>`;
      g+=`<text x="${X(0.5)}" y="${OY+34}" font-size="12" fill="#7c3aed" text-anchor="middle">1</text>`;
    }
    if(step>=1){
      g+=`<line x1="${X(1)}" y1="${OY}" x2="${X(1)}" y2="${Y(1)}" stroke="#0ea5e9" stroke-width="3"/>`;
      g+=`<text x="${X(1)+12}" y="${(OY+Y(1))/2}" font-size="12" fill="#0ea5e9">1</text>`;
    }
    if(step>=2){
      g+=`<line x1="${X(0)}" y1="${OY}" x2="${X(1)}" y2="${Y(1)}" stroke="#dc2626" stroke-width="3"/>`;
      const mx=(X(0)+X(1))/2, my=(OY+Y(1))/2;
      g+=`<text x="${mx-18}" y="${my-6}" font-size="14" fill="#dc2626" font-weight="bold">√2</text>`;
      g+=`<text x="${X(1)+16}" y="${Y(1)-4}" font-size="12" fill="#1c2430">(1,1)</text>`;
    }
    if(step>=3){
      const r=Math.sqrt(2)*SC;
      g+=`<path d="M ${X(0)+r} ${OY} A ${r} ${r} 0 0 1 ${X(1)} ${Y(1)}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>`;
      g+=`<circle cx="${X(Math.sqrt(2))}" cy="${OY}" r="6" fill="#16a34a" stroke="#fff" stroke-width="2"/>`;
      g+=`<text x="${X(Math.sqrt(2))}" y="${OY-14}" font-size="13" fill="#16a34a" font-weight="bold" text-anchor="middle">√2 ≈ 1.414</text>`;
    }
    el.querySelector('#svgA').innerHTML=g;
    el.querySelector('#stitle').textContent=steps[step].t;
    el.querySelector('#sdesc').textContent=steps[step].d;
    el.querySelector('#snum').textContent=(step+1)+' / 4';
  }
  el.querySelector('#next').onclick=()=>{step=Math.min(3,step+1);draw();};
  el.querySelector('#prev').onclick=()=>{step=Math.max(0,step-1);draw();};
  el.querySelector('#auto').onclick=()=>{
    step=0;draw();
    let i=0;const t=setInterval(()=>{i++;if(i>=3){clearInterval(t);}step=Math.min(3,i);draw();},1100);
  };
  draw();
}

/* ============ Lesson K2：√9=3 vs x²=9 → ±3 ============ */
function microK2(el){
  let n=9;
  el.innerHTML=`
    <div class="step">Have a go</div>
    <h3>√n  vs  x² = n </h3>
    <div class="lead">Two questions that look alike but answer differently. Drag the slider and see.</div>
    <div class="slider-row"><label>n = <input type="range" id="rn" min="1" max="25" value="9"><span class="val" id="vn">9</span></label></div>
    <div class="micro">
      <div class="fig"><div class="cap">What is √n?</div>
        <svg id="sL" viewBox="0 0 240 150" width="230" height="144"></svg>
        <div class="sub2" id="dL"></div></div>
      <div class="fig"><div class="cap">Solutions of x² = n</div>
        <svg id="sR" viewBox="0 0 240 150" width="230" height="144"></svg>
        <div class="sub2" id="dR"></div></div>
    </div>
    <div class="box">√9 asks only for 3 — one answer. x² = 9 asks for x = ±3 — two answers.
      </div>`;
  const draw=()=>{
    const r=Math.sqrt(n);
    const isSq=Math.abs(r-Math.round(r))<1e-9;
    let L=`<text x="120" y="52" font-size="26" fill="#7c3aed" font-weight="bold" text-anchor="middle">√${n} = ${isSq?Math.round(r):r.toFixed(3)}</text>
           <text x="120" y="86" font-size="13" fill="#15803d" text-anchor="middle">One value only · never negative</text>
           <line x1="40" y1="110" x2="200" y2="110" stroke="#e3e8ef" stroke-width="2"/>
           <circle cx="${40+(r/6)*160}" cy="110" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/>
           <text x="40" y="132" font-size="11" fill="#6b7785" text-anchor="middle">0</text>`;
    el.querySelector('#sL').innerHTML=L;
    el.querySelector('#dL').innerHTML=`√${n} is the principal square root — the non-negative one`;
    let R=isSq
      ? `<text x="120" y="42" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">x² = ${n}</text>
         <text x="120" y="74" font-size="20" fill="#dc2626" font-weight="bold" text-anchor="middle">x = +${Math.round(r)}  or  −${Math.round(r)}</text>
         <text x="120" y="100" font-size="13" fill="#b91c1c" text-anchor="middle">${n===0?'only one (0)':'Two solutions · one positive, one negative'}</text>
         <line x1="30" y1="124" x2="210" y2="124" stroke="#e3e8ef" stroke-width="2"/>
         <circle cx="${120-(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <circle cx="${120+(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <text x="${120-(r/6)*90}" y="144" font-size="11" fill="#dc2626" text-anchor="middle">−${Math.round(r)}</text>
         <text x="${120+(r/6)*90}" y="144" font-size="11" fill="#dc2626" text-anchor="middle">+${Math.round(r)}</text>`
      : `<text x="120" y="42" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">x² = ${n}</text>
         <text x="120" y="74" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle">x = ±√${n} ≈ ±${r.toFixed(3)}</text>
         <text x="120" y="100" font-size="13" fill="#b91c1c" text-anchor="middle">Two solutions · both irrational</text>
         <line x1="30" y1="124" x2="210" y2="124" stroke="#e3e8ef" stroke-width="2"/>
         <circle cx="${120-(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
         <circle cx="${120+(r/6)*90}" cy="124" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>`;
    el.querySelector('#sR').innerHTML=R;
    el.querySelector('#dR').innerHTML=`x² = ${n} is an equation: find every number whose square is ${n}`;
  };
  el.querySelector('#rn').oninput=()=>{n=+el.querySelector('#rn').value;el.querySelector('#vn').textContent=n;draw();};
  draw();
}

/* ============ Lesson K3: cube roots can be negative ============ */
function microK3(el){
  let v=8;
  el.innerHTML=`
    <div class="step">Have a go</div>
    <h3>Cube roots can be negative </h3>
    <div class="lead">Drag the slider past 0 and watch what happens.</div>
    <div class="slider-row"><label>the number <input type="range" id="rv" min="-27" max="27" value="8"><span class="val" id="vv">8</span></label></div>
    <div class="eqbox" id="res"></div>
    <div class="micro">
      <div class="fig"><div class="cap">Square root √v</div><svg id="cs" viewBox="0 0 240 120" width="230" height="115"></svg>
        <div class="sub2" id="csd"></div></div>
      <div class="fig"><div class="cap">Cube root ∛v</div><svg id="cc" viewBox="0 0 240 120" width="230" height="115"></svg>
        <div class="sub2" id="ccd"></div></div>
    </div>
    <div class="box">(−3)² = 9. What number squares to −9? None. So √(−4) does not exist. But (−2)³ = −8, so ∛(−8) = −2.</div>`;
  const draw=()=>{
    const ok = v>=0;
    const sr = ok?Math.sqrt(v):null;
    const cr = Math.cbrt(v);
    el.querySelector('#res').innerHTML =
      `√${v} = ${ok? (Math.abs(sr-Math.round(sr))<1e-9? Math.round(sr): sr.toFixed(3)) : '<span style="color:#dc2626">does not exist in the real numbers</span>'}`+

/* ============ Practice engine ============ */
function genQ(type,diff){
  if(type==='sqrt'){
    const p=pick(SQR.filter(x=>diff===1?x<=100:true));
    return {q:`Find <b>√${p}</b>.<br><span class="cn-tag">Find the principal square root of ${p}.</span>`,
      ans:Math.sqrt(p), sol:`Since ${Math.sqrt(p)}² = ${p}, and the principal root is non-negative, √${p} = ${Math.sqrt(p)}`};
  }
  if(type==='cuberoot'){
    const sign=Math.random()<0.35?-1:1;
    const p=pick(CUB.filter(x=>diff===1?x<=125:true));
    const v=sign*p;
    return {q:`Find <b>∛${v}</b>.<br><span class="cn-tag">Find the cube root of ${v}.</span>`,
      ans:Math.cbrt(v), sol:`Since (${Math.cbrt(v)})³ = ${v}, ∛${v} = ${Math.cbrt(v)}${v<0?'(negative numbers have cube roots too)':''}`};
  }
  if(type==='eq'){
    const p=pick(SQR.filter(x=>diff===1?x<=81:true));
    return {q:`Solve <b>x² = ${p}</b>. Select ALL solutions — how many are there?<br><span class="cn-tag">Solve x² = ${p}. How many solutions?</span>`,
      ans:p===0?'1':'2', sol:`x² = ${p} → x = ±√${p} = ±${Math.sqrt(p)}，so ${p===0?'1':'2'} solutions (one positive, one negative)`};
  }
  if(type==='ratirr'){
    const irr=['√2','√3','√5','√7','π','√10','√8'];
    const rat=['1/2','0.75','-3','0.333...','22/7','0.6','5'];
    const isIrr=Math.random()<0.5;
    const v=isIrr?pick(irr):pick(rat);
    return {q:`Is <b>${v}</b> rational or irrational?<br><span class="cn-tag">Is ${v} rational or irrational?</span>`,
      ans:isIrr?'Irrational':'Rational',
      sol:isIrr?`${v} cannot be written as a ratio of two integers; its decimal never ends and never repeats → irrational`:`${v} can be written as a fraction (a ratio of two integers) → rational`};
  }
  if(type==='estimate'){
    const n=ri(2,90);
    const lo=Math.floor(Math.sqrt(n));
    return {q:`Between which two consecutive integers is <b>√${n}</b>?<br><span class="cn-tag">Between which two consecutive integers does √${n} lie?</span>`,
      ans:`${lo} and ${lo+1}`,
      sol:`${lo}² = ${lo*lo} and ${lo+1}² = ${(lo+1)*(lo+1)}. Since ${lo*lo} < ${n} < ${(lo+1)*(lo+1)}, we get ${lo} < √${n} < ${lo+1}`};
  }
  if(type==='simplify'){
    const k=ri(2,7), m=ri(2,11);
    return {q:`Simplify <b>√${k*k*m}</b>.<br><span class="cn-tag">Simplify √${k*k*m}.</span>`,
      ans:`${k}√${m}`,
      sol:`√${k*k*m} = √${k*k} × √${m} = ${k}√${m}`};
  }
}

function renderQ(el,q,onAns){
  el.innerHTML=`<div class="q"><div class="qt">${q.q}</div><div id="opts"></div>
    <div class="row"><button class="ghost" id="hb">Hint</button></div>
    <div class="hint" id="hint">${q.hint||'First decide whether you are being asked for the principal square root or for solutions to an equation — the first has one non-negative answer, the second two, one positive and one negative.'}</div>
    <div class="fb" id="fb"></div></div>`;
  const od=el.querySelector('#opts');
  let opts; let tries=0;
  if(['Yes','No','Rational','Irrational','1','2'].includes(String(q.ans))){
    const map={'ratirr':['Rational','Irrational'],'eq':['1','2'],'conv':['Yes','No']};
    opts=map[guessType(q)]||['Rational','Irrational'];
  } else if(String(q.ans).includes(' and ')){
    opts=[q.ans, `${parseInt(q.ans)-1} and ${parseInt(q.ans)}`, `${parseInt(q.ans)+1} and ${parseInt(q.ans)+2}`];
  } else if(String(q.ans).includes('√')){
    const kk=parseInt(q.ans);
    opts=[q.ans, `${kk+1}√${q.ans.split('√')[1]}`, `${kk-1}√${q.ans.split('√')[1]}`, `√${q.ans.split('√')[1]}`];
  } else {
    const n=+q.ans;
    opts=[...new Set([n, n+1, Math.max(-10,n-1), n+ri(2,4), -n])].slice(0,4);
  }
  opts=[...new Set(opts)].sort(()=>Math.random()-0.5);
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=String(o);
    b.onclick=()=>{
      const ok=String(o)===String(q.ans);
      const fb=el.querySelector('#fb');
      if(ok){
        od.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        b.classList.add('sel-ok');
        fb.className='fb ok';
        fb.innerHTML='✓ Correct. '+q.sol;
        onAns(true);
      } else {
        tries++;
        b.classList.add('sel-bad'); b.disabled=true;
        if(tries===1){
          el.querySelector('#hint').classList.add('on');
          fb.className='fb bad'; fb.textContent='✗ Try again。';
        } else if(tries===2){
          fb.className='fb bad';
          fb.textContent='✗ Not quite. '+(q.sol?('Method: '+q.sol):'Work through it once more.');
        } else {
          od.querySelectorAll('.opt').forEach(x=>x.disabled=true);
          od.querySelectorAll('.opt').forEach(x=>{if(x.innerHTML===String(q.ans))x.classList.add('sel-ok');});
          fb.className='fb bad';
          fb.innerHTML=`The answer is <b>${q.ans}</b>`+(q.sol?('。'+q.sol):'。');
          onAns(false);
        }
      }
    };
    od.appendChild(b);
  });
  el.querySelector('#hb').onclick=()=>el.querySelector('#hint').classList.add('on');
}
function guessType(q){
  if(q.q.includes('rational or irrational'))return 'ratirr';
  if(q.q.includes('how many are there'))return 'eq';
  return 'conv';
}

    +'② <b>Practice</b>: 5 correct in a row clears it; if you get stuck, hints walk you through<br>'
    +'③ <b>Next section</b>: on the left, '+pts[0].n+'、'+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">Start '+pts[0].n+' '+pts[0].cn+' →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
function renderNav(){
  const n=document.getElementById('nav');n.innerHTML='';
  LESSONS.forEach(l=>{
    const s=st(l.id);let badge='';
    if(l.id==='test'){if(S.test)badge=`<span class="st">${S.test.ok}/${S.test.tot}</span>`;}
    else if(s.done)badge='<span class="st">✓</span>';
    else if(s.prac.tot>0)badge=`<span class="st">${s.prac.ok}/${s.prac.tot}</span>`;
    const d=document.createElement('div');d.className='nav-i'+(l.id===cur?' on':'');
    d.innerHTML=`<span><b>${l.n}</b> ${l.t}</span>${badge}`;
    d.onclick=()=>{cur=l.id;render();};n.appendChild(d);});
}
function render(){
  renderNav();
  const m=document.getElementById('main');m.innerHTML='';
  const L=LESSONS.find(x=>x.id===cur);
  if(cur==='intro'){introRender(m);return;}
  const h=document.createElement('h2');h.innerHTML=`<b>${L.n}</b> ${L.t}`;
  m.appendChild(h);
  const mk=()=>{const d=document.createElement('div');m.appendChild(d);return d;};
  if(cur==='k1'){microK1(mk());videos(mk(),V.k1,'k1');diag(mk(),'k1',['ratirr','sqrt','eq']);prac(mk(),'k1',['ratirr','sqrt','eq'],5);}
  else if(cur==='k2'){microK2(mk());videos(mk(),V.k2,'k2');diag(mk(),'k2',['sqrt','eq']);prac(mk(),'k2',['sqrt','eq'],5);}
  else if(cur==='k3'){microK3(mk());videos(mk(),V.k3,'k3');prac(mk(),'k3',['cuberoot'],5);}
  else if(cur==='k4'){microK4(mk());videos(mk(),V.k4,'k4');prac(mk(),'k4',['estimate'],5);}
  else if(cur==='k5'){
    m.innerHTML+=`<div class="lead">This is just a few button presses — try it yourself first.</div>`;
    const d=mk();d.innerHTML=`<div class="box">
      <h3>Using the calculator</h3>
      <b>1. The √ key:</b> press √ then the number, or the number then √ — models differ, try both.<br>
      <b>2. Cube roots:</b> most calculators have a ∛ key, otherwise enter <code>^(1/3)</code>.<br>
      <b>3. Check:</b> square or cube your answer back and confirm you typed it right.<br>
      <b>4. Precision:</b> √2 = 1.414… is an <b>approximation</b>, not the exact value.<br>
      </div>`;
    videos(mk(),V.k5,'k5');}
  else if(cur==='k6'){
    const d=mk();
    d.innerHTML=`<div class="box"><h3>Real numbers</h3>
      Real numbers = rationals + irrationals.<br><br>
      <b>Rational:</b> can be written as p/q with p, q integers and q ≠ 0 — that covers integers, terminating decimals and repeating decimals.<br>
      <b>Irrational:</b> decimals that never end and never repeat — like √2, √3, π.<br><br>
      <b>The key fact: real numbers and points on the line match up one to one.</b> Every real number is exactly one point on the line, and every point is a real number.
      √2 included — see the construction in 2.1.<br>
      <span class="cn-tag"></span></div>`;
    videos(mk(),V.k6,'k6');prac(mk(),'k6',['ratirr','sqrt'],5);}
  else if(cur==='k7'){microK7(mk());videos(mk(),V.k7,'k7');prac(mk(),'k7',['simplify','sqrt'],5);}
  else if(cur==='ext'){
    m.innerHTML+=`<div class="lead">It turns up all over physics and chemistry formulas — worth a look now.</div>`;
    videos(mk(),V.ext,'ext');}
  else if(cur==='test'){chTest(mk());}
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
<script>
(function(){try{if(new URLSearchParams(location.search).get('go')==='test'){cur='test';render();}}catch(e){}})();
</script>
