<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>升级挑战 · 综合大考 · 八上数学</title>
<style>
:root{
 --bg:#fafafa; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
 --accent:#7c3aed; --ok:#16a34a; --err:#dc2626; --warn:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:99}
.topbar a{color:var(--accent);text-decoration:none;font-weight:600}
.wrap{display:grid;grid-template-columns:220px 1fr;gap:18px;max-width:1160px;margin:0 auto;padding:18px}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 26px;border-radius:14px;margin-bottom:14px;grid-column:1/-1}
header h1{font-size:22px;margin-bottom:4px}
header p{opacity:.92;font-size:13px}
nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:fit-content;position:sticky;top:60px}
.nav-i{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav-i:hover{background:#f5f3ff}
.nav-i.on{background:var(--accent);color:#fff}
.nav-i .st{font-size:11px;opacity:.85}
main{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;min-height:70vh}
.step{padding:10px 14px;background:var(--accent);color:#fff;border-radius:8px;margin-bottom:14px;font-size:15px}
.box{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.box h3{font-size:15px;margin-bottom:8px;color:var(--accent)}
.note{background:#fffbeb;border-left:3px solid var(--warn);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:13px}
.q{margin:12px 0;padding:14px;background:#f9fafb;border-radius:8px;border-left:3px solid var(--accent)}
.q .q-text{font-size:15px;margin-bottom:6px}
.q .q-cn{font-size:12px;color:var(--muted);margin-bottom:10px}
.feedback{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:6px;display:none}
.feedback.show{display:block}
.feedback.ok{background:#dcfce7;color:#166534}
.feedback.err{background:#fee2e2;color:#991b1b}
.feedback.warn{background:#fef3c7;color:#92400e}
.hint{background:#fef3c7;border-left:3px solid var(--warn);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:13px;display:none}
.hint.show{display:block}
input[type=text]{padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;width:140px;font-family:inherit}
button{font-family:inherit;border:none;cursor:pointer;border-radius:8px;padding:8px 14px;font-size:14px;background:var(--accent);color:#fff}
button.secondary{background:#e5e7eb;color:var(--text)}
button.choice{display:block;width:100%;text-align:left;background:#fff;color:var(--text);border:1px solid var(--line);margin:6px 0}
button.choice:hover{background:#f5f3ff;border-color:var(--accent)}
.progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:var(--accent);transition:width .3s}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;background:#f3f4f6;color:var(--muted)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.lock{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:600}
.sol{font-family:"Courier New",monospace;background:#1f2937;color:#a5f3fc;padding:8px 12px;border-radius:6px;margin-top:8px;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="topbar">
 <a href="index.html">← 我的学习地图</a>
 <a href="unittests.html">升级挑战</a>
 <span style="margin-left:auto;font-size:11px;color:var(--muted)">内容来源 Khan Academy · CC BY-NC-SA</span>
</div>

<div class="wrap">
<header>
 <h1>🏆 升级挑战</h1>
 <p>把一章学过的几节混到一起考 —— 通过就能解锁下一个</p>
 <p style="margin-top:6px;font-size:12px">每关 10 道题（期末大挑战 12 道）· 第一次答错给提示，第二次答错给完整解法，并自动进错题本</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script>
/* ================= 工具 ================= */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mkNum(q,qcn,ans,hint,sol){return {type:'num',q:q,qcn:qcn,ans:String(ans),hint:hint||'',sol:sol||''};}
function mkChoice(q,qcn,choices,ci,hint,sol){return {type:'choice',q:q,qcn:qcn,choices:choices,ans:String(choices[ci]),ci:ci,hint:hint||'',sol:sol||''};}
function isRight(qq,v){
 v=String(v).trim();
 if(qq.type==='choice'){
  const i=parseInt(v,10);
  if(!isNaN(i))return i===qq.ci;
  return v.toLowerCase()===String(qq.ans).toLowerCase();
 }
 let x;
 if(v.indexOf('/')>0){const p=v.split('/');x=parseFloat(p[0])/parseFloat(p[1]);}
 else x=parseFloat(v.replace(/[^0-9.\-]/g,''));
 if(isNaN(x))return false;
 return Math.abs(x-parseFloat(qq.ans))<1e-6;
}

/* ================= U1 · 实数与根式 (Ch01 + Ch02) ================= */
const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25],[10,24,26],[12,16,20],[15,20,25],[9,40,41]];
const G1=[
 ()=>{const m=ri(2,20),n=m*m;return mkNum(`√${n} = ?`,`${n} 的算术平方根（平方根取正的那个）`,m,
   `Which number, multiplied by itself, gives ${n}?`,`${m} × ${m} = ${n}  ⟹  √${n} = ${m}`);},
 ()=>{const m=ri(2,10),n=m*m*m;return mkNum(`∛${n} = ?`,`${n} 的立方根`,m,
   `Which number, cubed, gives ${n}?`,`${m}³ = ${n}  ⟹  ∛${n} = ${m}`);},
 ()=>{const m=ri(2,15),n=m*m+ri(1,2*m);return mkNum(`Between which two consecutive whole numbers does √${n} lie? Give the SMALLER one.`,
   `√${n} 在哪两个连续整数之间？给出较小的那个`,m,
   `Compare ${n} with the perfect squares around it.`,`${m*m} < ${n} < ${(m+1)*(m+1)}  ⟹  ${m} < √${n} < ${m+1}`);},
 ()=>{const m=ri(2,6),n=m*m*m+ri(1,3*m*m+3*m);return mkNum(`Between which two consecutive whole numbers does ∛${n} lie? Give the SMALLER one.`,
   `∛${n} 在哪两个连续整数之间？给出较小的那个`,m,
   `Compare ${n} with the perfect cubes around it.`,`${m*m*m} < ${n} < ${(m+1)*(m+1)*(m+1)}  ⟹  ${m} < ∛${n} < ${m+1}`);},
 ()=>{const pool=[['√2',1],['√16',0],['π',1],['22/7',0],['0.1010010001… (pattern, never repeats)',1],['-√9',0],['√5',1],['1.414',0],['√7',1],['0.333… (0.3 repeating)',0],['√25',0],['2π',1]];
   const sel=shuffle(pool).slice(0,5);const cnt=sel.filter(x=>x[1]).length;
   return mkNum(`How many of these 5 numbers are IRRATIONAL (无理数)?  ${sel.map((x,i)=>'('+(i+1)+') '+x[0]).join('   ')}`,
    `下面 5 个数里有几个是无理数？`,cnt,
    `A rational number is a fraction of two integers (or a terminating / repeating decimal). √ of a non-perfect-square and π are irrational.`,
    sel.map(x=>x[0]+' → '+(x[1]?'irrational 无理':'rational 有理')).join('\n')+`\ncount = ${cnt}`);},
 ()=>{const t=pick(TRIPLES);const hide=ri(0,2);
   if(hide===2)return mkNum(`A right triangle has legs ${t[0]} and ${t[1]}. Find the hypotenuse.`,`直角三角形两直角边 ${t[0]}、${t[1]}，求斜边`,t[2],
     `a² + b² = c²`,`c² = ${t[0]}² + ${t[1]}² = ${t[0]*t[0]+t[1]*t[1]} = ${t[2]*t[2]}  ⟹  c = ${t[2]}`);
   return mkNum(`A right triangle has one leg ${hide===0?t[1]:t[0]} and hypotenuse ${t[2]}. Find the other leg.`,
     `直角三角形一条直角边 ${hide===0?t[1]:t[0]}，斜边 ${t[2]}，求另一条直角边`,hide===0?t[0]:t[1],
     `a² + b² = c², so leg² = c² - (known leg)²`,
     `x² = ${t[2]}² − ${(hide===0?t[1]:t[0])}² = ${t[2]*t[2]-(hide===0?t[1]*t[1]:t[0]*t[0])}  ⟹  x = ${hide===0?t[0]:t[1]}`);},
 ()=>{const t=pick(TRIPLES);return mkNum(`A ${t[2]}-metre ladder leans against a wall. Its foot is ${t[0]} m from the wall. How high up the wall does it reach?`,
   `长 ${t[2]} m 的梯子斜靠墙上，梯脚离墙 ${t[0]} m，求梯子顶端离地高度`,t[1],
   `The wall, the ground and the ladder form a right triangle.`,`h² = ${t[2]}² − ${t[0]}² = ${t[2]*t[2]-t[0]*t[0]} = ${t[1]*t[1]}  ⟹  h = ${t[1]} m`);},
 ()=>{const right=Math.random()<0.5;const t=pick(TRIPLES);const c=right?t[2]:t[2]+1;
   return mkChoice(`A triangle has sides ${t[0]}, ${t[1]} and ${c}. Is it a right triangle?`,
     `三边为 ${t[0]}、${t[1]}、${c} 的三角形是直角三角形吗？（勾股定理逆定理）`,
     ['Yes','No'],right?0:1,
     `Check whether (smallest)² + (middle)² equals (largest)². The largest side is ${Math.max(t[0],t[1],c)}.`,
     `${t[0]}² + ${t[1]}² = ${t[0]*t[0]+t[1]*t[1]}  vs  ${c}² = ${c*c}\n${t[0]*t[0]+t[1]*t[1]===c*c?'equal ⟹ right triangle':'not equal ⟹ NOT a right triangle'}`);},
 ()=>{const a=ri(2,9),b=ri(2,9);return mkNum(`A right triangle has legs ${a} and ${b}. What is c² (the square of the hypotenuse)?`,
   `直角三角形两直角边 ${a}、${b}，斜边的平方 c² = ?`,a*a+b*b,
   `You do not need to take the square root — the question asks for c².`,`c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}`);},
 ()=>{const L=[[12,2,3],[18,3,2],[20,2,5],[27,3,3],[32,4,2],[45,3,5],[50,5,2],[75,5,3],[48,4,3],[8,2,2]];const x=pick(L);
   return mkNum(`Simplify: √${x[0]} = a√${x[2]}. Find a.`,`化简二次根式：√${x[0]} = a√${x[2]}，求 a`,x[1],
     `Factor out the largest perfect square from ${x[0]}.`,`√${x[0]} = √(${x[1]*x[1]}×${x[2]}) = ${x[1]}√${x[2]}  ⟹  a = ${x[1]}`);},
 ()=>{const L=[[2,8,4],[3,12,6],[2,18,6],[5,20,10],[3,27,9],[2,32,8],[6,24,12],[7,28,14]];const x=pick(L);
   return mkNum(`Compute: √${x[0]} × √${x[1]} = ?`,`计算二次根式乘法：√${x[0]} × √${x[1]} = ?`,x[2],
     `√a × √b = √(ab).`,`√${x[0]} × √${x[1]} = √${x[0]*x[1]} = ${x[2]}`);},
 ()=>{const m=ri(1,9),e=ri(-6,6);const val=e<0?('0.'+'0'.repeat(-e-1)+m):(m+'0'.repeat(e));
   return mkNum(`Write ${val} in scientific notation a × 10ⁿ. What is n?`,`把 ${val} 写成科学计数法 a × 10ⁿ，求指数 n`,e,
     `Move the decimal point so that 1 ≤ a < 10; count the moves. Left = positive n, right = negative n.`,
     `${val} = ${m} × 10^(${e})  ⟹  n = ${e}`);},
 ()=>mkChoice(`Every point on a number line corresponds to exactly one ___ number.`,
   `数轴上的每一个点都唯一对应一个___数（实数与数轴一一对应）`,
   ['rational 有理','irrational 无理','real 实','whole 非负整数'],2,
   `Rational numbers alone leave "holes" on the line (e.g. √2).`,`有理数 + 无理数 = 实数，实数与数轴上的点一一对应 ⟹ real`),
];

/* ================= U2 · 一次函数与方程组 (Ch04 + Ch05) ================= */
const G2=[
 ()=>{const x1=ri(-5,5),y1=ri(-5,5),dx=ri(1,5),k=ri(-4,4);
   return mkNum(`Find the slope of the line through (${x1}, ${y1}) and (${x1+dx}, ${y1+k*dx}).`,
     `过点 (${x1}, ${y1}) 与 (${x1+dx}, ${y1+k*dx}) 的直线，斜率 k = ?`,k,
     `slope = (y₂ − y₁) / (x₂ − x₁)`,`k = (${y1+k*dx} − (${y1})) / (${x1+dx} − (${x1})) = ${k*dx} / ${dx} = ${k}`);},
 ()=>{const k=ri(-4,4)||2,x0=ri(-5,5),b=ri(-8,8),y0=k*x0+b;
   return mkNum(`The line y = ${k}x + b passes through (${x0}, ${y0}). Find b.`,`直线 y = ${k}x + b 经过 (${x0}, ${y0})，求 b`,b,
     `Plug the point in: y = kx + b  ⟹  b = y − kx.`,`b = ${y0} − ${k}×(${x0}) = ${y0} − ${k*x0} = ${b}`);},
 ()=>{const k=ri(-4,4)||3,b=ri(-6,6),x0=ri(1,6),ok=Math.random()<0.5,y=k*x0+b+(ok?0:pick([1,-1,2,-2]));
   return mkChoice(`Is the point (${x0}, ${y}) on the graph of y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)}?`,
     `点 (${x0}, ${y}) 在直线 y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)} 上吗？`,['Yes','No'],ok?0:1,
     `Substitute x and see whether the computed y matches.`,
     `when x = ${x0}:  y = ${k}×${x0} ${b>=0?'+':'−'} ${Math.abs(b)} = ${k*x0+b}\ngiven y = ${y}  ⟹  ${ok?'matches ⟹ Yes':'does not match ⟹ No'}`);},
 ()=>{const k=ri(-4,4)||2,b=ri(-6,6),x0=ri(-5,6);
   return mkNum(`For the function y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)}, what is y when x = ${x0}?`,
     `函数 y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)}，当 x = ${x0} 时 y = ?`,k*x0+b,
     `Replace x by ${x0} and compute.`,`y = ${k}×(${x0}) ${b>=0?'+':'−'} ${Math.abs(b)} = ${k*x0} ${b>=0?'+':'−'} ${Math.abs(b)} = ${k*x0+b}`);},
 ()=>{const k=ri(-5,5)||2,b=ri(-6,6);
   return mkNum(`A line is parallel to y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)}. What is its slope?`,
     `与直线 y = ${k}x ${b>=0?'+ '+b:'− '+Math.abs(b)} 平行的直线，斜率是多少？`,k,
     `Parallel lines have equal slopes.`,`平行 ⟹ k 相等 ⟹ slope = ${k}`);},
 ()=>{const x=ri(-9,9),y=ri(-9,9);
   return mkNum(`Solve:  x + y = ${x+y},  x − y = ${x-y}.  Find x.`,`解方程组：x + y = ${x+y}，x − y = ${x-y}，求 x`,x,
     `Add the two equations — y cancels.`,`相加：2x = ${(x+y)+(x-y)}  ⟹  x = ${x}`);},
 ()=>{const a=ri(2,4),b=ri(2,4),x=ri(-9,9),y=ri(-9,9);const A=a*x+b*y,B=a*x-b*y;
   return mkNum(`Solve:  ${a}x + ${b}y = ${A},  ${a}x − ${b}y = ${B}.  Find x.`,
     `加减消元法：${a}x + ${b}y = ${A}，${a}x − ${b}y = ${B}，求 x`,x,
     `The y-terms are opposites: add to eliminate y.`,`相加：${2*a}x = ${A+B}  ⟹  x = ${A+B} / ${2*a} = ${x}`);},
 ()=>{let a,b,c,d;do{a=ri(1,4);b=ri(1,4);c=ri(1,4);d=ri(1,4);}while(a*d===b*c);
   const x0=ri(-9,9),y0=ri(-9,9),e=a*x0+b*y0,f=c*x0+d*y0;
   return mkNum(`Solve the system:  ${a}x + ${b}y = ${e}   and   ${c}x + ${d}y = ${f}.  Find x.`,
     `解方程组：${a}x + ${b}y = ${e}，${c}x + ${d}y = ${f}，求 x`,x0,
     `Eliminate y: multiply the first equation by ${d} and the second by ${b}, then subtract.`,
     `×${d}: ${a*d}x + ${b*d}y = ${e*d}\n×${b}: ${b*c}x + ${b*d}y = ${f*b}\n相减: ${a*d-b*c}x = ${e*d-f*b}  ⟹  x = ${x0}`);},
 ()=>{const r=ri(2,20),c=ri(2,20),H=r+c,F=4*r+2*c;
   return mkNum(`鸡兔同笼 · ${H} heads and ${F} feet in total. How many rabbits?`,
     `鸡兔同笼：共 ${H} 个头、${F} 只脚，兔子有几只？`,r,
     `Let r = rabbits, c = chickens. r + c = heads, 4r + 2c = feet.`,
     `r + c = ${H},  4r + 2c = ${F}\n相减：2r = ${F} − 2×${H} = ${F-2*H}  ⟹  r = ${r}`);},
 ()=>{const p=pick([10,20,25,50]),base=ri(20,90)*100,now=base*(100+p)/100;
   return mkNum(`增收节支 · This year's income is ${now} yuan, which is ${p}% more than last year. What was last year's income?`,
     `增收节支：今年收入 ${now} 元，比去年增收 ${p}%，去年收入多少元？`,base,
     `this year = last year × (1 + p%). So last year = this year ÷ (1 + p%).`,
     `去年 × ${(100+p)/100} = ${now}  ⟹  去年 = ${now} ÷ ${(100+p)/100} = ${base} 元`);},
 ()=>{let a,b;do{a=ri(2,9);b=ri(1,9);}while(a<=b);const s=a+b,D=9*(a-b);
   return mkNum(`里程碑上的数 · A two-digit number: its tens digit and ones digit add to ${s}. Swapping the two digits gives a number ${D} SMALLER than the original. Find the original number.`,
     `里程碑：一个两位数，十位与个位数字之和为 ${s}；交换十位与个位后，新数比原数小 ${D}。求原数`,10*a+b,
     `Let tens = a, ones = b. Number = 10a + b. Swapped = 10b + a. Original − swapped = 9(a − b).`,
     `a + b = ${s},  9(a − b) = ${D} ⟹ a − b = ${a-b}\n联立：a = ${a}, b = ${b}  ⟹  原数 = ${10*a+b}`);},
 ()=>{let k1,k2;do{k1=ri(-4,4);k2=ri(-4,4);}while(k1===k2);
   const x0=ri(-6,6),y0=ri(-6,6),b1=y0-k1*x0,b2=y0-k2*x0;
   const s1=b1>=0?'+ '+b1:'− '+Math.abs(b1),s2=b2>=0?'+ '+b2:'− '+Math.abs(b2);
   return mkNum(`The lines y = ${k1}x ${s1} and y = ${k2}x ${s2} intersect. What is the x-coordinate of the intersection point?`,
     `直线 y = ${k1}x ${b1>=0?'+ '+b1:'− '+Math.abs(b1)} 与 y = ${k2}x ${b2>=0?'+ '+b2:'− '+Math.abs(b2)} 的交点横坐标 = ?`,x0,
     `Set the two expressions for y equal and solve for x.`,
     `${k1}x + (${b1}) = ${k2}x + (${b2})\n${k1-k2}x = ${b2-b1}  ⟹  x = ${x0}`);},
 ()=>{const x1=ri(-5,4),y1=ri(-5,5),dx=ri(1,4),k=ri(-4,4)||3;const x2=x1+dx,y2=y1+k*dx,b=y1-k*x1;
   return mkNum(`A line passes through (${x1}, ${y1}) and (${x2}, ${y2}). Write it as y = kx + b and find b.`,
     `用待定系数法：直线过 (${x1}, ${y1})、(${x2}, ${y2})，写成 y = kx + b，求 b`,b,
     `First find k = (y₂ − y₁)/(x₂ − x₁), then b = y₁ − kx₁.`,
     `k = (${y2} − (${y1}))/(${x2} − (${x1})) = ${k*dx}/${dx} = ${k}\nb = ${y1} − ${k}×(${x1}) = ${b}`);},
];

/* ================= U3 · 几何与坐标 (Ch03 + Ch07) ================= */
const G3=[
 ()=>{let a,b;do{a=ri(-9,9);b=ri(-9,9);}while(a===0||b===0);
   const ci=(a>0&&b>0)?0:(a<0&&b>0)?1:(a<0&&b<0)?2:3;
   return mkChoice(`Which quadrant contains the point (${a}, ${b})?`,`点 (${a}, ${b}) 在第几象限？`,
     ['I (+,+)','II (−,+)','III (−,−)','IV (+,−)'],ci,
     `Sign of x decides left/right; sign of y decides up/down.`,

function mkData(n,mean,spread){const d=[];let s=0;for(let i=0;i<n-1;i++){const v=ri(mean-spread,mean+spread);d.push(v);s+=v;}d.push(n*mean-s);return d;}
const G4=[
 ()=>{const n=ri(3,6),m=ri(5,20);let d;let guard=0;
   do{d=mkData(n,m,8);guard++;}while(guard<40&&(d.some(v=>v<1||v>60)));
   return mkNum(`Find the mean of: ${d.join(', ')}`,`求平均数：${d.join(', ')}`,m,
     `mean = (sum of all values) ÷ (number of values).`,
     `sum = ${d.reduce((a,b)=>a+b,0)}, n = ${n}  ⟹  mean = ${d.reduce((a,b)=>a+b,0)} / ${n} = ${m}`);},
 ()=>{const n=pick([5,7]);const s=[];let v=ri(1,10);for(let i=0;i<n;i++){v+=ri(1,6);s.push(v);}
   const med=s[(n-1)/2];const disp=shuffle(s).join(', ');
   return mkNum(`Find the median of: ${disp}`,`求中位数：${disp}`,med,
     `Sort the data first, then take the middle value.`,
     `排序后：${s.join(', ')}\n共 ${n} 个数（奇数），中位数 = 第 ${(n+1)/2} 个 = ${med}`);},
 ()=>{const m=ri(3,20);const others=[];let v=m;
   while(others.length<4){v+=ri(2,7);others.push(v);}
   const data=shuffle([m,m,m].concat(others));
   return mkNum(`Find the mode of: ${data.join(', ')}`,`求众数：${data.join(', ')}`,m,
     `The mode is the value that appears most often.`,`${m} 出现 3 次，其余各出现 1 次 ⟹ 众数 = ${m}`);},
 ()=>{const n=pick([3,4,5,6]),m=ri(7,15);let d,sq;let guard=0;
   do{d=[];let s=0;for(let i=0;i<n-1;i++){const x=ri(-5,5);d.push(x);s+=x;}d.push(-s);
     sq=d.reduce((a,b)=>a+b*b,0);guard++;}while(guard<60&&sq%n!==0);
   const data=d.map(x=>m+x);
   return mkNum(`Find the variance of: ${data.join(', ')}   (use s² = Σ(x − x̄)² / n)`,
     `求方差：${data.join(', ')}（s² = Σ(x − x̄)² / n）`,sq/n,
     `First find the mean, then each deviation, square them, add, divide by n.`,
     `x̄ = ${m}\n偏差：${d.map(x=>x>=0?'+'+x:x).join(', ')}\n平方和 = ${sq}\ns² = ${sq} / ${n} = ${sq/n}`);},
 ()=>{const v=pick([1,4,9,16,25,36]);
   return mkNum(`A data set has variance ${v}. What is its standard deviation?`,`一组数据的方差为 ${v}，标准差 = ?`,Math.sqrt(v),
     `standard deviation = √(variance).`,`s = √${v} = ${Math.sqrt(v)}`);},
 ()=>{const n=5;const s=[];let v=ri(2,12);for(let i=0;i<n;i++){v+=ri(2,9);s.push(v);}
   const disp=shuffle(s).join(', ');
   return mkNum(`Find the range (极差) of: ${disp}`,`求极差（最大值 − 最小值）：${disp}`,s[n-1]-s[0],
     `range = max − min.`,`max = ${s[n-1]}, min = ${s[0]}  ⟹  极差 = ${s[n-1]-s[0]}`);},
 ()=>{const p=pick([30,40,60,70]);const a=ri(60,95);let b=null;
   for(let t=60;t<=95;t++){if((a*p+t*(100-p))%100===0){b=t;break;}}
   if(b===null)b=60;
   const w=(a*p+b*(100-p))/100;
   return mkNum(`Weighted mean: daily work ${a} (${p}%) and final exam ${b} (${100-p}%). What is the weighted average?`,
     `加权平均数：平时 ${a}（占 ${p}%），期末 ${b}（占 ${100-p}%），学期总评 = ?`,w,
     `Multiply each score by its weight, then add.`,`${a}×${p}% + ${b}×${100-p}% = ${(a*p/100).toFixed(2)} + ${(b*(100-p)/100).toFixed(2)} = ${w}`);},
 ()=>{const q1=ri(5,25),iqr=ri(6,20);
   return mkNum(`A box plot has Q1 = ${q1} and IQR = ${iqr}. What is Q3?`,`箱线图中 Q1 = ${q1}，IQR = ${iqr}，求 Q3`,q1+iqr,
     `IQR = Q3 − Q1.`,`Q3 = Q1 + IQR = ${q1} + ${iqr} = ${q1+iqr}`);},
];

function buildQ(u){
 let pool;
 if(u.id==='fin'){pool=[];[G1,G2,G3,G4].forEach(G=>{shuffle(G).slice(0,3).forEach(f=>pool.push(f));});}
 else{const G=u.G;pool=shuffle(G).slice(0,Math.min(u.q,G.length));
   while(pool.length<u.q)pool.push(pick(G));}
 return shuffle(pool).map(f=>f());
}

/* ================= 状态 ================= */
const KEY='bnu8_unit_state',WKEY='bnu8_wrong';
function US(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function saveUS(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function WB(){try{return JSON.parse(localStorage.getItem(WKEY))||[];}catch(e){return [];}}
function saveWB(a){try{localStorage.setItem(WKEY,JSON.stringify(a));}catch(e){}}
function chPct(k){
 try{const S=JSON.parse(localStorage.getItem('bnu8_'+k+'_state'))||{};
  const CH={ch01:4,ch02:8,ch03:4,ch04:4,ch05:5,ch06:3,ch07:5};
  const ids=Object.keys(S).filter(x=>x!=='test');
  if(!ids.length)return 0;let sum=0;
  ids.forEach(id=>{const s=S[id]||{};const p=s.prac||{};
   sum+=s.done?4:(p.tot>=5&&p.ok/p.tot>=0.8?3:(p.tot>0?2:((s.diag!=null||Object.keys(s.vid||{}).length)?1:0)));});
  return sum/(CH[k]*4);
 }catch(e){return 0;}}
function readyPct(u){
 if(u.id==='fin'){const ks=['ch01','ch02','ch03','ch04','ch05','ch06','ch07'];return ks.reduce((a,k)=>a+chPct(k),0)/7;}
 if(u.id==='u1')return (chPct('ch01')+chPct('ch02'))/2;
 if(u.id==='u2')return (chPct('ch04')+chPct('ch05'))/2;
 if(u.id==='u3')return (chPct('ch03')+chPct('ch07'))/2;
 if(u.id==='u4')return chPct('ch06');
 return 0;
}

function run(el,u){
 const qs=buildQ(u);let i=0,ok=0,tries=0;
 const draw=()=>{
  if(i>=qs.length){finish(el,u,ok,qs.length);return;}
  const qq=qs[i];
  el.innerHTML=`<div class="step" style="background:${u.color}">${u.n} · ${u.cn} · 第 ${i+1} / ${qs.length} 题 · 已对 ${ok}</div>
   <div class="progress"><div style="width:${i/qs.length*100}%"></div></div>
   <div class="q"><div class="q-text">${qq.q}</div><div class="q-cn">${qq.qcn}</div>
    ${qq.type==='choice'
      ?`<div id="cs">${qq.choices.map((c,j)=>`<button class="choice" data-j="${j}">${String.fromCharCode(65+j)}. ${c}</button>`).join('')}</div>`
      :`<div style="display:flex;gap:8px"><input type="text" id="ai" placeholder="answer"><button id="sb">Submit</button></div>`}
    <div class="hint" id="ht"></div><div class="feedback" id="fb"></div></div>`;
  const fb=el.querySelector('#fb'),ht=el.querySelector('#ht');
  tries=0;
  const submit=(v)=>{
   if(isRight(qq,v)){
    fb.className='feedback show ok';fb.textContent='✓ Correct';
    i++;setTimeout(draw,650);
   }else if(tries===0){
    tries++;ht.className='hint show';ht.innerHTML='<b>Hint · 提示：</b>'+qq.hint;
    fb.className='feedback show warn';fb.textContent='✗ 再试一次 (try again)';
   }else{
    fb.className='feedback show err';
    fb.innerHTML=`✗ 正确答案是 <b>${qq.ans}</b>`+(qq.sol?`<div class="sol">${qq.sol}</div>`:'');
    addWrong(u,qq);
    i++;setTimeout(draw,2600);
   }
  };
  if(qq.type==='choice'){el.querySelectorAll('#cs button').forEach(b=>b.onclick=()=>{ok0(b.dataset.j);});
   function ok0(j){el.querySelectorAll('#cs button').forEach(b=>b.disabled=true);submit(j);}}
  else{const inp=el.querySelector('#ai');inp.focus();
   el.querySelector('#sb').onclick=()=>submit(inp.value);inp.onkeydown=e=>{if(e.key==='Enter')submit(inp.value);};}
 };
 draw();
}

function finish(el,u,ok,tot){
 const U=US();const prev=U[u.id]||{best:0,history:[]};
 const today=new Date().toISOString().slice(0,10);
 const best=Math.max(prev.best||0,ok);
 const hist=(prev.history||[]).concat([{ok:ok,tot:tot,date:today}]).slice(-5);
 U[u.id]={ok:ok,tot:tot,date:today,best:best,history:hist};saveUS(U);
 const p=ok/tot;
 const lvl=p>=0.8?['太棒了，全对的！','var(--ok)']:(p>=0.6?['还行，再把错题过一遍就稳了。','var(--warn)']:['还要多练 —— 回章节把相关知识点再练几个。','var(--err)']);
 el.innerHTML=`<div class="step" style="background:${lvl[1]}">成绩 · ${ok} / ${tot}</div>
  <div class="box"><h3 style="color:${lvl[1]}">${lvl[0]}</h3>
   <p style="font-size:14px">正确率 ${Math.round(p*100)}% · 历史最佳 ${best}/${tot}</p>
  </div>
  ${p<0.8?`<div class="note"><strong>下一步：</strong>错题已自动进错题本，点左侧「错题本」复习；或者回到章节页把对应的几个小知识练到过关。</div>`:''}
  <div style="margin-top:14px;display:flex;gap:8px"><button id="again">再练一次（新题）</button><button class="secondary" id="back">返回</button></div>`;
 el.querySelector('#again').onclick=()=>run(el,u);
 el.querySelector('#back').onclick=()=>render();
 renderNav();
}

   if(isRight(qq,v)){
    const W=WB();const t=W.find(x=>x.q===w.q&&x.ts===w.ts);
    if(t){t.rep=(t.rep||0)+1;t.int=Math.max(1,(t.int||0)*2)||1;t.due=Date.now()+t.int*86400000;
      if(t.int>=8)W.splice(W.indexOf(t),1);saveWB(W);}
    fb.className='feedback show ok';fb.textContent=`✓ 已答对，${t&&t.int?('下次复习：'+t.int+' 天后'):'已归档'}`;
    i++;setTimeout(draw,1200);
   }else if(tries===0){tries++;fb.className='feedback show warn';fb.textContent='✗ 再试一次';}
   else{
    fb.className='feedback show err';fb.innerHTML=`✗ 正确答案 <b>${w.ans}</b>`+(w.sol?`<div class="sol">${w.sol}</div>`:'');
    const W=WB();const t=W.find(x=>x.q===w.q&&x.ts===w.ts);
    if(t){t.int=0;t.due=Date.now();saveWB(W);}
    i++;setTimeout(draw,2600);
   }
  };
  if(w.type==='choice'){el.querySelectorAll('#cs button').forEach(b=>b.onclick=()=>{el.querySelectorAll('#cs button').forEach(x=>x.disabled=true);submit(b.dataset.j);});}
  else{const inp=el.querySelector('#ai');inp.focus();el.querySelector('#sb').onclick=()=>submit(inp.value);
   inp.onkeydown=e=>{if(e.key==='Enter')submit(inp.value);};}
 };
 draw();
}

/* ================= 主渲染 ================= */
function render(){
 const main=document.getElementById('main');renderNav();
 if(cur==='wrong'){renderWrong(main);return;}
 intro(main,UNITS.find(u=>u.id===cur));
}
render();

/* 支持 index.html 的深链 ?u=u2 */
(function(){const g=new URLSearchParams(location.search).get('u');
 if(g&&UNITS.some(u=>u.id===g)){cur=g;render();}})();
</script>
