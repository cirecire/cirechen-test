<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QClaw 学习站 — 选年级</title>
<style>
:root{
  --bg:#f6f8fb;
  --bg-2:#eef2f7;
  --text:#0f172a;
  --text-2:#475569;
  --text-3:#94a3b8;
  --card:#ffffff;
  --card-hover:#ffffff;
  --border:#e2e8f0;
  --brand:#0d9488;
  --brand-2:#0ea5e9;
  --brand-grad:linear-gradient(135deg,#0ea5e9 0%,#14b8a6 100%);
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(13,148,136,.18);
}
[data-theme="dark"]{
  --bg:#0b1220;
  --bg-2:#0e1626;
  --text:#e8eef6;
  --text-2:#a3b1c6;
  --text-3:#64748b;
  --card:#141d2e;
  --card-hover:#1a2438;
  --border:#233044;
  --brand:#2dd4bf;
  --brand-2:#38bdf8;
  --brand-grad:linear-gradient(135deg,#38bdf8 0%,#2dd4bf 100%);
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(45,212,191,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
/* decorative blobs */
body::before{
  content:"";position:fixed;top:-180px;right:-120px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(14,184,166,.18),transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:"";position:fixed;bottom:-200px;left:-140px;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle at 70% 70%,rgba(14,165,233,.16),transparent 70%);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 22px 64px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:var(--shadow)}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text-2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);transition:.15s}
.theme-btn:hover{transform:translateY(-1px)}

/* hero */
.hero{text-align:center;padding:48px 0 30px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--brand);background:rgba(13,148,136,.1);padding:6px 14px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:14px}
.hero h1 .grad{background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:16px;color:var(--text-2);max-width:440px;margin:0 auto}
.hero .en{font-size:13px;color:var(--text-3);margin-top:6px}

/* question */
.qblock{margin:34px auto 0;max-width:520px;text-align:center}
.qblock .qlabel{font-size:14px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.qblock .qhead{font-size:30px;font-weight:800;letter-spacing:-.5px}

/* grade grid */
.grades{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.gcard{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:38px 20px;text-decoration:none;color:var(--text);
  box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;
  position:relative;overflow:hidden;
}
.gcard::after{content:"";position:absolute;inset:0;background:var(--brand-grad);opacity:0;transition:opacity .16s}
.gcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.gcard:hover::after{opacity:.06}
.gcard .gnum{font-size:52px;font-weight:800;line-height:1;background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;z-index:1}
.gcard .gzh{font-size:18px;font-weight:700;position:relative;z-index:1}
.gcard .gen{font-size:13px;color:var(--text-3);position:relative;z-index:1}
.gcard .go{margin-top:10px;font-size:13px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:4px;position:relative;z-index:1}
.gcard:hover .go{gap:8px;transition:gap .16s}

/* footer */
.foot{text-align:center;margin-top:48px;font-size:13px;color:var(--text-3)}
.foot a{color:var(--brand);text-decoration:none}
.foot a:hover{text-decoration:underline}

@media(max-width:560px){
  .hero{padding:32px 0 20px}
  .hero h1{font-size:30px}
  .qblock .qhead{font-size:24px}
  .grades{grid-template-columns:1fr}
  .gcard .gnum{font-size:44px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="mark">Q</span> QClaw 学习站</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeText">夜间</span></button>
  </div>

  <section class="hero">
    <span class="eyebrow">可汗学院本地化课程 · 深圳公立校</span>
    <h1>欢迎来到 <span class="grad">QClaw 学习站</span></h1>
    <p>想学就学，随时学。</p>
    <div class="en">Learn what you want, when you want.</div>
  </section>

  <div class="qblock">
    <div class="qlabel">Choose your year</div>
    <div class="qhead">你在几年级？</div>
  </div>

  <nav class="grades">
    <a class="gcard" href="grade7/index.html">
      <div class="gnum">7</div>
      <div class="gzh">七年级</div>
      <div class="gen">Grade 7</div>
      <div class="go">进入 →</div>
    </a>
    <a class="gcard" href="grade8/index.html">
      <div class="gnum">8</div>
      <div class="gzh">八年级</div>
      <div class="gen">Grade 8</div>
      <div class="go">进入 →</div>
    </a>
  </nav>

  <footer class="foot">
    课程内容基于 <a href="https://www.khanacademy.org" target="_blank" rel="noopener">Khan Academy</a> 本地化改编 · 适配深圳公立校教学大纲
  </footer>
</div>

<script>
function getStored(){return localStorage.getItem('qclaw-theme');}
function getSys(){return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
function setTheme(t){if(t==='system'){localStorage.removeItem('qclaw-theme');document.documentElement.removeAttribute('data-theme');}else{localStorage.setItem('qclaw-theme',t);document.documentElement.setAttribute('data-theme',t);}upd();}
function cur(){return getStored()||getSys();}
function toggleTheme(){setTheme(cur()==='dark'?'light':'dark');}
function upd(){var c=cur();document.getElementById('themeIcon').textContent=c==='dark'?'☀️':'🌙';document.getElementById('themeText').textContent=c==='dark'?'日间':'夜间';}
(function(){var s=getStored();if(s)document.documentElement.setAttribute('data-theme',s);upd();window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if(!getStored())upd();});})();
</script>
</body>
</html>
