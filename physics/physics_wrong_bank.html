<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Mistake Bank — Khan Academy</title>
<style>
:root, [data-theme="dark"] {
  --bg:#0a0f1e; --card:#141d33; --text:#e8eaf0; --text2:#9aa0b0;
  --accent:#6366f1; --border:#1e2a45; --green:#22d3ee;
  --warn:#f87171; --ok:#34d399;
}
[data-theme="light"] {
  --bg:#f0f2ff; --card:#fff; --text:#1e293b; --text2:#64748b;
  --accent:#4f46e5; --border:#c7d2fe; --green:#0ea5e9;
  --warn:#ef4444; --ok:#10b981;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:56px 16px 40px; }
.container { max-width:720px; margin:0 auto; }
.back {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text);
  padding:8px 16px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600;
}
h1 { font-size:20px; font-weight:800; color:var(--accent); margin:20px 0 10px; }
.subtitle { font-size:13px; color:var(--text2); margin-bottom:20px; }
.empty {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:12px; padding:40px 20px; text-align:center; color:var(--text2);
}
.empty-icon { font-size:40px; margin-bottom:10px; }
.q-card {
  background:var(--card); border:1.5px solid var(--border); border-radius:12px;
  padding:16px; margin-top:12px;
}
.q-ch { font-size:11px; font-weight:700; color:var(--accent); background:rgba(99,102,241,.12); padding:3px 8px; border-radius:999px; display:inline-block; margin-bottom:8px; }
.q-text { font-size:14px; font-weight:600; margin-bottom:10px; }
.opt { padding:8px 12px; border-radius:8px; margin:5px 0; font-size:13.5px; }
.opt.wrong { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
.opt.correct { background:#f0fdf4; border:1px solid #6ee7b7; color:#065f46; }
.sol-box { margin-top:10px; padding:10px 12px; background:#f5f3ff; border:1px solid #c4b5fd; border-radius:8px; font-size:13px; color:#312e81; }
.del-btn { float:right; background:#fee2e2; color:#dc2626; border:none; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
.del-btn:hover { background:#fca5a5; }
.note-box { background:#fef9c3; border:1px solid #fde047; border-radius:8px; padding:10px 14px; margin-top:10px; font-size:13px; color:#713f12; }
.note-label { font-weight:700; margin-bottom:4px; color:#a16207; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="physics_index.html">← 目录</a>
  <h1>📕 错题库 · Mistake Bank</h1>
  <p class="subtitle">Your physics mistakes are saved here. Review before the next test.</p>
  <div id="bank"></div>
</div>
<script>
(function(){
  var KEY = 'phys-wrong';
  var entries = JSON.parse(localStorage.getItem(KEY) || '[]');
  var bank = document.getElementById('bank');
  if (!entries.length) {
    bank.innerHTML = '<div class="empty"><div class="empty-icon">📕</div><p>No mistakes yet — keep practicing!</p><p style="margin-top:8px;font-size:12px">Mistakes are saved automatically when you review solutions.</p></div>';
    return;
  }
  entries.forEach(function(e, i){
    var div = document.createElement('div');
    div.className = 'q-card';
    div.innerHTML =
      '<button class="del-btn" onclick="del('+i+')">删除</button>' +
      '<span class="q-ch">'+e.ch+'</span>' +
      '<div class="q-text">'+e.q+'</div>' +
      '<div class="opt wrong">✗ '+e.wrong+'</div>' +
      '<div class="opt correct">✓ '+e.correct+'</div>' +
      '<div class="sol-box">'+e.sol+'</div>' +
      (e.note ? '<div class="note-box"><div class="note-label">Your note:</div>'+e.note+'</div>' : '');
    bank.appendChild(div);
  });
  window.del = function(i) {
    entries.splice(i,1);
    localStorage.setItem(KEY, JSON.stringify(entries));
    location.reload();
  };
})();
</script>
</body>
</html>
