<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Practice — Khan Academy 8th Grade (2026-08-18)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f0f4f8;
  --card: #fff;
  --text: #1e293b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --border: #cbd5e1;
  --blue: #2563eb;
  --blue-dark: #1e3a5f;
  --blue-banner: linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);
  --shadow: rgba(0,0,0,0.08);
  --shadow-hover: rgba(0,0,0,0.12);
  /* Elicit: 冷静深蓝 */
  --elicit-bg: #eff6ff;
  --elicit-btn-bg: #1e40af;
  --elicit-btn-border: #1e3a8a;
  --elicit-btn-text: #ffffff;
  /* Step nav: 沉稳灰蓝 */
  --step-bg: #334155;
  --step-text: #f1f5f9;
  /* Solution: 深青墨绿 */
  --sol-bg: #f0fdfa;
  --sol-btn-bg: #0f766e;
  --sol-btn-border: #115e59;
  --sol-btn-text: #ffffff;
  --answer-input-border: #cbd5e1;
  --submit-btn: #2563eb;
  --submit-hover: #1d4ed8;
  --saved: #059669;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #334155;
  --shadow: rgba(0,0,0,0.4);
  --shadow-hover: rgba(0,0,0,0.6);
  /* Elicit: 深蓝 */
  --elicit-bg: #172554;
  --elicit-btn-bg: #3b82f6;
  --elicit-btn-border: #60a5fa;
  --elicit-btn-text: #ffffff;
  /* Step nav: 灰蓝 */
  --step-bg: #475569;
  --step-text: #f8fafc;
  /* Solution: 深青 */
  --sol-bg: #134e4a;
  --sol-btn-bg: #14b8a6;
  --sol-btn-border: #5eead4;
  --sol-btn-text: #0f172a;
  --answer-input-border: #334155;
  --answer-input-bg: #0f172a;
  --answer-input-text: #e2e8f0;
  --answer-input-focus: #3b82f6;
  --submit-btn: #3b82f6;
  --submit-hover: #2563eb;
  --saved: #22c55e;
  --ch-banner-bg: #1e293b;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 56px 24px 24px; }
.container { max-width: 800px; margin: 0 auto; }
.ch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
.ch-card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px var(--shadow); text-decoration: none; color: var(--text); transition: transform .15s, box-shadow .15s; border: 1px solid var(--border); }
.ch-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow-hover); }
.ch-card-num { font-size: 13px; color: var(--blue); font-weight: 600; }
.ch-card-title { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 4px; }
.ch-card-titleEn { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.ch-card-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
.ch-card-prac { display: inline-block; margin-top: 12px; background: var(--blue); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.ch-banner { background: var(--blue-banner); color: #fff; border-radius: 12px; padding: 20px 24px; margin: 20px 0 16px; display: flex; align-items: center; justify-content: space-between; }
.ch-banner[data-theme="dark"] { background: var(--ch-banner-bg); }
.ch-title { font-size: 20px; font-weight: 700; }
.ch-titleEn { font-size: 14px; opacity: 0.8; margin-top: 2px; }
.ch-banner-back { color: #fff; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,.4); padding: 6px 14px; border-radius: 20px; }
.ch-banner-back:hover { background: rgba(255,255,255,.15); }
.st-label { font-size: 13px; color: var(--blue); font-weight: 600; margin: 24px 0 10px; }
.question { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.q-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.diff-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.diff-basic { background: #dcfce7; color: #166534; }
.diff-medium { background: #fef9c3; color: #854d0e; }
.diff-hard { background: #ffedd5; color: #9a3412; }
.diff-challenge { background: #fce7f3; color: #9d174d; }
.q-num { font-size: 12px; color: var(--text-muted); }
.q-text { font-size: 15px; line-height: 1.7; margin-bottom: 16px; color: var(--text); }
.q-text .zh { color: #b45309; font-weight: 600; }
.answer-row { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.answer-input { flex: 1; min-width: 160px; padding: 10px 14px; border: 2px solid var(--answer-input-border, var(--border)); border-radius: 8px; font-size: 14px; outline: none; background: var(--answer-input-bg, var(--card)); color: var(--answer-input-text, var(--text)); }
.answer-input:focus { border-color: var(--answer-input-focus, var(--blue)); }
.submit-btn { padding: 10px 18px; background: var(--submit-btn); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.submit-btn:hover { background: var(--submit-hover); }
.submit-btn.saved { background: var(--saved); }
.elicit-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--elicit-btn-bg); color: var(--elicit-btn-text); border: 2px solid var(--elicit-btn-border); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; box-shadow: 0 2px 4px rgba(30,58,138,0.2); }
.elicit-btn:hover { background: var(--elicit-btn-border); box-shadow: 0 3px 6px rgba(30,58,138,0.3); }
.elicit-btn.open { background: var(--elicit-btn-border); }
.elicit-box { margin-top: 12px; border-left: 3px solid var(--elicit-btn-border); padding-left: 16px; }
.elicit-item { background: var(--elicit-bg); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
.elicit-q { font-size: 13px; color: var(--elicit-btn-text); font-weight: 600; margin-bottom: 6px; }
.elicit-a { font-size: 13px; color: var(--text); line-height: 1.6; margin-top: 4px; padding: 8px 10px; background: var(--card); border-radius: 6px; border: 1px solid var(--elicit-btn-border); }
.sol-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--sol-btn-bg); color: var(--sol-btn-text); border: 2px solid var(--sol-btn-border); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; margin-left: 8px; box-shadow: 0 2px 4px rgba(15,118,110,0.2); }
.sol-btn:hover { background: var(--sol-btn-border); box-shadow: 0 3px 6px rgba(15,118,110,0.3); }
.sol-btn.open { background: var(--sol-btn-border); }
.sol-box { margin-top: 12px; background: var(--sol-bg); border-radius: 8px; padding: 14px; }
.sol-step { font-size: 13px; color: var(--text); line-height: 1.7; padding: 4px 0; border-bottom: 1px solid var(--sol-btn-bg); }
.sol-step:last-child { border-bottom: none; }
.sol-answer { background: #dcfce7; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #166534; font-weight: 600; margin-top: 8px; }
@media (max-width:600px) { .ch-grid { grid-template-columns: 1fr; } body { padding: 12px; } }

/* Step-by-step Elicit UI */
.elicit-wrap { margin-top: 14px; }
.elicit-hint-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--elicit-btn-bg); color: var(--elicit-btn-text); border: 2px solid var(--elicit-btn-border); border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; box-shadow: 0 2px 4px rgba(30,58,138,0.2); }
.elicit-hint-btn:hover { background: var(--elicit-btn-border); box-shadow: 0 3px 6px rgba(30,58,138,0.3); }
.elicit-steps { margin-top: 14px; border-left: 3px solid var(--elicit-btn-border); padding-left: 16px; }
.elicit-step-item { display: none; background: var(--elicit-bg); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--elicit-btn-border); animation: stepIn .2s ease; }
.elicit-step-item.active { display: block; }
.elicit-step-num { display: inline-block; background: var(--elicit-btn-border); color: #fff; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; font-size: 12px; font-weight: 700; margin-right: 10px; }
.elicit-step-q { font-size: 14px; color: var(--elicit-btn-text); font-weight: 600; line-height: 1.6; }
.elicit-step-a { display: none; margin-top: 10px; font-size: 13px; color: var(--text); background: var(--card); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--elicit-btn-border); line-height: 1.6; }
.elicit-step-a.revealed { display: block; }
.elicit-next-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 7px 14px; background: var(--step-bg); color: var(--step-text); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.elicit-next-btn:hover { background: #475569; }
.elicit-prev-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; margin-right: 10px; padding: 7px 14px; background: var(--step-bg); color: var(--step-text); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.elicit-prev-btn:hover { background: #475569; }
.elicit-btn-row { display: flex; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.elicit-finish { display: none; margin-top: 14px; background: var(--card); border: 2px solid var(--elicit-btn-border); border-radius: 10px; padding: 14px 16px; }
.elicit-finish.revealed { display: block; }
.elicit-final-label { font-size: 13px; color: var(--elicit-btn-border); font-weight: 700; margin-bottom: 6px; }
.elicit-final-text { font-size: 14px; color: var(--text); line-height: 1.7; }
@keyframes stepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body>
<div id="theme-bar" style="position:fixed;top:12px;right:16px;z-index:9999;display:flex;gap:6px;align-items:center;">
  <button id="btn-auto" onclick="setTheme('auto')" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;">☀️/🌙 系统</button>
  <button id="btn-light" onclick="setTheme('light')" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;">☀️ 日间</button>
  <button id="btn-dark" onclick="setTheme('dark')" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;">🌙 夜间</button>
</div>
<script>
(function(){
  var saved=localStorage.getItem('pp-theme');
  var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  function apply(theme){
    var isDark=theme==='dark'||(theme==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',isDark?'dark':'');
    document.getElementById('btn-auto').style.fontWeight=theme==='auto'?700:400;
    document.getElementById('btn-light').style.fontWeight=theme==='light'?700:400;
    document.getElementById('btn-dark').style.fontWeight=theme==='dark'?700:400;
    localStorage.setItem('pp-theme',theme);
  }
  window.setTheme=function(t){ apply(t); };
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
    if(localStorage.getItem('pp-theme')==='auto') apply('auto');
  });
  apply(saved||'auto');
})();
</script>

<script>

window.PRACTICE = {"Ch01_机械运动": {"title": "第1章 机械运动", "titleEn": "Ch01 Mechanical Motion", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做练习。", "subtopics": [{"name": "1.1 长度和时间的测量", "en": "1.1 Length & Time", "problems": [{"en": "A steel ball bearing [钢球] has diameter [直径] d = 12.4 mm. What is d in cm?", "zh": "", "diff": "basic", "sol": ["[Identify] d = 12.4 mm. Convert to cm.", "[Conversion] 1 cm = 10 mm, divide by 10.", "[Calculate] 12.4 / 10 = 1.24 cm.", "Answer: 1.24 cm"], "elicit": [{"q": "What is this question actually asking us to do?", "a": "Convert a length from millimetres (mm) to centimetres (cm)."}, {"q": "What number do we have? What unit?", "a": "d = 12.4 mm."}, {"q": "What is the conversion factor?", "a": "1 cm = 10 mm. Divide mm by 10 to get cm."}, {"q": "Calculate.", "a": "12.4 / 10 = 1.24 cm."}, {"q": "Final answer?", "a": "1.24 cm"}]}, {"en": "A stopwatch [秒表] has a smallest division [分度值] of 0.1 s. A student reports a reading as 5.35 s. What is the absolute uncertainty [不确定度]?", "zh": "", "diff": "medium", "sol": ["[Rule] Uncertainty = half the smallest division = 0.1 / 2 = 0.05 s.", "[Report] t = (5.35 +/- 0.05) s.", "Answer: +/-0.05 s"], "elicit": [{"q": "What does 'absolute uncertainty' mean?", "a": "How much the reading could be off by."}, {"q": "What is the smallest scale division?", "a": "0.1 s."}, {"q": "What is the rule for analogue instruments?", "a": "Uncertainty = half the smallest division = 0.1 / 2 = 0.05 s."}, {"q": "How do we report the result?", "a": "t = (5.35 +/- 0.05) s"}, {"q": "Final answer?", "a": "+/-0.05 s"}]}, {"en": "A ruler with 1-mm divisions measures one sheet of paper as 0.9 mm. A micrometer [千分尺] gives 0.085 mm. Express the ruler result in micrometres and comment on its accuracy [精确度].", "zh": "", "diff": "hard", "sol": ["[Convert] 0.9 mm = 900 um.", "[Accuracy] Ruler true value is between 0.5 mm (500 um) and 1.4 mm (1400 um).", "[Micrometer] True value = 85 um.", "[Conclusion] Ruler result (900 um) is ~10x too large — completely inadequate.", "Answer: 900 um; ruler accuracy insufficient (true approx 85 um)"], "elicit": [{"q": "What are the two measurements we are comparing?", "a": "Ruler: 0.9 mm; Micrometer: 0.085 mm (= 85 um)."}, {"q": "Convert 0.9 mm to um.", "a": "0.9 * 1000 = 900 um."}, {"q": "Can a ruler with 1-mm divisions accurately measure one sheet of paper?", "a": "No. True value lies between 0.5 mm and 1.4 mm (500-1400 um)."}, {"q": "What is the true thickness from the micrometer?", "a": "0.085 mm = 85 um."}, {"q": "Compare: 900 um vs 85 um. What does this tell us?", "a": "The ruler is completely inadequate for this measurement."}, {"q": "Final answer?", "a": "900 um; ruler not accurate enough (true approx 85 um)"}]}, {"en": "A pendulum period is measured 5 times: 2.30, 2.38, 2.34, 2.31, 2.36 s. Find the mean [平均值] and the random uncertainty [随机不确定度] of the mean.", "zh": "", "diff": "challenge", "sol": ["[Mean] (2.30+2.38+2.34+2.31+2.36)/5 = 2.338 s approx 2.34 s.", "[Deviations] -0.038, +0.042, +0.002, -0.028, +0.022 s.", "[Sigma squared] 0.004480/5 = 0.000896, sigma = 0.030 s.", "[Uncertainty of mean] sigma_mean = 0.030 / sqrt(5) = 0.013 s.", "[Report] T = (2.34 +/- 0.01) s.", "Answer: Mean = 2.34 s; uncertainty = +/-0.01 s"], "elicit": [{"q": "List the five readings.", "a": "2.30, 2.38, 2.34, 2.31, 2.36 s."}, {"q": "Step 1: find the mean.", "a": "Add all five, divide by 5: (2.30+2.38+2.34+2.31+2.36)/5 = 2.338 s approx 2.34 s."}, {"q": "How do we quantify the spread of readings?", "a": "Use standard deviation."}, {"q": "Calculate the deviations from the mean (2.338 s).", "a": "-0.038, +0.042, +0.002, -0.028, +0.022 s."}, {"q": "What is sigma squared and sigma?", "a": "sigma^2 = 0.004480/5 = 0.000896, sigma = 0.030 s."}, {"q": "We want uncertainty of the MEAN, not one reading. What do we do?", "a": "Divide by sqrt(n): sigma_mean = 0.030 / sqrt(5) = 0.013 s."}, {"q": "Final answer?", "a": "Mean = 2.34 s; uncertainty = +/-0.01 s"}]}]}, {"name": "1.2 运动的描述", "en": "1.2 Describing Motion", "problems": [{"en": "A courier [快递员] rides 3 km north, then 4 km east. What is the total distance [路程] and the displacement [位移] from start?", "zh": "", "diff": "medium", "sol": ["[Distance] 3 + 4 = 7 km.", "[Displacement] Pythagorean: d = sqrt(3^2 + 4^2) = 5 km at 53.1 deg E of N.", "Answer: distance = 7 km; displacement = 5 km at 53.1 deg E of N"], "elicit": [{"q": "What two things does this question ask for?", "a": "Total distance (path length) AND displacement (straight-line from start to end)."}, {"q": "What is the total distance?", "a": "3 km + 4 km = 7 km."}, {"q": "Draw it: north 3 km, east 4 km. What shape? What is displacement?", "a": "A right triangle. Displacement is the hypotenuse."}, {"q": "Pythagorean theorem: d = sqrt(3^2 + 4^2) = ?", "a": "sqrt(9+16) = sqrt(25) = 5 km."}, {"q": "Why is displacement not 7 km?", "a": "Displacement is the straight-line vector, not the path length."}, {"q": "Final answer?", "a": "Distance = 7 km; displacement = 5 km at 53.1 deg E of N"}]}, {"en": "An object moves from position x = +8 m to x = -6 m. (a) What is the displacement? (b) If the motion takes 7 s, what is the average velocity [平均速度]?", "zh": "", "diff": "medium", "sol": ["(a) Delta-x = x_final - x_initial = -6 - (+8) = -14 m.", "(b) v_avg = Delta-x / Delta-t = -14 / 7 = -2 m/s.", "Answer: (a) -14 m (b) -2 m/s"], "elicit": [{"q": "What does 'position changes from +8 m to -6 m' mean?", "a": "The object starts at +8 m, crosses the origin, and ends at -6 m."}, {"q": "Calculate displacement: Delta-x = x_final - x_initial.", "a": "(-6) - (+8) = -14 m. Negative means 14 m in the -x direction."}, {"q": "What does the negative sign tell us?", "a": "The object crossed the origin and went into negative territory."}, {"q": "Average velocity = Delta-x / Delta-t. Delta-t = ?", "a": "7 s."}, {"q": "Calculate.", "a": "-14 / 7 = -2 m/s."}, {"q": "Final answer?", "a": "(a) -14 m (b) -2 m/s"}]}, {"en": "A runner completes 2.5 laps around a 400-m circular track. (a) Total distance? (b) Net displacement? (c) Explain why distance and displacement differ.", "zh": "", "diff": "medium", "sol": ["(a) Distance: 2.5 x 400 = 1000 m.", "(b) After 2 laps back at start; half lap more: 200 m from start. Displacement = 200 m.", "(c) Distance counts full path; displacement counts net change in position.", "Answer: (a) 1000 m (b) 200 m (c) because part of the path doubled back"], "elicit": [{"q": "2.5 laps -- where does the runner end up?", "a": "Two full laps back at start. Half a lap more: 200 m from start."}, {"q": "What is the total distance?", "a": "2.5 x 400 m = 1000 m."}, {"q": "What is the net displacement?", "a": "200 m -- the straight line from start to end."}, {"q": "Why are they so different?", "a": "Because part of the path doubled back on itself."}, {"q": "Final answer?", "a": "(a) 1000 m (b) 200 m (c) distance counts path, displacement counts net change"}]}, {"en": "A driver travels A to B (60 km at 40 km/h) and immediately returns B to A (60 km at 60 km/h). (a) Average speed for the whole trip? (b) Average velocity?", "zh": "", "diff": "hard", "sol": ["[Time A->B] 60/40 = 1.5 h. [Time B->A] 60/60 = 1.0 h.", "[Total] Distance = 120 km, Time = 2.5 h.", "(a) Average speed = 120/2.5 = 48 km/h.", "(b) Net displacement = 0, so average velocity = 0.", "[Common mistake] Average speed is NOT (40+60)/2 = 50. Must use total distance / total time.", "Answer: (a) 48 km/h (b) 0 m/s"], "elicit": [{"q": "What is the key formula for average speed?", "a": "Total distance / total time."}, {"q": "Calculate time for each leg.", "a": "A->B: 60/40 = 1.5 h. B->A: 60/60 = 1.0 h."}, {"q": "Total distance and total time?", "a": "Distance = 120 km; Time = 2.5 h."}, {"q": "Average speed = 120 / 2.5 = ?", "a": "48 km/h."}, {"q": "Common mistake: average speed = (40+60)/2 = 50 km/h -- is this right?", "a": "No! Always use total distance / total time, not the arithmetic mean."}, {"q": "Now part (b): net displacement?", "a": "Zero -- back at the starting point. Average velocity = 0."}, {"q": "Final answer?", "a": "(a) 48 km/h (b) 0 m/s"}]}]}, {"name": "1.3 运动的快慢", "en": "1.3 Speed & Velocity", "problems": [{"en": "A car travels 240 km in 3 hours. What is its average speed in (a) km/h and (b) m/s?", "zh": "", "diff": "basic", "sol": ["(a) v = 240/3 = 80 km/h.", "(b) 80 km/h = 80*1000/3600 = 22.2 m/s.", "Answer: 80 km/h = 22.2 m/s"], "elicit": [{"q": "What two units do we need to give?", "a": "km/h AND m/s."}, {"q": "Part (a): 240 km in 3 hours. Speed = ?", "a": "240 / 3 = 80 km/h."}, {"q": "Part (b): convert 80 km/h to m/s.", "a": "80 * 1000 / 3600 = 22.2 m/s."}, {"q": "Final answer?", "a": "80 km/h = 22.2 m/s"}]}, {"en": "A cyclist rides 18 km in 45 minutes. What is the average speed in m/s?", "zh": "", "diff": "medium", "sol": ["[Convert] 18 km = 18000 m; 45 min = 2700 s.", "[Calculate] v = 18000/2700 = 6.67 m/s.", "Answer: 6.7 m/s"], "elicit": [{"q": "What units are given vs what is asked?", "a": "Given: km and minutes. Asked: m/s."}, {"q": "Convert: 18 km to ? m; 45 min to ? s.", "a": "18 km = 18000 m; 45 min = 2700 s."}, {"q": "Apply v = s/t.", "a": "18000 / 2700 = 6.67 m/s."}, {"q": "Final answer?", "a": "6.7 m/s"}]}, {"en": "An athlete runs 100 m in 10.2 s. What is her average speed?", "zh": "", "diff": "basic", "sol": ["v = 100 / 10.2 = 9.80 m/s.", "Answer: 9.80 m/s"], "elicit": [{"q": "What formula?", "a": "v = s / t = 100 / 10.2."}, {"q": "Calculate.", "a": "100 / 10.2 = 9.80 m/s."}, {"q": "Final answer?", "a": "9.80 m/s"}]}, {"en": "A car accelerates from 20 m/s to 30 m/s in 5 s. What is its average acceleration?", "zh": "", "diff": "medium", "sol": ["a = (v - v0) / t = (30 - 20) / 5 = 2 m/s^2.", "Answer: 2 m/s^2"], "elicit": [{"q": "What is the acceleration formula?", "a": "a = (v - v0) / t."}, {"q": "Identify: v0 = ?, v = ?, t = ?", "a": "v0 = 20 m/s, v = 30 m/s, t = 5 s."}, {"q": "Calculate.", "a": "(30 - 20) / 5 = 10 / 5 = 2 m/s^2."}, {"q": "Final answer?", "a": "2 m/s^2"}]}, {"en": "A high-speed train [高铁] 200 m long passes a stationary observer [静止观察者] at the platform edge [站台边缘] at 72 km/h. (a) How long does it take to completely pass? (b) How far does it travel?", "zh": "", "diff": "hard", "sol": ["[Convert] 72 km/h = 20 m/s.", "(a) Observer is a POINT. Train travels exactly its own length = 200 m. t = 200/20 = 10 s.", "(b) Distance = train length = 200 m.", "[Common mistake] The observer is a point, not a distance. Train travels exactly its own length.", "Answer: (a) 10 s (b) 200 m"], "elicit": [{"q": "Draw it: 200-m train, fixed observer at platform edge. When does it START passing? FINISH?", "a": "Start: front reaches observer. Finish: rear passes observer."}, {"q": "How far does the train travel while this happens?", "a": "Exactly one train length (200 m) -- the observer is a fixed point."}, {"q": "Convert 72 km/h to m/s.", "a": "72 * 1000 / 3600 = 20 m/s."}, {"q": "Calculate time.", "a": "200 / 20 = 10 s."}, {"q": "Most common mistake?", "a": "Adding train length to some other distance -- observer is a POINT, train travels exactly its own length."}, {"q": "Final answer?", "a": "(a) 10 s (b) 200 m"}]}, {"en": "A railway tunnel [铁路隧道] is 360 m long. A train 200 m long passes through at 54 km/h. (a) How long for the train to completely exit? (b) The train whistles from when front enters to when rear exits. How long does the whistle last?", "zh": "", "diff": "challenge", "sol": ["[Convert] 54 km/h = 15 m/s.", "(a) Rear exits when train travels tunnel + train = 360 + 200 = 560 m. t = 560/15 = 37.3 s.", "(b) Whistle = time for FRONT to cross tunnel = 360 m. t = 360/15 = 24 s.", "[Common mistake] Part (a) uses tunnel + train; part (b) uses only tunnel (tracks front, not rear).", "Answer: (a) 37.3 s (b) 24 s"], "elicit": [{"q": "Draw it: 360-m tunnel, 200-m train. When does the train COMPLETELY exit?", "a": "When the rear clears the far end. Train travels tunnel + train = 560 m."}, {"q": "Convert 54 km/h to m/s.", "a": "54 * 1000 / 3600 = 15 m/s."}, {"q": "Part (a): 560 m / 15 m/s = ?", "a": "37.3 s."}, {"q": "Part (b): whistle starts when front enters, stops when rear exits. What does it track?", "a": "The whistle lasts as long as the FRONT travels the tunnel length (360 m). Rear exiting is irrelevant."}, {"q": "Why is (b) different from (a)?", "a": "(a) tracks REAR exiting (tunnel + train). (b) tracks FRONT crossing (tunnel only)."}, {"q": "Part (b): 360 m / 15 m/s = ?", "a": "24 s."}, {"q": "Final answer?", "a": "(a) 37.3 s (b) 24 s"}]}]}, {"name": "1.4 匀速直线运动", "en": "1.4 Uniform Linear Motion", "problems": [{"en": "An object moves at constant velocity [匀速] v = 5 m/s. How far does it travel in 12 s?", "zh": "", "diff": "basic", "sol": ["s = v * t = 5 * 12 = 60 m.", "Answer: 60 m"], "elicit": [{"q": "Constant velocity means speed and direction are fixed. Which formula?", "a": "s = v * t."}, {"q": "v = 5 m/s, t = 12 s. Calculate.", "a": "5 * 12 = 60 m."}, {"q": "Final answer?", "a": "60 m"}]}, {"en": "Cars A (20 m/s) and B (12 m/s) start from the same point at the same time, same direction. (a) How far apart after 30 s? (b) How long for A to be 400 m ahead of B?", "zh": "", "diff": "hard", "sol": ["[Relative speed] A relative to B = 20 - 12 = 8 m/s.", "(a) After 30 s: gap = 8 * 30 = 240 m.", "(b) t = 400 / 8 = 50 s.", "[Method] Treat B as stationary; ask how fast A pulls away.", "Answer: (a) 240 m (b) 50 s"], "elicit": [{"q": "Both cars start together. Key idea for comparing positions?", "a": "Treat car B as stationary -- ask how fast A is pulling away."}, {"q": "A's speed relative to B?", "a": "20 - 12 = 8 m/s."}, {"q": "Part (a): after 30 s, how far apart?", "a": "8 * 30 = 240 m."}, {"q": "Part (b): how long to build a 400-m gap?", "a": "400 / 8 = 50 s."}, {"q": "Final answer?", "a": "(a) 240 m (b) 50 s"}]}, {"en": "A car (54 km/h) and bicycle (5 m/s) start together. (a) After 2 minutes, how far ahead is the car? (b) Bicycle has a 1-km head start; car starts 5 min later. Who arrives first at a destination 20 km away?", "zh": "", "diff": "challenge", "sol": ["[Convert] Car: 54 km/h = 15 m/s.", "(a) Rel speed = 15 - 5 = 10 m/s. After 120 s: gap = 10 * 120 = 1200 m.", "(b) Bicycle: 20000/5 = 4000 s = 66.7 min. When car starts (300 s later): bicycle at 1500 m, 18500 m remaining. Catch-up distance = 19500 m. Catch-up time = 19500/10 = 1950 s. Total car time = 2250 s = 37.5 min. Car arrives first.", "Answer: (a) 1200 m (b) The car arrives first"], "elicit": [{"q": "Part (a): same start time. Relative speed?", "a": "15 - 5 = 10 m/s."}, {"q": "After 2 minutes (120 s), gap = ?", "a": "10 * 120 = 1200 m."}, {"q": "Part (b): break it down. Bicycle: 20 km at 5 m/s = ?", "a": "20000 / 5 = 4000 s = 66.7 min."}, {"q": "Where is bicycle when car starts (300 s later)?", "a": "5 * 300 = 1500 m from start. Remaining = 20000 - 1500 = 18500 m."}, {"q": "Total distance car must cover?", "a": "18500 m remaining + 1000 m head start = 19500 m."}, {"q": "Car catch-up time (at 10 m/s): 19500 / 10 = ?", "a": "1950 s = 32.5 min from car start. Total car = 300 + 1950 = 2250 s = 37.5 min."}, {"q": "Who wins?", "a": "Car (37.5 min) beats bicycle (66.7 min)."}, {"q": "Final answer?", "a": "(a) 1200 m (b) The car arrives first"}]}]}, {"name": "1.5 速度变化规律", "en": "1.5 Velocity Change Laws", "problems": [{"en": "A car accelerates from rest [从静止] at 3 m/s^2. What is its velocity after 8 s?", "zh": "", "diff": "basic", "sol": ["v = v0 + at = 0 + 3*8 = 24 m/s.", "Answer: 24 m/s"], "elicit": [{"q": "From rest means what initial velocity?", "a": "v0 = 0 m/s."}, {"q": "Formula: v = v0 + at. Plug in.", "a": "0 + 3 * 8 = 24 m/s."}, {"q": "Final answer?", "a": "24 m/s"}]}, {"en": "An object starts from rest and accelerates at 4 m/s^2. How far does it travel in the first 5 s?", "zh": "", "diff": "medium", "sol": ["s = v0*t + 0.5*a*t^2 = 0 + 0.5*4*25 = 50 m.", "Answer: 50 m"], "elicit": [{"q": "From rest (v0 = 0), a = 4 m/s^2 for 5 s. Which formula?", "a": "s = v0*t + 0.5*a*t^2."}, {"q": "Calculate: 0.5 * 4 * 25 = ?", "a": "50 m."}, {"q": "Final answer?", "a": "50 m"}]}, {"en": "A ball is thrown upward [竖直上抛] with v0 = 20 m/s. Take g = 10 m/s^2. (a) Maximum height? (b) Total air time? (c) Speed when it returns?", "zh": "", "diff": "hard", "sol": ["(a) v^2 = v0^2 - 2gh -> h = 400/20 = 20 m.", "(b) Time up = v0/g = 2 s. Total = 4 s.", "(c) By symmetry: speed = 20 m/s downward.", "[Common mistake] Using g inconsistently. Pick one sign convention and stick to it.", "Answer: (a) 20 m (b) 4 s (c) 20 m/s downward"], "elicit": [{"q": "At maximum height, what is the velocity?", "a": "v = 0 -- the ball stops momentarily."}, {"q": "Use v^2 = v0^2 - 2gh. Solve for h.", "a": "0 = 400 - 20h -> h = 20 m."}, {"q": "Time going up: v = v0 - g*t -> 0 = 20 - 10*t -> t = 2 s. Total air time?", "a": "4 s (symmetry: same time coming down)."}, {"q": "Speed when it returns?", "a": "Same magnitude as launch: 20 m/s, but direction is now downward."}, {"q": "Common sign-convention mistake?", "a": "Using g inconsistently (+10 sometimes, -10 others). Pick a direction as positive and stick to it throughout."}, {"q": "Final answer?", "a": "(a) 20 m (b) 4 s (c) 20 m/s downward"}]}, {"en": "A position-time graph [位移-时间图像] is a straight line from (0, 2) to (6, 20), position in metres, time in seconds. (a) What is the velocity? (b) What does x = 2 m at t = 0 mean? (c) Where is it at t = 10 s?", "zh": "", "diff": "challenge", "sol": ["(a) Slope = velocity = (20-2)/(6-0) = 3 m/s.", "(b) At t = 0, x = 2 m -- the object started 2 m from the origin.", "(c) x = x0 + v*t = 2 + 3*10 = 32 m.", "[Common mistake] Assuming x = 0 at t = 0. Always check the y-intercept!", "Answer: (a) 3 m/s (b) Starts 2 m from origin (c) 32 m"], "elicit": [{"q": "The line goes from (0, 2) to (6, 20). What do the axes mean?", "a": "x-axis = time (s), y-axis = position (m)."}, {"q": "What does the SLOPE of an s-t graph represent?", "a": "Velocity. Slope = delta-position / delta-time."}, {"q": "Calculate the slope.", "a": "(20 - 2) / (6 - 0) = 18/6 = 3 m/s."}, {"q": "The line starts at x = 2 m (not 0). What does this mean?", "a": "At t = 0, the object was already 2 m away from the reference point."}, {"q": "If it continues at 3 m/s, where at t = 10 s?", "a": "x = 2 + 3 * 10 = 32 m."}, {"q": "Most common mistake on s-t graphs?", "a": "Assuming x = 0 at t = 0. Always check where the line crosses the y-axis!"}, {"q": "Final answer?", "a": "(a) 3 m/s (b) Starts 2 m from origin (c) 32 m"}]}]}]}, "Ch02_声现象": {"title": "第2章 声现象", "titleEn": "Ch02 Sound", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "2.1 声音的产生与传播", "en": "Sound Production & Propagation", "problems": [{"en": "A sound wave [声波] travels through air at 340 m/s. How long does it take to travel 1.7 km?", "zh": "", "diff": "basic", "sol": ["[Identify] v = 340 m/s, d = 1.7 km = 1700 m. Find time.", "[Formula] t = d / v = 1700 / 340 = 5.0 s.", "Answer: 5.0 s"], "elicit": [{"q": "Formula connecting distance, speed, time?", "a": "t = d / v."}, {"q": "Convert 1.7 km to m.", "a": "1700 m."}, {"q": "Calculate.", "a": "1700 / 340 = 5.0 s."}, {"q": "Final answer?", "a": "5.0 s"}]}, {"en": "A sonar [声呐（利用回声测距）] pulse [脉冲（短促信号）] is sent to the seabed [海底] and returns after 0.4 s. Speed of sound in water = 1500 m/s. How deep is the seabed [海底]?", "zh": "", "diff": "medium", "sol": ["[Identify] Echo returns after 0.4 s, v = 1500 m/s (water). Find depth.", "[Key] Sound travels down AND back: total distance = 2 × depth.", "[Calculate] 2d = v × t = 1500 × 0.4 = 600 m → d = 300 m.", "Answer: 300 m"], "elicit": [{"q": "Why is the echo time doubled?", "a": "Sound travels DOWN to the seabed AND BACK up — total distance = 2 × depth."}, {"q": "Total distance traveled?", "a": "v × t = 1500 × 0.4 = 600 m."}, {"q": "Depth?", "a": "600 / 2 = 300 m."}, {"q": "Final answer?", "a": "300 m"}]}, {"en": "In a thunderstorm, lightning [闪电] is seen 3 s before thunder [雷声] is heard. Sound speed 340 m/s. How far away is the lightning [闪电]?", "zh": "", "diff": "basic", "sol": ["[Identify] Lightning seen 3 s before thunder, v = 340 m/s. Find distance.", "[Note] Light travel time ≈ 0, so 3 s is sound travel time.", "[Calculate] d = v × t = 340 × 3 = 1020 m.", "Answer: 1020 m (≈ 1.0 km)"], "elicit": [{"q": "Why can we ignore light travel time?", "a": "Light speed is ~3×10⁸ m/s — essentially instant compared to sound."}, {"q": "The 3 s is the travel time of what?", "a": "Sound (thunder) traveling from the lightning strike to you."}, {"q": "Calculate distance.", "a": "340 × 3 = 1020 m."}, {"q": "Final answer?", "a": "1020 m"}]}]}, {"name": "2.2 声音的特性", "en": "Pitch, Loudness & Wave Properties", "problems": [{"en": "A tuning fork [音叉] vibrates at 440 Hz. What is its period [周期]?", "zh": "", "diff": "basic", "sol": ["[Identify] f = 440 Hz. Find period T.", "[Formula] T = 1 / f = 1 / 440 = 0.00227 s.", "Answer: 2.27 ms"], "elicit": [{"q": "Relationship between frequency and period?", "a": "T = 1 / f."}, {"q": "Calculate.", "a": "1 / 440 = 0.00227 s = 2.27 ms."}, {"q": "Final answer?", "a": "2.27 ms"}]}, {"en": "A sound wave has f = 250 Hz and wavelength [波长（相邻波峰间距，λ）] λ = 1.36 m. What is the wave speed [波速]?", "zh": "", "diff": "medium", "sol": ["[Identify] f = 250 Hz, λ = 1.36 m. Find wave speed.", "[Formula] v = f × λ = 250 × 1.36 = 340 m/s.", "Answer: 340 m/s"], "elicit": [{"q": "Wave speed formula?", "a": "v = f × λ."}, {"q": "Calculate.", "a": "250 × 1.36 = 340 m/s."}, {"q": "Final answer?", "a": "340 m/s"}]}, {"en": "A wave has period [周期] 0.002 s and travels at 340 m/s. What is its wavelength [波长]?", "zh": "", "diff": "basic", "sol": ["[Identify] T = 0.002 s, v = 340 m/s. Find wavelength.", "[Step 1] f = 1/T = 1/0.002 = 500 Hz.", "[Step 2] λ = v / f = 340 / 500 = 0.68 m.", "Answer: 0.68 m"], "elicit": [{"q": "Find frequency first.", "a": "f = 1/T = 1/0.002 = 500 Hz."}, {"q": "Then wavelength.", "a": "λ = v / f = 340 / 500 = 0.68 m."}, {"q": "Final answer?", "a": "0.68 m"}]}, {"en": "A sound has wavelength [波长] 0.5 m in air (v = 340 m/s). When entering water (v = 1500 m/s), what is the new wavelength [波长]?", "zh": "", "diff": "challenge", "sol": ["[Identify] λ = 0.5 m in air (v=340). Entering water (v=1500). Find new λ (f constant).", "[Key] Frequency stays the same when crossing media.", "[Find f] f = v_air / λ_air = 340 / 0.5 = 680 Hz.", "[New λ] λ_water = v_water / f = 1500 / 680 = 2.21 m.", "Answer: 2.21 m"], "elicit": [{"q": "What stays constant when sound enters water?", "a": "Frequency (set by the source — doesn't change between media)."}, {"q": "Find frequency from air data.", "a": "f = 340 / 0.5 = 680 Hz."}, {"q": "New wavelength in water?", "a": "λ = 1500 / 680 = 2.21 m."}, {"q": "Final answer?", "a": "2.21 m"}]}]}]}, "Ch03_物态变化": {"title": "第3章 物态变化", "titleEn": "Ch03 Changes of State", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "3.1 温度与物态", "en": "Temperature & Phase Changes", "problems": [{"en": "Convert 37°C to Fahrenheit [华氏度（°F）]. [°F = °C × 9/5 + 32]", "zh": "", "diff": "basic", "sol": ["[Identify] T = 37°C. Convert to °F.", "[Formula] °F = °C × 9/5 + 32.", "[Calculate] 37 × 9/5 = 66.6; 66.6 + 32 = 98.6°F.", "Answer: 98.6°F"], "elicit": [{"q": "Celsius to Fahrenheit formula?", "a": "°F = °C × 9/5 + 32."}, {"q": "Calculate.", "a": "37 × 9/5 = 66.6; 66.6 + 32 = 98.6°F."}, {"q": "Final answer?", "a": "98.6°F (normal body temp)"}]}, {"en": "Water has specific heat [热量] capacity [比热容（单位质量升温1°C所需热量）] c = 4.18 J/(g·°C). Heat [热量] needed to warm 500 g water from 20°C to 70°C?", "zh": "", "diff": "medium", "sol": ["[Identify] c = 4.18 J/(g·°C), m = 500 g, ΔT = 80 − 20 = 60°C. Find heat.", "[Formula] Q = mcΔT.", "[Calculate] Q = 500 × 4.18 × 60 = 125400 J = 125.4 kJ.", "Answer: 1.25×10⁵ J"], "elicit": [{"q": "Heat formula for temperature change?", "a": "Q = mcΔT."}, {"q": "Find ΔT.", "a": "80 − 20 = 60°C."}, {"q": "Calculate.", "a": "500 × 4.18 × 60 = 125400 J = 125.4 kJ."}, {"q": "Final answer?", "a": "1.25×10⁵ J"}]}, {"en": "Convert 212°F to Celsius [摄氏度]. [°C = (°F − 32) × 5/9]", "zh": "", "diff": "basic", "sol": ["[Identify] 212°F. Convert to °C.", "[Formula] °C = (°F − 32) × 5/9.", "[Calculate] (212 − 32) × 5/9 = 180 × 5/9 = 100°C.", "Answer: 100°C"], "elicit": [{"q": "Fahrenheit to Celsius formula?", "a": "°C = (°F − 32) × 5/9."}, {"q": "Calculate.", "a": "(212 − 32) × 5/9 = 180 × 5/9 = 100°C."}, {"q": "Final answer?", "a": "100°C (water boils)"}]}, {"en": "A 200-g piece of copper (c = 0.39 J/g°C) is heated from 25°C to 100°C. How much heat [热量] is absorbed?", "zh": "", "diff": "medium", "sol": ["[Identify] m = 200 g, c = 0.39 J/(g°C), ΔT = 100 − 25 = 75°C. Find heat.", "[Formula] Q = mcΔT = 200 × 0.39 × 75 = 5850 J.", "Answer: 5850 J"], "elicit": [{"q": "Formula", "a": "Q = mcΔT."}, {"q": "ΔT?", "a": "100 − 25 = 75°C."}, {"q": "Calculate.", "a": "200 × 0.39 × 75 = 5850 J."}, {"q": "Final answer?", "a": "5850 J"}]}]}, {"name": "3.2 汽化和液化", "en": "Evaporation & Condensation", "problems": [{"en": "Latent heat of vaporization [汽化潜热（液体变气体所需热量）] of water is 2260 J/g. Heat needed to evaporate 100 g water at 100°C?", "zh": "", "diff": "basic", "sol": ["[Identify] Lv = 2260 J/g, m = 100 g. Find heat to evaporate.", "[Formula] Q = mLv = 100 × 2260 = 226000 J.", "Answer: 2.26×10⁵ J"], "elicit": [{"q": "What heat is needed for evaporation?", "a": "Q = mLv (latent heat of vaporization)."}, {"q": "Calculate.", "a": "100 × 2260 = 226000 J."}, {"q": "Final answer?", "a": "2.26×10⁵ J"}]}, {"en": "Latent heat of fusion [熔化潜热（固体变液体所需热量）] of ice is 334 J/g. Heat needed to melt 50 g of ice at 0°C?", "zh": "", "diff": "basic", "sol": ["[Identify] Lf = 334 J/g, m = 50 g. Find heat to melt.", "[Formula] Q = mLf = 50 × 334 = 16700 J.", "Answer: 1.67×10⁴ J"], "elicit": [{"q": "What heat is needed to melt ice?", "a": "Q = mLf (latent heat of fusion)."}, {"q": "Calculate.", "a": "50 × 334 = 16700 J."}, {"q": "Final answer?", "a": "1.67×10⁴ J"}]}, {"en": "A puddle of water (mass 2 kg) evaporates [蒸发（液体变气体）] completely. How much heat is absorbed? (Lv = 2260 J/g)", "zh": "", "diff": "hard", "sol": ["[Identify] m = 2 kg = 2000 g, evaporates. Find heat absorbed.", "[Formula] Q = mLv = 2000 × 2260 = 4.52×10⁶ J.", "Answer: 4.52×10⁶ J"], "elicit": [{"q": "Convert 2 kg to g.", "a": "2000 g."}, {"q": "Heat to evaporate?", "a": "Q = mLv = 2000 × 2260 = 4.52×10⁶ J."}, {"q": "Final answer?", "a": "4.52×10⁶ J"}]}]}, {"name": "3.3 熔化与凝固", "en": "Melting & Freezing", "problems": [{"en": "A 100-g block of ice at 0°C is heated until it melts completely. How much heat is absorbed? (Lf = 334 J/g)", "zh": "", "diff": "medium", "sol": ["[Identify] m = 100 g ice at 0°C melts. Find heat.", "[Formula] Q = mLf = 100 × 334 = 33400 J.", "Answer: 3.34×10⁴ J"], "elicit": [{"q": "Ice at 0°C melting — which latent heat?", "a": "Latent heat of fusion Lf = 334 J/g."}, {"q": "Calculate.", "a": "100 × 334 = 33400 J."}, {"q": "Final answer?", "a": "3.34×10⁴ J"}]}, {"en": "To freeze [凝固（液体变固体）] 250 g of water at 0°C into ice, how much heat must be removed? (Lf = 334 J/g)", "zh": "", "diff": "medium", "sol": ["[Identify] m = 250 g water at 0°C freezes. Lf = 334 J/g. Find heat removed.", "[Formula] Q = mLf = 250 × 334 = 83500 J.", "Answer: 8.35×10⁴ J"], "elicit": [{"q": "Freezing is the reverse of melting. Heat removed?", "a": "Q = mLf (same magnitude as melting)."}, {"q": "Calculate.", "a": "250 × 334 = 83500 J."}, {"q": "Final answer?", "a": "8.35×10⁴ J removed"}]}]}]}, "Ch04_光现象": {"title": "第4章 光现象", "titleEn": "Ch04 Light", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "4.1 光的直线传播", "en": "Rectilinear Propagation of Light", "problems": [{"en": "A girl of height 1.5 m stands 2 m from a street lamp [路灯（光源）]. Her shadow [影子（光线被物体遮挡形成的暗区）] is 1.2 m long. How high is the lamp [路灯（光源）]?", "zh": "", "diff": "challenge", "sol": ["[Identify] Given: girl height=1.5m, distance from lamp=2m, shadow length=1.2m. Find: lamp height H.", "[Key principle] Similar triangles: light rays from the lamp top to shadow tip and from girl's head to shadow tip are parallel.", "[Setup] H / (2+1.2) = 1.5 / 1.2  (lamp height : total lamp-to-tip distance = girl height : shadow length).", "[Note] Total distance = distance to lamp + shadow length = 2 + 1.2 = 3.2 m (common mistake: use 2m directly!).", "[Calculate] H = 3.2 × (1.5 / 1.2) = 3.2 × 1.25 = 4.0 m.", "[Check] Lamp (4m) > girl (1.5m) and shadow (1.2m) < girl height -- physically reasonable. ✓", "Answer: 4.0 m"], "elicit": [{"q": "What does the diagram look like? What triangles are formed?", "a": "Two similar right triangles: (1) lamp top → ground → shadow tip; (2) girl head → ground → shadow tip. The light rays are parallel."}, {"q": "What is the key similarity relationship?", "a": "Lamp height / Total lamp-to-tip distance = Girl height / Shadow length. Both triangles share the same angle at the shadow tip."}, {"q": "What is the total lamp-to-tip distance?", "a": "Girl-to-lamp distance + shadow length = 2 + 1.2 = 3.2 m. (Common mistake: use 2 m directly -- this is wrong!)"}, {"q": "Set up and solve.", "a": "H / 3.2 = 1.5 / 1.2 → H = 3.2 × 1.25 = 4.0 m."}, {"q": "Final answer?", "a": "4.0 m"}]}]}, {"name": "4.2 光的反射", "en": "Reflection", "problems": [{"en": "Light hits a plane mirror [平面镜（平整的反射镜面）] at incidence angle [入射角（光线与法线的夹角）] 30°. What is the angle of reflection [反射（光线遇到镜面返回原介质）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: incidence angle i = 30°. Find: reflection angle r.", "[Law of Reflection] The angle of reflection always equals the angle of incidence.", "[Note] Both angles are measured from the normal (perpendicular to the mirror surface), NOT from the mirror surface itself.", "[Calculate] r = i = 30°.", "[Check] Rays are reversible: r = 30° ✓", "Answer: 30°"], "elicit": [{"q": "What is the Law of Reflection?", "a": "The angle of reflection equals the angle of incidence (both measured from the normal, NOT the mirror surface)."}, {"q": "Are the angles measured from the mirror surface or from the normal?", "a": "From the NORMAL (the line perpendicular to the mirror surface). A common mistake is measuring from the mirror surface itself."}, {"q": "What is the answer?", "a": "r = i = 30°."}]}, {"en": "An object is placed 60 cm in front of a plane mirror [平面镜]. Where does the image appear?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: object distance u = 60 cm from a plane mirror. Find: image position.", "[Plane Mirror Rules] ① Image is as far behind the mirror as the object is in front (image distance = object distance).", "② Image is virtual (formed by extensions of reflected rays, cannot be captured on a screen).", "③ Image is upright and the same size as the object.", "[Calculate] Image distance = 60 cm behind the mirror.", "[Common mistake] Image distance is NOT u + v. u is object-to-mirror; v is image-to-mirror.", "[Check] Object-mirror distance (60 cm) + mirror-image distance (60 cm) = 120 cm separation. ✓", "Answer: Virtual image, 60 cm behind the mirror"], "elicit": [{"q": "What are the three rules for plane mirror images?", "a": "① Image distance = Object distance; ② Image is virtual (behind the mirror); ③ Image is upright and same size."}, {"q": "Where is the image?", "a": "60 cm behind the mirror (same distance as the object is in front)."}, {"q": "Why is it called a 'virtual' image?", "a": "The image forms where light rays appear to come from, but no actual rays meet behind the mirror -- you cannot capture it on a screen."}, {"q": "Final answer?", "a": "Virtual image, 60 cm behind the mirror."}]}, {"en": "Two plane mirrors [平面镜（两面镜子）] are placed at 90°. How many images of an object placed between them can be seen?", "zh": "", "diff": "hard", "sol": ["[Identify] Given: two plane mirrors at θ = 90°. Find: number of images formed.", "[Formula] Number of images: n = (360°/θ) − 1.", "[Calculate] n = (360 ÷ 90) − 1 = 4 − 1 = 3 images.", "[Why it works] Multiple reflections between two mirrors create multiple images.", "[Common mistake] The formula n = 360/θ − 1 only works when 360/θ is an integer.", "[Check] 90° is a common configuration (corner of a room) -- 3 images is the classic result. ✓", "Answer: 3 images"], "elicit": [{"q": "What formula gives the number of images formed by two mirrors at angle θ?", "a": "n = (360° / θ) − 1."}, {"q": "Calculate for θ = 90°.", "a": "n = (360 / 90) − 1 = 4 − 1 = 3."}, {"q": "When does this formula NOT apply?", "a": "When 360°/θ is not a whole number. For example, at 100°: n = 3.6 − 1 = 2.6 (not a valid count)."}, {"q": "Final answer?", "a": "3 images."}]}]}, {"name": "4.3 光的折射", "en": "Refraction & Snell's Law", "problems": [{"en": "Light travels from air (n = 1) into water (n = 1.33). Incidence angle [入射角] = 45°. Find angle of refraction [折射（光从一种介质进入另一种介质时方向改变）].", "zh": "", "diff": "medium", "sol": ["[Identify] Given: air n₁=1, water n₂=1.33, incidence angle i=45°. Find: refraction angle r.", "[Snell's Law] n₁ sin i = n₂ sin r.", "[Physical meaning] Light from air (rarer) enters water (denser) -- it bends TOWARD the normal.", "[Calculate] 1 × sin 45° = 1.33 × sin r → sin r = 0.7071 / 1.33 = 0.532.", "r = arcsin(0.532) ≈ 32.1°.", "[Common mistake] arcsin(0.532) ≠ 0.532 -- use a calculator!", "[Check] Since water is optically denser (n₂ > n₁), r < i (32° < 45°) ✓", "Answer: approximately 32°"], "elicit": [{"q": "Which law governs refraction at an interface?", "a": "Snell's Law: n₁ sin i = n₂ sin r."}, {"q": "Identify n₁, n₂, i in this problem.", "a": "n₁ = 1 (air), n₂ = 1.33 (water), i = 45°."}, {"q": "Light goes from air to water. Does it bend toward or away from the normal?", "a": "Toward the normal (water is optically denser, so light slows down and bends inward)."}, {"q": "Solve: n₁ sin i = n₂ sin r.", "a": "1 × sin 45° = 1.33 × sin r → sin r = 0.7071/1.33 = 0.532 → r = arcsin(0.532) ≈ 32°."}, {"q": "Common mistake to watch out for?", "a": "arcsin(0.532) ≠ 0.532. You MUST use a calculator to find arcsin!"}, {"q": "Final answer?", "a": "Approximately 32°."}]}, {"en": "Light enters glass (n = 1.5) from air. Refraction [折射] angle [折射角] = 25°. Find the angle of incidence.", "zh": "", "diff": "hard", "sol": ["[Identify] Given: glass n₂=1.5, air n₁=1, refraction angle r=25°. Find: incidence angle i.", "[Snell's Law] n₁ sin i = n₂ sin r.", "[Calculate] 1 × sin i = 1.5 × sin 25° → sin i = 1.5 × 0.4226 = 0.6339.", "i = arcsin(0.6339) ≈ 39.3°.", "[Common mistake] arcsin requires a calculator -- cannot estimate by eye.", "[Check] Light going from rarer (air) to denser (glass) bends toward normal: i (39°) > r (25°) ✓", "Answer: approximately 39°"], "elicit": [{"q": "What is known and what is unknown?", "a": "Known: n₁=1 (air), n₂=1.5 (glass), r=25°. Unknown: incidence angle i."}, {"q": "Apply Snell's Law.", "a": "1 × sin i = 1.5 × sin 25° → sin i = 1.5 × 0.4226 = 0.6339."}, {"q": "Find i.", "a": "i = arcsin(0.6339) ≈ 39.3°."}, {"q": "Final answer?", "a": "Approximately 39°."}]}]}]}, "Ch05_透镜": {"title": "第5章 透镜", "titleEn": "Ch05 Lenses", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "5.1 透镜基础", "en": "Types of Lenses & Fundamentals", "problems": [{"en": "A convex lens [凸透镜（中间厚、边缘薄的透镜，可会聚光线）] has focal length [焦距 f（焦点到光心的距离）] f = 20 cm. Object placed 60 cm from lens. Find image distance [像距 v（像到透镜的距离）].", "zh": "", "diff": "medium", "sol": ["[Identify] Given: convex lens f=20cm, object distance u=60cm. Find: image distance v.", "[Thin Lens Formula] 1/f = 1/u + 1/v.", "[Analysis] u=60cm > 2f=40cm → object beyond 2F → should form an inverted, reduced real image.", "[Calculate] 1/v = 1/f − 1/u = 1/20 − 1/60 = (3−1)/60 = 2/60 → v = 30 cm.", "[Check] f < v < 2f (20 < 30 < 40) -- consistent with reduced real image. ✓", "Answer: v = 30 cm (inverted, reduced real image)"], "elicit": [{"q": "Which formula connects f, u, and v?", "a": "The thin lens formula: 1/f = 1/u + 1/v."}, {"q": "Given f=20cm, u=60cm. Where is the object relative to 2F?", "a": "2F is at 40cm. Since u=60cm > 40cm, the object is beyond 2F."}, {"q": "What type of image forms when u > 2F?", "a": "Inverted, reduced real image (between F and 2F on the other side)."}, {"q": "Solve 1/f = 1/u + 1/v.", "a": "1/v = 1/20 − 1/60 = (3−1)/60 = 2/60 → v = 30 cm."}, {"q": "Final answer?", "a": "v = 30 cm (inverted, reduced real image)."}]}, {"en": "A convex lens [凸透镜] with f = 15 cm. Object is 10 cm from lens. Is the image real or virtual?", "zh": "", "diff": "hard", "sol": ["[Identify] Given: convex lens f=15cm, u=10cm (u < f). Determine: real or virtual image?", "[Convex Lens Rule] When u < f (object inside focal length), rays diverge -- no real intersection.", "[Analysis] u=10cm < f=15cm → object is between lens and focus.", "[Conclusion] Virtual image: upright, enlarged, on the same side as the object (magnifying glass principle).", "[Common mistake] A virtual image is NOT a 'non-existent' image -- it is formed by extensions of rays.", "[Check] Magnifying glass: u < f → you see a magnified, upright virtual image. ✓", "Answer: Virtual image (upright, enlarged)"], "elicit": [{"q": "Where is the object relative to the focal point?", "a": "u = 10 cm, f = 15 cm. Since u < f, the object is between the lens and the focal point."}, {"q": "What happens to rays from an object inside the focal length?", "a": "They diverge -- they never meet on the far side. So no real image can form."}, {"q": "What type of image does a convex lens produce when u < f?", "a": "A virtual image -- upright, enlarged, on the same side as the object (magnifying glass principle)."}, {"q": "Final answer?", "a": "Virtual image (upright, enlarged)."}]}, {"en": "A concave lens [凹透镜（中间薄、边缘厚的透镜，可发散光线）] has focal length [焦距 f（凹透镜 f 取负值）] f = −10 cm. Object is 20 cm away. Calculate image distance.", "zh": "", "diff": "hard", "sol": ["[Identify] Given: concave lens f=−10cm (f negative for concave), u=20cm. Find: image distance v.", "[Concave Lens Property] Always diverges rays -- always produces a virtual image (v is negative).", "[Thin Lens Formula] 1/f = 1/u + 1/v, with f negative for concave lens.", "[Calculate] 1/v = 1/f − 1/u = 1/(−10) − 1/20 = −0.1 − 0.05 = −0.15.", "v = −1/0.15 = −6.67 cm.", "[Interpretation] v < 0 means the image is on the same side as the object (virtual, upright, reduced).", "[Check] |v| < u (6.67 < 20) -- consistent with a reduced virtual image. ✓", "Answer: v = −6.67 cm (virtual image, same side as object)"], "elicit": [{"q": "What is the sign convention for a concave lens focal length?", "a": "Negative. Concave (diverging) lenses always have f < 0."}, {"q": "Can a concave lens produce a real image?", "a": "No! Concave lenses always diverge rays -- the extensions of diverging rays always meet on the object side → always virtual image."}, {"q": "Apply the lens formula: 1/f = 1/u + 1/v, with f=−10cm, u=20cm.", "a": "1/v = 1/(−10) − 1/20 = −0.1 − 0.05 = −0.15 → v = −6.67 cm."}, {"q": "What does v < 0 mean?", "a": "The image is on the same side as the object (virtual, upright, reduced)."}, {"q": "Final answer?", "a": "v = −6.67 cm (virtual image)."}]}]}, {"name": "5.2 透镜成像规律", "en": "Lens Imaging Rules", "problems": [{"en": "A convex lens [凸透镜] forms a real image [实像（倒立，可用光屏承接）] 3× the size of the object. f = 12 cm. Find u and v.", "zh": "", "diff": "challenge", "sol": ["[Identify] Given: convex lens f=12cm, magnification m=3 (real image 3× size). Find: u and v.", "[Magnification] m = v/u = 3 → v = 3u.", "[Apply Thin Lens Formula] 1/f = 1/u + 1/v = 1/u + 1/(3u) = 4/(3u).", "[Solve] 1/12 = 4/(3u) → 3u = 48 → u = 16 cm.", "[Then] v = 3 × 16 = 48 cm.", "[Check] u=16cm is between f and 2f (12<16<24) → should give enlarged real image ✓", "Answer: u = 16 cm, v = 48 cm"], "elicit": [{"q": "What does magnification m = 3 mean?", "a": "The image is 3 times the size of the object: m = v/u = 3 → v = 3u."}, {"q": "Combine with the lens formula: 1/f = 1/u + 1/v.", "a": "1/12 = 1/u + 1/(3u) = 4/(3u) → 3u = 48 → u = 16 cm."}, {"q": "Find v.", "a": "v = 3 × 16 = 48 cm."}, {"q": "Check: is u between f and 2F?", "a": "f=12, 2F=24. u=16 is between 12 and 24 → should give enlarged real image ✓ (v=48cm > 2F=24 ✓)."}, {"q": "Final answer?", "a": "u = 16 cm, v = 48 cm."}]}, {"en": "A 2-cm tall object is placed 10 cm from a convex lens [凸透镜] of f = 6 cm. Find image height [像高（所成像的高度）].", "zh": "", "diff": "medium", "sol": ["[Identify] Given: object height h₀=2cm, u=10cm, f=6cm. Find: image height h.", "[Step 1 -- Find image distance v] 1/v = 1/f − 1/u = 1/6 − 1/10 = (5−3)/30 = 2/30 → v = 15 cm.", "[Step 2 -- Find magnification] m = v/u = 15/10 = 1.5.", "[Step 3 -- Find image height] h = m × h₀ = 1.5 × 2 = 3 cm.", "[Note] m > 1 → enlarged image; v > u confirms enlargement.", "[Check] Object between f and 2f (6<10<12) → should be enlarged real image ✓", "Answer: 3 cm (inverted real image, height 3 cm)"], "elicit": [{"q": "Step 1: Find the image distance v using the lens formula.", "a": "1/v = 1/f − 1/u = 1/6 − 1/10 = (5−3)/30 = 2/30 → v = 15 cm."}, {"q": "Step 2: Find the magnification m.", "a": "m = v/u = 15/10 = 1.5."}, {"q": "Step 3: Find the image height.", "a": "h = m × h₀ = 1.5 × 2 = 3 cm."}, {"q": "What type of image is this?", "a": "Since u=10cm is between f=6 and 2F=12, it forms an enlarged real image (inverted, but height is positive as a magnitude)."}, {"q": "Final answer?", "a": "Image height = 3 cm."}]}]}]}, "Ch06_质量密度": {"title": "第6章 质量与密度", "titleEn": "Ch06 Mass and Density", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "6.1 密度计算", "en": "Density Calculations", "problems": [{"en": "A block of iron has V = 50 cm³ and ρ = 7.8 g/cm³. What is its mass [质量]?", "zh": "", "diff": "basic", "sol": ["[Identify] V = 50 cm³, ρ = 7.8 g/cm³. Find mass.", "[Formula] m = ρV = 7.8 × 50 = 390 g.", "Answer: 390 g"], "elicit": [{"q": "Density formula?", "a": "ρ = m / V → m = ρV."}, {"q": "Calculate.", "a": "7.8 × 50 = 390 g."}, {"q": "Final answer?", "a": "390 g"}]}, {"en": "A metal cube [立方体] of side 2 cm has mass 70 g. What is the density [密度] in kg/m³?", "zh": "", "diff": "medium", "sol": ["[Identify] cube side = 2 cm, m = 70 g. Find density in kg/m³.", "[Volume] V = 2³ = 8 cm³.", "[Density in g/cm³] ρ = 70 / 8 = 8.75 g/cm³.", "[Convert] 1 g/cm³ = 1000 kg/m³ → 8750 kg/m³.", "Answer: 8750 kg/m³"], "elicit": [{"q": "Volume of a cube?", "a": "V = side³ = 2³ = 8 cm³."}, {"q": "Density in g/cm³?", "a": "70 / 8 = 8.75 g/cm³."}, {"q": "Convert to kg/m³.", "a": "×1000 → 8750 kg/m³."}, {"q": "Final answer?", "a": "8750 kg/m³"}]}]}, {"name": "6.2 密度的应用", "en": "Density Applications", "problems": [{"en": "A bottle: empty mass 120 g, filled mass 320 g, volume 200 cm³. Density [密度] of the liquid [液体]?", "zh": "", "diff": "basic", "sol": ["[Identify] empty = 120 g, filled = 320 g, V = 200 cm³. Find liquid density.", "[Liquid mass] m = 320 − 120 = 200 g.", "[Density] ρ = 200 / 200 = 1.0 g/cm³.", "Answer: 1.0 g/cm³ (water)"], "elicit": [{"q": "How to get the liquid's mass?", "a": "Filled mass − empty mass = 320 − 120 = 200 g."}, {"q": "Density?", "a": "ρ = 200 / 200 = 1.0 g/cm³."}, {"q": "Final answer?", "a": "1.0 g/cm³ (water)"}]}, {"en": "An aluminum block (ρ = 2.7 g/cm³) has mass 540 g. What is its volume [体积]?", "zh": "", "diff": "basic", "sol": ["[Identify] ρ = 2.7 g/cm³, m = 540 g. Find volume.", "[Formula] V = m / ρ = 540 / 2.7 = 200 cm³.", "Answer: 200 cm³"], "elicit": [{"q": "Rearrange density formula for volume.", "a": "V = m / ρ."}, {"q": "Calculate.", "a": "540 / 2.7 = 200 cm³."}, {"q": "Final answer?", "a": "200 cm³"}]}, {"en": "A 200-g piece of gold (ρ = 19.3 g/cm³) and a 200-g piece of lead (ρ = 11.3 g/cm³). Which has larger volume [体积]?", "zh": "", "diff": "medium", "sol": ["[Identify] Gold m=200g ρ=19.3, Lead m=200g ρ=11.3. Compare volume.", "[Gold] V = 200/19.3 = 10.4 cm³.", "[Lead] V = 200/11.3 = 17.7 cm³.", "[Conclusion] Same mass → higher density = smaller volume. Gold is smaller.", "Answer: Gold volume = 10.4 cm³ < Lead = 17.7 cm³"], "elicit": [{"q": "Calculate gold volume.", "a": "V = 200 / 19.3 = 10.4 cm³."}, {"q": "Calculate lead volume.", "a": "V = 200 / 11.3 = 17.7 cm³."}, {"q": "Which is smaller? Why?", "a": "Gold (10.4 cm³) — same mass, higher density means smaller volume."}, {"q": "Final answer?", "a": "Gold = 10.4 cm³ < Lead = 17.7 cm³"}]}]}]}, "Ch07_力": {"title": "第7章 力", "titleEn": "Ch07 Force", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "7.1 力的合成", "en": "Force Composition", "problems": [{"en": "Two forces F₁ = 8 N and F₂ = 6 N act in the same direction. What is their resultant [合力（两个或多个力合并后的总效果）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: F1=8N, F2=6N, same direction. Find: resultant F.", "[Formula] Same direction: F = F1 + F2.", "[Substitute] F = 8 + 6 = 14 N.", "[Direction] Same direction as both forces.", "[Check] 14N > each force — maximum when same direction. ✓", "Answer: 14 N"], "elicit": [{"q": "What is the question asking us to find?", "a": "The resultant force F (the net combined effect of two forces)."}, {"q": "What is the relationship between the two forces?", "a": "They act in the same direction."}, {"q": "What formula applies when forces act in the same direction?", "a": "F = F1 + F2 (add them directly)."}, {"q": "Calculate.", "a": "F = 8 + 6 = 14 N"}, {"q": "Final answer?", "a": "14 N, in the same direction as both forces."}]}, {"en": "F₁ = 8 N and F₂ = 6 N act in opposite directions [反向（两力夹角180°）]. What is the resultant [合力]?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: F1=8N, F2=6N, opposite directions. Find: resultant F.", "[Formula] Opposite: F = |F1 - F2|, direction = direction of larger force.", "[Substitute] F = |8 - 6| = 2 N.", "[Direction] Same as the 8 N force.", "[Check] Only equal & opposite forces cancel to zero. Here they are not equal. ✓", "Answer: 2 N, in the direction of the 8 N force"], "elicit": [{"q": "What is the relationship between the two forces?", "a": "They act in opposite directions."}, {"q": "What formula applies?", "a": "F = |F1 - F2|, direction = direction of the larger force."}, {"q": "Calculate.", "a": "F = |8 - 6| = 2 N"}, {"q": "Direction of the resultant?", "a": "Same as the 8 N force (since 8N > 6N)."}, {"q": "When does the resultant equal zero?", "a": "Only when the two forces are equal in magnitude AND opposite in direction. Here they are not equal, so NOT zero."}, {"q": "Final answer?", "a": "2 N, in the direction of the 8 N force."}]}]}, {"name": "7.2 弹力", "en": "Elastic Force & Hooke's Law", "problems": [{"en": "A spring has natural length [自然长度（不加外力时的长度）] 20 cm. A 5-N weight stretches it to 25 cm. Find k.", "zh": "", "diff": "medium", "sol": ["[Identify] Given: natural length=20cm, F=5N, new length=25cm. Find: spring constant k.", "[Formula] Hooke's Law: F = k * x, where x is the extension (change in length).", "[Note] x is extension, NOT total length — common mistake!", "[Find x] x = 25 - 20 = 5 cm = 0.05 m (convert to metres for SI).", "[Substitute] k = F / x = 5 / 0.05 = 100 N/m.", "[Check] k = 100 N/m — 100 N stretches spring 1 m. ✓", "Answer: 100 N/m"], "elicit": [{"q": "What are we given and what are we asked to find?", "a": "Given: natural length=20cm, F=5N, new length=25cm. Find: spring constant k."}, {"q": "Which formula?", "a": "Hooke's Law: F = k * x, where x is the extension (change in length), NOT the total length."}, {"q": "Calculate the extension x (remember to convert units!).", "a": "x = 25 - 20 = 5 cm = 0.05 m (convert to metres for SI)."}, {"q": "Solve for k.", "a": "k = F / x = 5 / 0.05 = 100 N/m"}, {"q": "Final answer?", "a": "100 N/m"}]}, {"en": "A spring with k = 50 N/m is stretched by 12 cm. What force is exerted?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: k = 50 N/m, extension = 12 cm. Find: elastic force F.", "[Formula] F = k * x.", "[Unit check] x = 12 cm = 0.12 m (convert — k is in N/m).", "[Substitute] F = 50 * 0.12 = 6 N.", "[Check] 6 N stretches spring 12 cm — reasonable. ✓", "Answer: 6 N"], "elicit": [{"q": "Given: k = 50 N/m, extension = 12 cm. What are we finding?", "a": "The elastic force F exerted by the spring."}, {"q": "Which formula?", "a": "F = k * x"}, {"q": "Do we need to convert x? Why?", "a": "Yes! x = 12 cm = 0.12 m. Since k is in N/m, x must be in metres."}, {"q": "Calculate.", "a": "F = 50 * 0.12 = 6 N"}, {"q": "Final answer?", "a": "6 N"}]}]}, {"name": "7.3 重力", "en": "Gravity & Weight", "problems": [{"en": "An object of mass [质量 m（物体所含物质多少）] 12 kg on Earth (g = 10 m/s²). What is its weight [重力 W（地球表面物体受到的引力）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: mass = 12 kg, g = 10 m/s2. Find: weight W on Earth.", "[Formula] W = m * g.", "[Substitute] W = 12 * 10 = 120 N.", "[Note] Mass (kg) constant everywhere; weight (N) changes with g.", "[Check] Units: N = kg * m/s2 — correct SI. ✓", "Answer: 120 N"], "elicit": [{"q": "Given: mass = 12 kg, g = 10 m/s2. What are we finding?", "a": "The weight W on Earth."}, {"q": "What is the weight formula?", "a": "W = m * g"}, {"q": "Calculate.", "a": "W = 12 * 10 = 120 N"}, {"q": "Key difference: mass vs weight?", "a": "Mass (kg) is constant everywhere; weight (N) changes with the gravitational acceleration g."}, {"q": "Final answer?", "a": "120 N"}]}, {"en": "Same object on the Moon (g = 1.6 m/s²). What is its weight [重力 W（随星体g值变化）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: mass = 12 kg, g_moon = 1.6 m/s2. Find: weight on Moon.", "[Key] Mass is a property of the object — stays 12 kg everywhere.", "[Formula] W_moon = m * g_moon.", "[Substitute] W_moon = 12 * 1.6 = 19.2 N.", "[Check] ~1/6 of Earth weight. ✓", "Answer: 19.2 N"], "elicit": [{"q": "Given: mass = 12 kg, g_moon = 1.6 m/s2. What are we finding?", "a": "The weight W_moon on the Moon."}, {"q": "Does the mass change on the Moon?", "a": "No! Mass is a property of the object itself -- it stays 12 kg everywhere."}, {"q": "Calculate the Moon weight.", "a": "W_moon = 12 * 1.6 = 19.2 N"}, {"q": "How does this compare to Earth?", "a": "About 1/6 of Earth weight (Moon's g is ~1/6 of Earth's g)."}, {"q": "Final answer?", "a": "19.2 N"}]}, {"en": "A person weighs 600 N on Earth. What is their mass [质量 m（固有属性，各处不变）]? What is their weight [重力 W（随g值变化）] on the Moon?", "zh": "", "diff": "medium", "sol": ["[Identify] Given: weight on Earth = 600 N. Find: (1) mass; (2) weight on Moon.", "[Step 1] m = W / g = 600 / 10 = 60 kg.", "[Note] g on Earth = 10 m/s2 (standard textbook value).", "[Step 2] W_moon = 60 * 1.6 = 96 N.", "[Check] Mass stays 60 kg everywhere. ✓", "Answer: Mass = 60 kg; weight on Moon = 96 N"], "elicit": [{"q": "Given: weight on Earth = 600 N. What two things do we need to find?", "a": "(1) Mass m; (2) Weight on the Moon W_moon."}, {"q": "What value of g on Earth should we use?", "a": "g = 10 m/s2 (standard textbook value)."}, {"q": "Step 1 -- find the mass.", "a": "m = W / g = 600 / 10 = 60 kg"}, {"q": "Step 2 -- find Moon weight.", "a": "W_moon = 60 * 1.6 = 96 N"}, {"q": "Final answer?", "a": "Mass = 60 kg; weight on Moon = 96 N"}]}]}, {"name": "7.4 摩擦力", "en": "Friction", "problems": [{"en": "A 10-N block rests on a horizontal surface; μs = 0.4. Max static friction [静摩擦（物体未滑动时的摩擦）]?", "zh": "", "diff": "medium", "sol": ["[Identify] Given: weight=10N, coefficient of static friction=0.4, horizontal. Find: f_s(max).", "[Formula] f_s(max) = us * N.", "[Find N] On horizontal surface: N = weight = 10 N.", "[Substitute] f_s(max) = 0.4 * 10 = 4 N.", "[Note] Static friction varies: when F < f_s(max), friction = F (object stays at rest).", "[Check] 4 N < typical push force — reasonable. ✓", "Answer: 4 N"], "elicit": [{"q": "Given: weight = 10 N, coefficient of static friction = 0.4, on a horizontal surface. Find?", "a": "The maximum static friction force f_s(max)."}, {"q": "What is the formula for maximum static friction?", "a": "f_s(max) = us * N, where N is the normal force."}, {"q": "What is the normal force N on a horizontal surface?", "a": "N = weight = 10 N (balances the weight vertically)."}, {"q": "Calculate f_s(max).", "a": "f_s(max) = 0.4 * 10 = 4 N"}, {"q": "Is static friction a fixed value?", "a": "No! Static friction varies. As long as applied force F < f_s(max), actual friction exactly equals F (object stays at rest)."}, {"q": "Final answer?", "a": "4 N"}]}, {"en": "The same block slides; μk = 0.3. What is the kinetic friction [动摩擦（物体已滑动时的摩擦）] force?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: weight=10N, coefficient of kinetic friction=0.3, already sliding. Find: f_k.", "[Formula] f_k = uk * N.", "[Find N] N = weight = 10 N.", "[Substitute] f_k = 0.3 * 10 = 3 N.", "[Key point] us > uk: harder to start moving than to keep moving. f_k=3N < f_s(max)=4N — consistent.", "[Check] Friction drops once sliding — expected. ✓", "Answer: 3 N"], "elicit": [{"q": "Given: weight = 10 N, coefficient of kinetic friction = 0.3, object is already sliding. Find?", "a": "The kinetic friction force f_k."}, {"q": "Which formula?", "a": "f_k = uk * N"}, {"q": "What is N on a horizontal surface?", "a": "N = weight = 10 N"}, {"q": "Calculate.", "a": "f_k = 0.3 * 10 = 3 N"}, {"q": "Why is the answer less than maximum static friction (4 N)?", "a": "The static friction coefficient us is always larger than the kinetic friction coefficient uk. It takes more force to start moving than to keep moving."}, {"q": "Final answer?", "a": "3 N"}]}, {"en": "A 5-kg box is pushed with 30 N. μs = 0.5, μk = 0.2. Does it move? If so, what is its acceleration [加速度 a（速度变化快慢）]?", "zh": "", "diff": "challenge", "sol": ["[Identify] Given: m=5kg, push=30N, us=0.5, uk=0.2. Find: (1) moves? (2) acceleration a.", "[Step 1] Compare with f_s(max): N=mg=5*10=50N; f_s(max)=0.5*50=25N. Since 30N > 25N -> MOVES.", "[Step 2] Use kinetic friction: f_k = uk * N = 0.2 * 50 = 10 N.", "[Step 3] F_net = push - f_k = 30 - 10 = 20 N.", "[Step 4] a = F_net / m = 20 / 5 = 4 m/s2.", "[Note] Two-step: compare vs f_s(max) first, then use kinetic friction.", "[Check] a = 4 m/s2 > 0 -> confirmed moving. ✓", "Answer: Moves with a = 4 m/s2"], "elicit": [{"q": "Given: m = 5 kg, push = 30 N, us = 0.5, uk = 0.2. Find?", "a": "(1) Will it move? (2) If yes, what is the acceleration a?"}, {"q": "Step 1 -- determine if it moves. How?", "a": "Compare the push force with the maximum static friction f_s(max). If push > f_s(max) -- the object moves."}, {"q": "Find f_s(max). What is N?", "a": "N = mg = 5 * 10 = 50 N; f_s(max) = 0.5 * 50 = 25 N."}, {"q": "Compare: push = 30 N vs f_s(max) = 25 N.", "a": "30 > 25 -- the object DOES move."}, {"q": "Now that it is moving, which friction do we use?", "a": "Use kinetic friction f_k = uk * N (switch from static to kinetic friction)."}, {"q": "Calculate f_k.", "a": "f_k = 0.2 * 50 = 10 N"}, {"q": "Find the net force.", "a": "F_net = push - f_k = 30 - 10 = 20 N (in the push direction)."}, {"q": "Apply Newton's Second Law.", "a": "a = F_net / m = 20 / 5 = 4 m/s2"}, {"q": "Final answer?", "a": "The object moves with acceleration a = 4 m/s2."}]}]}, {"name": "7.5 牛顿运动定律", "en": "Newton's Laws", "problems": [{"en": "A 5-kg object has net force [合力 F_net（所有外力的矢量和）] 20 N. Acceleration?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: mass = 5 kg, net force = 20 N. Find: acceleration a.", "[Formula] a = F_net / m.", "[Substitute] a = 20 / 5 = 4 m/s2.", "[Direction] Same direction as the net force (20 N).", "[Check] a = 4 m/s2 -> reasonable for 5 kg acted on by 20 N. ✓", "Answer: 4 m/s2"], "elicit": [{"q": "Given: mass = 5 kg, net force = 20 N. Find?", "a": "Acceleration a."}, {"q": "Which formula?", "a": "F = m * a -> a = F / m."}, {"q": "Substitute.", "a": "a = 20 / 5 = 4 m/s2"}, {"q": "Direction of the acceleration?", "a": "Same direction as the net force (20 N)."}, {"q": "Final answer?", "a": "4 m/s2"}]}, {"en": "A 3-kg object accelerates at 5 m/s². Net force?", "zh": "", "diff": "basic", "sol": ["[Identify] Given: mass = 3 kg, acceleration = 5 m/s2. Find: net force F.", "[Formula] F_net = m * a.", "[Substitute] F_net = 3 * 5 = 15 N.", "[Unit check] 1 N = 1 kg * 1 m/s2 — consistent. ✓", "Answer: 15 N"], "elicit": [{"q": "Given: mass = 3 kg, acceleration = 5 m/s2. Find?", "a": "Net force F."}, {"q": "Which formula?", "a": "F = m * a"}, {"q": "Substitute.", "a": "F = 3 * 5 = 15 N"}, {"q": "Unit check.", "a": "1 N = 1 kg * 1 m/s2 -- consistent."}, {"q": "Final answer?", "a": "15 N"}]}, {"en": "A 2000-kg car accelerates from 0 to 20 m/s in 10 s. Average net force [合力 F_net]?", "zh": "", "diff": "medium", "sol": ["[Identify] Given: m=2000kg, v0=0, v=20m/s, t=10s. Find: average net force F.", "[Step 1] a = (v - v0) / t = (20-0)/10 = 2 m/s2.", "[Step 2] F_net = m * a = 2000 * 2 = 4000 N.", "[Check] 2000kg car at 2m/s2 needs ~4000N — large but reasonable.", "[Common mistake] Never use F = m*v/t directly. Always find a first. ✓", "Answer: 4000 N"], "elicit": [{"q": "Given: mass = 2000 kg, v0 = 0, v = 20 m/s, t = 10 s. Find?", "a": "Average net force F."}, {"q": "Can we use F = m*v/t directly?", "a": "No! Must first find acceleration a = (v - v0)/t, then apply F = m * a."}, {"q": "Step 1 -- find acceleration.", "a": "a = (20 - 0) / 10 = 2 m/s2"}, {"q": "Step 2 -- apply Newton's Second Law.", "a": "F = m * a = 2000 * 2 = 4000 N"}, {"q": "Physical check.", "a": "2000 kg car at 2 m/s2 needs ~4000 N -- large but reasonable."}, {"q": "Final answer?", "a": "4000 N"}]}, {"en": "A 50-kg person in an elevator feels weight [重力 W（地球表面的引力）] 600 N (on a scale). Is the elevator accelerating [加速（速度在变化）]? If so, how much?", "zh": "", "diff": "challenge", "sol": ["[Identify] Given: mass=50kg, scale reading=600N. Find: (1) accelerating? (2) a and direction.", "[Key insight] Scale reading = normal force N (apparent weight), NOT true weight.", "[Find true weight] True weight = mg = 50 * 10 = 500 N.", "[Compare] Scale (600N) > true weight (500N) -> N > mg -> net force is UPWARD.", "[Find net force] F_net = N - mg = 600 - 500 = 100 N (upward).", "[Find acceleration] a = F_net / m = 100 / 50 = 2 m/s2 upward.", "[Physical meaning] Elevator accelerating upward (or decelerating downward).", "[Common mistake] N > mg -> upward accel. N < mg -> downward accel. Scale does NOT read true weight during accel.", "Answer: Yes — accelerating upward at a = 2 m/s2"], "elicit": [{"q": "Given: mass = 50 kg, scale reading = 600 N. Find?", "a": "(1) Is the elevator accelerating? (2) What is a, and in which direction?"}, {"q": "What does the scale reading actually measure?", "a": "The normal force N from the floor -- the scale measures the support force, NOT the true weight."}, {"q": "Find the true weight on Earth.", "a": "True weight = mg = 50 * 10 = 500 N."}, {"q": "Compare: scale (600 N) vs true weight (500 N). Why is 600 > 500?", "a": "Normal force N (600 N) > mg (500 N) -- net force is upward."}, {"q": "Calculate the net force.", "a": "F_net = N - mg = 600 - 500 = 100 N (direction: upward)."}, {"q": "Calculate the acceleration.", "a": "a = F_net / m = 100 / 50 = 2 m/s2"}, {"q": "Physical meaning of a = 2 m/s2 upward?", "a": "Elevator accelerating upward (or decelerating while moving downward)."}, {"q": "Key principle.", "a": "When N > mg -> upward acceleration. When N < mg -> downward acceleration. Scale does NOT read true weight during acceleration."}, {"q": "Final answer?", "a": "Yes -- accelerating upward at a = 2 m/s2."}]}]}]}, "Ch08_压强": {"title": "第8章 压强", "titleEn": "Ch08 Pressure", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "8.1 压力与压强", "en": "Pressure", "problems": [{"en": "A 60-kg person stands on one foot [单脚（接触面积小）] (area [面积] = 150 cm²). Pressure [压强（单位面积上的力，p=F/A）] on floor? (g = 10 m/s²)", "zh": "", "diff": "medium", "sol": ["[Identify] m=60kg, A=150cm² (one foot), g=10. Find pressure on floor.", "[Step 1] Force = weight = mg = 60×10 = 600 N.", "[Step 2] Convert area: 150cm² = 0.015 m².", "[Step 3] p = F/A = 600/0.015 = 40000 Pa.", "[Note] Standing on one foot → smaller area → higher pressure than two feet.", "Answer: 4.0×10⁴ Pa"], "elicit": [{"q": "What force does the person exert on the floor?", "a": "Their weight: F = mg = 60 × 10 = 600 N."}, {"q": "Convert 150 cm² to m².", "a": "150 / 10000 = 0.015 m²."}, {"q": "Pressure formula?", "a": "p = F / A = 600 / 0.015 = 40000 Pa."}, {"q": "Why does standing on one foot matter?", "a": "Smaller contact area → higher pressure for the same weight."}, {"q": "Final answer?", "a": "4.0×10⁴ Pa"}]}, {"en": "A force of 500 N acts over an area of 0.25 m². Pressure [压强] in Pa [帕斯卡（压强单位，1 Pa = 1 N/m²）]?", "zh": "", "diff": "basic", "sol": ["[Identify] F=500N, A=0.25m². Find pressure in Pa.", "[Formula] p = F/A = 500/0.25 = 2000 Pa.", "Answer: 2000 Pa"], "elicit": [{"q": "Pressure formula?", "a": "p = F / A."}, {"q": "Calculate.", "a": "500 / 0.25 = 2000 Pa."}, {"q": "Final answer?", "a": "2000 Pa"}]}, {"en": "A knife blade [刀刃（很薄的切割边缘）] applies 100 N force over a 0.2-mm-wide, 10-cm-long edge [刀刃（接触线）]. Find pressure.", "zh": "", "diff": "hard", "sol": ["[Identify] F=100N, edge 0.2mm wide × 10cm long. Find pressure.", "[Area] A = 0.2mm × 10cm = 0.0002m × 0.1m = 2×10⁻⁵ m².", "[Pressure] p = 100 / (2×10⁻⁵) = 5×10⁶ Pa.", "[Key] Sharp edge → tiny area → huge pressure (cuts easily).", "Answer: 5×10⁶ Pa"], "elicit": [{"q": "Why is a knife able to cut?", "a": "The edge has a tiny contact area → enormous pressure for a small force."}, {"q": "Calculate the edge area.", "a": "A = 0.2mm × 10cm = 0.0002 × 0.1 = 2×10⁻⁵ m²."}, {"q": "Pressure?", "a": "p = 100 / (2×10⁻⁵) = 5×10⁶ Pa."}, {"q": "Final answer?", "a": "5×10⁶ Pa"}]}]}, {"name": "8.2 液体压强", "en": "Liquid Pressure", "problems": [{"en": "Water tank [水箱] is 3 m deep. Pressure at the bottom? (ρ = 1000 kg/m³, g = 10 m/s²)", "zh": "", "diff": "basic", "sol": ["[Identify] h=3m, ρ=1000, g=10. Find pressure at bottom.", "[Liquid pressure] p = ρgh = 1000×10×3 = 30000 Pa.", "[Note] Independent of tank shape/size — only depends on depth.", "Answer: 3.0×10⁴ Pa"], "elicit": [{"q": "Liquid pressure formula?", "a": "p = ρgh (depends only on depth, not container shape)."}, {"q": "Calculate.", "a": "1000 × 10 × 3 = 30000 Pa."}, {"q": "Final answer?", "a": "3.0×10⁴ Pa"}]}, {"en": "A diver [潜水员] is 8 m below the surface. What total pressure [总压强（大气压+液体压强）]? (p_atm = 1.0 × 10⁵ Pa)", "zh": "", "diff": "medium", "sol": ["[Identify] h=8m, ρ=1000, g=10, p_atm=1.0×10⁵ Pa. Find total pressure.", "[Liquid part] p_liquid = ρgh = 1000×10×8 = 80000 Pa.", "[Total] p = p_atm + p_liquid = 1.0×10⁵ + 8.0×10⁴ = 1.8×10⁵ Pa.", "Answer: 1.8×10⁵ Pa"], "elicit": [{"q": "What two pressures add up at depth?", "a": "Atmospheric pressure (on the surface) + liquid pressure (from the water column above)."}, {"q": "Liquid part?", "a": "ρgh = 1000 × 10 × 8 = 80000 Pa."}, {"q": "Total?", "a": "1.0×10⁵ + 8.0×10⁴ = 1.8×10⁵ Pa."}, {"q": "Final answer?", "a": "1.8×10⁵ Pa"}]}, {"en": "A U-tube [U形管（连通器）] contains water on one side. The other side is filled with oil [油（密度比水小）] (ρ = 800 kg/m³) to a height of 20 cm. What is the height difference between the water levels?", "zh": "", "diff": "challenge", "sol": ["[Identify] U-tube: water one side, oil (ρ_oil) other. h_water=20cm. Find h_oil.", "[Principle] At same horizontal level, pressure equal: ρ_w g h_w = ρ_oil g h_o.", "[Solve] h_oil = h_water × ρ_w / ρ_oil = 20 × 1000 / 800 = 25 cm.", "Answer: 25 cm"], "elicit": [{"q": "What principle connects the two sides of a U-tube?", "a": "At the same horizontal level, the pressure is equal in both arms."}, {"q": "Set up the equation.", "a": "ρ_water × g × h_water = ρ_oil × g × h_oil."}, {"q": "Solve for h_oil.", "a": "h_oil = h_water × ρ_water / ρ_oil = 20 × 1000 / 800 = 25 cm."}, {"q": "Final answer?", "a": "25 cm"}]}]}, {"name": "8.3 大气压强", "en": "Atmospheric Pressure", "problems": [{"en": "A barometer [气压计（测大气压）] uses mercury [水银（汞，密度大）] (ρ = 13600 kg/m³). p_atm = 1.0 × 10⁵ Pa. How high is the column?", "zh": "", "diff": "medium", "sol": ["[Identify] Mercury barometer, ρ=13600, p_atm=1.0×10⁵ Pa. Find height h.", "[Formula] p_atm = ρgh → h = p_atm/(ρg) = 1.0×10⁵ / (13600×10) = 0.735 m.", "Answer: 0.735 m (73.5 cm)"], "elicit": [{"q": "What does a mercury barometer measure?", "a": "Atmospheric pressure — the height of the mercury column it can support."}, {"q": "Formula?", "a": "p_atm = ρgh → h = p_atm / (ρg)."}, {"q": "Calculate.", "a": "h = 1.0×10⁵ / (13600 × 10) = 0.735 m."}, {"q": "Final answer?", "a": "0.735 m (73.5 cm)"}]}, {"en": "If water (ρ = 1000 kg/m³) were used instead of mercury [水银], how tall would the barometer need to be?", "zh": "", "diff": "hard", "sol": ["[Identify] Same p_atm but water (ρ=1000). Find height.", "[Formula] h = p_atm/(ρg) = 1.0×10⁵ / (1000×10) = 10 m.", "[Note] Water column 13.6× taller than mercury (since ρ ratio = 13.6).", "Answer: 10 m"], "elicit": [{"q": "Same atmospheric pressure, now with water. What changes?", "a": "Water is much less dense than mercury, so the column must be much taller."}, {"q": "Calculate height.", "a": "h = 1.0×10⁵ / (1000 × 10) = 10 m."}, {"q": "How much taller than mercury?", "a": "10 / 0.735 ≈ 13.6× taller (matching the density ratio)."}, {"q": "Final answer?", "a": "10 m"}]}]}]}, "Ch09_浮力": {"title": "第9章 浮力", "titleEn": "Ch09 Buoyancy", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "9.1 浮力的概念", "en": "Buoyant Force", "problems": [{"en": "A stone weighs 15 N in air and 10 N in water [水中重]. Buoyant force [浮力（液体对物体的向上托力）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Weight in air = 15N, in water = 10N. Find buoyant force.", "[Archimedes] Buoyant force = loss of weight in fluid = 15 − 10 = 5 N.", "Answer: 5 N"], "elicit": [{"q": "What is Archimedes' principle about weight loss?", "a": "Buoyant force = weight in air − weight in fluid."}, {"q": "Calculate.", "a": "15 − 10 = 5 N."}, {"q": "Final answer?", "a": "5 N"}]}, {"en": "An object floats [漂浮（浮在液面）] with 60% submerged [浸没（没入液体中）] (ρ_water = 1000 kg/m³). Density [密度] of object?", "zh": "", "diff": "medium", "sol": ["[Identify] Floats 60% submerged, ρ_water=1000. Find object density.", "[Floating condition] ρ_object / ρ_water = fraction submerged = 0.60.", "[Calculate] ρ_object = 0.60 × 1000 = 600 kg/m³.", "Answer: 600 kg/m³"], "elicit": [{"q": "For a floating object, what links its density to the fluid's?", "a": "Fraction submerged = ρ_object / ρ_fluid."}, {"q": "Calculate density.", "a": "ρ_object = 0.60 × 1000 = 600 kg/m³."}, {"q": "Final answer?", "a": "600 kg/m³"}]}, {"en": "A 2-kg object floats [漂浮] with 80% of its volume [体积] submerged [浸没]. Find the object's density.", "zh": "", "diff": "hard", "sol": ["[Identify] m=2kg floats 80% submerged. Find density.", "[Fraction submerged] 0.80 = ρ_object / ρ_water → ρ_object = 800 kg/m³.", "[Check with mass] V = m/ρ = 2/800 = 0.0025 m³; submerged V = 0.8×0.0025 = 0.002 m³; buoyant = ρ_w×V_sub×g = 1000×0.002×10 = 20N = mg ✓.", "Answer: 800 kg/m³"], "elicit": [{"q": "Same floating rule: fraction submerged = ρ_object / ρ_water.", "a": "0.80 = ρ_object / 1000 → ρ_object = 800 kg/m³."}, {"q": "Verify with mass (optional).", "a": "V = 2/800 = 0.0025 m³; submerged part gives buoyant = 1000×0.8×0.0025×10 = 20N = mg ✓."}, {"q": "Final answer?", "a": "800 kg/m³"}]}]}, {"name": "9.2 阿基米德原理", "en": "Archimedes' Principle", "problems": [{"en": "A 0.5-m³ object is completely submerged [浸没] in water. Buoyant force [浮力]? (g = 10 m/s²)", "zh": "", "diff": "medium", "sol": ["[Identify] V=0.5m³ fully submerged in water, g=10. Find buoyant force.", "[Archimedes] F_b = ρ_water × V × g = 1000 × 0.5 × 10 = 5000 N.", "Answer: 5000 N"], "elicit": [{"q": "Archimedes' principle for fully submerged object?", "a": "Buoyant force = weight of displaced fluid = ρ_fluid × V × g."}, {"q": "Calculate.", "a": "1000 × 0.5 × 10 = 5000 N."}, {"q": "Final answer?", "a": "5000 N"}]}, {"en": "A piece of wood [木头] (ρ = 600 kg/m³, V = 0.002 m³). Will it sink [下沉] or float [漂浮]?", "zh": "", "diff": "basic", "sol": ["[Identify] ρ_wood=600 < ρ_water=1000. V=0.002m³. Sink or float?", "[Rule] Object denser than fluid sinks; less dense floats.", "[Conclusion] 600 < 1000 → wood floats.", "Answer:
