 Floats"], "elicit": [{"q": "What determines sink or float?", "a": "Compare densities: denser than fluid → sinks; less dense → floats."}, {"q": "Apply here.", "a": "600 < 1000 → wood is less dense than water → floats."}, {"q": "Final answer?", "a": "Floats"}]}, {"en": "A 200-g iron nail [铁钉] (ρ = 7.8 g/cm³) is placed in mercury [水银（密度很大）] (ρ = 13.6 g/cm³). Will it sink or float? What fraction is submerged?", "zh": "", "diff": "challenge", "sol": ["[Identify] Iron nail ρ=7.8, mercury ρ=13.6. Sink or float?", "[Rule] Compare densities: 7.8 < 13.6 → nail is LESS dense than mercury.", "[Conclusion] Iron floats on mercury (like wood on water).", "Answer: Floats on mercury"], "elicit": [{"q": "Compare iron's density to mercury's.", "a": "Iron ρ=7.8, mercury ρ=13.6 → iron is LESS dense than mercury."}, {"q": "Conclusion?", "a": "Iron floats on mercury (just like wood floats on water)."}, {"q": "Final answer?", "a": "Floats on mercury"}]}]}]}, "Ch10_功和机械能": {"title": "第10章 功和机械能", "titleEn": "Ch10 Work and Energy", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "10.1 功的计算", "en": "Work", "problems": [{"en": "A force F = 50 N pushes a box 4 m along the floor. Work [功（力×沿力方向位移，W=Fs）] done?", "zh": "", "diff": "basic", "sol": ["[Identify] F=50N, s=4m along floor. Find work.", "[Formula] W = Fs = 50×4 = 200 J.", "Answer: 200 J"], "elicit": [{"q": "Work formula?", "a": "W = F × s (force × displacement in force direction)."}, {"q": "Calculate.", "a": "50 × 4 = 200 J."}, {"q": "Final answer?", "a": "200 J"}]}, {"en": "A person lifts [提起] a 10-kg backpack 1.5 m. Work against gravity [克服重力做功]? (g = 10 m/s²)", "zh": "", "diff": "basic", "sol": ["[Identify] m=10kg, h=1.5m, g=10. Work against gravity.", "[Formula] W = mgh = 10×10×1.5 = 150 J.", "Answer: 150 J"], "elicit": [{"q": "Work against gravity formula?", "a": "W = mgh."}, {"q": "Calculate.", "a": "10 × 10 × 1.5 = 150 J."}, {"q": "Final answer?", "a": "150 J"}]}, {"en": "A 20-N force acts at 30° to the horizontal, moving object 6 m. Work [功] done?", "zh": "", "diff": "medium", "sol": ["[Identify] F=20N at 30° to horizontal, s=6m. Find work.", "[Formula] W = F s cosθ = 20×6×cos30° = 120×0.866 = 104 J.", "Answer: 104 J"], "elicit": [{"q": "When force is at an angle, what part does work?", "a": "Only the component along motion: W = F s cosθ."}, {"q": "Calculate.", "a": "20 × 6 × cos30° = 120 × 0.866 = 104 J."}, {"q": "Final answer?", "a": "104 J"}]}]}, {"name": "10.2 功率", "en": "Power", "problems": [{"en": "A motor [电动机] lifts a 200-kg load 5 m in 10 s. Power [功率（单位时间做功，P=W/t）]? (g = 10 m/s²)", "zh": "", "diff": "medium", "sol": ["[Identify] m=200kg, h=5m, t=10s, g=10. Find power.", "[Work] W = mgh = 200×10×5 = 10000 J.", "[Power] P = W/t = 10000/10 = 1000 W = 1 kW.", "Answer: 1000 W (1 kW)"], "elicit": [{"q": "Work to lift the load?", "a": "W = mgh = 200 × 10 × 5 = 10000 J."}, {"q": "Power?", "a": "P = W/t = 10000/10 = 1000 W."}, {"q": "Final answer?", "a": "1000 W (1 kW)"}]}, {"en": "A car engine produces 60 kW at a speed of 20 m/s. Tractive force [牵引力（使车前进的力）]?", "zh": "", "diff": "hard", "sol": ["[Identify] P=60kW=60000W, v=20m/s. Find tractive force.", "[Formula] P = Fv → F = P/v = 60000/20 = 3000 N.", "Answer: 3000 N"], "elicit": [{"q": "Power, force, speed relation?", "a": "P = Fv (power = force × velocity)."}, {"q": "Solve for F.", "a": "F = P/v = 60000/20 = 3000 N."}, {"q": "Final answer?", "a": "3000 N"}]}]}, {"name": "10.3 动能", "en": "Kinetic Energy", "problems": [{"en": "A 2-kg ball moves at 5 m/s. KE [动能（运动能量，½mv²）]?", "zh": "", "diff": "basic", "sol": ["[Identify] m=2kg, v=5m/s. Find KE.", "[Formula] KE = ½mv² = ½×2×25 = 25 J.", "Answer: 25 J"], "elicit": [{"q": "Kinetic energy formula?", "a": "KE = ½mv²."}, {"q": "Calculate.", "a": "½ × 2 × 25 = 25 J."}, {"q": "Final answer?", "a": "25 J"}]}, {"en": "A 1000-kg car at 20 m/s brakes [刹车] to a stop. Work done by brakes [刹车] [刹车做的功（转化为热）]?", "zh": "", "diff": "medium", "sol": ["[Identify] m=1000kg, v=20m/s → stop. Work by brakes.", "[Energy] Brakes remove all KE: W = ½mv² = ½×1000×400 = 200000 J.", "Answer: 2.0×10⁵ J"], "elicit": [{"q": "What does braking do to the car's energy?", "a": "Removes all kinetic energy (converts it to heat)."}, {"q": "Work = initial KE.", "a": "½ × 1000 × 20² = 200000 J."}, {"q": "Final answer?", "a": "2.0×10⁵ J"}]}]}, {"name": "10.4 势能", "en": "Potential Energy", "problems": [{"en": "A 3-kg mass raised [被举高] 4 m. Gravitational PE [重力势能（mgh）]? (g = 10 m/s²)", "zh": "", "diff": "basic", "sol": ["[Identify] m=3kg, h=4m, g=10. Gravitational PE.", "[Formula] PE = mgh = 3×10×4 = 120 J.", "Answer: 120 J"], "elicit": [{"q": "Gravitational PE formula?", "a": "PE = mgh."}, {"q": "Calculate.", "a": "3 × 10 × 4 = 120 J."}, {"q": "Final answer?", "a": "120 J"}]}, {"en": "A spring [弹簧] with k = 200 N/m compressed [压缩] by 0.1 m. Elastic PE [弹性势能（½kx²）]?", "zh": "", "diff": "medium", "sol": ["[Identify] k=200N/m, x=0.1m compressed. Elastic PE.", "[Formula] PE = ½kx² = ½×200×0.01 = 1 J.", "Answer: 1 J"], "elicit": [{"q": "Elastic PE formula?", "a": "PE = ½kx²."}, {"q": "Calculate.", "a": "½ × 200 × 0.1² = 1 J."}, {"q": "Final answer?", "a": "1 J"}]}]}, {"name": "10.5 机械能守恒", "en": "Conservation of Mechanical Energy", "problems": [{"en": "A 1-kg ball is dropped [自由下落] from 5 m. Speed just before ground [落地前瞬间速度]? (g = 10 m/s²)", "zh": "", "diff": "medium", "sol": ["[Identify] m=1kg dropped from h=5m, g=10. Speed at ground.", "[Energy conservation] mgh = ½mv² → v = √(2gh) = √(2×10×5) = 10 m/s.", "Answer: 10 m/s"], "elicit": [{"q": "Use energy conservation: PE at top = KE at bottom.", "a": "mgh = ½mv² → v = √(2gh)."}, {"q": "Calculate.", "a": "√(2×10×5) = √100 = 10 m/s."}, {"q": "Final answer?", "a": "10 m/s"}]}, {"en": "A pendulum [摆] bob of mass 0.5 kg swings from height [高度] 0.4 m to lowest point. Max KE [最大动能（最低点）]?", "zh": "", "diff": "medium", "sol": ["[Identify] m=0.5kg, h=0.4m to lowest point. Max KE.", "[Conservation] Max KE = loss of PE = mgh = 0.5×10×0.4 = 2 J.", "Answer: 2 J"], "elicit": [{"q": "At the lowest point, all PE has become KE. Max KE = ?", "a": "PE lost = mgh = 0.5 × 10 × 0.4 = 2 J."}, {"q": "Final answer?", "a": "2 J"}]}, {"en": "A 0.5-kg rollercoaster [过山车] car has speed 10 m/s at the top of a 20-m hill. Speed at the bottom of a 10-m valley? (ignore friction, g = 10 m/s²)", "zh": "", "diff": "challenge", "sol": ["[Identify] m=0.5kg, v_top=10m/s at h=20m hill. Speed at bottom.", "[Total energy top] E = ½mv² + mgh = ½×0.5×100 + 0.5×10×20 = 25 + 100 = 125 J.", "[At bottom] all KE: ½mv_bottom² = 125 → v_bottom² = 500 → v = 22.4 m/s.", "Answer: 22.4 m/s"], "elicit": [{"q": "Total mechanical energy at the top?", "a": "E = ½mv² + mgh = ½×0.5×100 + 0.5×10×20 = 25 + 100 = 125 J."}, {"q": "At the bottom, all energy is KE.", "a": "½mv_bottom² = 125 → v_bottom² = 500 → v = 22.4 m/s."}, {"q": "Final answer?", "a": "22.4 m/s"}]}]}]}, "Ch11_简单机械": {"title": "第11章 简单机械", "titleEn": "Ch11 Simple Machines", "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。", "subtopics": [{"name": "11.1 杠杆", "en": "Levers", "problems": [{"en": "A lever [杠杆] has a fulcrum [支点（杠杆绕其转动的点）] at midpoint. Load [阻力（被撬动的重物）] = 40 N at 0.2 m from fulcrum [支点（杠杆绕其转动的点）]. Force needed at 0.5 m?", "zh": "", "diff": "medium", "sol": ["[Identify] Fulcrum at midpoint. Load=40N at 0.2m. Effort at 0.8m (other half). Find effort.", "[Balance] Effort × d_e = Load × d_l → E × 0.8 = 40 × 0.2.", "[Solve] E = 8/0.8 = 10 N.", "Answer: 10 N"], "elicit": [{"q": "Balance condition for a lever?", "a": "Effort × effort-arm = Load × load-arm (clockwise = counterclockwise moments)."}, {"q": "Set up equation.", "a": "E × 0.8 = 40 × 0.2."}, {"q": "Solve.", "a": "E = 8 / 0.8 = 10 N."}, {"q": "Final answer?", "a": "10 N"}]}, {"en": "A wheelbarrow [独轮车（杠杆类）]: load 200 N, effort distance 1.5 m, load distance 0.3 m. Mechanical advantage [机械效益（MA=阻力/动力）]?", "zh": "", "diff": "basic", "sol": ["[Identify] Load=200N, effort arm=1.5m, load arm=0.3m. Find MA.", "[Formula] MA = effort arm / load arm = 1.5/0.3 = 5.", "Answer: 5"], "elicit": [{"q": "Mechanical advantage formula for a lever?", "a": "MA = effort-arm / load-arm."}, {"q": "Calculate.", "a": "1.5 / 0.3 = 5."}, {"q": "Final answer?", "a": "5"}]}, {"en": "A 50-N load [阻力] is 0.3 m from the fulcrum. What effort [动力] at 1.2 m is needed to balance [平衡]?", "zh": "", "diff": "basic", "sol": ["[Identify] Load=50N at 0.3m. Effort at 1.2m. Find effort to balance.", "[Balance] E × 1.2 = 50 × 0.3 → E = 15/1.2 = 12.5 N.", "Answer: 12.5 N"], "elicit": [{"q": "Balance: E × d_e = Load × d_l.", "a": "E × 1.2 = 50 × 0.3."}, {"q": "Solve.", "a": "E = 15 / 1.2 = 12.5 N."}, {"q": "Final answer?", "a": "12.5 N"}]}]}, {"name": "11.2 滑轮", "en": "Pulleys", "problems": [{"en": "A fixed pulley [定滑轮（改变力的方向）] has radius 10 cm. Mechanical advantage [机械效益]?", "zh": "", "diff": "basic", "sol": ["[Identify] Fixed pulley. Find MA.", "[Property] Fixed pulley only changes direction, MA = 1.", "Answer: 1"], "elicit": [{"q": "What does a fixed pulley do?", "a": "Changes the direction of the force — you pull down to lift up. But MA = 1."}, {"q": "Final answer?", "a": "MA = 1"}]}, {"en": "A movable pulley [动滑轮（省力）] supports 200 N load. Effort [动力] required (neglect friction)?", "zh": "", "diff": "medium", "sol": ["[Identify] Movable pulley supports 200N load. Find effort (ideal).", "[Property] Movable pulley splits load between 2 rope segments → E = 200/2 = 100 N.", "Answer: 100 N"], "elicit": [{"q": "How many rope segments support the load in a movable pulley?", "a": "Two (the load hangs from the pulley, supported by 2 rope parts)."}, {"q": "Effort?", "a": "E = Load / 2 = 200 / 2 = 100 N."}, {"q": "Final answer?", "a": "100 N"}]}, {"en": "A block and tackle [滑轮组] has 4 supporting rope segments [承重绳段数]. Ideal MA [理想机械效益]?", "zh": "", "diff": "medium", "sol": ["[Identify] Block and tackle, 4 supporting segments. Ideal MA.", "[Rule] Ideal MA = number of supporting rope segments = 4.", "Answer: 4"], "elicit": [{"q": "Ideal MA of a block and tackle = ?", "a": "Number of rope segments supporting the load (4 here)."}, {"q": "Final answer?", "a": "4"}]}]}, {"name": "11.3 斜面与机械效率", "en": "Inclined Planes & Efficiency", "problems": [{"en": "A ramp [斜面（斜坡）] is 6 m long, 1.5 m high. A 300-N box is pushed. Ideal MA [理想机械效益]?", "zh": "", "diff": "basic", "sol": ["[Identify] Ramp L=6m, H=1.5m. Ideal MA.", "[Formula] MA = length/height = 6/1.5 = 4.", "Answer: 4"], "elicit": [{"q": "Ideal MA of a ramp?", "a": "MA = length / height."}, {"q": "Calculate.", "a": "6 / 1.5 = 4."}, {"q": "Final answer?", "a": "4"}]}, {"en": "With the same ramp, what minimum force [最小推力（忽略摩擦）] is needed?", "zh": "", "diff": "basic", "sol": ["[Identify] Same ramp, load=300N. Minimum force (ideal).", "[Formula] F = Load / MA = 300/4 = 75 N.", "Answer: 75 N"], "elicit": [{"q": "Minimum force on an ideal ramp?", "a": "F = Load / MA = 300 / 4 = 75 N."}, {"q": "Final answer?", "a": "75 N"}]}, {"en": "An actual ramp requires 100 N to push the 300-N box. What is the efficiency [效率（有用功/总功）]?", "zh": "", "diff": "hard", "sol": ["[Identify] Actual force=100N for 300N load. Find efficiency.", "[Ideal force] 75 N (from Q8).", "[Efficiency] η = (ideal/actual) × 100% = (75/100)×100% = 75%.", "Answer: 75%"], "elicit": [{"q": "Ideal force (no friction) from Q8?", "a": "75 N."}, {"q": "Efficiency formula?", "a": "η = (ideal force / actual force) × 100%."}, {"q": "Calculate.", "a": "(75 / 100) × 100% = 75%."}, {"q": "Final answer?", "a": "75%"}]}]}]}};


function getParams() {
  var qs = window.location.search.replace(/^\?/, '');
  var pairs = qs.length ? qs.split('&') : [];
  for (var i = 0; i < pairs.length; i++) {
    if (!pairs[i]) continue;
    var kv = pairs[i].split('=');
    if (decodeURIComponent(kv[0]) === 'ch') return decodeURIComponent(kv[1] || '');
  }
  return null;
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function initElicit(qid, total) {
  var wrap = document.getElementById('ew-' + qid);
  if (!wrap) return;
  wrap.dataset.step = '0';
  wrap.dataset.total = total;
  // Hide finish box
  var finish = wrap.querySelector('.elicit-finish');
  if (finish) finish.classList.remove('revealed');
  showStep(qid, 0);
}

function showStep(qid, step) {
  var wrap = document.getElementById('ew-' + qid);
  if (!wrap) return;
  var total = parseInt(wrap.dataset.total);
  var items = wrap.querySelectorAll('.elicit-step-item');
  var prevBtn = wrap.querySelector('.elicit-prev-btn');
  var nextBtn = wrap.querySelector('.elicit-next-btn');
  var finish = wrap.querySelector('.elicit-finish');

  // Hide all steps (answers hidden in elicitation — use Solution button for that)
  items.forEach(function(it){ it.classList.remove('active'); });
  // Hide finish
  if (finish) finish.classList.remove('revealed');

  if (step < total) {
    // Show all steps up to and including current step (answers stay hidden)
    for (var i = 0; i <= step; i++) {
      if (items[i]) items[i].classList.add('active');
    }
    // Prev button: hide at step 0, show otherwise
    if (prevBtn) prevBtn.style.display = (step > 0) ? 'inline-flex' : 'none';
    // Next button: hide at last step
    if (nextBtn) nextBtn.style.display = (step < total - 1) ? 'inline-flex' : 'none';
    // Update Next button label with current step number
    if (nextBtn) nextBtn.textContent = step < total - 1
      ? '\u25b6 Step ' + (step + 2) + ' of ' + total + ' \u25b6'
      : '\u2705 Finish';
  } else {
    // All done — show finish box
    if (finish) finish.classList.add('revealed');
    if (prevBtn) prevBtn.style.display = 'none';
    if (nextBtn) nextBtn.style.display = 'none';
  }

  wrap.dataset.step = step;
  if (items[step]) items[step].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextStep(qid) {
  var wrap = document.getElementById('ew-' + qid);
  if (!wrap) return;
  var step = parseInt(wrap.dataset.step);
  var total = parseInt(wrap.dataset.total);
  showStep(qid, step + 1);
}

function prevStep(qid) {
  var wrap = document.getElementById('ew-' + qid);
  if (!wrap) return;
  var step = parseInt(wrap.dataset.step);
  if (step > 0) showStep(qid, step - 1);
}

function togSol(qid) {
  var box = document.getElementById('sl-' + qid);
  if (!box) return;
  var open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  var btn = document.getElementById('sol-btn-' + qid);
  if (btn) { btn.textContent = open ? '✔ Solution' : '✔ Hide'; btn.classList.toggle('open', !open); }
  if (!open) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function submitAns(ch, qi, qid) {
  var inp = document.getElementById('in-' + qid);
  var btn = document.getElementById('sub-' + qid);
  if (!inp || !btn) return;
  var v = inp.value.trim();
  if (!v) return;
  localStorage.setItem('ans_' + ch + '_' + qi, v);
  btn.textContent = '✓ Saved!';
  btn.classList.add('saved');
}

function getCh() {
  var ch = getParams();
  var c = document.getElementById('content');
  if (!ch) {
    var h = '<h1>\ud83d\udcda Physics Practice</h1><p style="color:#666;font-size:15px;margin-top:4px;">Khan Academy 8th Grade \u2014 11 Chapters</p><div class="ch-grid">';
    for (var key in window.PRACTICE) {
      var d = window.PRACTICE[key];
      var qc = 0;
      d.subtopics.forEach(function(st){ qc += st.problems.length; });
      h += '<a class="ch-card" href="?ch=' + encodeURIComponent(key) + '">';
      h += '<div class="ch-card-num">' + d.title.split(' ')[0] + '</div>';
      h += '<div class="ch-card-title">' + escapeHtml(d.title) + '</div>';
      h += '<div class="ch-card-titleEn">' + escapeHtml(d.titleEn) + '</div>';
      h += '<div class="ch-card-note">' + escapeHtml(d.note) + '</div>';
      h += '<div class="ch-card-prac">' + qc + ' questions</div></a>';
    }
    h += '</div>';
    c.innerHTML = h;
    return;
  }
  var d = window.PRACTICE[ch];
  if (!d) { c.innerHTML = '<p>Chapter not found.</p>'; return; }
  var h = '<div class="ch-banner"><div><div class="ch-title">' + escapeHtml(d.title) + '</div><div class="ch-titleEn">' + escapeHtml(d.titleEn) + '</div></div>';
  h += '<a class="ch-banner-back" href="../index.html">&larr; Home</a>';
  h += '<a class="ch-banner-back" href="?">&larr; All Chapters</a></div>';
  d.subtopics.forEach(function(st, si) {
    h += '<div class="st-label">' + escapeHtml(st.name) + '</div>';
    st.problems.forEach(function(p, pi) {
      var qi = si + '_' + pi;
      var qid = 'q-' + ch + '-' + qi;
      var dc = 'diff-' + (p.diff || 'basic');
      h += '<div class="question" id="sq-' + qid + '">';
      h += '<div class="q-meta"><span class="diff-badge ' + dc + '">' + (p.diff||'basic') + '</span><span class="q-num">Q' + (pi+1) + '</span></div>';
      h += '<div class="q-text">' + escapeHtml(p.en) + '</div>';
      h += '<div class="answer-row">';
      h += '<input class="answer-input" id="in-' + qid + '" type="text" placeholder="Type your answer here..." onkeydown="if(event.keyCode===13)submitAns(\'' + ch + '\',\'' + qi + '\',\'' + qid + '\')">';
      h += '<button class="submit-btn" id="sub-' + qid + '" onclick="submitAns(\'' + ch + '\',\'' + qi + '\',\'' + qid + '\')">Submit</button></div>';
      var el = p.elicit || (p.sol||[]).map(function(s){ return {q:s,a:'',hint:''}; });
      if (el.length) {
        h += '<div class="elicit-wrap" id="ew-' + qid + '">';
        h += '<button class="elicit-hint-btn" id="eh-btn-' + qid + '" onclick="initElicit(\'' + qid + '\',' + el.length + ')">\u2728 Show Hint 1 / Next</button>';
        h += '<div class="elicit-steps">';
        el.forEach(function(item, ei) {
          h += '<div class="elicit-step-item" id="es-' + qid + '-' + ei + '">';
          h += '<div class="elicit-step-q"><span class="elicit-step-num">' + (ei+1) + '</span>' + escapeHtml(item.q) + '</div>';
          if (item.a) h += '<div class="elicit-step-a" style="display:none;" id="ea-' + qid + '-' + ei + '">' + escapeHtml(item.a) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '<div class="elicit-btn-row">';
        h += '<button class="elicit-prev-btn" id="ep-' + qid + '" onclick="prevStep(\'' + qid + '\')" style="display:none;">\u2b05 Prev</button>';
        h += '<button class="elicit-next-btn" id="en-' + qid + '" onclick="nextStep(\'' + qid + '\')">\u25b6 Step 2 of ' + el.length + ' \u25b6</button>';
        h += '</div>';;
        h += '<div class="elicit-finish" id="ef-' + qid + '">';
        h += '<div class="elicit-final-label">\u2705 All Steps Done — Ready to Solve?</div>';
        h += '<div class="elicit-final-text">Work through the question step by step. When you\'re done, check your answer in the Solution box below.</div>';
        h += '</div></div>';
      }
      if (p.sol && p.sol.length) {
        h += '<button class="sol-btn" id="sol-btn-' + qid + '" onclick="togSol(\'' + qid + '\')">\u2714 Solution</button>';
        h += '<div class="sol-box" id="sl-' + qid + '" style="display:none;">';
        p.sol.forEach(function(s){ h += '<div class="sol-step">' + escapeHtml(s) + '</div>'; });
        h += '</div>';
      }
      h += '</div>';
    });
  });
  c.innerHTML = h;
}
getCh();

</script>
