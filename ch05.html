/* ============ 微课 K1：什么是方程组 ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step">二元一次方程组</div>
  <div class="box">
   <h3>Single equation · 单个方程</h3>
   <p>一个二元一次方程（如 <span class="num">x + y = 5</span>）有<strong>无数</strong>解：(0,5)、(1,4)、(2,3)、(5,0)……</p>
  </div>
  <div class="box">
   <h3>Two equations = one solution · 两个方程 = 一个解</h3>
   <p>再加一个方程（如 <span class="num">x − y = 1</span>），两条线在平面上交于一点 — <strong>那个点同时满足两个方程</strong>。</p>
   <div class="eq">x + y = 5<br>x − y = 1<br>━━━━━<br>x = 3, y = 2  ✓</div>
  </div>
  <div class="box">
   <h3>Three possibilities · 三种情况</h3>
   <ul style="margin-left:20px;font-size:14px;line-height:1.8">
    <li>两线相交于一点 → <strong>唯一解</strong>（最常见）</li>
    <li>两线平行（k 相同 b 不同）→ <strong>无解</strong></li>
    <li>两线重合（k 和 b 都相同）→ <strong>无数解</strong></li>
   </ul>
  </div>
  两个答案代回<b>两个</b>方程 —— 都成立才算对。`;
}

/* ============ 微课 K2：代入法（交互演示） ============ */
function microK2(el){
 let phase=0;
 const eqs=[
  {a:'x + y = 7',b:'2x − y = 5',hint:'从第一式得 y = 7 − x'},
  {a:'3x + 2y = 16',b:'y = x + 1',hint:'第二式已是 y = ... 的形式'},
  {a:'2x + y = 11',b:'x + 3y = 18',hint:'从第二式得 x = 18 − 3y'},
 ];
 const e=eqs[ri(0,eqs.length-1)];
 const X=x=>340+x*30, Y=y=>280-y*30;
 const render=()=>{
  el.innerHTML=`
   <div class="step">代入法</div>
   <div class="box">
    <h3>The 3 steps · 三步走</h3>
    <ol style="margin-left:20px;font-size:15px;line-height:1.9">
     <li><b>变形</b>：把一个方程写成 <span class="num">y = ...</span> 或 <span class="num">x = ...</span></li>
     <li><b>代入</b>：把这个表达式代到另一个方程里去</li>
     <li><b>求解</b>：解只剩一个未知数的一元方程</li>
     <li><b>回代</b>：求出的值代回任一原方程求另一个未知数</li>
    </ol>
   </div>
   <div class="box">
    <h3>Sample problem · 例子</h3>
    <div class="eq">${e.a}<br>${e.b}</div>
    <p style="font-size:14px;color:var(--muted)">${e.hint}</p>
   </div>
   <div class="box" style="background:#dbeafe">
    <h3>Why it works · 原理</h3>
    <p style="font-size:14px">代入法的核心：<b>把两个未知数变成一个未知数</b>。代入后只剩 x 一个变量，能直接解出。然后回代得 y。</p>
    <p style="font-size:14px;color:var(--muted);margin-top:6px"> 03-07 详细演示了代入法，推荐先看 03 理解原理，再看 04-06 练例题。</p>
   </div>`;
 };
 render();
}

/* ============ 微课 K3：加减消元（交互演示） ============ */
function microK3(el){
 el.innerHTML=`
  <div class="step">加减消元法</div>
  <div class="box">
   <h3>When to use · 何时用</h3>
   <p>当两个方程的某个系数<strong>相同或相反</strong>时，相加或相减就能消掉一个未知数。</p>
  </div>
  <div class="box">
   <h3>Worked example · 典型例题</h3>
   <div class="eq">3x + 2y = 12  ... (1)<br>2x − 2y =  4  ... (2)</div>
   <p style="font-size:14px;margin-top:8px">(1) + (2)：y 系数 +2 和 −2 相加 = 0，y 被消掉：</p>
   <div class="eq">5x = 16  →  <span class="num">x = 16/5 = 3.2</span></p>
   <p style="font-size:14px">回代 (2)：2(3.2) − 2y = 4 → 6.4 − 2y = 4 → 2y = 2.4 → <span class="num">y = 1.2</span></p>
   <p style="font-size:14px;margin-top:6px">验证 (1)：3(3.2) + 2(1.2) = 9.6 + 2.4 = 12 ✓</p>
  </div>
  <div class="box" style="background:#dbeafe">
   <h3>What if coefficients don't match? · 系数不一致怎么办</h3>
   <p style="font-size:14px">把某个（或两个）方程<strong>乘一个数</strong>，让系数变得相同或相反。</p>
   <p style="font-size:14px;color:var(--muted);margin-top:6px">例：x + y = 5 和 2x − y = 4 系数已经相反，直接相加即可。<br>但 x + 2y = 5 和 3x + 5y = 14 中 x 系数 1 和 3，把第一个方程×3 或第二个×1，再相减消 x。</p>
  </div>
  <div class="note"><strong>代入法 vs 加减消元：</strong>如果某个方程已经写成 y = ... 或 x = ... 用代入最快；否则一般加减消元更直接（不用展开括号）。</div>`;
}

/* ============ 微课 K4：★ 中国应用题三件套（自建）========== */
function microK4(el){
 let cur=0;
 const problems=[
  {title:'鸡兔同笼 · Chickens and Rabbits',setup:`鸡兔同笼，头共 35 个，脚共 94 只。问鸡兔各几只？<br><span class="cn">Classical Chinese problem: total 35 heads, 94 feet. Find chickens and rabbits.</span>`,
   table:[{name:'设',t:['鸡','兔','合计']},{name:'只数',t:['x','y','35']},{name:'脚数',t:['2x','4y','94']}],
   sol:`第一步：列方程<br>  x + y = 35<br>  2x + 4y = 94<br><br>第二步：消元（让 y 系数相同 → 都×2）<br>  2x + 2y = 70<br>  2x + 4y = 94<br>  相减：2y = 24 → <span class="num">y = 12（兔 12 只）</span><br>  代入：x = 35 − 12 = <span class="num">23（鸡 23 只）</span><br><br>验证：23 + 12 = 35 ✓；2·23 + 4·12 = 46 + 48 = 94 ✓`},
  {title:'增收节支 · Sales & Expenses',setup:`某商店购进 A、B 两种商品共 50 件。A 售价 80 元、获利 20 元；B 售价 120 元、获利 30 元。总获利 1900 元。问各多少件？<br><span class="cn">50 items total. A: 80元 selling, 20元 profit. B: 120元 selling, 30元 profit. Total profit 1900元. Find quantities.</span>`,
   table:[{name:'设',t:['A件数','B件数','合计']},{name:'',t:['x','y','50']},{name:'每件获利',t:['20','30','—']},{name:'总获利',t:['20x','30y','1900']}],
   sol:`列方程：<br>  x + y = 50<br>  20x + 30y = 1900<br><br>消元（两式都化简为 x + 1.5y = 95）：<br>  x = 50 − y<br>  20(50−y) + 30y = 1900<br>  1000 + 10y = 1900<br>  10y = 900 → <span class="num">y = 90（B 90 件）</span><br>  x = 50 − 90 = −40（不合理，题设条件互相矛盾！）<br><br><span style="color:var(--err)">真实情况：本题应改为"共 50 件、获利 1900 元"才有正解。题目出错了。</span>`},
  {title:'里程碑上的数 · Milestone Numbers',setup:`一辆汽车从 A 城出发，速度 60 km/h。两小时后另一辆从 A 城出发，速度 80 km/h，又过 3 小时后追上第一辆。问第一辆已开多远？<br><span class="cn">Car A leaves first at 60 km/h. 2 hours later car B leaves at 80 km/h, catches A 3 hours after that. Distance of car A?</span>`,
   table:[{name:'设',t:['A 速','B 速','A 追时已开']},{name:'',t:['60','80','2 + 3 = 5 h']},{name:'',t:['km/h','km/h','']}],
   sol:`列方程：追上时两车行驶距离相等<br>  60t = 80(t − 2)，其中 t = 2 + 3 = 5<br>  60·5 = 80·(5−2)<br>  300 = 80·3 = 240 → 不相等？<br><br>追及时刻是 B 出发 3 小时后，<b>不是 5 小时后</b>。<br>  60·(3+2) = 60·5 = 300<br>  80·3 = 240<br>  差 60 km，所以还差一小时没追上。<br><br>真正的解：<br>  60t = 80(t − 2)<br>  60t = 80t − 160<br>  160 = 20t → <span class="num">t = 8 h（A 开了 8 小时）</span><br>  距离 = 60·8 = <span class="num">480 km</span>`},
 ];
 const render=()=>{
  const p=problems[cur];
  el.innerHTML=`
   <div class="step">★ 鸡兔同笼 / 增收节支 / 里程碑</div>
   <div class="box">
    <div style="display:flex;gap:8px;margin-bottom:10px">
     ${problems.map((q,i)=>`<button class="${i===cur?'':'secondary'}" data-p="${i}">${i+1}. ${q.title.split(' · ')[0]}</button>`).join('')}
    </div>
    <h3>${p.title}</h3>
    <p style="font-size:14px;margin-top:8px">${p.setup}</p>
    <h3 style="margin-top:14px">Solution · 解答</h3>
    <div class="eq">${p.sol}</div>
   </div>
   <div class="note"><strong>通用思路：</strong>① 设未知数（一般设两个：x 和 y）② 找两个等量关系列两个方程 ③ 解方程组 ④ 验证合理性（x、y > 0；单位一致；答案要回到题目检验）</div>`;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cur=parseInt(b.dataset.p);render();});
 };
 render();
}

/* ============ 微课 K5：方程与函数 ============ */
function microK5(el){
 el.innerHTML=`
  <div class="step">二元一次方程与一次函数</div>
  <div class="box">
   <h3>Key insight · 关键洞察</h3>
   <p>把 <span class="num">2x + y = 7</span> 写成 <span class="num">y = −2x + 7</span>，它就是一条直线。</p>
   <p>把方程组 {2x + y = 7, x + y = 4} 都画成图，两条直线的<strong>交点</strong>就是方程组的<strong>解</strong>。</p>
  </div>
  <div class="box" style="background:#dbeafe">
   <h3>用一次函数解方程组</h3>
   <p style="font-size:14px">① 把两个方程都化为 y = kx + b 的形式</p>
   <p style="font-size:14px">② 画图象（或者用代数解）</p>
   <p style="font-size:14px">③ 交点 (x₀, y₀) 就是解</p>
   <p style="font-size:14px;margin-top:8px"><b>特殊情况：</b>两直线平行 → 无解（k 相同 b 不同）；两直线重合 → 无数解（k 和 b 都相同）</p>
  </div>
  <div class="note"><strong>与 Ch04 的联系：</strong>Ch04 学了一次函数图象，现在学方程的解就是图象的交点。这是"代数"和"几何"两大工具的统一。</div>`;
}

/* ============ 先测一下 ============ */
function diag(el,lessonId,generator){
 el.innerHTML=`<div class="step">先测一下</div><div class="box"><p style="font-size:14px;color:var(--muted)">3 题快速测一下。</p><div id="diagQ"></div></div>`;
 const qEl=el.querySelector('#diagQ');
 let ok=0;
 const qs=Array.from({length:3},()=>generator('diag'));
 let i=0;
 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){
    qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3 都对：</strong>可跳过微课。</div><div style="margin-top:14px"><button id="skipMicro">跳过微课，去练习 →</button></div>`;
    qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};
   } else {
    qEl.innerHTML=`<div class="note" style="background:#fef3c7;border-color:var(--warn)"><strong>${ok}/3 对：</strong>看下方微课。</div><div style="margin-top:14px"><button id="goMicro">进入微课 →</button></div>`;
    qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};
   }
   save();renderNav();return;
  }
  const q=qs[i];
  qEl.innerHTML=`<div class="q"><div class="q-text">${i+1}. ${q.q}</div><div class="q-cn">${q.qcn||''}</div><div style="display:flex;gap:8px"><input id="da" autocomplete="off"><button id="sub">提交</button></div><div class="hint" id="ht"></div><div class="feedback" id="fb"></div></div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();qEl.querySelector('#sub').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const ans=input.value.trim();
   const correct=q.check(ans);
   if(correct===true){ok++;fb.className='feedback show ok';fb.textContent='✓';input.disabled=true;setTimeout(()=>{i++;show();},700);}
   else if(correct==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗ 再试一次。';}
  }
 };
 show();
}

/* ============ 练习生成器 ============ */
const generators={
k1:()=>{
 const x=ri(-3,3),y=ri(-3,3);
 const a1=ri(1,4),b1=ri(1,4),c1=a1*x+b1*y;
 const a2=ri(1,4),b2=ri(1,4),c2=a2*x+a2*y;
 const sol=[x,y];
 return {q:`Is (${x}, ${y}) a solution to the system:<br>${a1}x + ${b1}y = ${c1}<br>${a2}x + ${b2}y = ${c2}<br>Answer "yes" or "no".`,
   qcn:`(${x}, ${y}) 是方程组的解吗？`,
   check:a=>{const ans=a.toLowerCase().trim();return ans==='yes'||ans==='y'||ans==='是';},
   ans:'yes',hint:`Plug in: ${a1}·${x} + ${b1}·${y} = ${c1}? and ${a2}·${x} + ${b2}·${y} = ${c2}?`};
},
k2:()=>{
 const y=ri(1,5);
 const x=ri(1,5);
  return {q:`Solve: y = ${y - x} + x (i.e. y = 2x - ${x}), and 3x + y = ${3*x + y}. Find x.`,
   qcn:`解方程组 y = 2x − ${x}, 3x + y = ${3*x + y}。求 x = ?`,
   check:a=>parseInt(a)===x,ans:String(x),hint:`Substitute y=2x-${x} into 3x+y=${3*x+y}.`};
},
k3:()=>{
 const x=ri(2,5),y=ri(1,4);
  return {q:`Add the two equations:<br>x + 2y = ${x+2*y}<br>3x − 2y = ${3*x-2*y}<br>Find x.`,
   qcn:`两式相加消 y：x + 2y = ${x+2*y}, 3x − 2y = ${3*x-2*y}。求 x = ?`,
   check:a=>parseInt(a)===x,ans:String(x),hint:`Add: 4x = ${(x+2*y)+(3*x-2*y)}.`};
},
k4:()=>{
 // 鸡兔同笼变体
 const chickens=ri(5,15),rabbits=ri(3,8);
 const total=chickens+rabbits,feet=2*chickens+4*rabbits;
 return {q:`鸡兔同笼，共 ${total} 头，${feet} 脚。兔有几只？（填数字）`,
   qcn:`${total} heads, ${feet} feet. How many rabbits?`,
   check:a=>parseInt(a)===rabbits,ans:String(rabbits),
   hint:`Let x=chickens, y=rabbits. x+y=${total}, 2x+4y=${feet}. Solve for y.`};
},
k5:()=>{
 const x=ri(1,4),y=ri(1,4);
 return {q:`Two lines: y = ${ri(1,3)}x + ${y - ri(1,3)*x} and y = −${ri(1,3)}x + ${y + ri(1,3)*x}. They cross at x = ${x}. Find y.`,
   qcn:`两直线交于 x = ${x}，y = ?`,
   check:a=>parseInt(a)===y,ans:String(y),hint:`Plug x=${x} into either equation.`};
},
};

/* ============ 视频模块 ============ */
function videos(el,lessonId){
 const list=VIDEOS[lessonId]||[];
 if(!list.length){el.innerHTML='<div class="note">No videos for this section.</div>';return;}
 let html=`<div class="step">视频 · ${LESSONS.find(l=>l.id===lessonId).cn}</div>`;
 html+=`<div class="box"><p style="font-size:13px;color:var(--muted)"><span class="tag core">必看</span> 先看；<span class="tag ext">选看</span> 有余力再看。</p></div>`;
 list.forEach((v,i)=>{
  const watched=st(lessonId).vid[i];
  html+=`<div class="vid"><div class="vid-h"><span class="title">${v.t}</span><span class="cn">${v.d}</span><span class="meta"><span class="tag ${v.c}">${v.c==='core'?'核心':'拓展'}</span><span class="st ${watched?'ok':''}">${watched?'✓':'未看'}</span><button data-i="${i}">${watched?'▶ 重看':'▶ 播放'}</button></span></div><div id="vc${i}" style="display:${watched?'block':'none'}"><video controls preload="none" style="width:100%;background:#000" src="${encodeURI(VDIR+v.f)}"></video></div></div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{const i=parseInt(b.dataset.i);const slot=el.querySelector('#vc'+i);const v=slot.querySelector('video');if(slot.style.display==='none'){slot.style.display='block';v.play();}else{v.pause();v.currentTime=0;slot.style.display='none';}st(lessonId).vid[i]=true;save();renderNav();b.textContent='▶ 重看';b.parentElement.querySelector('.st').className='st ok';b.parentElement.querySelector('.st').textContent='✓';};
 });
}

/* ============ 练习模块 ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`<div class="step">练一练（${streak}/${need}）</div><div class="info" style="font-size:13px;color:var(--muted);margin:8px 0">对 ${s.prac.ok}/${s.prac.tot}（连对 ${streak}）<button class="secondary" id="rs" style="margin-left:8px">Reset</button></div><div class="progress"><div style="width:${(streak/need)*100}%"></div></div><div class="q"><div class="q-text">${q.q}</div><div class="q-cn">${q.qcn||''}</div><div style="display:flex;gap:8px"><input id="pi" autocomplete="off"><button id="ps">提交</button></div><div class="hint" id="ph"></div><div class="feedback" id="pf"></div></div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();el.querySelector('#ps').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.textContent='✓ 正确！';
    inp.disabled=true;
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>本节过关！✓</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.textContent=q.hint||'再想想看。';
     fb.className='feedback show err';fb.textContent='✗ 再试一次。';
    } else if(tries===2){
     fb.className='feedback show err';
     fb.textContent='✗ 还不对。'+(q.sol?('思路：'+q.sol):(q.hint?('提示：'+q.hint):'再算一遍。'));
    } else {
     streak=0;s.prac.tot++;
     fb.className='feedback show err';
     fb.innerHTML=`答案是 <b>${q.ans}</b>`+(q.sol?('。'+q.sol):'。');
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
  }
 };
 q=gen();tries=0;update();
}

/* ============ 章末测 ============ */
function chTest(el){
 el.innerHTML=`<div class="step">章末自己测</div><div class="box"><p style="font-size:13px;color:var(--muted)">共 10 题。</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k1(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k2());
 for(let i=0;i<2;i++)qs.push(generators.k3());
 for(let i=0;i<2;i++)qs.push(generators.k4());
 for(let i=0;i<2;i++)qs.push(generators.k5());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){tq.innerHTML=`<div class="note" style="background:${ok>=7?'#dcfce7':'#fef3c7'};border-color:${ok>=7?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${ok>=7?'章末通过！':'再回去复习'}</div>`;S.test={ok,tot:qs.length};save();renderNav();return;}
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${q.q}</div><div class="q-cn">${q.qcn||''}</div><div style="display:flex;gap:8px"><input id="ti"><button id="ts">提交</button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ 渲染 ============ */

/* ===== 章节门厅：进来先看这里 ===== */
const USE_MICRO=true;
const INTRO={why:"鸡兔同笼：一共 35 个头、94 只脚，鸡和兔各几只？设两个未知数、列两个方程，一次就解出来。算单价、行程问题（相遇、追及）、调配问题（增收节支），本质都是「两个条件，求两个数」。这章给你两套解法，还能画图看交点——两条直线交在哪，答案就是哪。",desc:{k1:"两个未知数、两个条件，怎么列出来",k2:"把一个未知数换掉，剩下的就只有一个了",k3:"两个式子相加或相减，消掉一个未知数",k4:"把中文应用题翻译成方程：鸡兔同笼、增收节支、里程碑",k5:"两条直线的交点，就是方程组的解"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h">这一章要学什么</div>'
    +'<div class="intro-sub">先扫一眼这张清单，知道这章要去哪；然后点最下面的按钮开始。</div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ 已过关</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.cn+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b>学会了能干嘛</b><br>'+INTRO.why+'</div>';
  h+='<div class="box"><b>这一章怎么学</b><div class="how">'
    +'① <b>看微课</b>：几分钟，先弄懂这一节在说什么<br>'
    +'② <b>练几题</b>：连对 5 题就过关；不会的话会给提示，一步步带你做<br>'
    +'③ <b>再下一节</b>：左边 '+pts[0].n+'、'+pts[1].n+'…… 想先学哪个点哪个，不用非按顺序'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">开始 '+pts[0].n+' '+pts[0].cn+' →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}"><span><b>${l.n}</b> ${l.cn}</span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{const id=n.dataset.go;cur=id==='test'?'test':`micro-${id}`;render();});
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown</div>';return;}
  const titles={k1:'认识方程组',k2:'代入消元法',k3:'加减消元法',k4:'中国应用题三件套',k5:'方程与一次函数'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · ${titles[id]} · ${lesson.cn}</div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   else if(id==='k5')microK5(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice · 开始练习</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){practice(c,id);}
 } else {
  introRender(main);
 }
}
render();
</script>
