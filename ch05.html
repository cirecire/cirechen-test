/* ============ Lesson K6: find the line from two points ============ */
function microK6(el){
 let k=ri(1,4),b=ri(-3,5),x1=ri(-3,3);
 let x2=x1;while(x2===x1)x2=ri(-3,3);
 const y1=k*x1+b,y2=k*x2+b;
 const render=()=>{
  el.innerHTML=`
   <div class="step">${L('Find the straight-line rule from two points','已知两点求直线表达式')}</div>
   <div class="box">
    <h3>${L('What we are after','要找什么')}</h3>
    <p>${L('A line has the form <span class="num">y = kx + b</span>. If you know <strong>two points</strong> on it, you can find both <span class="num">k</span> (slope) and <span class="num">b</span> (intercept) — by turning the two points into a tiny system of equations.','直线的形式是 <span class="num">y = kx + b</span>。知道直线上<strong>两个点</strong>，就能求出 <span class="num">k</span>（斜率）和 <span class="num">b</span>（截距）—— 办法是把这两个点变成一个小方程组。')}</p>
   </div>
   <div class="box">
    <h3>${L('Worked example · points ','例题 · 已知两点 ')}(${x1}, ${y1}) ${L('and','和')} (${x2}, ${y2})</h3>
    <p style="font-size:14px">${L('Step 1 — plug each point into y = kx + b:','第 1 步 —— 把两个点分别代入 y = kx + b：')}</p>
    <div class="eq">${y1} = k·${x1} + b<br>${y2} = k·${x2} + b</div>
    <p style="font-size:14px;margin-top:8px">${L('Step 2 — subtract to kill b:','第 2 步 —— 两式相减，消掉 b：')}</p>
    <div class="eq">(${y2}) − (${y1}) = k·${x2} − k·${x1}<br>${y2-y1} = k·${x2-x1}<br>k = ${y2-y1} ÷ ${x2-x1} = <span class="num">${k}</span></div>
    <p style="font-size:14px;margin-top:8px">${L('Step 3 — back-substitute to get b:','第 3 步 —— 回代求出 b：')}</p>
    <div class="eq">${y1} = ${k}·${x1} + b → b = ${y1} − ${k*x1} = <span class="num">${b}</span></div>
    <p style="font-size:14px;margin-top:8px">${L('So the rule is ','所以表达式是 ')}<span class="num">y = ${k}x + ${b}</span>${L('.','。')}</p>
   </div>
   <div class="box" style="background:#dbeafe">
    <h3>${L('Why two points are enough','为什么两个点就够了')}</h3>
    <p style="font-size:14px">${L('One point leaves both k and b unknown — infinitely many lines pass through it. Two points fix the slope, and once the slope is fixed, the intercept is forced. This is the same "two conditions, two unknowns" idea as the rest of the chapter, just dressed as a line.','只有一个点时，k 和 b 都还不知道 —— 经过一个点可以画无数条直线。两个点就能确定斜率，斜率一定，截距也就被定死了。这跟本章"两个条件、两个未知数"是同一个道理，只是换成了直线的说法。')}</p>
    <p style="font-size:14px;color:var(--muted);margin-top:6px">${L('Hit 🎲 for a new pair of points and walk the three steps again.','按 🎲 换一对点，再把三步走一遍。')}</p>
    <button id="reroll6" class="secondary">🎲 ${L('New points','换一组点')}</button>
   </div>`;
  el.querySelector('#reroll6').onclick=()=>{k=ri(1,4);b=ri(-3,5);x1=ri(-3,3);x2=x1;while(x2===x1)x2=ri(-3,3);y1=k*x1+b;y2=k*x2+b;render();};
 };
 render();
}

  return {q:`Solve: y = x + ${y - x}, and 3x + y = ${3*x + y}. Find x.`,
   zhq:`解方程组：y = x + ${y-x}，且 3x + y = ${3*x+y}。求 x。`,
   check:v=>parseInt(v)===x,ans:String(x),hint:`Replace y with x + ${y-x} in 3x + y = ${3*x+y}, then solve 4x + ${y-x} = ${3*x+y}.`,
   zhh:`把 y 换成 x + ${y-x} 代入 3x + y = ${3*x+y}，再解 4x + ${y-x} = ${3*x+y}。`};
},
k3:()=>{
 const x=ri(2,5),y=ri(1,4);
  return {q:`Add the two equations:<br>x + 2y = ${x+2*y}<br>3x − 2y = ${3*x-2*y}<br>Find x.`,
   zhq:`把两个方程相加：<br>x + 2y = ${x+2*y}<br>3x − 2y = ${3*x-2*y}<br>求 x。`,
   check:a=>parseInt(a)===x,ans:String(x),hint:`Add: 4x = ${(x+2*y)+(3*x-2*y)}.`,
   zhh:`相加得：4x = ${(x+2*y)+(3*x-2*y)}。`};
},
k4:()=>{
 // randomly pick one of the three classic BNU word problems
 const type=ri(1,3);
 if(type===1){
  // chickens and rabbits
  const chickens=ri(5,15),rabbits=ri(3,8);
  const total=chickens+rabbits,feet=2*chickens+4*rabbits;
  return {q:`Chickens and rabbits: ${total} heads, ${feet} feet. How many rabbits? (number only)`,
   zhq:`鸡兔同笼：共 ${total} 个头，${feet} 只脚。兔子有多少只？（只填数字）`,
   check:a=>parseInt(a)===rabbits,ans:String(rabbits),
   hint:`Let x=chickens, y=rabbits. x+y=${total}, 2x+4y=${feet}. Solve for y.`,
   zhh:`设 x=鸡，y=兔。x+y=${total}，2x+4y=${feet}。解出 y。`};
 } else if(type===2){
  // sales & costs: two products, total count and total value
  const x0=ri(3,9),y0=ri(3,9),a=ri(5,15),b=ri(5,15);
  const n=x0+y0,C=a*x0+b*y0;
  return {q:`A shop sells item A at ¥${a} each and item B at ¥${b} each. A customer buys ${n} items for ¥${C} in total. How many of item A? (number only)`,
   zhq:`商店 A 商品每件 ¥${a}，B 商品每件 ¥${b}。一位顾客共买 ${n} 件，花了 ¥${C}。其中 A 商品买了多少件？（只填数字）`,
   check:v=>parseInt(v)===x0,ans:String(x0),
   hint:`Let x = count of A, y = count of B. x+y=${n}, ${a}x+${b}y=${C}. Solve for x.`,
   zhh:`设 x 为 A 的件数，y 为 B 的件数。x+y=${n}，${a}x+${b}y=${C}。解出 x。`};
 } else {
  // milestone / catch-up: car B starts later and catches car A
  const T=ri(2,3),h=ri(1,2),m=ri(8,12);
  const a=T*m, b=m*(T+h); // a·(T+h)=b·T → both travel the same distance at catch-up
  return {q:`Car A leaves at ${a} km/h. ${h} hour(s) later car B leaves at ${b} km/h and catches up with A. How many hours after B leaves does it catch A? (number only)`,
   zhq:`A 车先以 ${a} km/h 出发。${h} 小时后 B 车以 ${b} km/h 出发并追上 A。B 出发后多少小时追上 A？（只填数字）`,
   check:v=>parseInt(v)===T,ans:String(T),
   hint:`At catch-up the distances are equal: ${a}·(t+${h}) = ${b}·t, where t is the time B has driven. Solve for t.`,
   zhh:`追上时两车路程相等：${a}·(t+${h}) = ${b}·t，t 为 B 行驶的时间。解出 t。`};
 }
},
k5:()=>{
 const x=ri(1,4),y=ri(1,4);
 // pick each slope ONCE: calling ri() again inside one question gives the two
 // lines different slopes, and then they no longer meet at (x, y)
 const m=ri(1,3), n=ri(1,3);
 return {q:`Two lines: y = ${m}x + ${y-m*x} and y = −${n}x + ${y+n*x}. They cross at x = ${x}. Find y.`,
   zhq:`两条直线：y = ${m}x + ${y-m*x} 与 y = −${n}x + ${y+n*x}。它们在 x = ${x} 处相交。求 y。`,
   check:v=>parseInt(v)===y,ans:String(y),hint:`Plug x=${x} into either equation.`,
   zhh:`把 x=${x} 代入任意一个方程。`};
},
k6:()=>{
 const k=ri(1,4),b=ri(-3,5),x1=ri(-3,3);
 let x2=x1;while(x2===x1)x2=ri(-3,3);
 const y1=k*x1+b,y2=k*x2+b;
 return {q:`A line passes through (${x1}, ${y1}) and (${x2}, ${y2}). It has the form y = kx + b. Find k. (number only)`,
  zhq:`一条直线经过 (${x1}, ${y1}) 和 (${x2}, ${y2})，形式為 y = kx + b。求 k。（只填数字）`,
  check:v=>parseInt(v)===k,ans:String(k),
  hint:`k = (y₂ − y₁) / (x₂ − x₁) = (${y2} − ${y1}) / (${x2} − ${x1}).`,
  zhh:`k = (y₂ − y₁) / (x₂ − x₁) = (${y2} − ${y1}) / (${x2} − ${x1})。`};
},
ext:()=>{
 const x0=ri(1,5),y0=ri(1,5),z0=ri(1,5);
 const A=x0+y0+z0, B=x0+2*y0+3*z0, C=2*x0+y0+z0;
 return {q:`Solve the system:<br>x + y + z = ${A}<br>x + 2y + 3z = ${B}<br>2x + y + z = ${C}<br>Find x. (number only)`,
  zhq:`解方程组：<br>x + y + z = ${A}<br>x + 2y + 3z = ${B}<br>2x + y + z = ${C}<br>求 x。（只填数字）`,
  check:v=>parseInt(v)===x0,ans:String(x0),
  hint:`From the first equation z = ${A} − x − y. Substitute into the other two to get a 2-variable system, then solve.`,
  zhh:`由第一式得 z = ${A} − x − y，代入另两式化为二元一次方程组，再解。`};
},
};

/* ============ Practice module ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`<div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div><div class="info" style="font-size:13px;color:var(--muted);margin:8px 0">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></div><div class="progress"><div style="width:${(streak/need)*100}%"></div></div><div class="q"><div class="q-text">${q.q}</div><div style="display:flex;gap:8px"><input id="pi" autocomplete="off"><button id="ps">Submit</button></div><div class="hint" id="ph"></div><div class="feedback" id="pf"></div></div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};

  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();el.querySelector('#ps').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');
    inp.disabled=true;
    syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    setTimeout(()=>{q=gen();tries=0;update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
  }
 };
 q=gen();tries=0;update();
}

/* ============ Chapter check ============ */
function chTest(el){
 el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div><div class="box"><p style="font-size:13px;color:var(--muted)">12 questions.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k1(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k2());
 for(let i=0;i<2;i++)qs.push(generators.k3());
 for(let i=0;i<2;i++)qs.push(generators.k4());
 for(let i=0;i<2;i++)qs.push(generators.k5());
 qs.push(generators.k6());
 qs.push(generators.ext());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){tq.innerHTML=`<div class="note" style="background:${ok>=7?'#dcfce7':'#fef3c7'};border-color:${ok>=7?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${ok>=7?'Chapter passed!':'Go back and review'}</div>`;S.test={ok,tot:qs.length};save();renderNav();return;}
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.innerHTML=L(q.hint||'', q.zhh||'');}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

const GLOSS={k1:"二元一次方程组",k2:"代入消元法",k3:"加减消元法",k4:"应用题",k5:"交点",k6:"待定系数法",ext:"三元一次方程组"};

const INTRO={why:"Chickens and rabbits in one cage: 35 heads, 94 feet. How many of each? Name two unknowns, write two equations, solve it in one go. Unit prices, meeting and catching-up problems, mixing and budgeting — all of them are \"two conditions, two unknowns\". This chapter gives you two algebraic methods, plus the picture: where the two lines cross is the answer.",whyZh:"鸡兔同笼：35 个头，94 只脚，各有多少？设两个未知数，列两个方程，一次解出来。单价问题、追及相遇、混合配比、增收节支，全都是\"两个条件、两个未知数\"。这一章给你两种代数解法，再加一个直观办法：两条直线的交点，就是答案。",desc:{k1:"Two unknowns, two conditions — how to set it up",k2:"Replace one unknown so that only one is left",k3:"Add or subtract the equations to cancel one unknown",k4:"Turning word problems into equations",k5:"Where the two lines cross is the solution",k6:"Two points fix a straight line — find its rule",ext:"Three unknowns need three equations (optional)"}};

function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');

  });
  h+='</div>';
  h+='<div class="why"><b><span class="en">Where this shows up in real life</span><span class="zh">在真实生活里哪里会用到</span></b><br>'+L(INTRO.why,INTRO.whyZh)+'</div>';
  h+='<div class="box"><b><span class="en">How this chapter works</span><span class="zh">本章怎么学</span></b><div class="how">'
    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"方程组","k2":"代入法","k3":"加减法","k4":"应用题","k5":"图像法","k6":"待定系数","ext":"三元一次方程组","test":"章末自己测"};

function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}"><span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{const id=n.dataset.go;cur=id==='test'?'test':`micro-${id}`;render();});
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown</div>';return;}
  const titles={k1:'What is a system?',k2:'Substitution',k3:'Elimination',k4:'Word problems',k5:'Systems and graphs',k6:'Find the line from two points',ext:'Three variables (optional)'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   else if(id==='k5')microK5(c);
   else if(id==='k6')microK6(c);
   else if(id==='ext')microExt(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){practice(c,id);}
 } else {
  introRender(main);
 }
}
render();
