/* ============ Lesson K1: why prove? ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step">What is a proof?</div>
  <div class="box">
   <h3>From experiment to proof</h3>
   <p>Up to now geometry has rested on <strong>measuring, drawing and looking</strong>. But that cannot do one thing:</p>
   <p style="margin:10px 0;font-size:15px"><b>"The angles of every triangle add to 180°"</b> — it holds for the 100 triangles you drew, but does that let you say it <i>must</i> hold?</p>
  </div>
  <div class="box" style="background:#fee2e2">
   <h3>Why looking is not enough</h3>
   <p style="font-size:14px">Your drawn triangle might come out at 178° or 182° — that is measurement error, not a broken theorem. To <i>guarantee</i> it you need <b>strict logical deduction</b>, which is what a <b>proof</b> is.</p>
  </div>
  <div class="box" style="background:#dbeafe">
   <h3>What a proof is: known to unknown</h3>
   <p style="font-size:14px">Start from statements already known to be true, follow the rules of logic, and arrive at a new true statement.</p>
   <p style="font-size:14px">known (axioms, proved results) → rules of inference → conclusion</p>
  </div>
  `;
}

/* ============ Lesson K2: how to write a proof ============ */
function microK2(el){
 el.innerHTML=`
  <div class="step">★ How to write a proof</div>
  <div class="box">
   <h3>The standard layout</h3>
   <p style="font-size:14px">The standard layout is <b>two columns</b>: the step on the left, the reason for it on the right, marked with ∵ (since) and ∴ (therefore).</p>
  </div>
  <div class="box">
   <h3>Symbol key</h3>
   <p style="font-size:16px;font-family:monospace">
    <span class="num">∵</span> = "since" &nbsp;&nbsp;&nbsp; <span class="num">∴</span> = "therefore"
   </p>
  </div>
  <div class="box" style="background:#dbeafe">
   <h3>Worked example</h3>
   <p><b>Problem:</b> given AB ∥ CD and ∠B = ∠D, prove AD ∥ BC.</p>
   <div class="proof">
    <div class="row"><span class="step-row"><span class="yin">∵</span> AB ∥ CD</span><span class="reason">(given)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠B = ∠ACD (alternate interior angles)</span><span class="reason">(parallel lines → alternate interior angles equal)</span></div>
    <div class="row"><span class="step-row"><span class="yin">∵</span> ∠B = ∠D (given)</span><span class="reason">(given)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠D = ∠ACD</span><span class="reason">(substitution of equals)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> AD ∥ BC</span><span class="reason">(alternate interior angles equal → lines parallel)</span></div>
   </div>
  </div>
  <div class="box" style="background:#fffbeb">
   <h3>Common reasons</h3>
   <ul style="margin-left:20px;font-size:14px;line-height:1.9">
    <li><b>Given</b> — stated in the problem</li>
    <li><b>Parallel lines → alternate interior angles equal</b></li>
    <li><b>Parallel lines → corresponding angles equal</b></li>
    <li><b>Parallel lines → co-interior angles sum to 180°</b></li>
    <li><b>Substitution of equals</b> — replace one side of an equality</li>
    <li><b>Definition</b> — e.g. vertical angles are equal, by definition</li>
    <li><b>A proved theorem</b> — e.g. the angles of a triangle sum to 180°</li>
   </ul>
  </div>
  <div class="note">After this section you should be able to write a two-column proof like the one above.</div>`;
}

/* ============ Lesson K3: the tests for parallel lines ============ */
function microK3(el){
 el.innerHTML=`

   <div class="box" style="background:#dbeafe;margin:10px 0">

    <p><b>② Alternate interior angles equal → lines parallel</b></p>

   </div>
  </div>

    <line x1="50" y1="140" x2="350" y2="140" stroke="#374151" stroke-width="2"/>
    <line x1="180" y1="20" x2="240" y2="180" stroke="#b91c1c" stroke-width="2"/>

    <circle cx="220" cy="140" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="200" y="55" font-size="10" text-anchor="middle">①</text>
    <text x="220" y="135" font-size="10" text-anchor="middle">②</text>
    <text x="170" y="100" font-size="11" fill="#5b6472">corresponding</text>

/* ============ Lesson K4: what follows from parallel lines ============ */
function microK4(el){
 el.innerHTML=`
  <div class="step">What follows from parallel lines</div>
  <div class="box" style="background:#dbeafe">
   <h3>Two directions</h3>
   <p style="font-size:14px"><b>Test:</b> from equal angles → conclude the lines are parallel</p>
   <p style="font-size:14px"><b>Property:</b> from parallel lines → conclude angles are equal (find the angle)</p>
   <p style="font-size:14px">They are <b>converses</b> of each other — the test and the property run in opposite directions.</p>
  </div>
  <div class="box">
   <h3>Application</h3>
   <div class="proof" style="font-size:13px">
    <p><b>Problem:</b> AB ∥ CD and ∠B = 50°. Find ∠D.</p>
    <div class="row"><span class="step-row"><span class="yin">∵</span> AB ∥ CD</span><span class="reason">(given)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠B + ∠D = 180°</span><span class="reason">(parallel lines → co-interior angles sum to 180°)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠D = 180° − 50° = <span class="num">130°</span></span><span class="reason">(properties of equality)</span></div>
   </div>
  </div>
  <div class="note"><strong>Telling the two apart:</strong><br>
   Given "a ∥ b, find the angle" → use the <strong>property</strong> (lines to angles)<br>
   Given "angles are equal, prove a ∥ b" → use the <strong>test</strong> (angles to lines)<br>
   One word apart: the test goes angles → lines, the property lines → angles.</div>`;
}

/* ============ Lesson K5: the triangle angle sum ============ */
function microK5(el){
 el.innerHTML=`
  <div class="step">The triangle angle sum</div>
  <div class="box" style="background:#dbeafe">
   <h3>Theorem</h3>
   <p style="font-size:18px;text-align:center">The three interior angles of a triangle sum to <span class="num">180°</span></p>
  </div>
  <div class="box">
   <h3>★ Proof (using parallel lines)</h3>
   <p style="font-size:14px">Draw a helper line: through A, draw DE ∥ BC.</p>
   <div class="proof">
    <div class="row"><span class="step-row"><span class="yin">∵</span> DE ∥ BC</span><span class="reason">(by construction)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠DAB = ∠B(alternate interior)</span><span class="reason">(parallel lines → alternate interior angles equal)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠EAC = ∠C(alternate interior)</span><span class="reason">(parallel lines → alternate interior angles equal)</span></div>
    <div class="row"><span class="step-row"><span class="yin">∵</span> ∠BAC = ∠DAB + ∠EAC</span><span class="reason">(sum of angles)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠A = ∠B + ∠C</span><span class="reason">(substitution of equals)</span></div>
    <div class="row"><span class="step-row"><span class="yj">∴</span> ∠A + ∠B + ∠C = 180°</span><span class="reason">(a straight angle is 180°)</span></div>
   </div>
  </div>
  <div class="box" style="background:#fffbeb">
   <h3>Exterior angle</h3>
   <p style="font-size:14px">An exterior angle of a triangle equals the sum of the two <b>opposite interior</b> angles.</p>
   <p style="font-size:14px">So an exterior angle is larger than either opposite interior angle.</p>
  </div>
  <div class="note"><strong>Looking ahead:</strong> in an isosceles triangle the base angles are equal, and conversely. This section sets that up.</div>`;
}

/* ============ Quick check ============ */
function diag(el,lessonId,generator){
 el.innerHTML=`<div class="step"><span class="en">Quick check</span><span class="zh">小测一下</span></div><div class="box"><p style="font-size:14px;color:var(--muted)">3 questions, just to see where you stand.</p><div id="diagQ"></div></div>`;
 const qEl=el.querySelector('#diagQ');
 let ok=0;
 const qs=Array.from({length:3},()=>generator('diag'));
 let i=0;
 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3</strong></div><div style="margin-top:14px"><button id="skipMicro"><span class="en">Skip the lesson, go to practice →</span><span class="zh">跳过微课，去做练习 →</span></button></div>`;qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};}
   else{qEl.innerHTML=`<div class="note" style="background:#fef3c7;border-color:var(--warn)"><strong>${ok}/3</strong></div><div style="margin-top:14px"><button id="goMicro"><span class="en">Go to lesson →</span><span class="zh">去看微课 →</span></button></div>`;qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};}
   save();renderNav();return;
  }
  const q=qs[i];
  qEl.innerHTML=`<div class="q"><div class="q-text">${i+1}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="da"><button id="sub">Submit</button></div><div class="hint" id="ht"></div><div class="feedback" id="fb"></div></div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();qEl.querySelector('#sub').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const correct=q.check(input.value.trim());
   if(correct===true){ok++;fb.className='feedback show ok';fb.textContent='✓';input.disabled=true;setTimeout(()=>{i++;show();},700);}
   else if(correct==='hint'){ht.className='hint show';ht.innerHTML=L(q.hint||'', q.zhh||'');}
   else{fb.className='feedback show err';fb.innerHTML=L('✗ Try again.','✗ 再试一次。');}
  }
 };
 show();
}

/* ============ Practice generators ============ */
const generators={
k3:()=>{
 const a=ri(40,140);
  return {q:`If a transversal crosses two lines and the corresponding angles are equal (both ${a}°), are the two lines parallel? Answer "yes" or "no".`,
   zhq:`一条截线穿过两条直线，若同位角相等（都是 ${a}°），这两条直线平行吗？回答 "yes" 或 "no"。`,
   check:a=>{const ans=a.toLowerCase().trim();return ans==='yes'||ans==='y'||ans==='yes';},
   ans:'yes',hint:'Corresponding angles equal ⟹ parallel.',zhh:'同位角相等 ⟹ 两直线平行。'};
},
k4:()=>{
 const a=ri(40,140);
  return {q:`If a ∥ b and the co-interior angle is ${a}°, what is the other co-interior angle?`,
   zhq:`若 a ∥ b，其中一个同旁内角是 ${a}°，另一个同旁内角是多少？`,
   // NB: do NOT name the parameter `a` — it would shadow the angle above
   check:v=>parseInt(v)===180-a,ans:String(180-a),hint:'Co-interior angles sum to 180°.',zhh:'同旁内角互补，和为 180°。'};
},
k5:()=>{
 const a=ri(30,80),b=ri(30,80);
  return {q:`In a triangle, ∠A = ${a}°, ∠B = ${b}°. Find ∠C.`,
   zhq:`在三角形中，∠A = ${a}°，∠B = ${b}°。求 ∠C。`,
   // NB: do NOT name the parameter `a` — it would shadow ∠A above
   check:v=>parseInt(v)===180-a-b,ans:String(180-a-b),hint:'Sum to 180°.',zhh:'三角形内角和是 180°。'};
},
};

/* ============ Videos module ============ */
function videos(el,lessonId){
 const list=VIDEOS[lessonId]||[];
 if(!list.length){el.innerHTML='<div class="note">No videos for this section.</div>';return;}
 let html=`<div class="step"><span class="en">Videos</span><span class="zh">视频</span> · ${LESSONS.find(l=>l.id===lessonId).t}</div>`;
 list.forEach((v,i)=>{
  const watched=st(lessonId).vid[i];
  html+=`<div class="vid"><div class="vid-h"><span class="title">${L(v.t,(typeof VTZ!=='undefined'&&VTZ[v.t])||v.t)}</span><span class="meta"><span class="tag ${v.c}"><span class="en">${v.c==='core'?'Core':'Extra'}</span><span class="zh">${v.c==='core'?'核心':'拓展'}</span></span><span class="st ${watched?'ok':''}">${watched?'✓':'Unwatched'}</span><button data-i="${i}">${watched?'<span class="en">▶ Replay</span><span class="zh">▶ 重播</span>':'<span class="en">▶ Play</span><span class="zh">▶ 播放</span>'}</button></span></div><div id="vc${i}" style="display:${watched?'block':'none'}"><video controls preload="none" style="width:100%;background:#000" src="${encodeURI(VDIR+v.f)}"></video></div></div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{const i=parseInt(b.dataset.i);const slot=el.querySelector('#vc'+i);const v=slot.querySelector('video');if(slot.style.display==='none'){slot.style.display='block';v.play();}else{v.pause();v.currentTime=0;slot.style.display='none';}st(lessonId).vid[i]=true;save();renderNav();b.textContent='▶ Replay';};
 });
}

/* ============ Practice ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice (K1/K2 are concept lessons)</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0;
 const update=()=>{
  el.innerHTML=`<div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div><div style="font-size:13px;color:var(--muted);margin:8px 0">Correct: ${s.prac.ok}/${s.prac.tot}<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></div><div class="progress"><div style="width:${(streak/need)*100}%"></div></div><div class="q"><div class="q-text">${q.q}</div><div style="display:flex;gap:8px"><input id="pi"><button id="ps">Submit</button></div><div class="hint" id="ph"></div><div class="feedback" id="pf"></div></div>`;
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;save();update();renderNav();};

  const syncTop=()=>{
   const stp=el.querySelector(".step"); if(stp) stp.innerHTML=`<span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})`;
   const pg=el.querySelector(".progress"); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+"%";
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();el.querySelector('#ps').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){streak++;s.prac.ok++;s.prac.tot++;fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');inp.disabled=true;syncTop();if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}setTimeout(()=>{q=gen();tries=0;update();},900);}
   else{
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
  }
 };
 q=gen();tries=0;update();
}

/* ============ Chapter check ============ */
function chTest(el){
 el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div><div class="box"><p style="font-size:13px;color:var(--muted)">6 questions.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k3());
 for(let i=0;i<2;i++)qs.push(generators.k4());
 for(let i=0;i<2;i++)qs.push(generators.k5());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){tq.innerHTML=`<div class="note" style="background:${ok>=4?'#dcfce7':'#fef3c7'}"><strong>${ok}/${qs.length}</strong> ${ok>=4?'Chapter passed!':'Review it again'}</div>`;S.test={ok,tot:qs.length};save();renderNav();return;}
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.innerHTML=L(q.hint||'', q.zhh||'');}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */

/* ===== Chapter lobby: start here ===== */
const GLOSS={k1:"证明",k2:"两列式证明",k3:"平行线的判定",k4:"平行线的性质",k5:"三角形内角和"};
const USE_MICRO=true;
const INTRO={why:"\"If alternate interior angles are equal, the lines are parallel\" — but why must that be true? Measuring it is not an argument. This chapter turns \"looks right to me\" into \"here is my reason\": every step written as because…, therefore… (∵ ∴). That habit of backing up a claim carries into geometry, into essays, into any argument you ever make.",desc:{k1:"\"It looks right\" is not enough — you need a reason",k2:"The standard format: every step as because…, therefore… (∵ ∴)",k3:"What lets you conclude that two lines are parallel",k4:"Once you know lines are parallel, what follows from it",k5:"The three angles of a triangle add to 180° — and how to prove it"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h"><span class="en">What this chapter covers</span><span class="zh">本章学什么</span></div>'
    +'<div class="intro-sub"><span class="en">Skim the list to see where this chapter is going, then press the button at the bottom.</span><span class="zh">先扫一眼下面的清单，看本章去哪，然后按底部按钮开始。</span></div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.t+(GLOSS[l.id]?' <span class="cn-tag">'+GLOSS[l.id]+'</span>':'')+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b><span class="en">Where this shows up in real life</span><span class="zh">在真实生活里哪里会用到</span></b><br>'+INTRO.why+'</div>';
  h+='<div class="box"><b><span class="en">How this chapter works</span><span class="zh">本章怎么学</span></b><div class="how">'
    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"为什么证明","k2":"书写证明","k3":"平行线的判定","k4":"平行线的性质","k5":"三角形内角和","test":"章末自己测"};
const LKEY='bnu8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}
function applyLang(){const l=getLang();document.body.className=(' '+document.body.className+' ').replace(/\s+lang-(en|mix|zh)\b/g,' ').trim();if(l==='mix'||l==='zh')document.body.classList.add('lang-'+l);document.querySelectorAll('.langseg button').forEach(b=>{b.classList.toggle('on',b.dataset.lang===l);});}
applyLang();


function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}"><span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{const id=n.dataset.go;cur=id==='test'?'test':`micro-${id}`;render();});
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown</div>';return;}
  const titles={k1:'Why prove?',k2:'Writing a proof',k3:'Parallel lines: the tests',k4:'Parallel lines: what follows',k5:'Triangle angle sum'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]||(()=>({q:'(no diag for this lesson)',check:()=>true})));
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   else if(id==='k5')microK5(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){practice(c,id);}
 } else {
  introRender(main);
 }
}
render();
</script>
