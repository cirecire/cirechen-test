ext:[

/* ============ Lesson K1: latitude, longitude and ordered pairs ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step">How does one pair of numbers pin down a spot?</div>
  <div class="box">
   <h3>One number is not enough</h3>
   <div class="cn"></div>
   <p>Say you're in Shenzhen — but Shenzhen is 2000 km². You need two numbers: <span class="num">22.5°N, 114.0°E</span> (latitude, longitude).</p>
   <p>So a position in a plane is always given as an <b>ordered pair (x, y)</b> — order matters: (3, 5) ≠ (5, 3).</p>
  </div>
  <div class="box">
   <h3>A direction first, then a distance</h3>
   <div class="cn"></div>
   <p>Before the coordinate plane, Chinese maps used <b>bearing</b>: from a known point, go "north 30° east, 50 meters". One direction + one distance = one position.</p>
   <p>Same logic as (r, θ) in polar coordinates.</p>
  </div>
  <div class="box">
   <h3>From bearings to ordered pairs</h3>
   <div class="cn"></div>
   <p>The coordinate plane is just <b>two perpendicular axes</b> — once you set them, every point has exactly one ordered pair. So "ordered pair" is the bridge from any positioning system (latitude/longitude, bearing, or grid).</p>
  </div>
  One (x, y) matches one point — one to one. K2 and K3 both build on this.`;
}

/* ============ Lesson K2: the coordinate plane ============ */
function microK2(el){
 let px=2,py=3,drag=null;
 const render=()=>{
  const X=x=>240+x*30, Y=y=>240-y*30;
  const quadrants=[
   {x:1,y:1,label:'I (+,+)'},{x:-1,y:1,label:'II (−,+)'},{x:-1,y:-1,label:'III (−,−)'},{x:1,y:-1,label:'IV (+,−)'}
  ];
  let q=quadrants.map(qt=>{
   const cx=qt.x*150,cy=qt.y*100;
   const onAxis=(px===0)||(py===0);
   return `<text x="${X(cx/150*3-0)+15}" y="${Y(cy/100*4+1.5)-10}" font-size="13" fill="#9ca3af" font-weight="600">${qt.label}</text>`;
  }).join('');
  el.innerHTML=`
   <div class="step">Drag P and watch the coordinates</div>
   <div class="box">
    <h3>The four quadrants</h3>
    <div class="cn">The x-axis splits the plane top from bottom, the y-axis left from right; together they make four quadrants, numbered anticlockwise: I, II, III, IV.</div>
    <svg viewBox="0 0 480 480" style="background:#fafafa;border-radius:8px;cursor:crosshair" id="svgK2">
     <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
     </defs>
     <line x1="20" y1="${Y(0)}" x2="460" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
     <line x1="${X(0)}" y1="460" x2="${X(0)}" y2="20" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
     <text x="455" y="${Y(0)-6}" font-size="14" fill="#374151">x</text>
     <text x="${X(0)+8}" y="20" font-size="14" fill="#374151">y</text>
     <text x="${X(0)-5}" y="${Y(0)+14}" font-size="11" fill="#6b7280">O</text>
     ${[-4,-3,-2,-1,1,2,3,4].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${[-4,-3,-2,-1,1,2,3,4].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${q}
     <line x1="${X(0)}" y1="${Y(0)}" x2="${X(px)}" y2="${Y(py)}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
     <line x1="${X(px)}" y1="${Y(0)}" x2="${X(px)}" y2="${Y(py)}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
     <line x1="${X(0)}" y1="${Y(py)}" x2="${X(px)}" y2="${Y(py)}" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
     <circle cx="${X(px)}" cy="${Y(py)}" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2" id="dotP"/>
     <text x="${X(px)+12}" y="${Y(py)-8}" font-size="14" font-weight="bold" fill="#7c3aed">P(${px}, ${py})</text>
     <text x="${X(px/2)-12}" y="${Y(0)-6}" font-size="11" fill="#dc2626">x=${px}</text>
     <text x="${X(0)+8}" y="${Y(py/2)+4}" font-size="11" fill="#16a34a">y=${py}</text>
    </svg>
    <div class="box" style="margin-top:14px;background:#fef3c7">
     <h3 id="quadrantInfo">Quadrant analysis</h3>
     <div id="coordDesc" style="font-size:14px"></div>
    </div>
   </div>`;
  const desc=px>0&&py>0?'Quadrant I (+,+)':
            px<0&&py>0?'Quadrant II (−,+)':
            px<0&&py<0?'Quadrant III (−,−)':
            px>0&&py<0?'Quadrant IV (+,−)':
            'On the axes (sign is mixed)';
  const sp=Math.abs(px)+Math.abs(py);
  el.querySelector('#coordDesc').innerHTML=`Coordinates <b class="num">(${px}, ${py})</b> → ${desc}<br>Manhattan distance from the origin = |x|+|y| = <b>${sp}</b>`;
  const svg=el.querySelector('#svgK2');
  svg.onmousedown=e=>{drag=true;update(e);};
  svg.onmousemove=e=>{if(drag)update(e);};
  svg.onmouseup=svg.onmouseleave=()=>drag=false;
  svg.ontouchstart=svg.ontouchmove=e=>{update(e.touches[0]);e.preventDefault();};
  function update(e){
   const r=svg.getBoundingClientRect();
   const x=Math.round(((e.clientX-r.left)/r.width*480-240)/30);
   const y=Math.round((240-(e.clientY-r.top)/r.height*480)/30);
   px=Math.max(-4,Math.min(4,x)); py=Math.max(-4,Math.min(4,y));
   render();
  }
 };
 render();
}

/* ============ Lesson K3: reflections ============ */
function microK3(el){
 let px=2,py=3,axis='x';
 const render=()=>{
  let rx,ry,rule,ruleCN;
  if(axis==='x'){rx=px;ry=-py;rule=`(${px}, ${py}) → (${px}, ${py<0?'−'+(-py):py})`;ruleCN='Across the x-axis: <b>x stays, y flips sign</b>';}
  else if(axis==='y'){rx=-px;ry=py;rule=`(${px}, ${py}) → (${px<0?'−'+(-px):px}, ${py})`;ruleCN='Across the y-axis: <b>y stays, x flips sign</b>';}
  else{rx=-px;ry=-py;rule=`(${px}, ${py}) → (${px<0?'−'+(-px):px}, ${py<0?'−'+(-py):py})`;ruleCN='Through the origin: <b>both x and y flip sign</b>';}
  const X=x=>240+x*30, Y=y=>240-y*30;
  el.innerHTML=`
   <div class="step">Reflections — drag and see</div>
   <div class="controls">
    <button class="${axis==='x'?'on':''}" data-a="x">Reflect across the x-axis</button>
    <button class="${axis==='y'?'on':''}" data-a="y">Reflect across the y-axis</button>
    <button class="${axis==='o'?'on':''}" data-a="o">Reflect through the origin</button>
   </div>
   <div class="box">
    <svg viewBox="0 0 480 480" style="background:#fafafa;border-radius:8px;cursor:crosshair" id="svgK3">
     <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker></defs>
     <line x1="20" y1="${Y(0)}" x2="460" y2="${Y(0)}" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <line x1="${X(0)}" y1="460" x2="${X(0)}" y2="20" stroke="#374151" stroke-width="2" marker-end="url(#arr3)"/>
     <text x="455" y="${Y(0)-6}" font-size="14" fill="#374151">x</text>
     <text x="${X(0)+8}" y="20" font-size="14" fill="#374151">y</text>
     ${[-4,-3,-2,-1,1,2,3,4].map(i=>`<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#9ca3af"/><text x="${X(i)-3}" y="${Y(0)+15}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${[-4,-3,-2,-1,1,2,3,4].map(i=>`<line x1="${X(0)-3}" y1="${Y(i)}" x2="${X(0)+3}" y2="${Y(i)}" stroke="#9ca3af"/><text x="${X(0)-15}" y="${Y(i)+4}" font-size="10" fill="#6b7280">${i}</text>`).join('')}
     ${axis==='x'?`<line x1="20" y1="${Y(0)}" x2="460" y2="${Y(0)}" stroke="#d97706" stroke-width="3" opacity=".6"/>`:''}
     ${axis==='y'?`<line x1="${X(0)}" y1="20" x2="${X(0)}" y2="460" stroke="#d97706" stroke-width="3" opacity=".6"/>`:''}
     <line x1="${X(px)}" y1="${Y(py)}" x2="${X(rx)}" y2="${Y(ry)}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
     <circle cx="${X(px)}" cy="${Y(py)}" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
     <circle cx="${X(rx)}" cy="${Y(ry)}" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/>
     <text x="${X(px)+12}" y="${Y(py)-8}" font-size="13" font-weight="bold" fill="#7c3aed">P(${px},${py})</text>
     <text x="${X(rx)+12}" y="${Y(ry)-8}" font-size="13" font-weight="bold" fill="#dc2626">P'(${rx},${ry})</text>
    </svg>
    <div class="box" style="margin-top:14px;background:#dbeafe">
     <h3>The pattern</h3>
     <p style="font-size:16px">${rule}</p>
     <p style="margin-top:6px;font-size:14px">${ruleCN}</p>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:8px">Hint: drag P (or click an axis to switch it) and compare the coordinates of P and P'.</p>
   </div>`;
  el.querySelectorAll('[data-a]').forEach(b=>{b.onclick=()=>{axis=b.dataset.a;render();};});
  const svg=el.querySelector('#svgK3');
  let drag=false;
  svg.onmousedown=()=>drag=true;
  svg.onmousemove=e=>{if(drag)update(e);};
  svg.onmouseup=svg.onmouseleave=()=>drag=false;
  function update(e){
   const r=svg.getBoundingClientRect();
   px=Math.max(-4,Math.min(4,Math.round(((e.clientX-r.left)/r.width*480-240)/30)));
   py=Math.max(-4,Math.min(4,Math.round((240-(e.clientY-r.top)/r.height*480)/30)));
   render();
  }
 };
 render();
}

/* ============ Quick check ============ */
function diag(el,lessonId,generator){
 el.innerHTML=`<div class="step">Quick check</div><div class="box"><p style="font-size:14px;color:var(--muted)">3 questions, just to see where you stand.3/3 通过则跳过讲解；有错才进Lesson。</p><div id="diagQ"></div></div>`;
 const qEl=el.querySelector('#diagQ');
 let ok=0;
 const qs=Array.from({length:3},()=>generator('diag'));
 let i=0;
 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){
    qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3:</strong> you already have this — skip the lesson and go to practice.</div><div style="margin-top:14px"><button id="skipMicro">Skip the lesson, go to practice →</button></div>`;
    qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};
   } else {
    qEl.innerHTML=`<div class="note" style="background:#fef3c7;border-color:var(--warn)"><strong>${ok}/3:</strong> work through the lesson below to fill the gap.</div><div style="margin-top:14px"><button id="goMicro">Go to lesson →</button></div>`;
    qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};
   }
   save();renderNav();
   return;
  }
  const q=qs[i];
  qEl.innerHTML=`
   <div class="q">
    <div class="q-text">${i+1}. ${q.q}</div>
    
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="da" autocomplete="off" placeholder="?"> <button id="sub">Submit · Submit</button>
    </div>
    <div class="hint" id="ht"></div>
    <div class="feedback" id="fb"></div>
   </div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();
  qEl.querySelector('#sub').onclick=check;
  input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const ans=input.value.trim();
   const correct=q.check(ans);
   if(correct===true){ok++;fb.className='feedback show ok';fb.textContent='✓ Correct · correct';input.disabled=true;setTimeout(()=>{i++;show();},700);}
   else if(correct==='hint'){ht.className='hint show';ht.textContent=q.hint||'Have another go.';}
   else{fb.className='feedback show err';fb.textContent='✗ Not right, try again.';}
  }
 };
 show();
}

const generators={
k1:()=>{ // ordered pairs and bearings
 const type=ri(1,3);
 if(type===1){
  const x=ri(-4,4),y=ri(-4,4);
  const opts=[`(${x},${y})`,`(${y},${x})`,`(${x},${-y})`,`(${-x},${y})`];
  return {q:`Point P has x-coordinate ${x} and y-coordinate ${y}. Which is its ordered pair?`,
   check:a=>a===opts[0],ans:opts[0],opts,choice:true,hint:'Order matters: (x, y), not (y, x).'};
 } else if(type===2){
  const x=ri(-3,3),y=ri(-3,3);
  return {q:`Find the point (${x}, ${y}). Which quadrant is it in?`,
   check:a=>{
    const n=parseInt(a);
    if(x>0&&y>0)return n===1;
    if(x<0&&y>0)return n===2;
    if(x<0&&y<0)return n===3;
    if(x>0&&y<0)return n===4;
    return false;
   },hint:`(${x}, ${y}) — x sign × y sign tells you the quadrant.`};
 } else {
  const a=ri(1,3),b=ri(1,3);
  return {q:`In a grid, point A is at row ${a}, column ${b}. What is the ordered pair (column, row)?`,
   check:a=>a===`(${b},${a})`,ans:`(${b},${a})`,hint:'In an ordered pair: x comes first (column), y second (row).'};
 }
},
k2:()=>{ // plotting and reading points
 const type=ri(1,2);
 if(type===1){
  const x=ri(-5,5),y=ri(-5,5);
  return {q:`What are the coordinates of the point 3 units right of origin and 2 units up?`,
   check:a=>a===`(${ri === undefined ? 3 : 3},${2})`,ans:`(3,2)`,hint:'Right is +x, up is +y.'};
 } else {
  const x=ri(-4,4),y=ri(-4,4);
  return {q:`The point (${x}, ${y}) — what is its distance from the y-axis (absolute value of x)?`,
   check:a=>parseInt(a)===Math.abs(x),ans:String(Math.abs(x)),hint:'Distance from y-axis = |x|.'};
 }
},
k3:()=>{ // reflections
 const ax=['x','y','o'][ri(0,2)];
 const x=ri(-4,4),y=ri(-4,4);
 let rx,ry;
 if(ax==='x'){rx=x;ry=-y;}
 else if(ax==='y'){rx=-x;ry=y;}
 else{rx=-x;ry=-y;}
 return {q:`If point P = (${x}, ${y}) is reflected across the ${ax==='o'?'origin':ax+'-axis'}, what is P'?`,
   check:a=>{
    const m=a.match(/^\(?\s*(-?\d+)\s*,\s*(-?\d+)\s*\)?$/);
    if(!m)return false;
    return parseInt(m[1])===rx&&parseInt(m[2])===ry;
   },ans:`(${rx},${ry})`,
   hint:ax==='x'?'(x, y) → (x, −y)':ax==='y'?'(x, y) → (−x, y)':'(x, y) → (−x, −y)'};
},
};

/* ============ Videos module ============ */
function videos(el,lessonId){
 const list=VIDEOS[lessonId]||[];
 if(!list.length){el.innerHTML='<div class="note">No videos for this section.</div>';return;}
 let html=`<div class="step">Videos · ${LESSONS.find(l=>l.id===lessonId).t}</div>`;
 html+=`<div class="box"><p style="font-size:13px;color:var(--muted)"><span class="tag core">Watch first</span> watch first; <span class="tag ext">Optional</span> if you have time.</p></div>`;
 list.forEach((v,i)=>{
  const watched=st(lessonId).vid[i];
  html+=`<div class="vid">
   <div class="vid-h">
    <span class="title">${v.t}</span>
    
    <span class="meta">
     <span class="tag ${v.c}">${v.c==='core'?'Core':'Extra'}</span>
     <span class="st ${watched?'ok':''}">${watched?'✓ watched':'Unwatched'}</span>
     <button data-i="${i}">${watched?'▶ Replay':'▶ Play'}</button>
    </span>
   </div>
   <div id="vc${i}" style="display:${watched?'block':'none'}">
    <video controls preload="none" style="width:100%;background:#000" src="${encodeURI(VDIR+v.f)}"></video>
   </div>
  </div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{
   const i=parseInt(b.dataset.i);
   const slot=el.querySelector('#vc'+i);
   const v=slot.querySelector('video');
   if(slot.style.display==='none'){slot.style.display='block';v.play();}
   else{v.pause();v.currentTime=0;slot.style.display='none';}
   st(lessonId).vid[i]=true;save();renderNav();b.textContent='▶ Replay';
   b.parentElement.querySelector('.st').className='st ok';
   b.parentElement.querySelector('.st').textContent='✓ watched';
  };
 });
}

/* ============ Practice module ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,ans='',tries=0;
 let diff=1; // 1=easy,2=med,3=hard
 const pickDiff=()=>diff;
 function newQ(){q=gen(pickDiff());tries=0;}
 const update=()=>{
  el.innerHTML=`
   <div class="step">Practice (${streak}/${need}）</div>
   <div class="diff">
    Difficulty: 
    <button class="secondary ${diff===1?'on':''}" data-d="1">Easy</button>
    <button class="secondary ${diff===2?'on':''}" data-d="2">Medium</button>
    <button class="secondary ${diff===3?'on':''}" data-d="3">Hard</button>
    <span class="info">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px">Reset</button></span>
   </div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${q.q}</div>
    
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps">Submit · Submit</button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=parseInt(b.dataset.d);update();});
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;diff=1;save();update();renderNav();};
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.textContent='✓ correct！';
    inp.disabled=true;
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>Section cleared ✓</strong>';save();renderNav();}
    else if(streak>=3&&diff<3){diff++;}
    setTimeout(()=>{newQ();update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.textContent=q.hint||'Have another go.';
     fb.className='feedback show err';fb.textContent='✗ Try again。';
    } else if(tries===2){
     fb.className='feedback show err';
     fb.textContent='✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.'));
    } else {
     streak=0;s.prac.tot++;if(diff>1)diff--;
     fb.className='feedback show err';
     fb.innerHTML=`The answer is <b>${q.ans}</b>`+(q.sol?('。'+q.sol):'。');
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 newQ();update();
}

/* ============ Chapter test ============ */
function chTest(el){
 el.innerHTML=`<div class="step">Chapter test</div><div class="box"><p style="font-size:13px;color:var(--muted)">8 questions，覆盖本章所有知识点。计时 (not scored).</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<3;i++)qs.push(generators.k1(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k2(i+1));
 for(let i=0;i<3;i++)qs.push(generators.k3());
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){
   tq.innerHTML=`<div class="note" style="background:${ok>=6?'#dcfce7':'#fef3c7'};border-color:${ok>=6?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${ok>=6?'Chapter passed!可以进下一章':'再回去复习错的知识点'}</div>`;
   S.test={ok,tot:qs.length};save();renderNav();return;
  }
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${q.q}</div><div style="display:flex;gap:8px"><input id="ti" autocomplete="off"><button id="ts">Submit</button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */

/* ===== Chapter lobby: start here ===== */
const GLOSS={k1:"有序数对",k2:"平面直角坐标系",k3:"轴对称",ext:"平移 / 旋转 / 缩放"};
const USE_MICRO=true;
const INTRO={why:"How does a delivery rider find you? \"Building 3, unit 502\" — two pieces of information pinning down one spot. That is a coordinate. Maps, where a character stands in a game, seating plans, spreadsheets: all of them are \"which column, which row\". Turn \"where\" into a pair of numbers and you can measure the distance between two points, or work out where a shape ends up after a flip.",desc:{k1:"Two pieces of information pin down a point: column and row, or a bearing",k2:"Writing \"where\" as a pair (x, y), and the four quadrants",k3:"What happens to coordinates when a shape is reflected",ext:"Translations, rotations and dilations (optional)"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h">What this chapter covers</div>'
    +'<div class="intro-sub">Skim the list to see where this chapter is going, then press the button at the bottom.</div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.t+(GLOSS[l.id]?' <span class="cn-tag">'+GLOSS[l.id]+'</span>':'')+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b>Where this shows up in real life</b><br>'+INTRO.why+'</div>';
  h+='<div class="box"><b>How this chapter works</b><div class="how">'
    +'① <b>Watch the lesson</b>: a few minutes to get what the section is about<br>'
    +'② <b>Practice</b>: 5 correct in a row clears it; if you get stuck, hints walk you through<br>'
    +'③ <b>Next section</b>: on the left, '+pts[0].n+'、'+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">Start '+pts[0].n+' '+pts[0].cn+' →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}">
   <span><b>${l.n}</b> ${l.t}</span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
  const id=n.dataset.go;
  cur = id==='test' ? 'test' : (id==='ext' ? 'ext' : `micro-${id}`);
  render();
 });
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  if(id==='ext'){
   main.innerHTML=`<div class="step">Optional · Translations / rotations / dilations</div><div class="box"><p style="font-size:13px;color:var(--muted)">Once coordinates make sense, these transformations help you picture how coordinates变」想清楚。</p></div>`;
   videos(main,'ext');
   return;
  }
  const titles={k1:'Locating points',k2:'The coordinate plane',k3:'Reflections and coordinates'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · ${titles[id]} · ${lesson.cn}</div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  introRender(main);
 }
}
render();
</script>
<script>
(function(){try{if(new URLSearchParams(location.search).get('go')==='test'){cur='test';render();}}catch(e){}})();
</script>
