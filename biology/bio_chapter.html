<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Lesson — Khan Academy Gr.7–8</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f0f4f8; --card:#fff; --text:#1e293b; --text-secondary:#475569; --text-muted:#64748b;
  --border:#cbd5e1; --blue:#2563eb; --blue-dark:#1e3a5f;
  --blue-banner:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);
  --shadow:rgba(0,0,0,.08); --shadow-hover:rgba(0,0,0,.12);
  --purple:#7c3aed; --teal:#0f766e; --green:#059669;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:0 0 56px;}
.banner{background:var(--blue-banner);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px;}
.banner .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;}
.banner .crumb{font-size:12px;opacity:.85;}
.banner h1{font-size:18px;font-weight:700;margin-top:2px;}
.banner .cov{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.18);}
.container{max-width:800px;margin:0 auto;padding:0 24px;}
.stepbar{display:flex;gap:6px;align-items:center;margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px var(--shadow);overflow-x:auto;}
.sb{display:flex;align-items:center;gap:7px;cursor:pointer;flex-shrink:0;}
.sb-num{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:.15s;}
.sb-lab{font-size:12.5px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.sb.active .sb-num{background:var(--blue);color:#fff;}
.sb.active .sb-lab{color:var(--blue-dark);}
.sb.done .sb-num{background:var(--green);color:#fff;}
.sb.done .sb-lab{color:var(--text-secondary);}
.sb-arrow{color:var(--border);font-size:16px;font-weight:700;}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:16px;box-shadow:0 2px 8px var(--shadow);}
.panel.show{display:block;}
.panel h2{font-size:17px;color:var(--blue-dark);margin-bottom:10px;}
.elicit{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px;font-weight:600;}
.video-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.video-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);background:#fff;transition:transform .12s,box-shadow .12s;}
.video-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--shadow-hover);}
.video-card .play{width:38px;height:38px;border-radius:8px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.video-card .vt{font-size:14px;font-weight:600;}
.video-card .vm{font-size:12px;color:var(--text-muted);}
.notes{margin:10px 0 0 18px;}
.notes li{margin-bottom:8px;font-size:14.5px;}
.gloss{color:var(--blue);font-weight:600;}
.project{margin-top:14px;background:#faf5ff;border-left:4px solid var(--purple);border-radius:8px;padding:12px 14px;font-size:13.5px;}
.q{display:none;border:1px solid var(--border);border-radius:10px;padding:15px;margin-top:13px;background:#fff;}
.q.show{display:block;}
.qn{font-weight:600;font-size:14.5px;margin-bottom:9px;}
.qopts{display:flex;flex-direction:column;gap:7px;}
.qopt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;}
.qopt:hover{background:#f8fafc;}
.qopt input{accent-color:var(--blue);width:16px;height:16px;}
.fill{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;display:none;}
.fb.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;display:block;}
.fb.no{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;display:block;}
.sol{margin-top:10px;padding:10px 12px;background:#f0fdfa;border-left:4px solid var(--teal);border-radius:8px;font-size:13.5px;display:none;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
.next-btn{background:var(--blue);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
.next-btn:hover{background:#1d4ed8;}
.next-btn:disabled{background:#cbd5e1;cursor:not-allowed;}
.back-btn{background:#fff;color:var(--text-secondary);border:1px solid var(--border);padding:11px 18px;border-radius:9px;font-size:13.5px;cursor:pointer;}
.done-screen{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;margin-top:16px;box-shadow:0 2px 8px var(--shadow);}
.done-screen.show{display:block;}
.done-screen .big{font-size:40px;}
.done-screen h2{color:var(--green);margin:8px 0;}
.go-next{display:inline-block;margin-top:14px;background:var(--green);color:#fff;text-decoration:none;padding:12px 24px;border-radius:9px;font-weight:700;font-size:14px;}
.note{font-size:12.5px;color:var(--text-muted);margin-top:12px;font-style:italic;}
</style>
</head>
<body>
<div class="banner">
  <a class="home" id="home" href="#">← 课程</a>
  <div><div class="crumb" id="crumb"></div><h1 id="title"></h1><span class="cov" id="cov"></span></div>
</div>
<div class="container">
  <div class="stepbar" id="stepbar"></div>
  <div class="panel" id="p1"></div>
  <div class="panel" id="p2"></div>
  <div class="panel" id="p3"></div>
  <div class="panel" id="p4"></div>
  <div class="panel" id="p5"></div>
  <div class="done-screen" id="done">
    <div class="big">🎉</div>
    <h2 id="doneTitle">Chapter complete!</h2>
    <p id="doneText"></p>
    <a class="go-next" id="goNext" href="#">Go to next chapter ▶</a>
  </div>
</div>

<script src="bio_data.js"></script>
<script>
var params=new URLSearchParams(location.search);
var id=params.get('ch');
var CH=null, CH_LIST=[], idx=-1, GRADE=null;
function cleanName(t){ return t.replace(/^(七上|七下|八上|八下)?Ch\d+\s*/, '').trim(); }
function pad(n){ return (n<10?'0'+n:''+n); }
// build grade-filtered list
GRADE=params.get('grade');
for(var i=0;i<BIO_DATA.length;i++){ if(BIO_DATA[i].id===id){ CH=BIO_DATA[i]; if(!GRADE) GRADE=CH.g; break; } }
if(CH){ CH_LIST=BIO_DATA.filter(function(c){ return c.g===GRADE; }); for(var j=0;j<CH_LIST.length;j++){ if(CH_LIST[j].id===id){ idx=j; break; } } }
if(!CH){ document.getElementById('title').textContent='Chapter not found'; }
else { render(); }

var TOTAL=5, cur=1;
function render(){
  document.getElementById('home').href='grade'+GRADE+'/index.html';
  document.getElementById('crumb').textContent='G'+GRADE+' · '+CH.loc+' · 第'+CH.gx+'节';
  document.getElementById('title').textContent='G'+GRADE+'·'+pad(CH.gx)+'  '+cleanName(CH.title);
  var covTxt={g:'🟢 Khan video + exercise',b:'🔵 Khan video only — practice added',p:'🟣 custom only'}[CH.coverage];
  document.getElementById('cov').textContent=covTxt;

  var labels=['Think','Watch','Notes','Practice','Quiz'];
  var sb='';
  for(var s=1;s<=5;s++){ sb+='<div class="sb" data-step="'+s+'" onclick="goStep('+s+')"><div class="sb-num">'+s+'</div><div class="sb-lab">'+labels[s-1]+'</div></div>'+(s<5?'<span class="sb-arrow">→</span>':''); }
  document.getElementById('stepbar').innerHTML=sb;

  document.getElementById('p1').innerHTML='<h2>Step 1 · Think</h2><div class="elicit">'+CH.think+'</div><div class="note">No answer yet — just think. Click Next when ready.</div><div class="nav"><span></span><button class="next-btn" onclick="next()">Next → Watch</button></div>';

  var v='<h2>Step 2 · Watch (exact videos, in order)</h2><div class="video-list">';
  CH.videos.forEach(function(x){ v+='<a class="video-card" href="'+x.url+'" target="_blank"><div class="play">▶</div><div><div class="vt">'+x.t+'</div><div class="vm">'+(x.m||'')+'</div></div></a>'; });
  v+='</div><div class="note">Watch in order, then Next.</div><div class="nav"><button class="back-btn" onclick="goStep(1)">← Back</button><button class="next-btn" onclick="next()">Next → Notes</button></div>';
  document.getElementById('p2').innerHTML=v;

  var n='<h2>Step 3 · Notes (English, key terms glossed once)</h2><ul class="notes">';
  CH.notes.forEach(function(x){ n+='<li>'+x+'</li>'; });
  n+='</ul>';
  if(CH.project) n+='<div class="project">🔧 综合实践（Comprehensive project）：'+CH.project+'</div>';
  n+='<div class="nav"><button class="back-btn" onclick="goStep(2)">← Back</button><button class="next-btn" onclick="next()">Next → Practice</button></div>';
  document.getElementById('p3').innerHTML=n;

  document.getElementById('p4').innerHTML='<h2>Step 4 · Practice (auto-checked)</h2>'+renderQs(CH.practice,false)+'<div class="nav"><button class="back-btn" onclick="goStep(3)">← Back</button><button class="next-btn" onclick="next()">Next → Quiz</button></div>';

  document.getElementById('p5').innerHTML='<h2>Step 5 · Quiz (checkpoint)</h2><p class="note">Answer all to finish the chapter.</p>'+renderQs(CH.quiz,true)+'<div class="nav"><button class="back-btn" onclick="goStep(4)">← Back</button><button class="next-btn" id="finishBtn" onclick="finish()" disabled>Finish chapter ✓</button></div>';

  showStep(1); wireChecks();
}
function renderQs(list,isQuiz){
  var h=''; var tag=isQuiz?'quiz':'prac';
  list.forEach(function(q,qi){
    var inner='<div class="qn">'+(qi+1)+'. '+q.q+'</div>';
    if(q.type==='fill'){
      inner+='<input class="fill" type="text" placeholder="your answer" data-ans="'+q.ans.toLowerCase()+'">';
    } else {
      inner+='<div class="qopts">';
      q.opts.forEach(function(o,oi){ inner+='<label class="qopt"><input type="radio" name="'+tag+qi+'" value="'+o.v+'" data-ans="'+o.v.toLowerCase()+'"> '+o.t+'</label>'; });
      inner+='</div>';
    }
    inner+='<div class="fb"></div>';
    if(q.sol) inner+='<div class="sol">'+q.sol+'</div>';
    h+='<div class="q show" data-q="'+tag+qi+'" data-quiz="'+(isQuiz?1:0)+'">'+inner+'</div>';
  });
  return h;
}
function wireChecks(){
  document.querySelectorAll('.q').forEach(function(q){
    q.addEventListener('change',function(){ checkQ(q); });
    var f=q.querySelector('.fill'); if(f) f.addEventListener('input',function(){ checkQ(q); });
  });
}
function checkQ(q){
  var fb=q.querySelector('.fb');
  var inp=q.querySelector('.fill');
  var sel=q.querySelector('input:checked');
  var val=inp?inp.value.trim().toLowerCase():(sel?sel.value.toLowerCase():'');
  var ans=(inp?inp.dataset.ans:(sel?sel.dataset.ans:'')).toLowerCase();
  if(!val){ fb.className='fb'; fb.textContent=''; return; }
  var ok = (val===ans) || (val.length>=2 && (val.indexOf(ans)>=0 || ans.indexOf(val)>=0));
  if(ok){ fb.className='fb ok'; fb.textContent='✅ Correct!'; }
  else { fb.className='fb no'; fb.textContent='❌ Not quite — review Notes (Step 3), then retry.'; }
  updateFinish();
}
function updateFinish(){
  var qs=document.querySelectorAll('[data-quiz="1"]'); var done=0;
  qs.forEach(function(q){ var i=q.querySelector('.fill'); var s=q.querySelector('input:checked'); if((i&&i.value.trim())||s) done++; });
  document.getElementById('finishBtn').disabled=(done<qs.length);
}
function showStep(n){
  for(var i=1;i<=TOTAL;i++) document.getElementById('p'+i).classList.toggle('show',i===n);
  document.getElementById('done').classList.remove('show');
  document.querySelectorAll('.sb').forEach(function(b){ var s=+b.dataset.step; b.classList.toggle('active',s===n); b.classList.toggle('done',s<n); });
  window.scrollTo({top:0,behavior:'smooth'});
}
function goStep(n){ cur=n; showStep(n); }
function next(){ if(cur<TOTAL){ cur++; showStep(cur); } }
function finish(){
  for(var i=1;i<=TOTAL;i++){ var b=document.querySelector('.sb[data-step="'+i+'"]'); if(b){ b.classList.add('done'); b.classList.remove('active'); } }
  document.getElementById('done').classList.add('show');
  var nx=CH_LIST[idx+1];
  if(nx){
    document.getElementById('goNext').href='bio_chapter.html?ch='+nx.id+'&grade='+GRADE;
    document.getElementById('doneText').textContent='下一章：G'+GRADE+'·'+pad(nx.gx)+' '+cleanName(nx.title);
  } else {
    document.getElementById('goNext').href='grade'+GRADE+'/index.html';
    document.getElementById('doneText').textContent='That was the last Grade '+GRADE+' chapter — back to course map.';
  }
  try{ localStorage.setItem('bio_'+GRADE+'_'+id,'done'); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
