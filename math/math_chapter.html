<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math · Khan Academy</title>
<!-- KaTeX for LaTeX math rendering (used by KA itself, MIT licensed) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{
  --bg:#0a0f1e; --card:#141d33; --card2:#1a2540;
  --text:#e8eef8; --text2:#9fb0c8; --text3:#64748b;
  --blue:#3b82f6; --blue-banner:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);
  --green:#10b981; --purple:#a855f7; --teal:#14b8a6;
  --border:#23304d; --shadow:0 4px 16px rgba(0,0,0,.35);
  /* light theme overrides */
  --bg-l:#f0f4ff; --card-l:#ffffff; --card2-l:#f8faff;
  --text-l:#1e293b; --text2-l:#64748b; --text3-l:#94a3b8;
  --blue-l:#2563eb; --border-l:#c7d2fe; --shadow-l:0 2px 12px rgba(0,0,0,.10);
  --banner-l:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);
  --green-l:#059669;
}
[data-theme="light"]{
  --bg:var(--bg-l); --card:var(--card-l); --card2:var(--card2-l);
  --text:var(--text-l); --text2:var(--text2-l); --text3:var(--text3-l);
  --blue:var(--blue-l); --border:var(--border-l); --shadow:var(--shadow-l);
  --blue-banner:var(--banner-l); --green:var(--green-l);
}
[data-theme="light"] .elicit{background:#eff6ff;border-color:#2563eb;color:#1e3a8a}
[data-theme="light"] .notes-list li{background:#f0fdf4;border-color:#059669;color:#064e3b}
[data-theme="light"] .sb-num{background:#e2e8f0;color:#475569}
[data-theme="light"] .dia-wrap svg{background:#f8fafc}
[data-theme="light"] .dia-wrap svg text{opacity:.7}
[data-theme="light"] .vlink{color:#2563eb}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding:0 0 60px}
.banner{background:var(--blue-banner);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:8px}
.banner .home:hover{background:rgba(255,255,255,.28)}
.banner h1{font-size:18px;font-weight:800;flex:1;min-width:200px}
.banner .cov{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.theme-btn{background:rgba(255,255,255,.16);border:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:#fff;display:flex;align-items:center;transition:background .15s;flex-shrink:0}
.theme-btn:hover{background:rgba(255,255,255,.28)}
[data-theme="light"] .theme-btn{color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.stepbar{display:flex;gap:6px;align-items:center;margin:18px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);overflow-x:auto}
.sb{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;padding:4px 6px;border-radius:8px}
.sb-num{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:.15s}
.sb.active .sb-num{background:var(--blue);color:#fff}
.sb.done .sb-num{background:var(--green);color:#fff}
.sb-label{font-size:13px;font-weight:600;color:var(--text2)}
.sb.active .sb-label{color:var(--text)}
.arrow{color:var(--text3);font-size:13px}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:14px;box-shadow:var(--shadow)}
.panel.active{display:block}
.panel h2{font-size:17px;margin-bottom:12px;color:var(--blue)}
.elicit{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px;font-weight:600;color:#1e3a8a}
.video-wrap{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#000}
.bili{width:100%;height:480px;border:0;display:block}
.video-meta{font-size:13px;color:var(--text2);padding:10px 14px;background:var(--card2)}
.video-meta .vlink{color:var(--blue);font-weight:700;text-decoration:none;margin-left:6px}
.notes-list{list-style:none}
.notes-list li{background:#f0fdf4;border-left:4px solid var(--green);border-radius:8px;padding:11px 14px;margin-top:9px;color:#064e3b;font-size:14px}

/* ── KA-style math text (rendered by KaTeX) ── */
.math-inline{display:inline}

/* ── Diagram wrappers ── */
.dia-wrap{margin:10px 0;text-align:center;padding:12px;background:#fff;border-radius:8px;display:inline-block}
.dia-wrap svg{display:inline-block;max-width:100%}

/* ── Question cards ── */
.q{display:block;border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:13px;background:var(--card2)}
.qnum{font-size:12px;color:var(--text3);margin-bottom:6px}
.qtext{font-weight:600;margin-bottom:10px;font-size:15px}
.options{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;cursor:default;background:var(--card)}
.opt-l{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.opt-t{font-size:14px}
.opt-correct{border-color:var(--green);background:#f0fdf4}
.opt-correct .opt-l{background:var(--green);color:#fff}

/* ── Answer area ── */
.ans-area{margin-top:10px}
.show-ans-btn{background:var(--purple);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.show-ans-btn:hover{background:#9333ea}
.ans-display{display:none;margin-top:8px;padding:10px 14px;background:#f0fdf4;border:1px solid #6ee7b7;border-radius:8px;font-size:14px;color:#065f46}

/* ── Feedback / hints ── */
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;display:none}
.fb.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;display:block}
.fb.no{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;display:block}
.sol{margin-top:8px;padding:10px 14px;background:#f0fdfa;border-left:4px solid var(--teal);border-radius:8px;font-size:13.5px;display:none;color:#134e4a}
.sol-header{font-weight:700;color:#0f766e;margin-bottom:6px}

/* ── Buttons ── */
.next-btn{background:var(--blue);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:18px}
.next-btn:hover{background:#2563eb}
.next-btn.sm{padding:8px 16px;margin-top:8px}
.next-btn.big{display:block;width:100%;font-size:15px;padding:14px}
.next-btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Done screen ── */
.done-screen{display:none;text-align:center;padding:50px 20px}
.done-screen.show{display:block}
.done-screen .big{font-size:54px}
.done-screen h2{margin:12px 0;color:var(--green)}
.go-next{display:inline-block;margin-top:16px;background:var(--green);color:#fff;text-decoration:none;padding:12px 26px;border-radius:9px;font-weight:700}
.go-next:hover{background:#059669}

/* ── Instruction strip ── */
.paper-note{background:#fffbea;border:1px solid #f59e0b;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#92400e;text-align:center}
.paper-note strong{color:#d97706}
/* ── Hints ── */
.hint-btn{background:#fef3c7;color:#92400e;border:1.5px solid #f59e0b;padding:5px 13px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:6px}
.hint-btn:hover{background:#fde68a}
/* ── interleaved subtopic (KA-style) additions ── */
.videos{display:flex;flex-direction:column;gap:14px;margin:6px 0 4px}
.prac-head{margin:18px 0 8px;font-size:16px;color:var(--ka-blue,#0a7cff)}
.mbadge-wrap{margin:6px 0 2px}
.mbadge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--border)}
.mbadge.none{background:#f1f5f9;color:#64748b}
.mbadge.familiar{background:#fef9c3;color:#a16207;border-color:#fde047}
.mbadge.proficient{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.mbadge.mastered{background:#dcfce7;color:#15803d;border-color:#86efac}
.opt-wrong{border-color:#ef4444;background:#fef2f2}
.opt-wrong .opt-l{background:#ef4444;color:#fff}
.opt-done{cursor:default;opacity:.92}
.opt-done:hover{transform:none}

</style>
</head>
<body>
<div class="banner">
  <a class="home" id="home" href="index.html">← 目录</a>
  <h1 id="title">Loading…</h1>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle day/night mode" title="Toggle day/night">
    <svg id="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <span class="cov" id="cov"></span>
</div>
<div class="wrap">
  <div id="versionMarker" style="position:fixed;top:5px;right:5px;background:lime;color:black;padding:6px 12px;z-index:99999;font:bold 15px monospace;border:2px solid black;">v2026-08-30-FIX-NEXTBTN</div>
  <div class="paper-note" id="paperNote" style="display:none">
    ✏️ <strong>Solve on paper first</strong>, then check your answer below.
  </div>
  <div class="stepbar" id="stepbar"></div>
  <div id="panels"></div>
  <div class="done-screen" id="done">
    <div class="big">🎉</div>
    <h2 id="doneTitle">Chapter complete!</h2>
    <p id="doneText"></p>
    <a class="go-next" id="goNext" href="#">Go to next chapter ▶</a>
  </div>
</div>

<script src="math_data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// GRAPHIE → SVG ENGINE
// Translates KA's graphie drawing calls into SVG.
// Supports: init, line, path, arc, label, circle, Triangle,
//           grid/axes, and all style options.
// ═══════════════════════════════════════════════════════════════

var _g = null; // current graphie context

function Graphie(svgEl) {
  this.svg = svgEl;
  this.scale = 40;
  this.range = [[-10, 10], [-10, 10]];
  this.styles = {};
  this.init = function(range, opts) {
    if (!range) return;
    this.range = range;
    this.scale = (opts && opts.scale) || 40;
  };
  // Convert KA graphie coords (x,y) → SVG pixel coords
  this.toSVG = function(x, y) {
    var rx = this.range[0], ry = this.range[1];
    var w = this.svg.width.baseVal.value;
    var h = this.svg.height.baseVal.value;
    var px = ((x - rx[0]) / (rx[1] - rx[0])) * w;
    var py = h - ((y - ry[0]) / (ry[1] - ry[0])) * h; // flip Y
    return [px, py];
  };
  this._el = function(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    // apply current styles
    for (var s in this.styles) el.style[s] = this.styles[s];
    this.svg.appendChild(el);
    return el;
  };
  this.line = function(p1, p2, opts) {
    var a = this.toSVG(p1[0], p1[1]);
    var b = this.toSVG(p2[0], p2[1]);
    var attrs = { x1: a[0], y1: a[1], x2: b[0], y2: b[1] };
    if (opts && opts.end) {
      attrs.markerEnd = 'url(#arrowhead)';
    }
    return this._el('line', attrs);
  };
  this.path = function(points, opts) {
    var self = this;
    var d = points.map(function(p) {
      var pt = self.toSVG(p[0], p[1]);
      return (p === points[0] ? 'M' : 'L') + pt[0] + ',' + pt[1];
    }).join(' ');
    if (opts && opts.close) d += ' Z';
    return this._el('path', { d: d, fill: opts && opts.close ? 'none' : 'none' });
  };
  this.arc = function(center, radius, startDeg, endDeg, opts) {
    var c = this.toSVG(center[0], center[1]);
    // scale radius to SVG pixels
    var rx0 = this.toSVG(center[0] - center[0], center[1] - center[1]);
    var rx1 = this.toSVG(center[0] + radius, center[1] - center[1]);
    var r = Math.abs(rx1[0] - rx0[0]);
    var s = (startDeg * Math.PI / 180);
    var e = (endDeg * Math.PI / 180);
    var large = (endDeg - startDeg) > 180 ? 1 : 0;
    var x = c[0] + r * Math.cos(s);
    var y = c[1] + r * Math.sin(s);
    var ex = c[0] + r * Math.cos(e);
    var ey = c[1] + r * Math.sin(e);
    var d = 'M ' + x + ',' + y + ' A ' + r + ',' + r + ' 0 ' + large + ' 1 ' + ex + ',' + ey;
    return this._el('path', { d: d, fill: 'none' });
  };
  this.circle = function(center, r) {
    var c = this.toSVG(center[0], center[1]);
    var rx0 = this.toSVG(center[0] - center[0], center[1] - center[1]);
    var rx1 = this.toSVG(center[0] + r, center[1] - center[1]);
    var pr = Math.abs(rx1[0] - rx0[0]);
    return this._el('circle', { cx: c[0], cy: c[1], r: pr });
  };
  this.label = function(pos, text, side, opts) {
    var c = this.toSVG(pos[0], pos[1]);
    var tx = c[0], ty = c[1];
    var anchor = 'middle';
    if (side === 'left') { tx -= 6; anchor = 'end'; }
    if (side === 'right') { tx += 6; anchor = 'start'; }
    if (side === 'above') ty -= 6;
    if (side === 'below') ty += 16;
    if (side === 'above left') { tx -= 8; ty -= 6; anchor = 'end'; }
    if (side === 'above right') { tx += 8; ty -= 6; anchor = 'start'; }
    if (side === 'below left') { tx -= 8; ty += 18; anchor = 'end'; }
    if (side === 'below right') { tx += 8; ty += 18; anchor = 'start'; }
    var el = this._el('text', {
      x: tx, y: ty, 'text-anchor': anchor, 'dominant-baseline': 'middle'
    });
    // render LaTeX via KaTeX
    try {
      if (text.startsWith('$') && text.endsWith('$')) {
        katex.render(text.slice(1,-1), el, { throwOnError: false, displayMode: false });
      } else {
        el.textContent = text;
      }
    } catch(e) { el.textContent = text; }
    return el;
  };
  this.style = function(attrs, fn) {
    var old = this.styles;
    for (var k in attrs) this.styles[k] = attrs[k];
    if (fn) {
      fn.call(this);
      this.styles = old;
    }
  };
  // Draw a coordinate plane with axes
  this.drawAxes = function(opts) {
    opts = opts || {};
    var rx = this.range[0], ry = this.range[1];
    var pad = 5;
    // x-axis
    this.line([rx[0], 0], [rx[1], 0]);
    // y-axis
    this.line([0, ry[0]], [0, ry[1]]);
    // grid lines
    var step = opts.step || 1;
    for (var x = Math.ceil(rx[0]/step)*step; x <= rx[1]; x += step) {
      if (Math.abs(x) < 0.001) continue;
      this.line([x, ry[0]], [x, ry[1]]);
    }
    for (var y = Math.ceil(ry[0]/step)*step; y <= ry[1]; y += step) {
      if (Math.abs(y) < 0.001) continue;
      this.line([rx[0], y], [rx[1], y]);
    }
  };
  // Draw a right triangle (same as betterTriangle in KA)
  this.triangle = function(w, h, A, B, C, alabel, blabel, clabel) {
    // KA coords: C=(0,0), B=(w,0), A=(0,h)
    var Ax=0, Ay=h, Bx=w, By=0, Cx=0, Cy=0;
    this.path([[Cx,Cy],[Bx,By],[Ax,Ay],[Cx,Cy]], {close:true});
    // right angle marker at C
    var sq = 0.3;
    this.path([[Cx,Cy+sq],[Cx+sq,Cy+sq],[Cx+sq,Cy]]);
    // vertex labels
    this.label([Cx-0.3, Cy+0.3], C, 'below left');
    this.label([Bx+0.3, By+0.3], B, 'below right');
    this.label([Ax-0.3, Ay-0.3], A, 'above left');
    // side labels
    this.label([Cx, Cy+h/2], blabel, 'left');
    this.label([Cx+w/2, Cy+0.3], alabel, 'below');
    // hypotenuse midpoint, perpendicular offset
    var hyp = Math.sqrt(w*w+h*h);
    var nx = -h/hyp, ny = w/hyp;
    this.label([(Cx+Bx)/2+nx*0.5, (Cy+By)/2+ny*0.5], clabel, 'above right');
  };
  // Draw an angle arc between three points
  this.angleArc = function(p1, vertex, p2, r, labelText) {
    // angle at vertex between p1 and p2
    var vx = vertex[0], vy = vertex[1];
    var a1 = Math.atan2(p1[1]-vy, p1[0]-vx);
    var a2 = Math.atan2(p2[1]-vy, p2[0]-vx);
    var arcR = r || 0.5;
    // make sure we draw the smaller arc
    var da = a2 - a1;
    if (da > Math.PI) da -= 2*Math.PI;
    if (da < -Math.PI) da += 2*Math.PI;
    var s = a1 * 180 / Math.PI;
    var e = (a1 + da) * 180 / Math.PI;
    this.arc([vx, vy], arcR, s, e);
    if (labelText) {
      var mx = vx + (arcR + 0.4) * Math.cos(a1 + da/2);
      var my = vy + (arcR + 0.4) * Math.sin(a1 + da/2);
      this.label([mx, my], labelText);
    }
  };
}

// Render a graphie from a config object
function renderGraphie(cfg) {
  // cfg = { range, code } where code is array of draw commands
  // OR simplified format: { type:'triangle', w,h,A,B,C,a,b,c }
  var range = cfg.range || [[-2, 12], [-2, 10]];
  var padL = 20, padB = 20, padT = 20, padR = 20;
  var W = 500, H = 320;
  // Calculate scale to fit range into available space
  var scaleX = (W - padL - padR) / (range[0][1] - range[0][0]);
  var scaleY = (H - padT - padB) / (range[1][1] - range[1][0]);
  var scale = Math.min(scaleX, scaleY);

  var g = new Graphie({
    width: { baseVal: { value: W } },
    height: { baseVal: { value: H } },
    appendChild: function(el) {
      svg.innerHTML += el.outerHTML || '';
    }
  });
  g.range = range;
  g.scale = scale;

  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.style.background = '#f8fafc';
  svg.style.borderRadius = '6px';

  // Arrowhead marker
  svg.innerHTML += '<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>';

  g.svg = svg;

  if (cfg.type === 'triangle') {
    // simplified right-triangle drawing
    var w = cfg.w, h = cfg.h;
    var hyp = Math.sqrt(w*w+h*h);
    var SCALE = 260 / hyp;
    var Wpx = Math.round(w * SCALE), Hpx = Math.round(h * SCALE);
    var PL = 65, PT = 55, PR = 55, PB = 45;
    var vW = PL + Wpx + PR, vH = PT + Hpx + PB;
    svg.setAttribute('viewBox', '0 0 ' + vW + ' ' + vH);
    svg.setAttribute('width', vW);
    svg.setAttribute('height', vH);
    var Ax=PL, Ay=PT+Hpx, Bx=PL+Wpx, By=PT+Hpx, Cx=PL, Cy=PT;
    var lines = '';
    lines += '<polygon points="'+Ax+','+Ay+' '+Bx+','+By+' '+Cx+','+Cy+'" fill="none" stroke="#334155" stroke-width="2"/>';
    // right angle marker
    var sq=10;
    lines += '<path d="M '+(Cx)+','+(Cy+sq)+' L '+(Cx)+','+(Cy)+' L '+(Cx+sq)+','+(Cy)+'" fill="none" stroke="#94a3b8" stroke-width="1.5"/>';
    // vertex labels
    lines += '<text x="'+(Ax-10)+'" y="'+(Ay-8)+'" text-anchor="end" font-family="sans-serif" font-size="14" fill="#60a5fa" font-weight="700">'+esc(cfg.A||'')+'</text>';
    lines += '<text x="'+(Bx+10)+'" y="'+(By-8)+'" text-anchor="start" font-family="sans-serif" font-size="14" fill="#60a5fa" font-weight="700">'+esc(cfg.B||'')+'</text>';

// KaTeX rendering helper for math text in questions/notes
function renderMath(el) {
  if (!window.katex) return;
  // find $...$ spans and render them
  var nodes = el.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    if (node.nodeType === 3) { // text node
      var text = node.textContent;
      var m = text.match(/\$[^\$]+\$/g);
      if (m) {
        var frag = document.createDocumentFragment();
        var last = 0;
        m.forEach(function(match) {
          var idx = text.indexOf(match, last);
          if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
          var mathEl = document.createElement('span');
          mathEl.className = 'math-inline';
          try {
            katex.render(match.slice(1,-1), mathEl, { throwOnError: false, displayMode: false });
          } catch(e) { mathEl.textContent = match; }
          frag.appendChild(mathEl);
          last = idx + match.length;
        });
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        el.replaceChild(frag, node);
        i--;
      }
    }
  }
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

if (CH) {
  CH_LIST = MATH_DATA.filter(function(c){ return (c.g || "8") === GRADE; });
  for (var j = 0; j < CH_LIST.length; j++) { if (CH_LIST[j].id === CH_ID) { idx = j; break; } }
}
if (!CH) { document.getElementById("title").textContent = "Chapter not found"; }
else { render(); }

function pad(n){ return (n<10?"0":"") + n; }

function pad(n){ return (n<10?'0':'')+n; }
function nextBtn(label){ return '<button class="next-btn big" onclick="nextStep()">' + (label || 'Next ›') + '</button>'; }
function buildSteps() {
  var steps = [{type:'think'}];
  if (CH.subtopics && CH.subtopics.length) {
    CH.subtopics.forEach(function(st, si){ steps.push({type:'learn', si:si}); });
  } else {
    steps.push({type:'watch'});
    steps.push({type:'notes'});
    steps.push({type:'practice'});
  }
  steps.push({type:'quiz'});
  return steps;
}

function render() {
  document.getElementById("home").href = "index.html";
  document.getElementById("title").textContent = "G" + GRADE + "·" + pad(CH.gx || (idx+1)) + "  " + CH.title;
  var covTxt = {g:"🟢 KA video + practice + quiz", b:"🔵 KA video only", p:"🟣 custom only"}[CH.coverage] || "";
  document.getElementById("cov").textContent = covTxt;
  STEPS = buildSteps();
  TOTAL = STEPS.length;
  var labels = STEPS.map(function(s){
    if (s.type==='think') return 'Think';
    if (s.type==='learn') return CH.subtopics[s.si].name || ('Topic '+(s.si+1));
    if (s.type==='watch') return 'Watch';
    if (s.type==='notes') return 'Notes';
    if (s.type==='practice') return 'Practice';
    if (s.type==='quiz') return 'Quiz';
  });
  var sb = '';
  for (var i=1;i<=TOTAL;i++){
    sb += '<div class="sb'+(i===cur?' active':'')+(i<cur?' done':'')+'" onclick="showStep('+i+')"><span class="sb-num">'+i+'</span><span class="sb-label">'+esc(labels[i-1])+'</span></div>';
    if (i<TOTAL) sb += '<span class="arrow">›</span>';
  }
  document.getElementById("stepbar").innerHTML = sb;
  var ph = '';
  for (var k=1;k<=TOTAL;k++) ph += '<div class="panel" id="p'+k+'"></div>';
  document.getElementById("panels").innerHTML = ph;
  for (var s=1;s<=TOTAL;s++) renderPanel(s);
  showStep(1);
}

function showStep(step) {
  if (cur !== step) {
    var vids = document.querySelectorAll("#panels video");
    for (var vi=0; vi<vids.length; vi++){ vids[vi].pause(); vids[vi].currentTime = 0; }
  }
  cur = step;
  for (var i=1;i<=TOTAL;i++){
    var p = document.getElementById("p"+i);
    if (p) p.classList.toggle("active", i===step);
  }
  var sbs = document.querySelectorAll(".sb");
  for (var k=0;k<sbs.length;k++){
    sbs[k].classList.toggle("active", k===(step-1));
    sbs[k].classList.toggle("done", k<(step-1));
  }
  if (STEPS[step-1] && STEPS[step-1].type==='learn') updateMasteryBadge(STEPS[step-1].si);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderVideoHTML(vid) {
  var ytId = esc(vid.yt || '');
  var ytPageUrl = 'https://www.youtube.com/watch?v=' + ytId;
  var khanPageUrl = vid.ka || 'https://www.khanacademy.org';
  var localSrc = vid.local ? encodeURI(vid.local) : '';
  if (localSrc) {
    return '<div class="video-wrap" style="background:#000;">' +
      '<video controls preload="metadata" playsinline style="width:100%;max-width:640px;display:block;margin:0 auto;background:#000;" src="' + localSrc + '"></video>' +
      '<div class="video-meta"><strong>' + esc(vid.t || 'Khan Academy video') + '</strong><br>' +
      '<span style="color:#666;">' + esc(vid.m || 'English') + ' · ' + esc(vid.duration || '~10 min') + '</span><br>' +
      '<a href="' + khanPageUrl + '" target="_blank" class="vlink">Open on Khan Academy ↗</a>' +
      (ytId ? ' &nbsp;|&nbsp; <a href="' + ytPageUrl + '" target="_blank" class="vlink">Watch on YouTube ↗</a>' : '') + '</div></div>';
  }
  var ytThumb = 'https://img.youtube.com/vi/' + ytId + '/maxresdefault.jpg';
  return '<div class="video-wrap">' +
    '<a href="' + ytPageUrl + '" target="_blank" class="video-thumb-link" style="display:block;position:relative;">' +
    '<img src="' + ytThumb + '" alt="Video thumbnail" style="width:100%;max-width:640px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.15);" onerror="this.src=\'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg\';">' +
    '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;pointer-events:none;">' +
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div></a>' +
    '<div class="video-meta"><strong>' + esc(vid.t || 'Khan Academy video') + '</strong><br>' +
    '<span style="color:#666;">' + esc(vid.m || 'English') + ' · ' + esc(vid.duration || '~10 min') + '</span><br>' +
    '<a href="' + ytPageUrl + '" target="_blank" class="vlink">▶ Watch on YouTube ↗</a> &nbsp;|&nbsp; ' +
    '<a href="' + khanPageUrl + '" target="_blank" class="vlink">Open on Khan Academy ↗</a></div></div>';
}

function masteryKey(si){ return 'ka_mastery_' + CH.id + '_' + si; }
function getMastery(si){
  try { return JSON.parse(localStorage.getItem(masteryKey(si)) || '{"streak":0}'); }
  catch(e){ return {streak:0}; }
}
function setMastery(si, m){ localStorage.setItem(masteryKey(si), JSON.stringify(m)); }
function masteryLabel(m){
  var s = m.streak||0;
  if (s>=5) return {t:'掌握', c:'mastered'};
  if (s>=3) return {t:'熟练', c:'proficient'};
  if (s>=1) return {t:'了解', c:'familiar'};
  return {t:'未开始', c:'none'};
}
function updateMasteryBadge(si){
  var el = document.getElementById('mbadge'+si);
  if (!el) return;
  var lab = masteryLabel(getMastery(si));
  el.className = 'mbadge ' + lab.c;
  el.textContent = '掌握度：' + lab.t;
}

function renderPanel(step) {
  var p = document.getElementById("p"+step);
  if (!p || !CH) return;
  var S = STEPS[step-1];
  if (S.type==='think') {
    p.innerHTML = '<h2>Step '+step+' · Think</h2><div class="elicit" id="thinkBox"></div>' + nextBtn();
    var tb = document.getElementById("thinkBox"); tb.textContent = CH.think || ""; renderMath(tb);
  } else if (S.type==='learn') {
    var si = S.si, st = CH.subtopics[si];
    document.getElementById("paperNote").style.display = 'block';
    var h = '<h2>Step '+step+' · ' + esc(st.name) + '</h2>';
    h += '<div class="mbadge-wrap"><span class="mbadge none" id="mbadge'+si+'">掌握度：未开始</span></div>';
    h += '<div class="videos">' + (st.vids||[]).map(function(vi){ return renderVideoHTML(CH.videos[vi]); }).join('') + '</div>';
    h += '<h3 class="prac-head">练习 · Practice</h3><div class="practiceBox" id="pb'+si+'"></div>';
    h += nextBtn((si===CH.subtopics.length-1 ? 'Go to Quiz ›' : 'Next topic ›'));
    p.innerHTML = h;
    renderQs('pb'+si, st.pq.map(function(i){ return CH.practice[i]; }), 'p'+si, si);
    updateMasteryBadge(si);
  } else if (S.type==='watch') {
    var v = '<h2>Step '+step+' · Watch</h2>';
    (CH.videos||[]).forEach(function(vid){ v += renderVideoHTML(vid); });
    p.innerHTML = v + nextBtn();
  } else if (S.type==='notes') {
    var n = '<h2>Step '+step+' · Notes</h2><ul class="notes-list" id="notesList"></ul>';
    p.innerHTML = n + nextBtn();
    var nl = document.getElementById("notesList");
    (CH.notes||[]).forEach(function(nt){ var li=document.createElement("li"); li.textContent=nt; renderMath(li); nl.appendChild(li); });
  } else if (S.type==='practice') {
    document.getElementById("paperNote").style.display = 'block';
    p.innerHTML = '<h2>Step '+step+' · Practice</h2><div id="practiceBox"></div>' + nextBtn("Finish practice, next ›");
    renderQs("practiceBox", CH.practice||[], "p", -1);
  } else if (S.type==='quiz') {
    document.getElementById("paperNote").style.display = 'block';
    p.innerHTML = '<h2>Step '+step+' · Quiz (Unit Test)</h2><div id="quizBox"></div>' + nextBtn("Submit & see result ›");
    renderQs("quizBox", CH.quiz||[], "q", -1);
  }
}

function renderQs(boxId, questions, kind, si) {
  var c = document.getElementById(boxId);
  if (!c) return;
  if (!questions.length) { c.innerHTML = '<p style="color:var(--text2)">No questions yet.</p>'; return; }
  var html = "";
  questions.forEach(function(item, i){
    var qid = kind + 'q' + i;
    html += '<div class="q" id="'+qid+'"' + (item.ansIdx!==undefined ? ' data-ansidx="'+item.ansIdx+'"' : '') + '>';
    html += '<div class="qnum">Question ' + (i+1) + '</div>';
    html += '<div class="qtext">' + esc(item.q) + '</div>';
    if (item.hint) {
      html += '<button class="hint-btn" id="'+kind+'hint'+i+'btn" onclick="toggleHint(\''+kind+'\','+i+')">💡 Hint</button>';
      html += '<div class="hint-text" id="'+kind+'hint'+i+'" style="display:none;margin:8px 0;padding:9px 13px;background:#fffbeb;border:1px solid #f59e0b;border-radius:8px;font-size:13.5px;color:#92400e">💡 <span>'+esc(item.hint)+'</span></div>';
    }
    if (item.dia) html += (typeof item.dia==='string') ? item.dia : renderGraphie(item.dia);
    if (item.options && item.options.length) {
      html += '<div class="options" id="'+kind+'opt'+i+'">';
      var letters = ['A','B','C','D','E','F'];
      item.options.forEach(function(opt, oi){
        html += '<div class="opt" data-opt="'+oi+'" onclick="gradeOpt(\''+kind+'\','+i+','+oi+','+si+')"><span class="opt-l">'+letters[oi]+'</span><span class="opt-t">'+esc(opt)+'</span></div>';
      });
      html += '</div>';
    }
    html += '<div class="ans-area">';
    html += '<button class="show-ans-btn" id="'+kind+'sh'+i+'" onclick="showAns(\''+kind+'\','+i+')">Show answer &amp; solution</button>';
    html += '<div class="ans-display" id="'+kind+'ad'+i+'"><strong>Answer:</strong> '+esc(item.ans)+'</div>';
    html += '</div>';
    if (item.sol) {
      html += '<div class="sol" id="'+kind+'sol'+i+'"><div class="sol-header">📝 Solution</div><div class="sol-body">'+esc(item.sol)+'</div></div>';
    }
    html += '</div>';
  });
  c.innerHTML = html;
  setTimeout(function(){
    document.querySelectorAll('#'+boxId+' .qtext, #'+boxId+' .ans-display, #'+boxId+' .opt-t').forEach(renderMath);
  }, 100);
}

function gradeOpt(kind, i, oi, si) {
  var qEl = document.getElementById(kind+'q'+i);
  var ansIdx = qEl ? parseInt(qEl.getAttribute('data-ansidx')) : null;
  var optWrap = document.getElementById(kind+'opt'+i);
  if (!optWrap) return;
  var chosen = optWrap.querySelector('.opt[data-opt="'+oi+'"]');
  if (chosen.classList.contains('opt-done')) return;
  optWrap.querySelectorAll('.opt').forEach(function(o){ o.classList.add('opt-done'); });
  if (ansIdx===oi) {
    chosen.classList.add('opt-correct');
    if (si>=0) { var m=getMastery(si); m.streak=(m.streak||0)+1; setMastery(si,m); updateMasteryBadge(si); }
  } else {
    chosen.classList.add('opt-wrong');
    if (ansIdx!==null) { var co=optWrap.querySelector('.opt[data-opt="'+ansIdx+'"]'); if (co) co.classList.add('opt-correct'); }
    if (si>=0) { var m2=getMastery(si); m2.streak=0; setMastery(si,m2); updateMasteryBadge(si); }
  }
  var solEl = document.getElementById(kind+'sol'+i);
  if (solEl) solEl.style.display='block';
  var btn = document.getElementById(kind+'sh'+i);
  if (btn) btn.style.display='none';
  var ansEl = document.getElementById(kind+'ad'+i);
  if (ansEl) { ansEl.style.display='block'; renderMath(ansEl); }
  var sb = solEl ? solEl.querySelector('.sol-body') : null;
  if (sb) renderMath(sb);
}

function toggleHint(kind, i) {
  var hintEl = document.getElementById(kind+'hint'+i);
  var btn = document.getElementById(kind+'hint'+i+'btn');
  if (!hintEl) return;
  if (hintEl.style.display==='none') {
    hintEl.style.display='block'; if (btn) btn.textContent='🙈 Hide hint';
    hintEl.querySelectorAll('span').forEach(renderMath);
  } else { hintEl.style.display='none'; if (btn) btn.textContent='💡 Hint'; }
}

function showAns(kind, i) {
  var btn = document.getElementById(kind+'sh'+i);
  var ansEl = document.getElementById(kind+'ad'+i);
  var solEl = document.getElementById(kind+'sol'+i);
  if (ansEl) ansEl.style.display='block';
  if (solEl) solEl.style.display='block';
  if (btn) btn.style.display='none';
  var qEl = document.getElementById(kind+'q'+i);
  var ansIdx = qEl ? qEl.getAttribute('data-ansidx') : null;
  var optWrap = document.getElementById(kind+'opt'+i);
  if (optWrap && ansIdx!==null) {
    var correctOpt = optWrap.querySelector('.opt[data-opt="'+ansIdx+'"]');
    if (correctOpt) correctOpt.classList.add('opt-correct');
  }
  renderMath(ansEl);
  var solBody = solEl ? solEl.querySelector('.sol-body') : null;
  if (solBody) renderMath(solBody);
}

function nextStep() {
  if (cur < TOTAL) showStep(cur+1);
  else finish();
}
function finish() {
  var vids = document.querySelectorAll("#panels video");
  for (var vi=0; vi<vids.length; vi++){ vids[vi].pause(); vids[vi].currentTime=0; }
  for (var i=1;i<=TOTAL;i++) document.getElementById("p"+i).style.display='none';
  document.getElementById("stepbar").style.display='none';
  document.getElementById("done").classList.add("show");
  document.getElementById("doneText").textContent = "You finished G"+GRADE+"·"+pad(CH.gx||(idx+1))+" "+CH.title;
  var nx = CH_LIST[idx+1];
  var goNext = document.getElementById("goNext");
  if (nx) { goNext.href = "math_chapter.html?ch="+nx.id+"&grade="+GRADE; goNext.textContent="Go to next chapter ▶"; }
  else { goNext.href="index.html"; goNext.textContent="← Back to chapter list"; }
}
