<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math · Khan Academy</title>
<style>
:root{
  --bg:#0a0f1e; --card:#141d33; --card2:#1a2540;
  --text:#e8eef8; --text2:#9fb0c8; --text3:#64748b;
  --blue:#3b82f6; --blue-banner:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);
  --green:#10b981; --purple:#a855f7; --teal:#14b8a6;
  --border:#23304d; --shadow:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding:0 0 60px}
.banner{background:var(--blue-banner);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:8px}
.banner .home:hover{background:rgba(255,255,255,.28)}
.banner h1{font-size:18px;font-weight:800;flex:1;min-width:200px}
.banner .cov{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.stepbar{display:flex;gap:6px;align-items:center;margin:18px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);overflow-x:auto}
.sb{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;padding:4px 6px;border-radius:8px}
.sb-num{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:.15s}
.sb.active .sb-num{background:var(--blue);color:#fff}
.sb.done .sb-num{background:var(--green);color:#fff}
.sb-label{font-size:13px;font-weight:600;color:var(--text2)}
.sb.active .sb-label{color:var(--text)}
.arrow{color:var(--text3);font-size:13px}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:14px;box-shadow:var(--shadow)}
.panel.active{display:block}
.panel h2{font-size:17px;margin-bottom:12px;color:var(--blue)}
.elicit{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px;font-weight:600;color:#1e3a8a}
.video-wrap{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#000}
.bili{width:100%;height:480px;border:0;display:block}
.video-meta{font-size:13px;color:var(--text2);padding:10px 14px;background:var(--card2)}
.video-meta .vlink{color:var(--blue);font-weight:700;text-decoration:none;margin-left:6px}
.notes-list{list-style:none}
.notes-list li{background:#f0fdf4;border-left:4px solid var(--green);border-radius:8px;padding:11px 14px;margin-top:9px;color:#064e3b;font-size:14px}
.dia-wrap{margin:10px 0;text-align:center}
.dia-wrap svg{display:inline-block;max-width:100%}
.q{display:block;border:1px solid var(--border);border-radius:10px;padding:15px;margin-top:13px;background:var(--card2)}
.qtext{font-weight:600;margin-bottom:10px}
.qopt{display:block;width:100%;text-align:left;padding:10px 14px;margin-top:7px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:14px}
.qopt:hover{background:#f8fafc}
.qopt.correct{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.qopt.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.qopt:disabled{cursor:default;opacity:.85}
.fill-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:8px;background:var(--card);color:var(--text)}
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;display:none}
.fb.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;display:block}
.fb.no{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;display:block}
.sol{margin-top:8px;padding:9px 12px;background:#f0fdfa;border-left:4px solid var(--teal);border-radius:8px;font-size:13.5px;display:none;color:#134e4a}
.next-btn{background:var(--blue);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:18px}
.next-btn:hover{background:#2563eb}
.next-btn.sm{padding:8px 16px;margin-top:8px}
.next-btn.big{display:block;width:100%;font-size:15px;padding:14px}
.next-btn:disabled{opacity:.45;cursor:not-allowed}
.done-screen{display:none;text-align:center;padding:50px 20px}
.done-screen.show{display:block}
.done-screen .big{font-size:54px}
.done-screen h2{margin:12px 0;color:var(--green)}
.go-next{display:inline-block;margin-top:16px;background:var(--green);color:#fff;text-decoration:none;padding:12px 26px;border-radius:9px;font-weight:700}
.go-next:hover{background:#059669}
</style>
</head>
<body>
<div class="banner">
  <a class="home" id="home" href="index.html">← 目录</a>
  <h1 id="title">Loading…</h1>
  <span class="cov" id="cov"></span>
</div>
<div class="wrap">
  <div class="stepbar" id="stepbar"></div>
  <div class="panel" id="p1"></div>
  <div class="panel" id="p2"></div>
  <div class="panel" id="p3"></div>
  <div class="panel" id="p4"></div>
  <div class="panel" id="p5"></div>
  <div class="done-screen" id="done">
    <div class="big">🎉</div>
    <h2 id="doneTitle">Chapter complete!</h2>
    <p id="doneText"></p>
    <a class="go-next" id="goNext" href="#">Go to next chapter ▶</a>
  </div>
</div>

<script src="math_data.js"></script>
<script>
var params = new URLSearchParams(location.search);
var CH_ID = params.get("ch") || "ch01";
var GRADE = params.get("grade") || "8";
var TOTAL = 5, cur = 1;
var CH = null, CH_LIST = [], idx = -1;
for (var i = 0; i < MATH_DATA.length; i++) {
  if (MATH_DATA[i].id === CH_ID) { CH = MATH_DATA[i]; if (!GRADE) GRADE = CH.g || "8"; break; }
}
if (CH) {
  CH_LIST = MATH_DATA.filter(function(c){ return (c.g || "8") === GRADE; });
  for (var j = 0; j < CH_LIST.length; j++) { if (CH_LIST[j].id === CH_ID) { idx = j; break; } }
}
if (!CH) { document.getElementById("title").textContent = "Chapter not found"; }
else { render(); }

function pad(n){ return (n<10?"0":"") + n; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ────────────────────────────────────────────────────────
// graphie → SVG renderer
// Mimics Khan Academy's graphie betterTriangle() function:
//   vertices: C=(0,0), B=(width,0), A=(0,height)
//   right angle at C
// ────────────────────────────────────────────────────────
function renderGraphie(dia) {
  // dia = { type:'triangle', w, h, A, B, C, a, b, c }
  // KA scale: scale = 5 / sqrt(w²+h²), then px = unit * scale * 50
  // We use a fixed canvas with max triangle display size ~260px
  var w = dia.w, h = dia.h;
  var hyp = Math.sqrt(w*w + h*h);
  var scale = 260 / hyp; // max display length in px
  var W = Math.round(w * scale);
  var H = Math.round(h * scale);

  // viewBox with padding for labels (left=60, bottom=40, top=50, right=50)
  var PAD_L = 60, PAD_B = 45, PAD_T = 55, PAD_R = 55;
  var vx = PAD_L, vy = PAD_T;
  var vw = W + PAD_R, vh = H + PAD_B;

  // SVG pixel positions
  var Ax = vx,       Ay = vy + H;   // A = (0, h) in KA coords → top-left in SVG
  var Bx = vx + W,   By = vy + H;   // B = (w, h) → top-right
  var Cx = vx,       Cy = vy;       // C = (0, 0) → bottom-left (right angle)

  function lblX(x, y, side) {
    if (side === 'left') return Math.round(x - 14);
    if (side === 'below') return Math.round(x);
    if (side === 'above right') return Math.round(x + 10);
    if (side === 'above left') return Math.round(x - 14);
    return Math.round(x);
  }
  function lblY(x, y, side) {
    if (side === 'left') return Math.round(y);
    if (side === 'below') return Math.round(y + 18);
    if (side === 'above right') return Math.round(y - 8);
    if (side === 'above left') return Math.round(y - 8);
    return Math.round(y);
  }

  var lines = '';
  // Triangle path: A → B → C → close
  lines += '<polygon points="'
    + Ax + ',' + Ay + ' '
    + Bx + ',' + By + ' '
    + Cx + ',' + Cy
    + '" fill="none" stroke="#e2e8f0" stroke-width="1.8"/>';

  // Vertex labels (A, B, C)
  var vertexFontSize = 13;
  lines += '<text x="' + (Ax - 9) + '" y="' + (Ay - 8) + '" text-anchor="end" font-family="sans-serif" font-size="' + vertexFontSize + '" fill="#93c5fd" font-weight="700">' + esc(dia.A || '') + '</text>';
  lines += '<text x="' + (Bx + 9) + '" y="' + (By - 8) + '" text-anchor="start" font-family="sans-serif" font-size="' + vertexFontSize + '" fill="#93c5fd" font-weight="700">' + esc(dia.B || '') + '</text>';
  lines += '<text x="' + (Cx - 9) + '" y="' + (Cy + 16) + '" text-anchor="end" font-family="sans-serif" font-size="' + vertexFontSize + '" fill="#93c5fd" font-weight="700">' + esc(dia.C || '') + '</text>';

  // Side length labels
  var sideFontSize = 12;
  var boldSide = true;
  // Label b: midpoint of AC (left vertical edge, KA b = AC = height)
  var bmx = lblX((Ax+Cx)/2, (Ay+Cy)/2, 'left');
  var bmy = lblY((Ax+Cx)/2, (Ay+Cy)/2, 'left');
  lines += '<text x="' + bmx + '" y="' + bmy + '" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="' + sideFontSize + '" fill="#fbbf24" font-weight="700">' + esc(dia.b || '') + '</text>';

  // Label a: midpoint of BC (bottom horizontal edge, KA a = BC = width)
  var amx = lblX((Bx+Cx)/2, (By+Cy)/2, 'below');
  var amy = lblY((Bx+Cx)/2, (By+Cy)/2, 'below');
  lines += '<text x="' + amx + '" y="' + amy + '" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="' + sideFontSize + '" fill="#fbbf24" font-weight="700">' + esc(dia.a || '') + '</text>';

  // Label c: midpoint of AB (hypotenuse, top-right diagonal)
  var cmx = (Ax+Bx)/2;
  var cmy = (Ay+By)/2;
  // offset perpendicular to hypotenuse (upward = negative normal)
  var nx = -h/hyp, ny = w/hyp; // unit normal pointing "up" from hypotenuse
  var coff = 16;
  lines += '<text x="' + Math.round(cmx + nx*coff) + '" y="' + Math.round(cmy + ny*coff) + '" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="' + sideFontSize + '" fill="#fbbf24" font-weight="700">' + esc(dia.c || '') + '</text>';

  // Right angle marker at C
  var sq = 10;
  lines += '<path d="M ' + (Cx) + ',' + (Cy + sq) + ' L ' + (Cx) + ',' + (Cy) + ' L ' + (Cx + sq) + ',' + (Cy) + '" fill="none" stroke="#94a3b8" stroke-width="1.2"/>';

  // 30° / 60° arc markers if provided (for special right triangles)
  if (dia.angle30) {
    // arc near the 30° vertex (which one depends on angle30: 'A' or 'B')
    if (dia.angle30 === 'A' || dia.angle30 === true) {
      var arcR = 18, ax0 = Ax + sq*1.5, ay0 = Ay - sq*1.5;
      var ax1 = Ax - sq*1.5, ay1 = Ay - sq*1.5;
      var axc = Ax, ayc = Ay - sq*2.5;
      lines += '<path d="M ' + ax0 + ',' + ay0 + ' Q ' + axc + ',' + ayc + ' ' + ax1 + ',' + ay1 + '" fill="none" stroke="#86efac" stroke-width="1.2"/>';
      lines += '<text x="' + (axc - 4) + '" y="' + (ayc - 4) + '" font-family="sans-serif" font-size="10" fill="#86efac">30°</text>';
    }
    if (dia.angle30 === 'B' || dia.angle30 === true) {
      var arcR = 18, bx0 = Bx - sq*1.5, by0 = By - sq*1.5;
      var bx1 = Bx - sq*1.5, by1 = By + sq*1.5;
      var bxc = Bx - sq*2.5, byc = By;
      lines += '<path d="M ' + bx0 + ',' + by0 + ' Q ' + bxc + ',' + byc + ' ' + bx1 + ',' + by1 + '" fill="none" stroke="#86efac" stroke-width="1.2"/>';
      lines += '<text x="' + (bxc + 3) + '" y="' + (byc + 14) + '" font-family="sans-serif" font-size="10" fill="#86efac">60°</text>';
    }
  }

  var svg = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + vw + '" height="' + vh + '" xmlns="http://www.w3.org/2000/svg">' + lines + '</svg>';
  return '<div class="dia-wrap">' + svg + '</div>';
}

// ────────────────────────────────────────────────────────
function render() {
  document.getElementById("home").href = "index.html";
  document.getElementById("title").textContent = "G" + GRADE + "·" + pad(CH.gx || (idx+1)) + "  " + CH.title;
  var covTxt = {g:"🟢 KA video + practice + quiz", b:"🔵 KA video only", p:"🟣 custom only"}[CH.coverage] || "";
  document.getElementById("cov").textContent = covTxt;
  var labels = ["Think","Watch","Notes","Practice","Quiz"];
  var sb = "";
  for (var i = 1; i <= TOTAL; i++) {
    sb += '<div class="sb' + (i===cur?" active":"") + (i<cur?" done":"") + '" onclick="showStep(' + i + ')"><span class="sb-num">' + i + '</span><span class="sb-label">' + labels[i-1] + '</span></div>';
    if (i < TOTAL) sb += '<span class="arrow">›</span>';
  }
  document.getElementById("stepbar").innerHTML = sb;
  for (var s = 1; s <= TOTAL; s++) renderPanel(s);
  showStep(1);
}
function showStep(step) {
  if (cur === 2 && step !== 2) {
    var f = document.querySelector("#p2 iframe.bili");
    if (f) f.src = "about:blank";
  }
  cur = step;
  for (var i = 1; i <= TOTAL; i++) {
    var p = document.getElementById("p" + i);
    if (p) p.classList.toggle("active", i === step);
  }
  var sbs = document.querySelectorAll(".sb");
  for (var k = 0; k < sbs.length; k++) {
    sbs[k].classList.toggle("active", k === (step-1));
    sbs[k].classList.toggle("done", k < (step-1));
  }
  if (step === 2) renderPanel(2);
  window.scrollTo({top:0, behavior:"smooth"});
}
function nextBtn(label) {
  var txt = label || "Next ›";
  return '<button class="next-btn big" onclick="nextStep()">' + txt + '</button>';
}
function renderPanel(step) {
  var p = document.getElementById("p" + step);
  if (!p || !CH) return;
  if (step === 1) {
    p.innerHTML = '<h2>Step 1 · Think</h2><div class="elicit">' + esc(CH.think || "") + '</div>' + nextBtn();
  } else if (step === 2) {
    var v = '<h2>Step 2 · Watch</h2>';
    (CH.videos || []).forEach(function(vid){
      v += '<div class="video-wrap"><iframe class="bili" src="https://www.youtube-nocookie.com/embed/' + esc(vid.yt) + '?rel=0" allowfullscreen="true"></iframe>' +
           '<div class="video-meta">' + esc(vid.t || "Khan Academy video") + ' · ' + esc(vid.m || "English") +
           ' <a class="vlink" href="https://www.youtube.com/watch?v=' + esc(vid.yt) + '" target="_blank">Open on YouTube ↗</a></div></div>';
    });
    p.innerHTML = v + nextBtn();
  } else if (step === 3) {
    var n = '<h2>Step 3 · Notes</h2><ul class="notes-list">';
    (CH.notes || []).forEach(function(nt){ n += '<li>' + esc(nt) + '</li>'; });
    n += '</ul>';
    p.innerHTML = n + nextBtn();
  } else if (step === 4) {
    p.innerHTML = '<h2>Step 4 · Practice</h2><div id="practiceBox"></div>' + nextBtn("Finish practice, next ›");
    renderQs("practiceBox", CH.practice || [], "p");
  } else if (step === 5) {
    p.innerHTML = '<h2>Step 5 · Quiz</h2><div id="quizBox"></div>' + nextBtn("Submit & see result ›");
    renderQs("quizBox", CH.quiz || [], "q");
  }
}
function renderQs(boxId, questions, kind) {
  var c = document.getElementById(boxId);
  if (!c) return;
  if (!questions.length) { c.innerHTML = '<p style="color:var(--text2)">No questions for this step yet.</p>'; return; }
  var html = "";
  questions.forEach(function(item, i){
    html += '<div class="q" id="' + kind + 'q' + i + '">';
    html += '<div class="qtext">' + (i+1) + '. ' + esc(item.q) + '</div>';
    // Render graphie diagram if present
    if (item.dia) html += renderGraphie(item.dia);
    if (item.type === "choice") {
      item.opts.forEach(function(opt, k){
        html += '<button class="qopt" id="' + kind + 'opt' + i + '_' + k + '">' + esc(opt) + '</button>';
      });
    } else {
      html += '<input class="fill-input" id="' + kind + 'fill' + i + '" placeholder="Type your answer">';
      html += '<button class="next-btn sm" onclick="checkFill(\'' + kind + '\',' + i + ')">Check</button>';
    }
    html += '<div class="fb" id="' + kind + 'fb' + i + '"></div>';
    html += '<div class="sol" id="' + kind + 'sol' + i + '">' + esc(item.sol || "") + '</div>';
    html += '</div>';
  });
  c.innerHTML = html;
  questions.forEach(function(item, i){
    if (item.type === "choice") {
      item.opts.forEach(function(opt, k){
        var btn = document.getElementById(kind + "opt" + i + "_" + k);
        btn.addEventListener("click", function(){ pickChoice(kind, i, opt, item.ans, item.sol); });
      });
    }
  });
}
function pickChoice(kind, i, picked, correct, sol) {
  var fb = document.getElementById(kind + "fb" + i);
  var solEl = document.getElementById(kind + "sol" + i);
  var opts = document.getElementById(kind + "q" + i).querySelectorAll(".qopt");
  for (var k = 0; k < opts.length; k++) {
    opts[k].disabled = true;
    var val = opts[k].textContent;
    if (val === correct) opts[k].classList.add("correct");
    if (val === picked && picked !== correct) opts[k].classList.add("wrong");
  }
  if (picked === correct) { fb.className = "fb ok"; fb.textContent = "✓ Correct!"; }
  else { fb.className = "fb no"; fb.textContent = "✗ Not quite. See the solution below."; }
  solEl.style.display = "block";
}
function checkFill(kind, i) {
  var item = (kind === "p" ? CH.practice : CH.quiz)[i];
  var input = document.getElementById(kind + "fill" + i);
  var fb = document.getElementById(kind + "fb" + i);
  var solEl = document.getElementById(kind + "sol" + i);
  var user = input.value.trim().toLowerCase().replace(/\s+/g," ");
  var ans = String(item.ans).trim().toLowerCase().replace(/\s+/g," ");
  if (user === ans) { fb.className = "fb ok"; fb.textContent = "✓ Correct!"; }
  else { fb.className = "fb no"; fb.textContent = "✗ Not quite. See the solution below."; }
  solEl.style.display = "block";
}
function nextStep() {
  if (cur < TOTAL) { showStep(cur + 1); }
  else { finish(); }
}
function finish() {
  var f = document.querySelector("#p2 iframe.bili");
  if (f) f.src = "about:blank";
  for (var i = 1; i <= TOTAL; i++) document.getElementById("p" + i).style.display = "none";
  document.getElementById("stepbar").style.display = "none";
  document.getElementById("done").classList.add("show");
  document.getElementById("doneText").textContent = "You finished G" + GRADE + "·" + pad(CH.gx || (idx+1)) + " " + CH.title;
  var nx = CH_LIST[idx + 1];
  var goNext = document.getElementById("goNext");
  if (nx) { goNext.href = "math_chapter.html?ch=" + nx.id + "&grade=" + GRADE; goNext.textContent = "Go to next chapter ▶"; }
  else { goNext.href = "index.html"; goNext.textContent = "← Back to chapter list"; }
}
</script>
</body>
</html>
