<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八年级数学 · 北师大版 — Khan Academy 学习模式</title>
<!-- KaTeX for LaTeX math rendering (MIT licensed) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --accent:#14bf96;          /* physics: sky-blue (math uses #14bf96 green) */
    --accent-dark:#0d9668;
    --accent-soft:#dcfce7;
    --bg:#f7f8fa;
    --surface:#ffffff;
    --border:#e3e6ea;
    --border-strong:#cfd5dc;
    --text:#1f2937;
    --text2:#5b6673;
    --text3:#8b95a1;
    --ok:#10b981;
    --ok-soft:#d1fae5;
    --err:#ef4444;
    --err-soft:#fee2e2;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
    --sidebar-w:300px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased}

  /* ---------- top bar ---------- */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:0 20px;height:58px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.2px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
  .topbar .ver{font-size:12px;color:var(--text3);font-weight:600}
  .topbar .spacer{flex:1}
  .navlink{font-size:13px;font-weight:700;color:var(--text2);text-decoration:none;
    padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface)}
  .navlink:hover{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent)}
  .navlink.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .navlink.primary:hover{background:var(--accent-dark);color:#fff}

  /* ---------- layout ---------- */
  .layout{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);
    border-right:1px solid var(--border);position:sticky;top:58px;
    height:calc(100vh - 58px);overflow-y:auto;padding:16px 12px 40px}
  .side-title{font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;
    letter-spacing:.6px;padding:6px 10px 10px}
  .unit{margin-bottom:3px}
  .unit-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
    cursor:pointer;font-size:13.5px;font-weight:700;color:var(--text);user-select:none}
  .unit-head:hover{background:var(--bg)}
  .unit.active .unit-head{background:var(--accent-soft);color:var(--accent-dark)}
  .unit-head .chev{font-size:10px;color:var(--text3);transition:transform .15s;flex:0 0 10px}
  .unit.open .unit-head .chev{transform:rotate(90deg)}
  .unit-head .unum{flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    background:var(--bg);border:1px solid var(--border-strong);color:var(--text2);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .unit.active .unit-head .unum{background:var(--accent);color:#fff;border-color:var(--accent)}
  .unit-head .uname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit-head .prog{font-size:10.5px;font-weight:800;color:var(--text3);
    background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:1px 7px}
  .unit.done .unit-head .prog{background:var(--ok-soft);color:#047857;border-color:#a7f3d0}
  .lessons{display:none;padding:2px 0 6px 0}
  .unit.open .lessons{display:block}
  .lesson{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 40px;
    font-size:12.5px;color:var(--text2);cursor:pointer;border-radius:8px;line-height:1.5}
  .lesson:hover{background:var(--bg);color:var(--text)}
  .lesson.active{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
  .lesson .tick{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-strong);
    flex:0 0 15px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
  .lesson.seen .tick{background:var(--ok);border-color:var(--ok)}
  .lesson.active .tick{border-color:var(--accent)}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;padding:26px 30px 70px;max-width:960px}
  .crumb{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:8px}
  .ch-title{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px;line-height:1.25}
  .ch-sub{font-size:14px;color:var(--text2);margin:0 0 16px}
  .mastery{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:13px 16px;margin-bottom:20px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mastery .lbl{font-size:12.5px;font-weight:800;color:var(--text2)}
  .mbar{flex:1;min-width:160px;height:8px;background:var(--bg);border-radius:20px;overflow:hidden}
  .mbar i{display:block;height:100%;background:var(--accent);border-radius:20px;
    transition:width .3s;width:0}
  .mastery .pct{font-size:12.5px;font-weight:800;color:var(--accent-dark);min-width:38px;text-align:right}

  /* ---------- tabs (real Khan style: underline) ---------- */
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:22px;
    overflow-x:auto}
  .tab{appearance:none;background:none;border:0;cursor:pointer;font:inherit;
    font-size:14px;font-weight:700;color:var(--text2);padding:11px 15px;
    border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;
    display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text);background:var(--bg)}
  .tab.active{color:var(--accent-dark);border-bottom-color:var(--accent)}
  .tab .tnum{width:19px;height:19px;border-radius:50%;background:var(--bg);
    border:1px solid var(--border-strong);color:var(--text2);font-size:10.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .tab.active .tnum{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab.done .tnum{background:var(--ok);color:#fff;border-color:var(--ok)}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:15.5px;font-weight:800}
  .card p{margin:0 0 10px}
  .card p:last-child{margin-bottom:0}
  .muted{color:var(--text2);font-size:13.5px}
  .elicit{background:var(--accent-soft);border-left:4px solid var(--accent);
    border-radius:10px;padding:15px 17px;font-size:14.5px;font-weight:600;color:#065f46}
  .empty{background:var(--bg);border:1px dashed var(--border-strong);border-radius:10px;
    padding:22px;text-align:center;color:var(--text3);font-size:13.5px}

  /* ---------- video ---------- */
  .vid{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:14px;
    background:var(--surface);box-shadow:var(--shadow)}
  .vid .frame{position:relative;padding-bottom:56.25%;background:#0b1220}
  .vid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vid .meta{padding:12px 15px;border-top:1px solid var(--border);background:var(--surface)}
  .vid .meta b{font-size:14px;display:block;margin-bottom:3px}
  .vid .meta a{color:var(--accent);font-weight:700;text-decoration:none;font-size:13px}
  .vid .meta a:hover{text-decoration:underline}
  .vid.linkonly .meta{padding:18px 16px;border-top:0}
  .vid.linkonly .meta span{color:var(--text2);font-size:12.5px}

  /* ---------- notes ---------- */
  .note{border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:13px;
    background:var(--surface);box-shadow:var(--shadow)}
  .note .nlabel{font-size:11px;font-weight:800;color:var(--accent-dark);
    background:var(--accent-soft);border-radius:20px;padding:2px 9px;display:inline-block;margin-bottom:8px}
  .note .nbody{font-size:14px;color:var(--text);white-space:pre-wrap}

  /* ---------- questions ---------- */
  .q{border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:15px;
    background:var(--surface);box-shadow:var(--shadow)}
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .qnum{font-size:11.5px;font-weight:800;color:var(--text3)}
  .qsrc{font-size:10.5px;font-weight:700;color:var(--text3);background:var(--bg);
    border:1px solid var(--border);border-radius:20px;padding:2px 8px}
  .qtext{font-size:14.5px;font-weight:600;margin-bottom:13px;line-height:1.7}
  .qdia{margin-bottom:13px;text-align:center}
  .qdia svg{max-width:100%;height:auto;border:1px solid var(--border);border-radius:9px;background:#fff}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
    border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface);
    font-size:14px;transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--border-strong);background:var(--bg)}
  .opt .ol{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--bg);
    border:1px solid var(--border-strong);color:var(--text2);font-size:11.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .ol{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opt.good{border-color:var(--ok);background:var(--ok-soft)}
  .opt.good .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.bad{border-color:var(--err);background:var(--err-soft)}
  .opt.bad .ol{background:var(--err);color:#fff;border-color:var(--err)}
  .qact{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px;align-items:center}
  .btn{appearance:none;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    padding:8px 15px;border-radius:9px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text)}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.ghost{border-color:transparent;background:var(--bg);color:var(--text2)}
  .feedback{margin:0;font-size:13.5px;font-weight:700}
  .feedback.ok{color:#047857}
  .feedback.no{color:#b91c1c}
  .hintbox{margin-top:11px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;
    padding:11px 13px;font-size:13.5px;color:#92400e}
  .solbox{margin-top:11px;background:var(--bg);border:1px solid var(--border);
    border-radius:9px;padding:13px 15px;font-size:13.5px;color:var(--text)}
  .solbox b{color:var(--accent-dark)}

  /* ---------- bank switch ---------- */
  .bankbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .bankbar .bl{font-size:12px;font-weight:800;color:var(--text3)}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:3px;gap:3px}
  .seg button{appearance:none;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    border:0;background:transparent;color:var(--text2);padding:6px 13px;border-radius:7px}
  .seg button.on{background:var(--surface);color:var(--accent-dark);box-shadow:var(--shadow)}

  /* ---------- footer nav ---------- */
  .chapnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;
    padding-top:20px;border-top:1px solid var(--border)}
  .chapnav a{font-size:13.5px;font-weight:700;color:var(--accent-dark);text-decoration:none;
    padding:10px 15px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .chapnav a:hover{background:var(--accent-soft);border-color:var(--accent)}
  .chapnav a.off{opacity:.4;pointer-events:none}

  @media (max-width:860px){
    .sidebar{position:static;width:100%;flex:none;height:auto;border-right:0;
      border-bottom:1px solid var(--border)}
    .layout{flex-direction:column}
    .main{padding:18px 16px 50px}
    .ch-title{font-size:22px}
  }
</style>
</head>

  <div class="brand"><span class="dot">📐</span> 八年级数学</div>

<script src="math_data.js?v=20261018b"></script>
<script>
(function(){
  "use strict";

  var DATA = (typeof MATH_DATA !== "undefined") ? MATH_DATA : [];
  var GRADE = new URLSearchParams(location.search).get("grade") || "8";
  var LS_KEY = "math_prog_v1";

  var state = {
    chId: new URLSearchParams(location.search).get("ch") || (DATA[0] && DATA[0].id),
    tab: "think",
    lesson: -1,
    bank: "ka",
    prog: loadProg()
  };

  var TABS = [
    {k:"think",    n:"1", zh:"预习", en:"Think"},
    {k:"watch",    n:"2", zh:"学习", en:"Watch"},
    {k:"notes",    n:"3", zh:"复习", en:"Notes"},
    {k:"practice", n:"4", zh:"练习", en:"Practice"},
    {k:"quiz",     n:"5", zh:"考试", en:"Quiz"}
  ];

  function loadProg(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
  function saveProg(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.prog)); }catch(e){} }
  function chapter(){ return DATA.find(function(c){ return c.id === state.chId; }) || DATA[0]; }
  function chProg(id){ return state.prog[id] || {}; }
  function markDone(tab){
    var p = state.prog[state.chId] || (state.prog[state.chId] = {});
    p[tab] = 1; saveProg();
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

  function tex(root){
    if (window.renderMathInElement) {
      try{ window.renderMathInElement(root, {
        delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
        throwOnError:false }); }catch(e){}
    }
  }

  /* ---------- graph rendering (s-t / v-t) ---------- */
  function graphSVG(d){
    if(!d || !d.lines) return "";
    var W=420,H=250,pl=52,pr=16,pt=16,pb=42;
    var xr=d.xRange||[0,10], yr=d.yRange||[0,10];
    var xs=d.xStep||((xr[1]-xr[0])/5), ys=d.yStep||((yr[1]-yr[0])/5);
    function X(v){ return pl + (v-xr[0])/((xr[1]-xr[0])||1)*(W-pl-pr); }
    function Y(v){ return H-pb - (v-yr[0])/((yr[1]-yr[0])||1)*(H-pb-pt); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#ffffff"/>';
    var gx,gy;
    for(gx=xr[0]; gx<=xr[1]+1e-9; gx+=xs){
      s+='<line x1="'+X(gx)+'" y1="'+pt+'" x2="'+X(gx)+'" y2="'+(H-pb)+'" stroke="#eef1f5" stroke-width="1"/>';
      s+='<text x="'+X(gx)+'" y="'+(H-pb+17)+'" font-size="11" fill="#8b95a1" text-anchor="middle">'+gx+'</text>';
    }
    for(gy=yr[0]; gy<=yr[1]+1e-9; gy+=ys){
      s+='<line x1="'+pl+'" y1="'+Y(gy)+'" x2="'+(W-pr)+'" y2="'+Y(gy)+'" stroke="#eef1f5" stroke-width="1"/>';
      s+='<text x="'+(pl-8)+'" y="'+(Y(gy)+4)+'" font-size="11" fill="#8b95a1" text-anchor="end">'+gy+'</text>';
    }
    s+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(H-pb)+'" stroke="#5b6673" stroke-width="1.6"/>';
    s+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="#5b6673" stroke-width="1.6"/>';
    s+='<text x="'+((pl+W-pr)/2)+'" y="'+(H-8)+'" font-size="12" fill="#5b6673" text-anchor="middle">'+esc(d.xLabel||"")+'</text>';
    s+='<text x="14" y="'+(pt+12)+'" font-size="12" fill="#5b6673">'+esc(d.yLabel||"")+'</text>';
    var pal=["#14bf96","#f59e0b","#10b981","#a855f7"];
    (d.lines||[]).forEach(function(ln,i){
      var pts=(ln.pts||[]).map(function(p){ return X(p[0])+","+Y(p[1]); }).join(" ");
      s+='<polyline points="'+pts+'" fill="none" stroke="'+(pal[i%pal.length])+'" stroke-width="2.4" stroke-linejoin="round"/>';
      (ln.pts||[]).forEach(function(p){
        s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.2" fill="#fff" stroke="'+(pal[i%pal.length])+'" stroke-width="2"/>';
      });
    });
    s+='</svg>';
    return s;
  }

  /* ---------- diagram dispatcher (math: triangle / coord_plane / angle; physics: s-t / v-t) ---------- */
  function svgWrap(w,h,inner){
    return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
           '<rect x="0" y="0" width="'+w+'" height="'+h+'" fill="#ffffff"/>'+inner+'</svg>';
  }
  function rnd(v){ return Math.round(v*100)/100; }

  function renderDiagram(d){
    if(!d) return "";
    if(d.type==="triangle")    return triangleSVG(d);
    if(d.type==="coord_plane") return coordSVG(d);
    if(d.type==="angle")       return angleSVG(d);
    if(d.lines)                return graphSVG(d);
    return "";
  }

  /* right triangle: C = bottom-left (right angle), A = top-left, B = bottom-right
     side a = BC (bottom), side b = AC (left), side c = AB (hypotenuse) */
  function triangleSVG(d){
    var W=340,H=230,pad=60;
    var w=Number(d.w)||5, h=Number(d.h)||3.3;
    var s=Math.min((W-pad*2)/(w||1),(H-pad*2)/(h||1));
    var bw=w*s, bh=h*s;
    var ox=(W-bw)/2, oy=(H-bh)/2+6;
    var Cx=ox, Cy=oy+bh, Ax=ox, Ay=oy, Bx=ox+bw, By=oy+bh;
    var o='<polygon points="'+Ax+','+Ay+' '+Bx+','+By+' '+Cx+','+Cy+'" fill="#ecfdf5" '+
          'stroke="#14bf96" stroke-width="2.2" stroke-linejoin="round"/>';
    var m=Math.min(15,bw*0.17,bh*0.17);
    o+='<path d="M '+(Cx+m)+' '+Cy+' L '+(Cx+m)+' '+(Cy-m)+' L '+Cx+' '+(Cy-m)+'" '+
       'fill="none" stroke="#14bf96" stroke-width="1.8"/>';
    function lbl(x,y,t,anchor){
      if(t==null||t===""||t==="?") return "";
      return '<text x="'+x+'" y="'+y+'" font-size="14" font-weight="700" fill="#1f2937" text-anchor="'+
             (anchor||"middle")+'">'+esc(t)+'</text>';
    }
    function vtx(x,y,t,anchor){
      return '<text x="'+x+'" y="'+y+'" font-size="15" font-weight="800" fill="#0d9668" text-anchor="'+
             (anchor||"middle")+'">'+esc(t)+'</text>';
    }
    o+=lbl((Cx+Bx)/2, Cy+22, d.a);              // bottom side = a
    o+=lbl(Cx-20, (Ay+Cy)/2+4, d.b, "end");     // left side   = b
    o+=lbl((Ax+Bx)/2+18, (Ay+By)/2-2, d.c, "start"); // hypotenuse = c
    o+=vtx(Ax-6, Ay-8, "A");
    o+=vtx(Bx+10, By+20, "B", "start");
    o+=vtx(Cx-8, Cy+20, "C");
    return svgWrap(W,H,o);
  }

  function coordSVG(d){
    var W=420,H=250,pl=44,pr=22,pt=22,pb=44;
    var r=d.range||[[-5,5],[-5,5]], st=Number(d.step)||1;
    var xr=r[0]||[-5,5], yr=r[1]||[-5,5];
    function X(v){ return pl+(v-xr[0])/((xr[1]-xr[0])||1)*(W-pl-pr); }
    function Y(v){ return H-pb-(v-yr[0])/((yr[1]-yr[0])||1)*(H-pb-pt); }
    var o='',gx,gy;
    for(gx=Math.ceil(xr[0]/st)*st; gx<=xr[1]+1e-9; gx+=st){
      o+='<line x1="'+X(gx)+'" y1="'+pt+'" x2="'+X(gx)+'" y2="'+(H-pb)+'" stroke="#eef1f5" stroke-width="1"/>';
      o+='<text x="'+X(gx)+'" y="'+(H-pb+18)+'" font-size="11" fill="#8b95a1" text-anchor="middle">'+rnd(gx)+'</text>';
    }
    for(gy=Math.ceil(yr[0]/st)*st; gy<=yr[1]+1e-9; gy+=st){
      o+='<line x1="'+pl+'" y1="'+Y(gy)+'" x2="'+(W-pr)+'" y2="'+Y(gy)+'" stroke="#eef1f5" stroke-width="1"/>';
      o+='<text x="'+(pl-8)+'" y="'+(Y(gy)+4)+'" font-size="11" fill="#8b95a1" text-anchor="end">'+rnd(gy)+'</text>';
    }
    if(yr[0]<=0 && 0<=yr[1]){
      o+='<line x1="'+pl+'" y1="'+Y(0)+'" x2="'+(W-pr)+'" y2="'+Y(0)+'" stroke="#5b6673" stroke-width="1.8"/>';
    }
    (d.points||[]).forEach(function(p){
      var px=(p["0"]!==undefined)?p["0"]:p.x, py=(p["1"]!==undefined)?p["1"]:p.y;
      var cx=X(px), cy=Y(py);
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#14bf96" stroke="#fff" stroke-width="2"/>';
      if(p.label) o+='<text x="'+cx+'" y="'+(cy-12)+'" font-size="12" font-weight="700" '+
                     'fill="#0d9668" text-anchor="middle">'+esc(p.label)+'</text>';
    });
    return svgWrap(W,H,o);
  }

  function angleSVG(d){
    var W=300,H=190, ox=54, oy=H-48, L=W-ox-50;
    var deg=Number(d.degree)||60, rad=deg*Math.PI/180;
    var ex=ox+L, ey=oy;
    var fx=ox+L*Math.cos(rad), fy=oy-L*Math.sin(rad);
    var o='<line x1="'+ox+'" y1="'+oy+'" x2="'+ex+'" y2="'+ey+'" stroke="#14bf96" stroke-width="2.4"/>';
    o+='<line x1="'+ox+'" y1="'+oy+'" x2="'+fx+'" y2="'+fy+'" stroke="#14bf96" stroke-width="2.4"/>';
    var ar=Math.min(38,L*0.42);
    var a0x=ox+ar, a0y=oy, a1x=ox+ar*Math.cos(rad), a1y=oy-ar*Math.sin(rad);
    o+='<path d="M '+a0x+' '+a0y+' A '+ar+' '+ar+' 0 0 0 '+a1x+' '+a1y+'" fill="none" '+
       'stroke="#f59e0b" stroke-width="2.2"/>';
    o+='<text x="'+(ox+ar+18)+'" y="'+(oy-ar*0.6)+'" font-size="15" font-weight="800" fill="#b45309">'+deg+'°</text>';
    o+='<circle cx="'+ox+'" cy="'+oy+'" r="3.5" fill="#14bf96"/>';
    return svgWrap(W,H,o);
  }

  /* ---------- sidebar ---------- */
  function renderSidebar(){
    var host=document.getElementById("units"); var h="";
    DATA.forEach(function(ch,i){
      var p=chProg(ch.id);
      var doneN=TABS.filter(function(t){ return p[t.k]; }).length;
      var open=(ch.id===state.chId);
      var isDone=doneN>=TABS.length;
      h+='<div class="unit'+(open?" open active":"")+(isDone?" done":"")+'" data-ch="'+esc(ch.id)+'">';
      h+=  '<div class="unit-head" data-toggle="'+esc(ch.id)+'">';
      h+=    '<span class="chev">&#9654;</span>';
      h+=    '<span class="unum">'+(i+1)+'</span>';
      h+=    '<span class="uname">'+esc(ch.title)+'</span>';
      h+=    '<span class="prog">'+doneN+"/"+TABS.length+'</span>';
      h+=  '</div>';
      h+=  '<div class="lessons">';
      (ch.subtopics||[]).forEach(function(st,si){
        var seen = p["L"+si];
        h+= '<div class="lesson'+(open&&state.lesson===si?" active":"")+(seen?" seen":"")+'" '+
            'data-ch="'+esc(ch.id)+'" data-lesson="'+si+'">'+
            '<span class="tick">'+(seen?"&#10003;":"")+'</span><span>'+esc(st.name)+'</span></div>';
      });
      h+=  '</div>';
      h+='</div>';
    });
    host.innerHTML=h;

    host.querySelectorAll("[data-toggle]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id=el.getAttribute("data-toggle");
        if(id!==state.chId){ state.chId=id; state.lesson=-1; state.tab="think"; }
        else { el.parentNode.classList.toggle("open"); }
        render();
      });
    });
    host.querySelectorAll("[data-lesson]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        state.chId=el.getAttribute("data-ch");
        state.lesson=parseInt(el.getAttribute("data-lesson"),10);
        state.tab="watch";
        var p=state.prog[state.chId]||(state.prog[state.chId]={});
        p["L"+state.lesson]=1; saveProg();
        render();
      });
    });
  }

  /* ---------- tabs ---------- */
  function renderTabs(){
    var p=chProg(state.chId); var h="";
    TABS.forEach(function(t){
      h+='<button class="tab'+(state.tab===t.k?" active":"")+(p[t.k]?" done":"")+'" data-tab="'+t.k+'">'+
         '<span class="tnum">'+(p[t.k]?"&#10003;":t.n)+'</span>'+t.en+' · '+t.zh+'</button>';
    });
    var host=document.getElementById("tabs");
    host.innerHTML=h;
    host.querySelectorAll("[data-tab]").forEach(function(b){
      b.addEventListener("click", function(){ state.tab=b.getAttribute("data-tab"); render(); });
    });
  }

  function renderMastery(){
    var p=chProg(state.chId);
    var n=TABS.filter(function(t){ return p[t.k]; }).length;
    var pct=Math.round(n/TABS.length*100);
    document.getElementById("mbarFill").style.width=pct+"%";
    document.getElementById("mbarPct").textContent=pct+"%";
  }

  /* ---------- video ---------- */
  function videoHTML(v){
    if(v.yt){
      return '<div class="vid">'+
        '<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(v.yt)+'" '+
        'title="'+esc(v.t||"")+'" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" '+
        'allowfullscreen></iframe></div>'+
        '<div class="meta"><b>'+esc(v.t||"Khan Academy")+'</b>'+
        (v.ka?'<a href="'+esc(v.ka)+'" target="_blank" rel="noopener">在 Khan Academy 打开 &#8599;</a>':'')+
        '</div></div>';
    }
    return '<div class="vid linkonly"><div class="meta">'+
      '<b>'+esc(v.t||"Khan Academy 资源")+'</b>'+
      '<span>'+esc(v.m||"Khan Academy")+'</span><br><br>'+
      (v.ka?'<a href="'+esc(v.ka)+'" target="_blank" rel="noopener">&#9654; 在 Khan Academy 观看 &#8599;</a>':'')+
      '</div></div>';
  }

  /* ---------- question ---------- */
  function questionHTML(q, idx, ns){
    var ansStr=String(q.ansIdx);
    var multi=ansStr.indexOf(",")>=0;
    var h='<div class="q" data-q="'+idx+'" data-ns="'+ns+'">';
    h+='<div class="qhead"><span class="qnum">第 '+(idx+1)+' 题'+(multi?" · 多选":"")+'</span>'+
       (q.source?'<span class="qsrc">'+esc(q.source)+'</span>':'')+'</div>';
    h+='<div class="qtext">'+esc(q.q)+'</div>';
    if(q.dia) h+='<div class="qdia">'+renderDiagram(q.dia)+'</div>';
    h+='<div class="opts">';
    (q.options||[]).forEach(function(o,oi){
      h+='<div class="opt" data-o="'+oi+'"><span class="ol">'+String.fromCharCode(65+oi)+'</span><span>'+esc(o)+'</span></div>';
    });
    h+='</div>';
    h+='<div class="qact">'+
       '<button class="btn primary" data-act="check">检查</button>'+
       (q.hint?'<button class="btn" data-act="hint">&#128161; 提示</button>':'')+
       '<button class="btn ghost" data-act="sol">看解析</button>'+
       '<span class="fb"></span>'+
       '</div>';
    h+='<div class="extras"></div>';
    h+='</div>';
    return h;
  }

  function wireQuestions(root){
    root.querySelectorAll(".q").forEach(function(qEl){
      var idx=parseInt(qEl.getAttribute("data-q"),10);
      var ns=qEl.getAttribute("data-ns");
      var bank=(ns==="practice")?(state.bank==="ka"?"practice":"practice2")
                                :(state.bank==="ka"?"quiz":"quiz2");
      var q=chapter()[bank][idx];
      if(!q) return;
      var ansStr=String(q.ansIdx);
      var multi=ansStr.indexOf(",")>=0;
      var correct=ansStr.split(",").map(Number);
      var sel=[];
      var locked=false;

      qEl.querySelectorAll(".opt").forEach(function(oEl){
        oEl.addEventListener("click", function(){
          if(locked) return;
          var oi=parseInt(oEl.getAttribute("data-o"),10);
          if(multi){
            var at=sel.indexOf(oi);
            if(at>=0) sel.splice(at,1); else sel.push(oi);
          } else { sel=[oi]; }
          qEl.querySelectorAll(".opt").forEach(function(e,i){
            e.classList.toggle("sel", sel.indexOf(i)>=0);
          });
        });
      });

      var fb=qEl.querySelector(".fb");
      var extras=qEl.querySelector(".extras");

      qEl.querySelector('[data-act="check"]').addEventListener("click", function(){
        if(locked) return;
        if(!sel.length){ fb.className="fb feedback no"; fb.textContent="请先选择一个答案"; return; }
        locked=true;
        var ok = sel.length===correct.length && sel.every(function(v){ return correct.indexOf(v)>=0; });
        qEl.querySelectorAll(".opt").forEach(function(e,i){
          if(correct.indexOf(i)>=0) e.classList.add("good");
          else if(sel.indexOf(i)>=0) e.classList.add("bad");
        });
        fb.className="fb feedback "+(ok?"ok":"no");
        fb.textContent = ok ? "✓ 正确！" : "✗ 不正确，正确答案已标出";
        if(ok) markDone(state.tab);
        renderTabs(); renderMastery(); renderSidebar();
      });

      var hb=qEl.querySelector('[data-act="hint"]');
      if(hb) hb.addEventListener("click", function(){
        extras.innerHTML='<div class="hintbox"><b>提示：</b>'+esc(q.hint)+'</div>'+extras.innerHTML;
        hb.disabled=true; hb.style.opacity=.5;
      });

      qEl.querySelector('[data-act="sol"]').addEventListener("click", function(){
        extras.innerHTML+='<div class="solbox"><b>解析：</b>'+esc(q.sol)+'</div>';
      });
    });
  }

  function bankBar(kind){
    var kaN=(chapter()[kind]||[]).length, cnN=(chapter()[kind+"2"]||[]).length;
    return '<div class="bankbar"><span class="bl">题库</span><span class="seg">'+
      '<button data-bank="ka" class="'+(state.bank==="ka"?"on":"")+'">可汗 KA ('+kaN+')</button>'+
      '<button data-bank="cn" class="'+(state.bank==="cn"?"on":"")+'">公立校 21cnjy ('+cnN+')</button>'+
      '</span></div>';
  }

  /* ---------- panels ---------- */
  function renderPanel(){
    var ch=chapter(); var el=document.getElementById("panel"); var h="";

    if(state.tab==="think"){
      h+='<div class="card"><h3>&#129300; 先想一想</h3>'+
         '<div class="elicit">'+esc(ch.think||"").replace(/\n/g,"<br>")+'</div>'+
         '<p class="muted" style="margin-top:14px">带着这些问题去看视频，会更容易抓住重点。</p></div>';
      h+='<div class="qact"><button class="btn primary" id="doneThink">我思考过了 → 去学习</button></div>';
    }

    else if(state.tab==="watch"){
      var vids=ch.videos||[];
      var order=[],i,j;
      if(state.lesson>=0 && ch.subtopics[state.lesson]){
        (ch.subtopics[state.lesson].vids||[]).forEach(function(v){ order.push(v); });
        for(i=0;i<vids.length;i++) if(order.indexOf(i)<0) order.push(i);
      } else { for(j=0;j<vids.length;j++) order.push(j); }
      if(!vids.length){
        h+='<div class="empty">本章暂无视频资源。</div>';
      } else {
        if(state.lesson>=0 && ch.subtopics[state.lesson]){
          h+='<div class="card" style="padding:13px 17px"><span class="muted">当前小节：</span><b>'+
             esc(ch.subtopics[state.lesson].name)+'</b></div>';
        }
        order.forEach(function(vi){ if(vids[vi]) h+=videoHTML(vids[vi]); });
        h+='<div class="qact"><button class="btn primary" id="doneWatch">视频看完了 → 去复习笔记</button></div>';
      }
    }

    else if(state.tab==="notes"){
      var notes=ch.notes||[];
      if(!notes.length){ h+='<div class="empty">本章暂无复习笔记。</div>'; }
      else {
        notes.forEach(function(n){
          var m=String(n).match(/^([^:：]*[（(][^）)]*[）)][^:：]*)\s*[:：]/);
          h+='<div class="note">'+
             (m?'<span class="nlabel">'+esc(m[1])+'</span>':'')+
             '<div class="nbody">'+esc(n)+'</div></div>';
        });
        h+='<div class="qact"><button class="btn primary" id="doneNotes">复习完成 → 去练习</button></div>';
      }
    }

    else if(state.tab==="practice" || state.tab==="quiz"){
      var kind = state.tab;
      var arr  = state.bank==="ka" ? (ch[kind]||[]) : (ch[kind+"2"]||[]);
      h+=bankBar(kind);
      if(!arr.length){
        h+='<div class="empty">该题库本章暂无题目，请切换到另一个题库。</div>';
      } else {
        arr.forEach(function(q,i){ h+=questionHTML(q,i,kind); });
      }
    }

    el.innerHTML=h;
    tex(el);

    el.querySelectorAll("[data-bank]").forEach(function(b){
      b.addEventListener("click", function(){
        state.bank=b.getAttribute("data-bank"); render();
      });
    });
    if(state.tab==="practice"||state.tab==="quiz") wireQuestions(el);

    var map={doneThink:"think",doneWatch:"watch",doneNotes:"notes"};
    Object.keys(map).forEach(function(id){
      var b=document.getElementById(id);
      if(b) b.addEventListener("click", function(){
        markDone(map[id]);
        var order=["think","watch","notes","practice","quiz"];
        var nx=order[order.indexOf(map[id])+1];
        if(nx) state.tab=nx;
        render();
      });
    });

    if(state.tab==="think" || state.tab==="watch" || state.tab==="notes") markDone(state.tab);
  }

  /* ---------- chapter nav ---------- */
  function renderChapNav(){
    var i=DATA.findIndex(function(c){ return c.id===state.chId; });
    var pv=DATA[i-1], nx=DATA[i+1];
    var a=document.getElementById("prevCh"), b=document.getElementById("nextCh");
    if(pv){ a.className=""; a.href="math_chapter.html?ch="+pv.id+"&grade="+GRADE; a.textContent="← "+(i)+". "+pv.title; }
    else { a.className="off"; a.removeAttribute("href"); a.textContent="← 上一章"; }
    if(nx){ b.className=""; b.href="math_chapter.html?ch="+nx.id+"&grade="+GRADE; b.textContent=(i+2)+". "+nx.title+" →"; }
    else { b.className="off"; b.removeAttribute("href"); b.textContent="下一章 →"; }
  }

  function render(){
    var ch=chapter();
    if(!ch){ document.getElementById("panel").innerHTML='<div class="empty">未找到章节数据。</div>'; return; }
    var i=DATA.findIndex(function(c){ return c.id===state.chId; });
    document.getElementById("crumb").textContent="八年级数学 · 北师大版 › 第 "+(i+1)+" 章";
    document.getElementById("chTitle").textContent="第 "+(i+1)+" 章 · "+ch.title;
    document.getElementById("chSub").textContent=ch.subtitle||"";
    renderSidebar(); renderTabs(); renderMastery(); renderPanel(); renderChapNav();
  }

  if(!DATA.length){
    document.getElementById("panel").innerHTML='<div class="empty">math_data.js 未加载成功。</div>';
  } else {
    render();
  }
})();
</script>
