<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 Math · Khan Academy (TEST)</title>
<style>
:root{--bg:#0a0f1e;--card:#141d33;--text:#e8eef8;--text2:#9fb0c8;--blue:#3b82f6;--border:#23304d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px}
.wrap{max-width:860px;margin:0 auto}
.banner{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;padding:16px 22px;border-radius:12px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.banner h1{font-size:18px;flex:1}
.banner .tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-decoration:none;color:var(--text);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.25)}
.card .no{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#0d9488;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.card h2{font-size:15px;margin-bottom:4px}
.card .en{font-size:12px;color:var(--text2)}
.card .cov{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:#6ee7b7}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <h1>八年级数学 · Khan Academy (TEST)</h1>
    <span class="tag">测试版</span>
  </div>
  <div class="grid">
    <a class="card" href="math_chapter.html?ch=ch01&grade=8">
      <span class="no">G8 · 01</span>
      <h2>勾股定理</h2>
      <div class="en">Pythagorean Theorem</div>
      <span class="cov">🟢 KA video + practice + quiz</span>
    </a>
  </div>
  <p style="margin-top:20px;color:var(--text2);font-size:13px">这是 KA 原生嵌入测试页。打开后请确认视频/练习/测验三个框是否能正常加载。若打不开会显示备用链接。</p>
</div>
</body>
</html>
