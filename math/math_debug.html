<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Chapter (Debug)</title>
<style>
:root {
  --bg: #f0f4f8;
  --card: #fff;
  --text: #1e293b;
  --text-secondary: #475569;
  --border: #cbd5e1;
  --blue: #2563eb;
  --blue-banner: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  --shadow: rgba(0,0,0,.08);
  --purple: #7c3aed;
  --teal: #0f766e;
  --green: #059669;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #334155;
  --shadow: rgba(0,0,0,.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:0 0 56px; }
.banner { background:var(--blue-banner); color:#fff; padding:18px 24px; display:flex; align-items:center; gap:14px; }
.banner .home { color:#fff; text-decoration:none; font-size:13px; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:8px; }
.banner h1 { flex:1; font-size:19px; }
.banner .cov { display:inline-block; margin-top:4px; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.18); }
.container { max-width:800px; margin:0 auto; padding:0 24px; }
.stepbar { display:flex; gap:6px; align-items:center; margin-top:18px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; box-shadow:0 2px 8px var(--shadow); overflow-x:auto; }
.sb { display:flex; align-items:center; gap:8px; cursor:pointer; flex-shrink:0; }
.sb-num { width:26px; height:26px; border-radius:50%; background:#e2e8f0; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
.sb-label { font-size:13px; font-weight:600; color:var(--text-secondary); }
.sb.active .sb-num { background:var(--blue); color:#fff; }
.sb.active .sb-label { color:var(--blue); }
.panel { display:none; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px; margin-top:16px; box-shadow:0 2px 8px var(--shadow); }
.panel.active { display:block; }
.elicit { background:#eff6ff; border-left:4px solid var(--blue); border-radius:8px; padding:14px 16px; font-weight:600; }
.video-card { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; text-decoration:none; color:var(--text); background:#fff; margin-bottom:10px; }
.video-card .play { width:38px; height:38px; border-radius:8px; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; }
.note { margin-top:12px; padding:10px 14px; background:#f0fdf4; border-left:4px solid var(--green); border-radius:8px; font-size:14px; }
.q { display:none; border:1px solid var(--border); border-radius:10px; padding:15px; margin-top:13px; background:#fff; }
.q.active { display:block; }
.q input[type="text"] { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; margin-top:6px; }
.fb { margin-top:10px; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; display:none; }
.fb.ok { background:#ecfdf5; border:1px solid #6ee7b7; color:#065f46; display:block; }
.fb.no { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; display:block; }
.sol { margin-top:10px; padding:10px 12px; background:#f0fdfa; border-left:4px solid var(--teal); border-radius:8px; font-size:13.5px; display:none; }
.next-btn { background:var(--blue); color:#fff; border:none; padding:11px 22px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; margin-top:16px; }
.debug { background:#fef3c7; border:2px solid #f59e0b; padding:10px; margin:10px 0; font-family:monospace; font-size:12px; }
</style>
</head>
<body>
<div class="banner">
  <a class="home" id="home" href="#">← Back</a>
  <div>
    <span id="crumb" style="font-size:12px;opacity:.7"></span>
    <h1 id="title">Loading...</h1>
    <span id="cov" class="cov"></span>
  </div>
</div>
<div class="container">
  <div id="debug" class="debug">Debug info loading...</div>
  <div class="stepbar" id="stepbar"></div>
  <div class="panel" id="p1"></div>
  <div class="panel" id="p2"></div>
  <div class="panel" id="p3"></div>
  <div class="panel" id="p4"></div>
  <div class="panel" id="p5"></div>
</div>
<script src="math_data.js"></script>
<script>
var debug = document.getElementById("debug");
function log(msg) {
  debug.innerHTML += "<br>" + msg;
  console.log(msg);
}

try {
  log("Script started");
  var params = new URLSearchParams(location.search);
  var CH_ID = params.get("ch") || "ch01";
  var GRADE = params.get("grade") || "8";
  log("CH_ID=" + CH_ID + ", GRADE=" + GRADE);
  log("MATH_DATA exists: " + (typeof MATH_DATA !== 'undefined'));
  
  if (typeof MATH_DATA === 'undefined') {
    log("ERROR: MATH_DATA not loaded!");
    document.getElementById("title").textContent = "Error: Data not loaded";
  } else {
    log("MATH_DATA.length=" + MATH_DATA.length);
    var CH = null;
    for (var i = 0; i < MATH_DATA.length; i++) {
      if (MATH_DATA[i].id === CH_ID) { CH = MATH_DATA[i]; break; }
    }
    log("CH found: " + (CH !== null));
    
    if (!CH) {
      document.getElementById("title").textContent = "Chapter not found: " + CH_ID;
    } else {
      log("CH.title=" + CH.title);
      document.getElementById("title").textContent = CH.title;
      document.getElementById("crumb").textContent = "Grade " + GRADE;
      document.getElementById("cov").textContent = CH.coverage || "custom";
      
      var labels = ["Think", "Watch", "Notes", "Practice", "Quiz"];
      var sb = "";
      for (var j = 1; j <= 5; j++) {
        sb += "<div class=\"sb\" data-step=\"" + j + "\" onclick=\"showStep(" + j + ")\">";
        sb += "<div class=\"sb-num\">" + j + "</div>";
        sb += "<div class=\"sb-label\">" + labels[j-1] + "</div>";
        sb += "</div>";
      }
      document.getElementById("stepbar").innerHTML = sb;
      log("Stepbar rendered");
      
      // Render Think step
      document.getElementById("p1").innerHTML = "<div class=\"elicit\">" + (CH.think || "What do you know?") + "</div>";
      document.getElementById("p1").classList.add("active");
      log("Panel 1 rendered with: " + (CH.think || "default"));
    }
  }
} catch(e) {
  log("ERROR: " + e.message);
  document.getElementById("title").textContent = "Error: " + e.message;
}

function showStep(step) {
  for (var i = 1; i <= 5; i++) {
    document.getElementById("p" + i).classList.remove("active");
  }
  document.getElementById("p" + step).classList.add("active");
}
</script>
</body>
</html>
