<style>

  --accent:#2563eb; --accent2:#0ea5e9; --ok:#15803d; --bad:#b91c1c; --warn:#b45309;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;

nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:fit-content;position:sticky;top:14px}

.nav-i:hover{background:#f1f5f9}

.cn-tag{color:var(--mute);font-weight:400;font-size:13px}

.box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;transition:.15s}
button:hover{filter:brightness(1.08)}

.step{display:inline-block;background:#eef2ff;color:var(--accent);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px}
/* Lesson */
.micro{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}

.fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.fig .cap{font-size:13px;font-weight:600;margin-bottom:6px}

svg{display:block;margin:0 auto}
.slider-row{display:flex;gap:20px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}

input[type=range]{width:130px;accent-color:var(--accent)}
.val{font-weight:700;color:var(--accent);min-width:56px;display:inline-block}
.eqbox{text-align:center;font-size:17px;padding:12px;background:#fff;border:2px solid var(--accent);border-radius:10px;margin:12px 0;font-weight:700}
.eqbox .num{color:var(--accent)}

<script>
/* ============ Data: Ch01 videos ============ */
const VDIR = 'videos/Ch01_勾股定理/';
const V = {
  k1: [
    {f:'01_The Pythagorean theorem intro.mp4', t:'Intro to the Pythagorean theorem', tz:'勾股定理入门', c:'core'},
    {f:'02_Pythagorean theorem.mp4', t:'Pythagorean theorem', tz:'勾股定理', c:'core'},
    {f:'03_Pythagorean theorem 1.mp4', t:'Pythagorean theorem 1', tz:'勾股定理（一）', c:'core'},
    {f:'04_Pythagorean theorem 2.mp4', t:'Pythagorean theorem 2', tz:'勾股定理（二）', c:'core'},
    {f:'05_Pythagorean theorem 3.mp4', t:'Pythagorean theorem 3', tz:'勾股定理（三）', c:'core'},
    {f:'06_Bhaskara\'s proof of the Pythagorean theorem.mp4', t:"Bhaskara's proof", tz:'婆什迦罗的证明', c:'ext'},
    {f:'07_Another Pythagorean theorem proof.mp4', t:'Another proof', tz:'另一种证明', c:'ext'},
    {f:'08_Garfield\'s proof of the Pythagorean theorem.mp4', t:"Garfield's proof", tz:'加菲尔德的证明', c:'ext'},
    {f:'09_Pythagorean theorem proof using similarity.mp4', t:'Proof using similarity', tz:'用相似三角形证明', c:'ext'}
  ],
  k2: [
    {f:'10_Converse of Pythagoras Theorem.mp4', t:'Converse of Pythagoras Theorem', tz:'勾股定理的逆定理', c:'core'}
  ],
  k3: [
    {f:'12_Pythagorean theorem in 3D.mp4', t:'Pythagorean theorem in 3D', tz:'三维空间中的勾股定理', c:'core'},
    {f:'11_Distance formula.mp4', t:'Distance formula', tz:'两点间距离公式', c:'core'}
  ],
  k4: [
    {f:'13_Algebraic midpoint of a segment exercise.mp4', t:'Midpoint of a segment', tz:'线段的中点', c:'ext'}
  ]
};

/* ============ State ============ */
const KEY='bnu8_ch01_state';
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const LESSONS=[
 {id:'intro',t:'Intro',cn:'Start here · What this chapter covers',n:'🏠'},
  {id:'k1', t:'Exploring the Theorem', cn:'Exploring the theorem', n:'1.1'},
  {id:'k2', t:'Is It Right? (Converse)', cn:'Is it a right triangle?', n:'1.2'},
  {id:'k3', t:'Applications', cn:'Applications', n:'1.3'},
  {id:'k4', t:'Strategy: Reflect', cn:'Strategy: reflect', n:'1.4'},
  {id:'test', t:'Chapter check', cn:'Chapter check', n:''}
];
let cur='intro';
function st(id){ return S[id] || (S[id]={diag:null,prac:{ok:0,tot:0},vid:{},done:false}); }

/* ============ Helpers ============ */
function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[ri(0,a.length-1)]; }
function gcd(a,b){ return b?gcd(b,a%b):a; }
// Dual-language wrapper: in en mode shows English; mix shows English+small Chinese; zh shows Chinese+small English.
function L(a,b){ return '<span class="en">'+a+'</span><span class="zh">'+(b==null?a:b)+'</span>'; }
const PYTH=[[3,4,5],[5,12,13],[6,8,10],[7,24,25],[8,15,17],[9,12,15],[9,40,41],[10,24,26],[12,16,20],[15,20,25],[12,35,37],[11,60,61],[20,21,29],[18,24,30],[16,30,34],[21,28,35]];

/* ============ Generative practice engine ============ */
function genQ(type,diff){
  // diff 1..3
  if(type==='hyp'){
    let a,b,c;
    if(diff===1){ const p=pick(PYTH.filter(x=>x[0]<=9&&x[1]<=12)); a=p[0];b=p[1];c=p[2]; }
    else if(diff===2){ const p=pick(PYTH.filter(x=>x[2]<=26)); a=p[0];b=p[1];c=p[2]; }
    else {
      // Euclid's formula gives an exact integer triple: a=m²−n², b=2mn, c=m²+n²
      // (rounding a leg and the hypotenuse independently would NOT give a right triangle)
      let m,n,guard=0;
      do { m=ri(2,6); n=ri(1,m-1); a=m*m-n*n; b=2*m*n; c=m*m+n*n; guard++; } while(c>40 && guard<200);
      if(a>b){ const t=a; a=b; b=t; }
    }
    return {q:`A right triangle has legs <b>a = ${a}</b> and <b>b = ${b}</b>. Find the hypotenuse <b>c</b>.`,
            zhq:`一个直角三角形的两条直角边分别是 <b>a = ${a}</b> 和 <b>b = ${b}</b>。求斜边 <b>c</b>。`,
            ans:c, unit:'',
            hint:'Find the longest side (the hypotenuse) first, then use a² + b² = c².',
            zhh:'先找最长的一边（斜边），再用 a² + b² = c² 计算。',
            sol:`c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}, so c = ${c}`,
            zhs:`c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}，所以 c = ${c}`};
  }
  if(type==='leg'){
    let p=pick(diff===1?PYTH.filter(x=>x[2]<=15):PYTH);
    let [a,b,c]=p; let give=(Math.random()<0.5)?a:b; let ask=(give===a)?b:a;
    return {q:`A right triangle has hypotenuse <b>c = ${c}</b> and one leg <b>${give}</b>. Find the other leg.`,
            zhq:`一个直角三角形的斜边是 <b>c = ${c}</b>，一条直角边是 <b>${give}</b>。求另一条直角边。`,
            ans:ask,
            hint:'Use a² + b² = c², with the unknown leg as one of a or b.',
            zhh:'用 a² + b² = c²，把未知直角边当作 a 或 b。',
            sol:`Call the other leg x: x² + ${give}² = ${c}², so x² = ${c*c} − ${give*give} = ${c*c-give*give}, x = ${ask}`,
            zhs:`设另一条直角边为 x：x² + ${give}² = ${c}²，则 x² = ${c*c} − ${give*give} = ${c*c-give*give}，x = ${ask}`};
  }
  if(type==='conv'){
    const p=pick(PYTH); let [a,b,c]=p;
    const isRight = Math.random()<0.5;
    let arr;
    if(isRight){ arr=[a,b,c]; }
    else { let d=c+ri(1,3); arr=[a,b,d]; }
    // shuffle
    for(let i=arr.length-1;i>0;i--){ const j=ri(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    const mx=Math.max(...arr);
    return {q:`Do sides <b>${arr[0]}</b>, <b>${arr[1]}</b>, <b>${arr[2]}</b> form a right triangle?`,
            zhq:`边长 <b>${arr[0]}</b>、<b>${arr[1]}</b>、<b>${arr[2]}</b> 能否组成直角三角形？`,
            ans:isRight?'Yes':'No', isRight:isRight, sides:arr,
            hint:'Take the longest side as c. Check whether the other two squared add to c².',
            zhh:'把最长边当作 c，看另外两边的平方和是否等于 c²。',
            sol:isRight? `${arr.slice().sort((x,y)=>x-y).join('² + ')}² : the other two squared add to ${Math.min(...arr)**2 + (arr.reduce((s,x)=>s+x,0)-Math.max(...arr)-Math.min(...arr))**2}; the largest side squared = ${Math.max(...arr)**2}; they are equal → it is a right triangle`
                      : `The longest side ${mx} squared = ${mx**2}; the other two squared add to ${arr.filter(x=>x!==mx).map(x=>x*x).join(' + ')} = ${arr.filter(x=>x!==mx).reduce((s,x)=>s+x*x,0)}. They are not equal → not a right triangle`,
            zhs:`最长边 ${mx} ${isRight?'作为斜边 c；另两边平方和等于 c²，所以是直角三角形。':'的平方 ≠ 另两边平方和，所以不是直角三角形。'}`};
  }
  if(type==='word'){
    const scenes=[
      {cn:'Ladder against a wall', en:'A ladder of length L leans against a wall. Its foot is D from the wall. How high up the wall does it reach?', zh:'一架长为 L 的梯子靠在墙上，梯脚离墙 D。梯子顶端到达墙面多高？', ask:'ladder'},
      {cn:'Flagpole rope', en:'A flagpole is H tall. A rope is tied from the top to a stake D from the base. How long is the rope?', zh:'一根 H 高的旗杆，从顶端拉一根绳子到离杆底 D 的木桩。绳子有多长？', ask:'rope'},
      {cn:'Broken bamboo', en:'A bamboo of total length L breaks so the top touches the ground D from the base. How high is the break?', zh:'一根总长 L 的竹子折断，顶端落在离竹根 D 处。折断处离地多高？', ask:'bamboo'}
    ];
    const sc=pick(scenes);
    if(sc.ask==='ladder'){
      // the ladder is the hypotenuse: h² + d² = l²
      const p=pick(PYTH.filter(x=>x[2]<=25)); let [d,h,l]=p;
      return {q:`${sc.en.replace('L',l).replace('D',d)}`,
              zhq:`${sc.zh.replace('L',l).replace('D',d)}`,
              ans:h,
              hint:'The ladder is the hypotenuse: height² + distance² = ladder².',
              zhh:'梯子是斜边：高² + 距离² = 梯长²。',
              sol:`h² + ${d}² = ${l}², so h² = ${l*l} − ${d*d} = ${l*l-d*d}, h = ${h}`,
              zhs:`h² + ${d}² = ${l}²，所以 h² = ${l*l} − ${d*d} = ${l*l-d*d}，h = ${h}`};
    } else if(sc.ask==='rope'){
      // the rope is the hypotenuse: r² = h² + d²
      const p=pick(PYTH.filter(x=>x[2]<=25)); let [d,h,r]=p;
      return {q:`${sc.en.replace('H',h).replace('D',d)}`,
              zhq:`${sc.zh.replace('H',h).replace('D',d)}`,
              ans:r,
              hint:'The rope is the hypotenuse: rope² = pole² + distance².',
              zhh:'绳子是斜边：绳长² = 杆高² + 距离²。',
              sol:`r² = ${h}² + ${d}² = ${h*h+d*d}, r = ${r}`,
              zhs:`r² = ${h}² + ${d}² = ${h*h+d*d}，r = ${r}`};
    } else {
      // Bamboo: stands h tall, snaps, the top lands d from the base.
      // Broken part = L − h, and (L − h)² = h² + d². Using triple (d,h,c):
      // broken part = c, so the total length is L = h + c.
      const p=pick(PYTH.filter(x=>x[2]<=25)); let [d,h,c]=p;
      const l = h + c;
      return {q:`${sc.en.replace('L',l).replace('D',d)}`,
              zhq:`${sc.zh.replace('L',l).replace('D',d)}`,
              ans:h,
              hint:'Broken part = total − height; (total − height)² = height² + distance².',
              zhh:'折断部分 = 总长 − 高度；(总长 − 高度)² = 高度² + 距离²。',
              sol:`Broken part = ${l} − h = ${c}. Then h² + ${d}² = ${c}², so h² = ${c*c} − ${d*d} = ${c*c-d*d}, h = ${h}`,
              zhs:`折断部分 = ${l} − h = ${c}。于是 h² + ${d}² = ${c}²，所以 h² = ${c*c} − ${d*d} = ${c*c-d*d}，h = ${h}`};
    }
  }
}

function renderQ(el,q,onAns,showHint){
  el.innerHTML=`<div class="q"><div class="qt">${L(q.q,q.zhq)}</div><div id="opts"></div>
    <div class="row"><button class="ghost" id="hb">${L('Hint','提示')}</button></div>
    <div class="hint" id="hint">${L(q.hint||'Find the longest side (the hypotenuse) first, then use a² + b² = c².', q.zhh||'先找最长的一边（斜边），再用 a² + b² = c²。')}</div>
    <div class="fb" id="fb"></div></div>`;
  const od=el.querySelector('#opts');
  let opts; let tries=0;
  if(q.ans==='Yes'||q.ans==='No'){ opts=['Yes','No']; }
  else{
    const n=q.ans;
    opts=[n, n+ri(1,3), Math.max(1,n-ri(1,3)), n+ri(4,8)];
    opts=[...new Set(opts)]; while(opts.length<4) opts.push(n+ri(-3,9));
    opts=[...new Set(opts)].slice(0,4);
  }
  opts.sort(()=>Math.random()-0.5);
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=(o==='Yes')?L('Yes','是'):(o==='No')?L('No','否'):String(o);
    b.dataset.val=String(o);
    b.onclick=()=>{
      const ok = b.dataset.val===String(q.ans);
      const fb=el.querySelector('#fb');
      if(ok){
        od.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        b.classList.add('sel-ok');
        fb.className='fb ok';
        fb.innerHTML=L('✓ Correct. '+q.sol, '✓ 对了。'+q.zhs);
        onAns(true);
      } else {
        tries++;
        b.classList.add('sel-bad'); b.disabled=true;
        if(tries===1){
          el.querySelector('#hint').classList.add('on');
          fb.className='fb bad'; fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
        } else if(tries===2){
          fb.className='fb bad';
          fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):'Work through it once more.'), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):'再算一遍。'));
        } else {
          od.querySelectorAll('.opt').forEach(x=>x.disabled=true);
          od.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.val===String(q.ans)) x.classList.add('sel-ok'); });
          fb.className='fb bad';
          fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
          onAns(false);
        }
      }
    };
    od.appendChild(b);
  });
  el.querySelector('#hb').onclick=()=>el.querySelector('#hint').classList.add('on');
}

        <div class="sub2">${L('4 triangles + a² square + b² square','4 个三角形 + a² 正方形 + b² 正方形')}</div>

      </div>
    </div>
    <div class="eqbox" id="eq"></div>
    <div class="box">${L('The two areas stay equal throughout. The four triangles are identical, so once you take them away, what is left must be equal too.','两边的面积始终相等。四个三角形完全相同，所以把它们都去掉之后，剩下的部分也必然相等。')}<br>
    </div>
    <div class="row"><button id="next1">${L('Next: watch the video →','下一步：看视频 →')}</button></div>`;

      L+=`<polygon points="${t.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>`;
    });

    L+=`<text x="${X(a/2+1)}" y="${Y(s/2)}" font-size="13" fill="#b91c1c" font-weight="bold">c²=${c2}</text>`;
    el.querySelector('#svgL').innerHTML=L;
    // right figure
    let R=`<rect x="${X(0)}" y="${Y(s)}" width="${s*SC}" height="${s*SC}" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>`;
    R+=`<rect x="${X(0)}" y="${Y(s)}" width="${a*SC}" height="${a*SC}" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>`;
    R+=`<text x="${X(a/2)}" y="${Y(s-a/2)}" font-size="13" fill="#15803d" font-weight="bold">a²=${a*a}</text>`;
    R+=`<rect x="${X(a)}" y="${Y(b)}" width="${b*SC}" height="${b*SC}" fill="#fde68a" stroke="#a16207" stroke-width="2"/>`;
    R+=`<text x="${X(a+b/2)}" y="${Y(b/2)}" font-size="13" fill="#a16207" font-weight="bold">b²=${b*b}</text>`;
    [[[0,0],[a,0],[a,b]],[[0,0],[a,b],[0,b]],[[a,b],[s,b],[a,s]],[[a,b],[s,s],[a,s]]].forEach(t=>{

/* ============ Lesson K2: the converse test ============ */
function microK2(el){
  el.innerHTML=`
    <div class="step">${L('Have a go','动手试')}</div>
    <h3>${L('Converse: is it a right triangle? ','逆定理：它是直角三角形吗？')}</h3>
    <div class="lead">${L('Last section: right angle → a²+b² = c². Now backwards: does a²+b² = c² force a right angle? Drag and see.','上一节：有直角 → a²+b² = c²。现在反过来：a²+b² = c² 能推出有直角吗？拖动看结果。')}</div>
    <div class="slider-row">
      <label>side 1 <input type="range" id="s1" min="1" max="20" value="3"><span class="val" id="v1">3</span></label>
      <label>side 2 <input type="range" id="s2" min="1" max="20" value="4"><span class="val" id="v2">4</span></label>
      <label>side 3 <input type="range" id="s3" min="1" max="25" value="6"><span class="val" id="v3">6</span></label>
    </div>
    <div class="eqbox" id="verdict"></div>
    <div class="box" id="detail"></div>
    <div class="box">${L('Take the longest side as c. Square the two shorter sides and add — equal to c² means a right angle, more means acute, less means obtuse.','取最长的一边为 c。把两条短边的平方相加 —— 等于 c² 就是直角，大于是锐角，小于是钝角。')}</div>
    <div class="box" style="background:#f8fafc">
     <h3>${L('★ Why does a² + b² = c² force a right angle?','★ 为什么 a² + b² = c² 能推出直角？')}</h3>
     <p style="font-size:14px">${L('Build a second triangle that is certainly right-angled: take legs a and b with a right angle between them, and call its hypotenuse d.','另外构造一个一定是直角的三角形：取两条直角边 a 和 b，夹角为直角，斜边记为 d。')}</p>
     <div class="proof">
      <div class="row"><span class="step-row">${L('By the theorem, d² = a² + b²','由勾股定理，d² = a² + b²')}</span><span class="reason">${L('(this new triangle is right-angled)','（这个新三角形是直角三角形）')}</span></div>
      <div class="row"><span class="step-row">${L('But a² + b² = c² was given','而题目给了 a² + b² = c²')}</span><span class="reason">${L('(that was the test)','（这是判定条件）')}</span></div>
      <div class="row"><span class="step-row">${L('So d² = c², hence d = c','所以 d² = c²，即 d = c')}</span><span class="reason">${L('(lengths are positive)','（边长都是正数）')}</span></div>
      <div class="row"><span class="step-row">${L('The two triangles match on all three sides','两个三角形三边对应相等')}</span><span class="reason">${L('(a, b, c — SSS)','（a, b, c —— 边边边）')}</span></div>
      <div class="row"><span class="step-row">${L('So the angle in the first triangle is 90°','所以第一个三角形里的那个角是 90°')}</span><span class="reason">${L('(matching sides face matching angles)','（相等的边对着相等的角）')}</span></div>
     </div>
    </div>`;
  const upd=()=>{
    const v=[+el.querySelector('#s1').value,+el.querySelector('#s2').value,+el.querySelector('#s3').value];
    const mx=Math.max(...v), rest=v.filter((x,i)=>x!==mx||i!==v.indexOf(mx));
    const s2=rest[0]*rest[0]+rest[1]*rest[1], m2=mx*mx;
    const canTri = rest[0]+rest[1]>mx;
    let txt,bg;
    if(!canTri){ txt=`✗ Not a triangle (${rest[0]} + ${rest[1]} ≤ ${mx})`; bg='#fee2e2'; }
    else if(s2===m2){ txt=`✓ Right triangle`; bg='#dcfce7'; }
    else if(s2>m2){ txt=`Acute triangle · a²+b² > c²`; bg='#fef3c7'; }
    else { txt=`Obtuse triangle · a²+b² < c²`; bg='#fee2e2'; }
    const vd=el.querySelector('#verdict'); vd.innerHTML=txt; vd.style.background=bg;
    el.querySelector('#detail').innerHTML=
      `Longest side ${mx}: ${mx}² = <b>${m2}</b><br>Other two, squared and added: ${rest[0]}² + ${rest[1]}² = ${rest[0]*rest[0]} + ${rest[1]*rest[1]} = <b>${s2}</b><br>
       Compare: ${s2} ${s2===m2?'=':(s2>m2?'>':'<')} ${m2}`;
  };
  [1,2,3].forEach(i=>{
    const s=el.querySelector('#s'+i);
    s.oninput=()=>{ el.querySelector('#v'+i).textContent=s.value; upd(); };
  });
  upd();
}

           <text x="${bx+d*SC/2+10}" y="${by-h*SC/2-6}" font-size="13" fill="#2563eb" font-weight="bold">L = ${L.toFixed(2)}</text>`;
    el.querySelector('#svgW').innerHTML=g;
    el.querySelector('#wcalc').innerHTML=
      `L² = h² + d² = ${h}² + ${d}² = ${h*h} + ${d*d} = ${h*h+d*d} &nbsp;→&nbsp; L = √${h*h+d*d} ≈ <b>${L.toFixed(2)}</b>`;
  };
  el.querySelector('#hh').oninput=()=>{el.querySelector('#vhh').textContent=el.querySelector('#hh').value;draw();};
  el.querySelector('#dd').oninput=()=>{el.querySelector('#vdd').textContent=el.querySelector('#dd').value;draw();};
  draw();
}

/* ============ Diagnostic ============ */
function diag(el,id,types){
  const s=st(id);
  if(s.diag){ 
    el.innerHTML=`<div class="box"><b>Quick check: </b>${s.diag.pass?
      '✓ all correct — you can go straight to practice.':'Done, with some wrong — watch the lesson and videos first.'}</div>`;
    return; 
  }
  el.innerHTML=`<div class="step"><span class="en">Quick check</span><span class="zh">小测一下</span></div>
    <div class="lead">Three questions. All correct means you already have this — skip straight to practice. Any wrong means watch the lesson first. <span class="cn-tag">Check first, then learn.</span></div>
    <div id="dq"></div><div class="row"><button id="ddone" disabled><span class="en">Submit</span><span class="zh">提交</span></button></div>`;
  const box=el.querySelector('#dq');
  let ok=0, done=0, qs=types.map(t=>genQ(t,1));
  qs.forEach(q=>{
    const d=document.createElement('div');
    box.appendChild(d);
    renderQ(d,q,r=>{ if(r)ok++; done++; if(done===qs.length){ const b=el.querySelector('#ddone'); b.disabled=false; } },true);
  });
  el.querySelector('#ddone').onclick=()=>{
    s.diag={ok:ok,tot:qs.length,pass:ok===qs.length}; save();
    el.innerHTML=`<div class="box"><b>Result: ${ok}/${qs.length}</b><br>
      ${ok===qs.length?'✓ all correct — go straight to practice.':'Watch the lesson and the videos first, then practice.'}</div>`;
  };
}

/* ============ Practice ============ */
function prac(el,id,types,need){
  const s=st(id);
  el.innerHTML=`<div class="step"><span class="en">Practice</span><span class="zh">练习</span></div>
    <div class="lead">Questions are generated fresh every time. To clear the section: ${need} correct in a row. <span class="cn-tag">${need} in a row counts as proficient.</span></div>
    <div class="stat"><span><span class="en">Streak: </span><span class="zh">连对：</span><b id="streak">0</b>/${need}</span>
      <span><span class="en">Total: </span><span class="zh">总数：</span><b id="cum">${s.prac.ok}/${s.prac.tot}</b></span>
      <span id="mast"></span></div>
    <div class="prog"><i id="pb" style="width:0%"></i></div>
    <div id="pq"></div><div class="row"><button id="nq"><span class="en">Next question</span><span class="zh">下一题</span></button><button class="ghost" id="reset"><span class="en">Reset progress</span><span class="zh">重置进度</span></button></div>`;
  let streak=0, diff=1;
  const upd=()=>{
    el.querySelector('#streak').textContent=streak;
    el.querySelector('#cum').textContent=s.prac.ok+'/'+s.prac.tot;
    el.querySelector('#pb').style.width=Math.min(100,streak/need*100)+'%';
    const m=el.querySelector('#mast');
    const p=s.prac||{};
    const L=s.done?['m-mas','<span class="en">Mastered</span><span class="zh">已掌握</span>']:(p.tot>=5&&p.ok/p.tot>=0.8?['m-pro','<span class="en">Proficient</span><span class="zh">熟练</span>']
      :(p.tot>0?['m-fam','<span class="en">Familiar</span><span class="zh">较熟</span>']:((Object.keys(s.vid||{}).length||s.diag!=null)?['m-att','<span class="en">Attempted</span><span class="zh">尝试过</span>']:['m-none','<span class="en">Not started</span><span class="zh">未开始</span>'])));
    m.innerHTML=`<span class="mastery ${L[0]}">${L[1]}</span>`;
  };
  const next=()=>{
    const box=el.querySelector('#pq'); box.innerHTML='';
    const d=document.createElement('div'); box.appendChild(d);
    const q=genQ(pick(types),diff);
    renderQ(d,q,r=>{
      s.prac.tot++; if(r){s.prac.ok++; streak++; if(streak>=3)diff=Math.min(3,diff+1);}
      else {streak=0; diff=Math.max(1,diff-1);}
      if(streak>=need){ s.done=true; save(); renderNav(); }
      save(); upd();
    },true);
    upd();
  };
  el.querySelector('#nq').onclick=next;
  el.querySelector('#reset').onclick=()=>{ s.prac={ok:0,tot:0}; s.done=false; streak=0; save(); upd(); renderNav(); };
  next();
}

/* ============ Chapter check ============ */
function chTest(el){
  el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div>
    <div class="lead">8 questions covering the 4 topics in this chapter. Do them on your own, no hints.</div>
    <div id="tq"></div><div class="row"><button id="sub"><span class="en">Submit</span><span class="zh">提交</span></button></div><div id="res"></div>`;
  const box=el.querySelector('#tq');
  const types=['hyp','leg','conv','word','hyp','leg','conv','word'];
  const qs=types.map((t,i)=>genQ(t, i<4?1:2));
  let ans=[];
  qs.forEach((q,i)=>{
    const d=document.createElement('div');
    d.innerHTML=`<div class="q"><div class="qt"><b>Q${i+1}.</b> ${q.q}</div><div id="o"></div></div>`;
    box.appendChild(d);
    const od=d.querySelector('#o');
    let opts = (q.ans==='Yes'||q.ans==='No')?['Yes','No']:
      [...new Set([q.ans,q.ans+ri(1,3),Math.max(1,q.ans-ri(1,3)),q.ans+ri(4,7)])].slice(0,4);
    opts.sort(()=>Math.random()-0.5);
    let sel=null;
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.innerHTML=String(o);
      b.onclick=()=>{ od.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel-ok'));
        b.classList.add('sel-ok'); ans[i]=String(o); };
      od.appendChild(b);
    });
  });
  el.querySelector('#sub').onclick=()=>{
    let ok=0; qs.forEach((q,i)=>{ if(ans[i]===String(q.ans)) ok++; });
    S.test={ok:ok,tot:qs.length}; save(); renderNav();
    el.querySelector('#res').innerHTML=`<div class="box"><b>Score: ${ok}/${qs.length}</b><br>
      ${ok>=7?'✓ You have this chapter down.':ok>=5?'△ Nearly there — rewatch the lesson for what you missed.':'✗ Go through the chapter again, then retry.'}</div>`;
    qs.forEach((q,i)=>{
      el.querySelector('#res').innerHTML+=`<div class="q"><b>Q${i+1}</b> Your answer ${ans[i]||'no answer'} · correct ${q.ans}<br><span class="cn-tag">${q.sol}</span></div>`;
    });
  };
}

const GLOSS={k1:"勾股定理",k2:"逆定理",k3:"斜边",k4:"反思"};
const USE_MICRO=false;
const INTRO={why:"A phone screen is sold as 6.1 inches — that is the diagonal, not the width or height, because the diagonal is what tells you how big it really is. Hand it the two sides and you can work out that diagonal. Same move for measuring a pitch, finding how long a ramp is, or checking whether a corner is genuinely square.",desc:{k1:"In a right triangle, the squares of the two shorter sides add up to the square of the longest side",k2:"The reverse test: if a² + b² = c², the triangle must be right-angled",k3:"Using it to find lengths and distances — ladders, folding, a bug crossing a box",k4:"Finish, then look back and check the answer actually makes sense"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){

    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'

  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"勾股定理","k2":"勾股定理的逆定理","k3":"应用","k4":"策略·反思","test":"章末自己测"};
const LKEY='bnu8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}

applyLang();


function renderNav(){
  const n=document.getElementById('nav'); n.innerHTML='';
  LESSONS.forEach(l=>{
    const s=st(l.id);
    let badge='';
    // st('test') creates a state object, so S.test exists before the test is taken —
    // only show a score once it actually has one, otherwise it prints "undefined/undefined"
    if(l.id==='test'){ if(S.test&&S.test.tot!=null) badge=`<span class="st">${S.test.ok}/${S.test.tot}</span>`; }
    else if(s.done) badge='<span class="st">✓</span>';
    else if(s.prac.tot>0) badge=`<span class="st">${s.prac.ok}/${s.prac.tot}</span>`;
    const d=document.createElement('div');
    d.className='nav-i'+(l.id===cur?' on':'');
    d.innerHTML=`<span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${badge}`;
    d.onclick=()=>{ cur=l.id; render(); };
    n.appendChild(d);
  });
}

  m.appendChild(h);

  if(cur==='k1'){
    const d=document.createElement('div'); microK1(d); m.appendChild(d);

  else if(cur==='k4'){

    m.innerHTML+=`<div class="lead"><span class="en">When you are done, go back and check your work.</span><span class="zh">做完之后，回头检查一下自己的过程。</span></div>`;

      <span class="en"><b>2. Did you pick the right hypotenuse?</b> It is always the <b>longest</b> side, opposite the right angle.</span><span class="zh"><b>2. 斜边找对了吗？</b>斜边永远是最<b>长</b>的那条边，在直角对面。</span><br>
      <span class="en"><b>3. Are the units consistent?</b> Do not mix metres with centimetres.</span><span class="zh"><b>3. 单位一致吗？</b>不要把米和厘米混着用。</span><br>
      <span class="en"><b>4. Is there another route?</b> Try the area method, or algebra, and see whether you land on the same number.</span><span class="zh"><b>4. 还有别的做法吗？</b>试试面积法或代数法，看结果是否一致。</span><br>
