<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学科导航门户 · Subject Navigator</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111a33; --card:#16203c; --card2:#1c2848;
    --text:#eaf0ff; --text2:#9fb0d0; --text3:#6478a0;
    --border:#26335c; --shadow:0 8px 28px rgba(0,0,0,.45);
    /* per-subject brand colors */
    --math:#14bf96;      /* 数学 · 绿 */
    --physics:#0ea5e9;   /* 物理 · 天蓝 */
    --chem:#a855f7;      /* 化学 · 紫 */
    --bio:#f59e0b;       /* 生物 · 琥珀 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16224a 0%,var(--bg) 60%);
    color:var(--text);line-height:1.6;min-height:100vh;padding:32px 18px 70px;
  }
  .head{max-width:1080px;margin:0 auto 26px;text-align:center}
  .head h1{font-size:30px;font-weight:900;letter-spacing:.5px}
  .head .accent{background:linear-gradient(90deg,var(--math),var(--physics),var(--chem),var(--bio));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .head p{color:var(--text2);margin-top:8px;font-size:15px}
  .hint{max-width:1080px;margin:0 auto 22px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:14px 18px;color:var(--text2);font-size:13.5px}
  .hint b{color:var(--text)}

  .stage{max-width:1080px;margin:0 auto 14px}
  .stage-label{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin:0 0 12px 4px}

  .subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .subj{
    position:relative;border-radius:16px;padding:20px 18px;cursor:pointer;
    background:var(--card);border:1px solid var(--border);transition:.18s;overflow:hidden;
  }
  .subj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .subj:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--c)}
  .subj.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
  .subj .emoji{font-size:30px}
  .subj .name{font-size:19px;font-weight:800;margin-top:6px}
  .subj .en{font-size:12px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
  .subj .meta{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
  .subj .soon{position:absolute;right:14px;top:14px;font-size:10px;font-weight:800;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);padding:2px 8px;border-radius:999px;letter-spacing:.5px}

  .panel{max-width:1080px;margin:22px auto 0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;display:none}
  .panel.show{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pick{margin-bottom:18px}
  .pick:last-child{margin-bottom:0}
  .pick h3{font-size:13px;color:var(--text2);margin-bottom:9px;font-weight:700}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--border);background:var(--card2);color:var(--text2);
    padding:9px 16px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04121f}
  .chip.dim{opacity:.4;cursor:not-allowed}
  .chip .sub{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:2px}

  .enter-row{margin-top:6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .enter{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#04121f;
    text-decoration:none;font-weight:800;font-size:15px;padding:13px 26px;border-radius:12px;transition:.15s;
  }
  .enter:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .enter.disabled{opacity:.4;pointer-events:none}
  .note{font-size:12.5px;color:var(--text3);max-width:560px}

  footer{max-width:1080px;margin:40px auto 0;text-align:center;color:var(--text3);font-size:12px;line-height:1.7}
  .warn{color:#fbbf24;font-weight:700}
</style>
</head>
<body>

  <div class="head">
    <h1><span class="accent">学科导航门户</span> · Subject Navigator</h1>
    <p>深圳 · 按「学科 → 年级 → 教材版本」自由穿梭，进入对应的自学课程</p>
  </div>

  <div class="hint">
    <b>怎么用：</b> 先选一个<b>学科</b>（数学 / 物理 / 化学 / 生物），再选<b>年级</b>与<b>教材版本</b>，最后点「进入课程」即可。
    每一门课的分页都带「🏠 门户」按钮，随时回到这里。
  </div>

  <!-- Step 1: Subject -->
  <div class="stage">
    <div class="stage-label">① 选择学科</div>
    <div class="subjects" id="subjects"></div>
  </div>

  <!-- Config panel -->
  <div class="panel" id="panel">
    <div class="pick">
      <h3>② 选择年级</h3>
      <div class="chips" id="gradeChips"></div>
    </div>
    <div class="pick">
      <h3>③ 选择教材版本</h3>
      <div class="chips" id="verChips"></div>
    </div>
    <div class="enter-row">
      <a class="enter disabled" id="enterBtn" href="#">进入课程 ▶</a>
      <span class="note" id="enterNote">请先选择年级与教材版本。</span>
    </div>
  </div>

  <footer>
    当前已上线：<b style="color:var(--math)">数学（北师大版 · 8年级）</b> · <b style="color:var(--physics)">物理（人教版 2026 · 8年级 · 12章）</b><br>
    化学、生物为<b>筹备中</b>。
  </footer>

<script>
/* ---- Subject registry ----
   catURL is the relative path from /portal/ to each subject's catalog page.
   Deployed on GH Pages: /portal/ -> ../math/ , ../physics/
*/
const SUBJECTS = [
  {
    key:"math", emoji:"📐", name:"数学", en:"Math", color:"var(--math)",
    grades:["8"], versions:[{v:"北师大版",sub:"BNU 2024"}],
    catURL:"../math/index.html"
  },
  {
    key:"physics", emoji:"🔬", name:"物理", en:"Physics", color:"var(--physics)",
    grades:["8"],
    // 已确认：深圳公立校（Kimi 学校）八年级物理 = 人教版 2026（2024 新课标版，上6章+下6章共12章）
    versions:[
      {v:"人教版 2026",sub:"深圳公立校 · 八年级全册（12章）"}
    ],
    catURL:"../physics/physics_index.html"
  },
  {
    key:"chem", emoji:"⚗️", name:"化学", en:"Chemistry", color:"var(--chem)",
    grades:[], versions:[], catURL:null, soon:true
  },
  {
    key:"bio", emoji:"🧬", name:"生物", en:"Biology", color:"var(--bio)",
    grades:[], versions:[], catURL:null, soon:true
  },
];

let cur = {subj:null, grade:null, ver:null};

const subjectsEl = document.getElementById('subjects');
const panel = document.getElementById('panel');
const gradeChips = document.getElementById('gradeChips');
const verChips = document.getElementById('verChips');
const enterBtn = document.getElementById('enterBtn');
const enterNote = document.getElementById('enterNote');

function renderSubjects(){
  subjectsEl.innerHTML = '';
  SUBJECTS.forEach(s=>{
    const d = document.createElement('div');
    d.className = 'subj' + (cur.subj===s.key?' sel':'');
    d.style.setProperty('--c', s.color);
    let meta = '';
    if(s.soon){
      meta = '<span class="pill">筹备中</span>';
    } else {
      meta = s.grades.map(g=>`<span class="pill">${g}年级</span>`).join('')
           + s.versions.map(v=>`<span class="pill">${v.v}</span>`).join('');
    }
    d.innerHTML = (s.soon?'<span class="soon">SOON</span>':'')
      + `<div class="emoji">${s.emoji}</div>`
      + `<div class="name">${s.name}</div>`
      + `<div class="en">${s.en}</div>`
      + `<div class="meta">${meta}</div>`;
    d.onclick = ()=>selectSubject(s.key);
    subjectsEl.appendChild(d);
  });
}

function selectSubject(key){
  const s = SUBJECTS.find(x=>x.key===key);
  if(s.soon) return;
  cur.subj = key; cur.grade=null; cur.ver=null;
  panel.style.setProperty('--accent', s.color);
  enterBtn.style.background = s.color;
  renderSubjects();
  panel.classList.add('show');
  renderGrades(s);
  renderVersions(s);
  updateEnter(s);
}

function renderGrades(s){
  gradeChips.innerHTML='';
  s.grades.forEach(g=>{
    const c=document.createElement('div');
    c.className='chip'+(cur.grade===g?' on':'');
    c.textContent=g+' 年级';
    c.onclick=()=>{cur.grade=g;renderGrades(s);updateEnter(s);};
    gradeChips.appendChild(c);
  });
}

function renderVersions(s){
  verChips.innerHTML='';
  s.versions.forEach(v=>{
    const c=document.createElement('div');
    c.className='chip'+(cur.ver===v.v?' on':'');
    c.innerHTML=`${v.v}<span class="sub">${v.sub}</span>`;
    c.onclick=()=>{cur.ver=v.v;renderVersions(s);updateEnter(s);};
    verChips.appendChild(c);
  });
}

function updateEnter(s){
  if(cur.grade && cur.ver && s.catURL){
    enterBtn.classList.remove('disabled');
    enterBtn.href = s.catURL + (s.catURL.includes('?')?'&':'?') + 'grade='+cur.grade+'&version='+encodeURIComponent(cur.ver);
    enterNote.textContent = `即将进入：${s.name} · ${cur.grade}年级 · ${cur.ver}`;
  } else {
    enterBtn.classList.add('disabled');
    enterBtn.href='#';
    enterNote.textContent = '请先选择年级与教材版本。';
  }
}

renderSubjects();
</script>
</body>
</html>
